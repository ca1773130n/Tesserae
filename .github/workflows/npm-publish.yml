# Publish the @jokerized/tesserae wrapper to npm on every vX.Y.Z tag.
#
# Authentication is OIDC trusted publishing — there is no NPM_TOKEN here and
# there must not be one. npm mints a short-lived credential from the
# `id-token: write` claim, which is why the trusted-publisher entry on
# npmjs.com pins THIS filename (npm-publish.yml). Renaming this file breaks
# publishing with ENEEDAUTH and nothing else will hint at why.
#
# Provenance attestations are generated automatically (public repo + public
# package + OIDC), so `--provenance` is deliberately absent.
name: npm publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.28.3)"
        required: true

permissions:
  id-token: write # OIDC — the whole point; publishing fails without it
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest # self-hosted runners are not supported by npm OIDC
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # No `registry-url:` on purpose. Setting it makes setup-node write an
      # .npmrc containing `_authToken=${NODE_AUTH_TOKEN}` and export a
      # placeholder value for that variable — npm then authenticates with
      # garbage instead of OIDC and the registry answers `E404 PUT`, which
      # reads like a missing package rather than an auth failure. npm defaults
      # to registry.npmjs.org anyway, so the setting bought nothing.
      - uses: actions/setup-node@v6
        with:
          node-version: "24" # ships npm >= 11.5.1, the OIDC floor
          package-manager-cache: false # never cache in a release build

      - name: Preflight
        run: |
          npm --version   # must be >= 11.5.1 or OIDC is unavailable
          # Names only, never values — these two are the OIDC handshake.
          [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] \
            && echo "OIDC: request URL present" \
            || { echo "OIDC: MISSING — id-token: write was not granted" >&2; exit 1; }

      # The tag is the source of truth. A mismatch here means the release
      # commit bumped some version files but not npm/package.json, which
      # would silently publish the wrong version.
      - name: Verify package version matches the tag
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          pkg=$(node -p "require('./npm/package.json').version")
          if [ "$tag" != "v$pkg" ]; then
            echo "tag $tag != npm/package.json $pkg" >&2
            exit 1
          fi

      # A version already on the registry is a NO-OP, not a failure.
      #
      # npm refuses to republish a version and cannot be made to, even after an
      # unpublish. So any second push of the same tag turns this workflow red
      # with `You cannot publish over the previously published versions`, and a
      # tag gets re-pushed for ordinary reasons — a tag pointed at the wrong
      # commit and corrected, a re-run of a release. That red run says nothing
      # about the package, which is already published and correct.
      #
      # This CANNOT hide a forgotten version bump: the step above fails the job
      # when npm/package.json disagrees with the tag, and it runs first. The
      # only thing reaching here with an existing version is a deliberate
      # re-tag of a release that already shipped.
      #
      # It is loud on purpose. A silent skip would be the "reported success,
      # published nothing" failure this repository has been bitten by before,
      # so the summary says which version was found and where.
      - name: Skip if this version is already published
        id: existing
        run: |
          name=$(node -p "require('./npm/package.json').name")
          ver=$(node -p "require('./npm/package.json').version")
          if npm view "$name@$ver" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$name@$ver is already on the registry — skipping publish."
            {
              echo "### npm publish skipped"
              echo ""
              echo "\`$name@$ver\` is already published, so this tag push is a no-op."
              echo "The package was published by an earlier run and is unchanged."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
            echo "$name@$ver is not on the registry — publishing."
          fi

      # ponytail: no `npm ci` / `npm test` — the wrapper has no dependencies,
      # no lockfile and no test script. Add them when it grows any.
      - name: Publish
        if: steps.existing.outputs.already != 'true'
        run: npm publish --access public
        working-directory: npm
