# Publish the @jokerized/tesserae wrapper to npm on every vX.Y.Z tag.
#
# Authentication is OIDC trusted publishing — there is no NPM_TOKEN here and
# there must not be one. npm mints a short-lived credential from the
# `id-token: write` claim, which is why the trusted-publisher entry on
# npmjs.com pins THIS filename (npm-publish.yml). Renaming this file breaks
# publishing with ENEEDAUTH and nothing else will hint at why.
#
# Provenance attestations are generated automatically (public repo + public
# package + OIDC), so `--provenance` is deliberately absent.
name: npm publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.28.3)"
        required: true

permissions:
  id-token: write # OIDC — the whole point; publishing fails without it
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest # self-hosted runners are not supported by npm OIDC
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # No `registry-url:` on purpose. Setting it makes setup-node write an
      # .npmrc containing `_authToken=${NODE_AUTH_TOKEN}` and export a
      # placeholder value for that variable — npm then authenticates with
      # garbage instead of OIDC and the registry answers `E404 PUT`, which
      # reads like a missing package rather than an auth failure. npm defaults
      # to registry.npmjs.org anyway, so the setting bought nothing.
      - uses: actions/setup-node@v6
        with:
          node-version: "24" # ships npm >= 11.5.1, the OIDC floor
          package-manager-cache: false # never cache in a release build

      - name: Preflight
        run: |
          npm --version   # must be >= 11.5.1 or OIDC is unavailable
          # Names only, never values — these two are the OIDC handshake.
          [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] \
            && echo "OIDC: request URL present" \
            || { echo "OIDC: MISSING — id-token: write was not granted" >&2; exit 1; }

      # The tag is the source of truth. A mismatch here means the release
      # commit bumped some version files but not npm/package.json, which
      # would silently publish the wrong version.
      - name: Verify package version matches the tag
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          pkg=$(node -p "require('./npm/package.json').version")
          if [ "$tag" != "v$pkg" ]; then
            echo "tag $tag != npm/package.json $pkg" >&2
            exit 1
          fi

      # ponytail: no `npm ci` / `npm test` — the wrapper has no dependencies,
      # no lockfile and no test script. Add them when it grows any.
      - name: Publish
        run: npm publish --access public
        working-directory: npm
