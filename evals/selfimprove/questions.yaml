    note: "Zero documents contain both a surface benchmark ('DTU' / 'BlendedMVS') and any of 'dynamic', 'deform', 'Nerfies' or 'HyperNeRF'. No cross-evaluation between the two lines exists anywhere in the corpus."
  - id: ctl2-surface-dyn-anneal-vs-bandwidth
    text: "Nerfies anneals its deformation network's encoding frequencies coarse-to-fine so the optimiser sees near-rigid motion first — VolSDF's learnable bandwidth on the Laplace CDF decides instead how tightly density sits on the zero level set. What settles first, and which of the two waits on the other?"
    anchors: ["coarse-to-fine", "bandwidth"]
