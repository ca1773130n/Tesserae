    note: "The roles are inverted. NICE-SLAM's shared decoder turns trilinearly interpolated features into 'occupancy and color'; Co-SLAM's shallow MLP 'predicts signed distance and colour'. No swap or trade between the two fields is described anywhere in the corpus, neither paper attributes a bottleneck to the other's field choice, and no surface-sharpness cost is reported for either."
  - id: ctl2-slam-nerf-barf-keeps-colmap
    text: "BARF keeps the COLMAP stage that NeRF depends on — refining those extrinsics only locally — whereas Gaussian Splatting SLAM removed the offline Structure from Motion pass that vanilla splatting requires. What consumes the incoming pose estimate in each case, and which system tolerates the worse initialisation?"
    anchors: ["COLMAP", "Structure from Motion"]
    control: true
