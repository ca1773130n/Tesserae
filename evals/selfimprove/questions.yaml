    note: "ORB-SLAM appears only as a bare comparison name in DSO and DROID-SLAM; the string 'map point' has zero occurrences across the corpus. Neither paper describes ORB-SLAM's internals - keypoints, map points, keyframe culling - and neither localises the failure to a named stage of it. DSO attributes its advantage to photometric calibration and DROID-SLAM to a learned front end, but neither claim is about ORB-SLAM's mechanism."
  - id: ctl2-slam-nerf-360-contribution-shares
    text: "Mip-NeRF 360 credited a 57% mean-squared-error reduction to three changes at once: a non-linear contraction, online distillation into a proposal MLP, and a distortion-based regulariser. Apportion that reduction across the three, and say which of them this corpus reports as carrying more weight on unbounded captures than on object-centric ones."
