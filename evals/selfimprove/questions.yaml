    hop_rationale: "'cost volume' and 'variational 3D Gaussians' are each one hop from the feed-forward-Gaussian hub, so a 2-hop path exists between literally any pair of papers in this family and would be equally short between MVSplat and Scaffold-GS, which is irrelevant here. The question turns on each paper's own statement of what it does when cross-view evidence is absent — MVSplat has no such statement beyond the cost volume's premise, latentSplat's is the whole point of the variance — so the connecting path must carry the failure-mode claim, not the shared representation."
