  - id: ctl2-surface-dyn-eikonal-elastic-tradeoff
    text: "IGR's Eikonal term holds a distance field metric everywhere in the ambient space, while the elastic energy regulariser of Nerfies, borrowed from physical-simulation literature, keeps a learned warp near-rigid by penalising distortion of its Jacobian. The two constrain different derivatives of one coordinate network, so explain how a model carrying both weights them, and say which is relaxed first."
