    hop_rationale: "Objaverse is a hub dataset node touched by much of the corpus, so it is one hop from almost any training-related anchor including 'quality-aware filtering'. Being one hop from the dataset every method trains on is exactly the shared-infrastructure false positive: it does not encode that one paper argues for more data, another for cleaner data, and a third that neither is the source of generalisation."
  - id: lrm-diversity-source-vs-vsd
    text: "ProlificDreamer diagnoses mode collapse in score distillation and fixes it with Variational Score Distillation, whereas Instant3D says diversity simply comes along from the diffusion sampler in its first stage. Compare where diversity is generated in each pipeline, and say whether LRM's deterministic single-image regression can produce it at all."
