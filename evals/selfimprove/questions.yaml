    note: "MonoSDF's representation study covers SDF backbones only. Zero documents contain both 'HexPlane' and a hash-grid or monolithic-MLP comparison, and no corpus paper ablates deformation-field backbones, so there is no ranking to report."
  - id: ctl2-surface-dyn-linear-decoder-on-sdf
    text: "K-Planes' linear decoder over a learned global colour basis matches a nonlinear black-box MLP, while IGR decodes geometry from a network whose gradient the Eikonal term holds at unit norm everywhere in the ambient space. Say what the corpus reports when that factorised decoder is placed on an SDF, and which of the two constraints is dropped."
