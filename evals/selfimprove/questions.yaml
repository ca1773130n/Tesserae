    note: "Directly contradicted: BARF 'removes this requirement' for accurate poses from an upstream structure-from-motion pipeline such as COLMAP, and recovers reconstructions 'even from heavily perturbed or completely uninitialized cameras', enabling pose-free NeRF training. The corpus reports no tolerance figure or initialisation-error threshold for either system, so the comparison asked for has no source even after the premise is corrected."
  - id: ctl2-slam-nerf-plenoxels-keeps-a-tiny-mlp
    text: "Plenoxels keeps a tiny MLP after its trilinear voxel lookup, just as Instant-NGP keeps one after its hash lookup, and both resolve grid collisions explicitly before decoding, so neither network ever sees a feature it cannot attribute. What does the collision-resolution step hand the two decoders, and where does the cost of a small network land?"
