    note: "Correct answer contrasts augmentation as robustness to unknown input pose, scale and lighting in the single-image regime with Instant3D's design of fixing relative camera poses so the reconstructor always sees a known layout; LRM supplies the baseline it reacts to, breadth of Objaverse plus MVImgNet rather than augmentation."
    hop_rationale: "Both anchors attach to generic training-setup and camera nodes, and TripoSR and Instant3D are already one hop apart through LRM. That adjacency is equally consistent with the two techniques being unrelated implementation details. The question asks which specific distribution shift each removes and why one design obviates the other — a directed claim absent from any short co-citation path."
  - id: lrm-janus-single-image-regression
    text: "Instant3D blames Janus artefacts on single-image optimisation methods and claims its factorisation avoids them. Does the same failure threaten LRM's single-image feed-forward regression, and what do LRM and TripoSR rely on instead of enforcing multi-view consistency at inference time?"
