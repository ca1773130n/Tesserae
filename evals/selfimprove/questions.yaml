    note: "Zero documents contain both 'bandwidth' and any annealing or coarse-to-fine schedule. VolSDF's bandwidth is learnable but never described as scheduled, and no paper relates it to the encoding anneal of Nerfies or BARF."
  - id: ctl2-surface-dyn-hypernerf-drops-warp
    text: "Nerfies maps every observed point into a single canonical template, and HyperNeRF's per-frame ambient coordinate makes each input image a slice of a higher-dimensional field. HyperNeRF drops the canonical warp once that ambient axis is in place. What becomes of the elastic term it inherited, and which regulariser replaces it?"
    anchors: ["canonical template", "ambient coordinate"]
    control: true
    requires: []
    reason_class: out-of-scope-claim
    note: "False premise. HyperNeRF's paper states the opposite: 'The deformation field is retained from Nerfies — the network first warps observed points into the canonical 3D coordinates, then performs the ambient slice.' The warp is never dropped and no regulariser replaces the elastic term."
  - id: ctl2-surface-dyn-kplanes-gate-network
    text: "K-Planes' six feature planes carry a decomposition of static and dynamic content, while Gao et al. composite a time-invariant static NeRF against a time-varying dynamic one, each of the two deciding what counts as static through its own learned gating network. Which gate is the larger, and what capacity does the corpus say it needs before the split is reliable?"
    anchors: ["feature planes", "static NeRF"]
    control: true
    requires: []
    reason_class: out-of-scope-claim
    note: "False premise. K-Planes' split is parameter-free: 'static-dynamic decomposition is induced by initializing the time-involving planes to the identity'. Only Gao et al. predict a blending weight, so there is no second gating network and no capacity figure for either."
  - id: ctl2-surface-dyn-monosdf-per-scene-finetune
    text: "MonoSDF adds monocular geometric cues — a depth estimate converted into a scale-and-shift-invariant loss, and a normal estimate matched against the analytic SDF gradient — supplying dense supervision exactly where the photometric loss is weakest, on large textureless regions. Each predictor is fine-tuned on the target scene before the surface fit begins. What does that adaptation add beyond the off-the-shelf prediction, and which cue depends on it more?"
    anchors: ["monocular geometric cues", "textureless"]
    control: true
    requires: []
    reason_class: out-of-scope-claim
    note: "False premise. MonoSDF's cues come from 'general-purpose off-the-shelf predictors that were never trained on the target scenes'. There is no per-scene adaptation step, so the premise contradicts the only document describing the pipeline."
  - id: ctl2-surface-dyn-igr-supervision
    text: "IGR fits a neural distance function directly to raw point clouds, with a zero-set term on the input points and an Eikonal term encouraging unit-norm gradient everywhere else, and both losses are scored against pre-computed ground-truth signed distance samples. What supplies those samples, and why is the Eikonal term still credited with ruling out degenerate solutions?"
    anchors: ["zero-set term", "raw point clouds"]
    control: true
    requires: []
    reason_class: out-of-scope-claim
    note: "False premise. IGR fits raw point clouds 'without supervised ground-truth occupancy' and is explicitly contrasted with DeepSDF-style methods 'that require pre-computed ground-truth SDF samples'. The premise asserts the supervision the paper exists to remove."
  - id: ctl2-surface-dyn-marching-cubes-mesh
    text: "SuGaR regularises Gaussians toward the local tangent plane suggested by their neighbours and extracts a clean watertight triangle mesh, and 2DGS collapses each primitive to an oriented disk so that its geometry is view-consistent from every camera. Both reach a mesh by running marching cubes over an implicit level set. What does each hand the extractor, and which level set is noisier?"
    anchors: ["marching cubes", "watertight"]
    control: true
    requires: []
    reason_class: out-of-scope-claim
    note: "False premise. SuGaR states 'Marching Cubes, the default for Neural SDFs, does not apply directly because Gaussians do not implicitly define a level set' and uses Poisson reconstruction instead; 2DGS never mentions marching cubes. Neither method runs it."
  - id: ctl2-surface-dyn-dynamic-followup-stubs
    text: "Gao et al. name DyNeRF and NSFF as follow-ups to their static-and-dynamic decomposition, in which a blending weight predicted by the dynamic network composites the two fields, and Nerfies reports that D-NeRF baselines blur on expressive motion. What does each of those three use where that weight would be, and why does the choice explain the blurring?"
    anchors: ["DyNeRF", "D-NeRF"]
    control: true
    requires: []
    reason_class: absent-entity
    note: "DyNeRF and NSFF appear once each, in Gao et al.'s follow-up list; D-NeRF appears as an unexplained baseline in Nerfies and as a dataset directory name in the 4DGaussians README. No document states the time encoding of any of the three."
  - id: ctl2-surface-dyn-tensorf-inheritance
    text: "K-Planes calls its d-choose-2 construction a generalisation of TensoRF's planar factorization, and MERF says its own three feature planes mirror the same factorization, geared to low-memory baking rather than fast training. What components of that decomposition does each one keep, and which did the original need that neither retains?"
    anchors: ["TensoRF", "planar factorization"]
    control: true
    requires: []
    reason_class: absent-entity
    note: "TensoRF is named in Plenoxels, K-Planes and MERF but never described. 'vector-matrix', 'VM decomposition' and 'tensor decomposition' have zero corpus hits, so TensoRF's components — and what each successor keeps or drops — are stated nowhere."
  - id: ctl2-surface-dyn-dtu-reconstruction-error
    text: "UNISURF and NeuS report mask-free reconstruction on DTU and BlendedMVS, NeuS on thin structures and self-occlusion, and VolSDF claims an advantage over IDR, which needs masks, on standard multi-view benchmarks. What reconstruction error does each of the three record on DTU, and which pair is separated by less than the run-to-run spread?"
    anchors: ["DTU", "foreground masks"]
    control: true
    requires: []
    reason_class: absent-quantity
    note: "The corpus carries no reconstruction numbers for DTU at all: 'chamfer' has one hit, in IGR, describing 'chamfer-style fitting' rather than a metric, and no document reports a per-method error, a table, or any run-to-run variation for the surface line."
  - id: ctl2-gen3d-layout-inside-reconstructor
    text: "Scene structure in GALA3D comes from an LLM-generated layout of named objects and bounding boxes, which the compositional stage later adjusts so that scale and contact become plausible. Instant3D hands four canonicalised views to a sparse-view reconstructor and takes them whole, with no notion of an object. What happens to object separation when GALA3D's layout prior is placed inside such a reconstructor, and what does the substitution cost?"
    anchors: ["LLM-generated layout", "sparse-view reconstructor"]
    control: true
    requires: []
    reason_class: absent-relation
    note: "Both premises are verbatim corpus (GALA3D abstract/paper; Instant3D paper). 'layout' occurs in only two papers across all 135 files -- GALA3D's LLM layout and Instant3D's canonicalised view layout -- and no document places an object-decomposition prior inside a feed-forward reconstructor, nor reports any cost for doing so. LRM, Instant3D, TripoSR and LGM never discuss multi-object inputs at all."
  - id: ctl2-gen3d-costvolume-into-lrm
    text: "MVSplat argues that a plane-sweep cost volume localises Gaussian centres by scoring cross-view feature similarity at a discrete set of depth hypotheses, while Instant3D's second stage regresses a radiance field through cross-attention alone. Which work here fits a cost volume in front of an LRM-style reconstructor, and what came out of the geometry?"
    anchors: ["cost volume", "cross-attention"]
    control: true
    requires: []
    reason_class: absent-relation
    note: "'cost volume' occurs in exactly three files: DeepV2D, and MVSplat's abstract and paper. 'cross-attention' occurs in two: LRM and TripoSR. The live question lrm-cost-volume-vs-attention-prior covers the stated *disagreement* between the two inductive biases; the *combination* -- a cost volume placed in front of an LRM-style reconstructor -- is built by no paper in the corpus, so there is no resulting geometry to report."
  - id: ctl2-gen3d-variational-gaussians-vsd
    text: "Uncertainty is carried two ways in this line: latentSplat encodes it as variational 3D Gaussians that a lightweight generative decoder turns back to pixels, and ProlificDreamer's Variational Score Distillation carries it as a particle ensemble updated by a learned variational score alongside the pretrained prior. Which paper treats one of those constructions as a limiting case of the other, and what does its argument actually rest on?"
    anchors: ["variational 3D Gaussians", "Variational Score Distillation"]
    control: true
    requires: []
    reason_class: absent-relation
    note: "'special case', 'limiting case' and 'single-particle' occur only in ProlificDreamer, and only in the claim that SDS is a single-particle limit of VSD with a delta posterior -- never about latentSplat. latentSplat is never cited by ProlificDreamer and vice versa. No document derives either variational construction from the other; the corpus's own framing is that 'variational' denotes two different things here."
  - id: ctl2-gen3d-anchor-vs-perpixel
    text: "Scaffold-GS materialises its primitives from anchor points whose attributes a shared MLP emits per view, while LGM's per-pixel Gaussian features are produced once in image space and fused across a multi-view stack with no anchor structure at all. Identify the method that anchors an amortised Gaussian predictor to a view-conditioned grid, and what the hybrid reported at benchmark resolution."
    anchors: ["anchor points", "per-pixel Gaussian"]
    control: true
    requires: []
    reason_class: absent-relation
    note: "'anchor point(s)' occurs in three files only: Scaffold-GS (abstract and paper) and Point-SLAM. None of the four feed-forward Gaussian predictors in the corpus -- AGG, LGM, MVSplat, latentSplat -- uses an anchor structure or a render-time shared MLP, and no document reports such a hybrid or any benchmark number for one. The hybrid does not exist to be measured."
  - id: ctl2-gen3d-identity-token-feedforward
    text: "Magic123 captures a reference image's identity in a token through textual inversion and regularises its radiance field by monocular depth, whereas LRM and TripoSR feed raw image encoder features to a transformer conditioned on no more than the picture in front of it. State what this line claims about adding Magic123's token to a feed-forward encoder, and which of the two gains by it."
    anchors: ["textual inversion", "image encoder"]
    control: true
    requires: []
    reason_class: absent-relation
    note: "'textual inversion' occurs in two files, both Magic123; reference-image 'identity' occurs only there. LRM and TripoSR are described as conditioning on image-encoder features alone. No corpus document adds an identity token to a feed-forward encoder or claims anything about what such a change would buy, so the asked-for claim exists nowhere."
  - id: ctl2-gen3d-janus-measurement
    text: "Instant3D names the Janus artefact and pins it on single-image optimisation, while ProlificDreamer's diagnosis puts over-saturation and mode collapse on the shape of the posterior that score distillation optimises rather than on any hyperparameter. What measurement of Janus artefacts under Variational Score Distillation does this corpus carry, and which of the two diagnoses does it favour?"
    anchors: ["Janus", "Variational Score Distillation"]
    control: true
    requires: []
    reason_class: absent-relation
    note: "'Janus' occurs in four files -- Instant3D's abstract and paper plus the zero123 and stable-dreamfusion READMEs -- and never once in ProlificDreamer, which discusses only over-saturation, over-smoothing and mode collapse. No document measures Janus artefacts under VSD, and the corpus carries no per-method metric tables of any kind, so no measurement can adjudicate the two diagnoses."
  - id: ctl2-gen3d-cloud-to-objects
    text: "Per-object grouping lets a GALA3D user move, resize or swap entities before re-optimisation, but LucidDreamer accumulates one undifferentiated point cloud through the Dreaming and Alignment loop that populates its scene. Which editing operations survive when such a cloud is regrouped into named objects, and what does that conversion actually lose?"
    anchors: ["Dreaming and Alignment", "per-object"]
    control: true
    requires: []
    reason_class: absent-relation
    note: "'per-object' and 'controllable editing' occur only in GALA3D; 'Dreaming and Alignment' only in LucidDreamer. LucidDreamer's output is a single aggregated cloud converted wholesale into Gaussians, and no corpus document discusses regrouping it into named objects, which editing operations would survive that conversion, or what it would cost. The two scene pipelines are compared only on where structure comes from."
  - id: ctl2-gen3d-object-model-on-scenes
    text: "MVSplat trains on RealEstate10K and ACID scene captures by photometric supervision alone, and latentSplat on readily available real video with no explicit 3D supervision. LRM's regime is the opposite one: roughly a million objects mixing Objaverse renders with real MVImgNet captures, object-centric and not scene-scale. Spell out the cross-evaluation of that object-trained model on the two scene benchmarks, and how it came out."
    anchors: ["RealEstate10K", "MVImgNet"]
    control: true
    requires: []
    reason_class: absent-relation
    note: "'RealEstate10K' and 'ACID' occur only in MVSplat's two files; 'MVImgNet' only in LRM's two. No corpus document runs an object-trained reconstructor on a scene benchmark or reports any number from such a run, and the corpus's own open-question note on inference cost versus fidelity states explicitly that the head-to-head comparisons across these regimes do not exist."
  - id: ctl2-gen3d-view-count-rationale
    text: "Four structured views fix Instant3D's first stage, and their canonicalised layout gives the reconstructor known relative poses, while LGM feeds a small multi-view stack through an asymmetric U-Net predicting Gaussians directly per pixel, not from a volumetric grid. Why does each pipeline fix its view budget where it does, and what degradation does each report as views drop away?"
    anchors: ["canonicalised", "asymmetric U-Net"]
    control: true
    requires: []
    reason_class: absent-relation
    note: "Instant3D's four views are stated but never justified against any alternative count, and LGM's stack size is never given at all. 'ablat*' returns zero hits across all 100 paper markdown files, so no view-count sweep, degradation curve or sensitivity result exists anywhere in the corpus for either system. The rationale and the degradation are both absent."
  - id: ctl2-gen3d-semantic-channel-generator
    text: "AGG's predicted primitives carry opacity and spherical-harmonic colour alongside scale and rotation, while Feature 3DGS distils a 2D foundation model's features onto the same kind of Gaussian, a trick the weekly synthesis calls orthogonal to both generation axes. Identify the paper reporting a distilled semantic channel that improves the geometry an amortised generator predicts, and what each side conceded."
    anchors: ["Feature 3DGS", "spherical-harmonic colour"]
    control: true
    requires: []
    reason_class: absent-relation
    note: "Feature 3DGS is described purely as a per-scene reconstruction, segmentation and editing method; it contains no generative component, no text conditioning and no amortised inference. The 2026-W18 synthesis explicitly calls the distillation trick orthogonal to both generation axes. No document reports a distilled semantic channel affecting the geometry any generator predicts, so there is nothing for either side to have conceded."
  - id: ctl2-gen3d-rasteriser-resolution-routes
    text: "High-resolution supervision is reached two ways here: Magic3D renders its deformable mesh through a differentiable rasteriser fast enough to match the latent diffusion model's own resolution, and LGM instead reaches that resolution by keeping Gaussian features in image space. Which later work reuses one of those routes inside the other, and what does it report about supervision once the two are combined?"
    anchors: ["differentiable rasteriser", "image space"]
    control: true
    requires: []
    reason_class: absent-relation
    note: "Magic3D's mesh rasteriser and LGM's image-space Gaussian features are each described only inside their own papers, and neither cites the other. The corpus contains no work that puts a mesh-stage rasteriser inside a feed-forward Gaussian predictor, nor any statement about supervision resolution for such a combination. The live resolution-bottleneck questions compare the routes; nothing merges them."
  - id: ctl2-gen3d-triposr-gaussian-head
    text: "TripoSR keeps LRM's image encoder and cross-attention transformer close to unchanged and puts its contribution into quality-aware filtering, augmentation and inference engineering. Explain what made it drop the triplane for a Gaussian head, and what each of its released checkpoints emits by way of replacement."
    anchors: ["triplane", "image encoder"]
    control: true
    requires: []
    reason_class: out-of-scope-claim
    note: "The premise is true but the question presupposes something the corpus contradicts. TripoSR is described as preserving LRM's template exactly -- 'an image encoder followed by a cross-attention transformer that predicts a triplane-parameterised volumetric representation' -- and its repo card confirms a triplane output. LGM, not TripoSR, is the paper that swaps the implicit field for Gaussians. TripoSR also has no per-checkpoint variants in the corpus."
  - id: ctl2-gen3d-instant3d-third-stage
    text: "Instant3D generates four view-consistent images with a fine-tuned diffusion model and then regresses a radiance field from them in one forward pass. The finished asset arrives in roughly twenty seconds, two orders of magnitude faster than the per-prompt pipelines it replaces, and the sampler's diversity propagates through. Explain why its third stage returns to per-prompt score distillation, and what that refinement adds which the regression step does not already produce."
    anchors: ["score distillation", "view-consistent"]
    control: true
    requires: []
    reason_class: out-of-scope-claim
    note: "The premise is verbatim from Instant3D, but the question presupposes a third stage the corpus denies. Instant3D is explicitly two-stage and its stated purpose is to sidestep the slow per-prompt optimisation of score-distillation methods entirely; there is no refinement loop, so no contribution to attribute to one. Nothing in the 135 files describes a distillation stage after an LRM-style regression."
  - id: ctl2-gen3d-zero123-real-captures
    text: "Zero-1-to-3 fine-tunes a Stable-Diffusion-style model to denoise a target view given an input image and a relative camera transformation in elevation, azimuth and radius, and that output is then reused as a score distillation prior with no further 3D supervision. Say what the real multi-view capture set was needed for beside the synthetic renders, and which of the two actually dominates."
    anchors: ["azimuth", "score distillation"]
    control: true
    requires: []
    reason_class: out-of-scope-claim
    note: "The premise is verbatim, but the presupposed real-capture set does not exist. Zero-1-to-3 trains only on rendered Objaverse triplets -- the paper states 'despite being trained only on synthetic data' and credits generalisation to the Stable Diffusion backbone. The synthetic-plus-real mixture belongs to LRM (Objaverse plus MVImgNet). There is no second data source of Zero-1-to-3's to weigh."
  - id: ctl2-gen3d-luciddreamer-scan-supervision
    text: "Inpainted images are lifted into a point cloud whose depth comes from a monocular estimator, and LucidDreamer's Dreaming and Alignment loop repeats that until the cloud can initialise a Gaussian Splatting optimisation. What keeps its indoor 3D scan supervision necessary, and which of the two steps would stop working without those scans?"
    anchors: ["Dreaming and Alignment", "3D scan"]
    control: true
    requires: []
    reason_class: out-of-scope-claim
    note: "The premise is accurate but the question presupposes exactly what LucidDreamer removes. Its abstract names training on 3D scan datasets as the domain limitation of prior work, and its whole claim is domain-free generation from an off-the-shelf 2D diffusion model with no scene-scale 3D data. There is no scan supervision in the pipeline, so nothing keeps it necessary."
  - id: ctl2-gen3d-agg-single-stream
    text: "AGG maps one image to a Gaussian set in a single forward pass and then upsamples the primitive count by a module that performs 3D Gaussian super-resolution, not through the score distillation loop its predecessors run. Explain why locations and appearance attributes share one undivided stream, and what the cascade gains by that coupling."
    anchors: ["Gaussian super-resolution", "appearance attributes"]
    control: true
    requires: []
    reason_class: out-of-scope-claim
    note: "The premise is verbatim, but the presupposed undivided stream is the opposite of what AGG reports. Both its abstract and paper state that AGG decomposes the generation of Gaussian locations from the other appearance attributes through a hybrid intermediate representation, arguing the split stabilises optimisation because locating primitives is the better-conditioned half. There is no coupling to explain or credit."
  - id: ctl2-gen3d-zero123-followups
    text: "Zero-1-to-3 turns a text-to-image model into a viewpoint-conditional one that knows where the camera sits relative to the input frame. This corpus names SyncDreamer, Wonder3D and One-2-3-45 as the follow-ups built directly on that formulation, rather than on the text-conditioned line DreamFusion started a year earlier. What multi-view consistency mechanism does each of the three add on top of it, and what does each give up in exchange?"
    anchors: ["viewpoint-conditional", "SyncDreamer"]
    control: true
    requires: []
    reason_class: absent-entity
    note: "All three names appear only as a citation stub in Zero-1-to-3's closing paragraph, with SyncDreamer repeated once in the zero123 repo card. None of the three has a paper among the 50, and no corpus document describes any mechanism, trade-off or result for them. Retrieval will land squarely on Zero-1-to-3 and still carry nothing about the follow-ups themselves."
  - id: ctl2-gen3d-pixelsplat-internals
    text: "MVSplat reports matching or surpassing pixelSplat on RealEstate10K and ACID by roughly a tenth of the parameters, but AGG and latentSplat both place pixelSplat in the same feed-forward Gaussian family they belong to. Spell out pixelSplat's own architecture as this line describes it, and what each design choice costs at that budget."
    anchors: ["pixelSplat", "RealEstate10K"]
    control: true
    requires: []
    reason_class: absent-entity
    note: "pixelSplat is named in five files -- MVSplat's abstract and paper, AGG, LGM and latentSplat -- always as a baseline or family member, never described. There is no pixelSplat paper among the 50. MVSplat's single structural remark, that its cost volume replaces 'learned attention alone', is a claim about MVSplat's own design, not an account of pixelSplat's architecture or the cost of any choice in it."
  - id: ctl2-gen3d-fantasia3d-separation
    text: "DreamFusion names Magic3D, Fantasia3D and ProlificDreamer among the works it seeded, and the stable-dreamfusion release lists Fantasia3D among the projects it points readers toward. Explain why Fantasia3D disentangles geometry from appearance where Magic3D instead separates resolution stages, and what each separation costs at the second step."
    anchors: ["Fantasia3D", "stable-dreamfusion"]
    control: true
    requires: []
    reason_class: absent-entity
    note: "Fantasia3D appears twice in the corpus: as a bare name in DreamFusion's lineage sentence and as a link title plus BibTeX entry in the stable-dreamfusion README. No paper for it is among the 50, so its geometry/appearance disentanglement is never described beyond that title, and no document states what either separation costs at a second stage. Magic3D's half is grounded; the comparison is not."
  - id: ctl2-gen3d-dreamgaussian-backends
    text: "The DreamGaussian release adds configurations for MVDream, ImageDream and Stable-Zero123 as alternative diffusion backends behind the same Gaussian optimisation loop that produced its two-minute result from a single image, not from a prompt. Say what geometry each backend recovers where the others fail, and what each costs in optimisation time."
    anchors: ["MVDream", "Stable-Zero123"]
    control: true
    requires: []
    reason_class: absent-entity
    note: "MVDream, ImageDream and Stable-Zero123 appear only in the DreamGaussian README, as news lines, config filenames and pip install commands. None has a paper in the corpus and no document describes what any of them changes about recovered geometry or optimisation time. The only timings in the corpus are DreamGaussian's own ~2 minutes and its README's 500/50-iteration stage figures."
  - id: ctl2-gen3d-threestudio-consolidation
    text: "Both the stable-dreamfusion and DreamGaussian releases point readers to threestudio as the consolidated implementation of this score distillation line, and the zero123 release credits it with a single-view reconstruction port that arrived later. Why does its unified guidance interface change what either reimplementation can reproduce, and where does the resulting behaviour stop matching the two papers?"
    anchors: ["threestudio", "score distillation"]
    control: true
    requires: []
    reason_class: absent-entity
    note: "threestudio appears in three README files as an outbound pointer only -- an advertisement line, an acknowledgement, and a note that it ported single-view reconstruction with zero123. The corpus contains no description of its guidance interface, no account of what it reproduces, and no divergence report against any paper. Every anchor resolves; the asked-for content is entirely outside the 50-paper boundary."
  - id: ctl2-gen3d-preference-rates
    text: "Magic3D reports 61.7% preference in a human user study over DreamFusion and delivers a textured mesh in roughly forty minutes, but DreamGaussian and LGM report only wall-clock figures. Which preference rate did each of those two systems report against its own predecessor, and which protocol did the three share?"
    anchors: ["human user study", "textured mesh"]
    control: true
    requires: []
    reason_class: absent-quantity
    note: "'preference' and 'user study' each occur exactly once in all 135 files, in Magic3D's single 61.7% sentence. DreamGaussian reports only ~2 minutes and a ~10x acceleration; LGM only 5 seconds at 512 training resolution. Neither reports a preference rate, and no shared evaluation protocol is described anywhere, so both halves of the ask are missing quantities rather than missing reasoning."
  - id: ctl2-gen3d-speedup-decomposition
    text: "Between LRM's five-second reconstruction and TripoSR's half-second one lies a gap TripoSR credits to quality-aware filtering, new augmentations, a rebalanced objective and careful kernel scheduling, never to an architectural change. What share of the speedup does each of those four contribute, and which one was measured by itself?"
    anchors: ["quality-aware filtering", "architectural change"]
    control: true
    requires: []
    reason_class: absent-quantity
    note: "TripoSR names its changes qualitatively and gives only the two endpoint timings; the corpus contains no per-change attribution, no isolated measurement and no ablation table. 'ablat*' has zero hits across the 100 paper markdown files, and the corpus holds 52 distinct numeric tokens in total, none of them a speedup decomposition. The qualitative attribution is answerable; the shares are not."
  - id: ctl2-gsplat-feature-speedup-attribution
    text: "Feature 3DGS reports being significantly faster to train and to render than NeRF-based feature distillation, and Scaffold-GS reports holding 3DGS rendering speed while cutting primitives. Give the training and rendering speed-ups each of them reports, and say whether the corpus attributes either gap to the rasteriser or to the representation."
    anchors: ["2D foundation model", "rendering speed"]
    control: true
    requires: []
    reason_class: absent-quantity
    note: "Both papers report the claim only qualitatively — Feature 3DGS as 'significantly faster to both train and render' and 'a fraction of the training and inference cost', Scaffold-GS as 'without sacrificing the rendering speed'. No speed-up figure exists for either. Corpus-wide, PSNR/LPIPS/SSIM appear as frontmatter metric names with no values, and no numeric attribution to rasteriser-versus-representation exists."
  - id: ctl2-gsplat-sugar-extraction-order
    text: "SuGaR reaches an editable mesh within minutes, and its authors credit the choice of extraction algorithm for that. Since the paper runs Marching Cubes over the Gaussian opacity field first and reserves Poisson reconstruction for the later binding stage, what does each algorithm contribute at its own stage, and why can the ordering not be reversed?"
    anchors: ["Marching Cubes", "Poisson reconstruction"]
    control: true
    requires: []
    reason_class: out-of-scope-claim
    note: "False premise. arxiv-2311-12775 states the opposite: SuGaR extracts the mesh with Poisson reconstruction and explicitly contrasts that with Marching Cubes ('in contrast to the Marching Cubes algorithm usually applied to extract meshes from Neural SDFs'). SuGaR never runs Marching Cubes and never thresholds an opacity field; the two-stage ordering the question asserts does not exist, so the contribution-per-stage it asks for cannot be given."
  - id: ctl2-gsplat-scaffold-bakes-harmonics
    text: "Scaffold-GS predicts neural-Gaussian attributes on the fly from viewing direction and distance, while 3DGS stores view-dependent colour as spherical harmonics attached to each primitive. Once Scaffold-GS bakes its shared MLP into those harmonics at the end of training, why does the baked form still count as view-adaptive?"
    anchors: ["spherical harmonics", "viewing direction"]
    control: true
    requires: []
    reason_class: out-of-scope-claim
    note: "False premise. No baking step exists in Scaffold-GS — on-the-fly, view-conditioned prediction is the whole design, and baking would destroy it. Verified that 'bake|baked|baking' occurs only in PlenOctrees, MERF, the 2DGS abstract ('without baking') and the TripoSR readme; it never appears in arxiv-2312-00109. The question asks to justify a step the corpus contradicts."
  - id: ctl2-gsplat-luciddreamer-runs-sfm
    text: "LucidDreamer alternates Dreaming and Alignment to grow a point cloud out of inpainted views, and 3DGS starts from the sparse cloud that a camera-calibration pass leaves behind. Since LucidDreamer recovers its own poses by running that same structure-from-motion stage over its generated images, what does each pass contribute to the Gaussian initialisation, and which one can be skipped?"
    anchors: ["inpainting", "camera calibration"]
    control: true
    requires: []
    reason_class: out-of-scope-claim
    note: "False premise. arxiv-2311-13384 says LucidDreamer lifts each inpainted image to 3D 'by combining a monocular depth estimate with the known camera pose' — poses are given by the sampling trajectory, not recovered. It runs no SfM or COLMAP stage; verified that 'LucidDreamer' co-occurs with 'structure|COLMAP|calibration' only in GALA3D's paper and the W18 weekly, neither attributing SfM to it."
  - id: ctl2-gsplat-foundation-read-stage
    text: "Feature 3DGS distils SAM and CLIP-LSeg into Gaussian primitives and blames the gap in spatial resolution and channel statistics between RGB images and foundation feature maps for the difficulty of the port. The two models expose features at different points in their own stacks. Which stage is read in either case, and what does that choice do to the resolution gap?"
    anchors: ["CLIP-LSeg", "2D foundation model"]
    control: true
    requires: []
    reason_class: absent-entity
    note: "The premise is Feature 3DGS's own stated obstacle. But neither SAM nor CLIP-LSeg is a corpus paper: 'CLIP-LSeg' occurs 3 times and SAM 4 times, always as named distillation sources. No document describes either model's architecture, so which internal stage supplies the distilled feature map — and how that choice governs the resolution gap — has no grounding anywhere in the 50 papers."
  - id: ctl2-gsplat-3dgut-projection-swap
    text: "The gsplat supplement derives projection of 3D Gaussians under a pinhole camera through a local affine approximation of the perspective transform, and the library later integrated 3DGUT as an alternative path through that same step. What does 3DGUT put in place of the affine approximation, and how does the substitution change the documented backward pass?"
    anchors: ["3DGUT", "local affine approximation"]
    control: true
    requires: []
    reason_class: absent-entity
    note: "Both anchors are real: 'local affine approximation' occurs once, in the gsplat supplement; '3DGUT' occurs only in the gsplat README, in three news lines that announce the integration and link out to NVIDIA. Nothing in the corpus explains what 3DGUT replaces in projection or how it interacts with the documented gradients — the answer lives entirely in an external page the corpus only links to."
  - id: ctl2-gsplat-ppisp-appearance-correction
    text: "Two per-view appearance corrections sit outside the Gaussian parameters in gsplat: a bilateral grid that compensates for varying training views, and PPISP, which the release notes record as an alternative to it. What does each correct, and why does the choice matter on a capture whose exposure or white balance drifts?"
    anchors: ["PPISP", "bilateral grid"]
    control: true
    requires: []
    reason_class: absent-entity
    note: "'PPISP' and 'bilateral grid' occur in exactly one line of the whole corpus — a gsplat README news entry stating PPISP 'is integrated as an alternative way of bilateral grid to compensate the training views'. Neither mechanism is described. The premise is faithful to that line, which makes retrieval land on it, but the line carries no content to answer what either corrects."
  - id: ctl2-gsplat-primitive-budget-numbers
    text: "Scaffold-GS reports a substantial reduction in primitive count at equal rendering quality, and Revising Densification adds a mechanism capping the total number of primitives generated per scene. Report the primitive counts each ends up with on a shared benchmark, and say which of the two reductions the corpus credits as the larger."
    anchors: ["primitive count", "Adaptive Density Control"]
    control: true
    requires: []
    reason_class: absent-quantity
    note: "Both claims are qualitative in the corpus: Scaffold-GS reports 'a substantial reduction in primitive count', Revising Densification 'a mechanism to control the total number of primitives generated per scene'. No count appears — a regex for a number adjacent to 'Gaussian|primitive' returns 0 hits across all 135 files, and the two papers are never evaluated on a shared benchmark, so no comparison of reduction size exists."
