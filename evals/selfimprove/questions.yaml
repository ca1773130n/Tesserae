    note: "No corpus document pairs an SDF with a deformation field. 'Eikonal' occurs only in IGR, VolSDF and the 2026-04-20 digest; 'elastic' only in Nerfies and HyperNeRF; zero documents contain both, and no paper states a weighting or an ordering between the two regularisers."
  - id: ctl2-surface-dyn-slice-then-mesh
    text: "4D-Rotor Gaussian Splatting recovers each frame by temporal slicing through anisotropic 4D Gaussians, so the effective primitives at any instant are not the ones the optimiser holds, and SuGaR's mesh comes instead from Poisson reconstruction over the oriented centres of a static cloud. State which orientation Poisson is handed where its input is slice-dependent, and what the corpus says about tracking connectivity across frames."
