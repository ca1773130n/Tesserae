  - id: lrm-what-amortisation-removes
    text: "DreamFusion's per-prompt cost is an optimisation loop that renders a NeRF and takes a diffusion gradient at every step. Which parts of that loop does LRM's amortised inference remove outright, and which does Instant3D merely move rather than delete when it claims two orders of magnitude?"
