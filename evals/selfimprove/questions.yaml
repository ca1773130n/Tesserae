  - id: lrm-uncertainty-in-feedforward-regression
    text: "latentSplat argues that deterministic feed-forward regressors collapse to a single underconstrained guess where the input views are weak, and answers with Variational 3D Gaussians. Does Instant3D's sparse-view reconstructor have any mechanism to express that uncertainty when its four generated views disagree, and does LGM's per-view fusion behave differently?"
