  - id: sparse-generated-views-into-cost-volume
    text: "Instant3D generates four view-consistent images with canonicalised poses and hands them to a sparse-view reconstructor; MVSplat's plane sweeping assumes the input views are genuine photographs of one scene, so its similarity scores are only meaningful where the views really do agree. What happens to a cost volume built from diffusion-generated views, and would latentSplat's generative decoder tolerate that inconsistency better?"
    anchors: ["plane sweeping", "view-consistent images"]
    requires: ["2403.14627", "2403.16292", "2311.06214"]
    note: "Gold: MVSplat for what plane sweeping presupposes about the inputs, Instant3D for how far its generated views are only approximately consistent and why it canonicalises poses, latentSplat for a decoder that resolves rather than trusts disagreement. Instant3D is the single out-of-pool paper."
    hop_rationale: "Instant3D and MVSplat both sit in the sparse-view cluster and connect within two hops through 'sparse views' or 'feed-forward reconstruction', a link that exists regardless of input provenance. The question depends on a premise mismatch — a geometric matcher fed synthesised images — that neither paper raises about the other, so a short cluster path cannot stand in for retrieving the two mechanisms and comparing their assumptions."
  - id: sparse-ctrl-pixelsplat-epipolar
    text: "MVSplat reports ten times fewer parameters than pixelSplat while building an explicit cost volume. How does pixelSplat's own epipolar-attention depth parameterisation place its Gaussians, and which part of that design accounts for the parameter gap?"
    anchors: ["pixelSplat", "cost volume"]
    control: true
    legacy_gameable: true
    requires: []
    note: "Unanswerable from the corpus: there is no pixelSplat paper among the 50 documents. pixelSplat appears only as a named comparison inside MVSplat, latentSplat, AGG and LGM, and always for parameter count, inference speed or output quality. Its epipolar sampling, its depth parameterisation and the internal reason for its size are described nowhere, so the parameter gap cannot be attributed to any component."
    hop_rationale: "Both anchors occur in MVSplat's own text, one sentence apart, so the graph will show them adjacent and a retriever will happily return MVSplat as if it answered. That adjacency is precisely the trap: it certifies that the comparison was made, not that the compared design was ever described in the corpus."
  - id: sparse-ctrl-anchor-distilled-features
    text: "In Scaffold-GS, how are CLIP-LSeg features predicted per anchor point alongside opacity and colour, and what modification to anchor growing keeps those distilled channels stable as new anchors appear?"
    anchors: ["CLIP-LSeg", "anchor points"]
    control: true
    legacy_gameable: true
    requires: []
    note: "Unanswerable from the corpus: Scaffold-GS's per-anchor MLP predicts only position offset, opacity, colour and scale, and its growing rule scores rendering contribution, never a semantic channel. Feature 3DGS distils CLIP-LSeg onto unstructured 3DGS primitives, not onto anchors. No document in the 50-paper corpus combines anchor-based structure with foundation-model distillation, so neither the per-anchor feature prediction nor its growing rule exists to be reported."
    hop_rationale: "Both anchors are two hops apart through the 3D Gaussian Splatting hub, and both papers are late-2023 3DGS variants that any topical graph will place side by side, so a plausible-looking path is guaranteed. The question tests whether that path is mistaken for a described mechanism: the hybrid it names has never been built in this corpus."
  - id: sparse-ctrl-uncertainty-calibration
    text: "How well calibrated is the uncertainty carried by latentSplat's variational 3D Gaussians compared with the uncertainty field NeRF-W predicts through its transient head, when both are measured on the same held-out views?"
    anchors: ["variational 3D Gaussians", "uncertainty field"]
    control: true
    legacy_gameable: true
    requires: []
    note: "Unanswerable from the corpus: neither paper reports any calibration measurement, the two target different settings (sparse-view generalisable reconstruction from video versus unconstrained tourist photo collections) with no shared benchmark, and no third document compares them. The corpus contains no per-pixel or per-primitive uncertainty numbers from which calibration could be computed."
    hop_rationale: "'Uncertainty' is a shared concept node linking NeRF-W and latentSplat in two hops, and both papers do model uncertainty explicitly, so the path looks strongly supportive. It is not: an existing concept edge says the two papers both represent uncertainty, while the question asks for a joint quantitative comparison that no document performs."

  # ---- ctl2: length-matched controls (2026-08-20) ----
  # The original 48 controls were separable from live questions by a
  # corpus-free rule: 31 words against 57. 'Refuse anything under 40
  # tokens' scored 2.1% hallucination and beat every knowledge signal, so
  # the number measured question style. These are length-matched (mean
  # 56.1 against live 56.7) and that exploit now scores 100%.
  #
  # reason_class splits two DIFFERENT capabilities and they must not be
  # pooled: absent-evidence probes test abstention; out-of-scope-claim
  # probes carry a false premise whose correct answer is a premise
  # CORRECTION — substantive content, not silence.
  - id: ctl2-slam-nerf-elastic-prior-and-pose-basin
    text: "Nerfies stabilised its deformation field with an elastic energy regulariser alongside a coarse-to-fine annealing schedule, and BARF's account names that work as the concurrent source of the schedule it carries over to extrinsic pose. What does the elastic term do to the pose-gradient landscape once the schedule is transplanted, and how does its role there differ?"
    anchors: ["elastic energy regularizer", "coarse-to-fine annealing schedule"]
    control: true
    requires: []
    reason_class: absent-relation
    note: "'elastic' occurs in only two documents (Nerfies, HyperNeRF), always about deformation. BARF never mentions elastic energy; Nerfies never optimises camera extrinsics. The corpus asserts only that BARF reused Nerfies' frequency-annealing schedule for pose - it says nothing about the elastic term outside a deformation field, so no document supports any claim about its effect on a pose-gradient landscape. Both anchors are grounded and both papers sit under coarse-to-fine annealing, so a short path is guaranteed while no evidence is."
  - id: ctl2-slam-nerf-transient-uncertainty-in-tracking
    text: "NeRF in the Wild predicts a transient density and an uncertainty field that downweights per-pixel loss wherever tourists and vehicles appear. NICE-SLAM's tracking thread and DROID-SLAM's Dense Bundle Adjustment layer both minimise residuals against whatever the sensor delivers. Which stage in each of those pipelines consumes such an estimate, and what does this corpus say the omission costs?"
    anchors: ["uncertainty field", "Dense Bundle Adjustment"]
    control: true
    requires: []
    reason_class: absent-relation
    note: "'uncertainty' occurs in exactly two documents, NeRF-W and latentSplat. No SLAM paper in the corpus mentions uncertainty weighting, transient occluders, moving objects or dynamic scenes ('transient' appears in SLAM only in Point-SLAM's reliability check on candidate points, which is not an uncertainty field). Neither NICE-SLAM's tracking thread nor DROID-SLAM's DBA layer is described as consuming any per-pixel confidence, and nothing states what omitting one costs."
  - id: ctl2-slam-nerf-sh-baking-a-slam-decoder
    text: "PlenOctrees dropped the viewing-direction input by baking a spherical-harmonic expansion into octree leaves, then fine-tuned those leaves against the photometric loss; NICE-SLAM and Co-SLAM instead keep a small shared decoder MLP evaluated at every queried point. What has to stop changing before either SLAM decoder could be tabulated that way, and which of the two does this corpus say would lose less by it?"
    anchors: ["spherical-harmonic expansion", "shared decoder MLP"]
    control: true
    requires: []
    reason_class: absent-relation
    note: "'spherical harmonic' occurs only in PlenOctrees, Plenoxels and 3DGS; 'baking' only in PlenOctrees, MERF, 2DGS and TripoSR. No SLAM paper in the corpus mentions spherical harmonics or baking at all. Nothing discretises, tabulates or bakes a SLAM decoder, and neither NICE-SLAM nor Co-SLAM discusses removing its decoder from the query path. The shared 'decoder' vocabulary makes the pairing sound tractable while no document relates the two."
  - id: ctl2-slam-nerf-proposal-sampler-while-mapping
    text: "Mip-NeRF 360 distils a small proposal MLP out of a larger radiance network so that hierarchical sampling concentrates on visible content, while Co-SLAM tunes a ray sampling strategy purely to keep its global bundle adjustment tractable at interactive rates. What supervises the Co-SLAM allocation while the map is still incomplete, and how does that change the per-ray cost of the first few keyframes?"
    anchors: ["proposal MLP", "ray sampling"]
    control: true
    requires: []
    reason_class: absent-relation
    note: "'proposal MLP' and 'online distillation' occur only in Mip-NeRF 360. Co-SLAM's sampler is named in a single clause - 'a ray sampling strategy tuned to the hybrid representation keeps the bundle adjustment tractable at interactive rates' - with no account of what supervises it, no per-ray cost figure, and no keyframe-indexed behaviour. No document relates distillation-based sample allocation to incremental mapping."
  - id: ctl2-slam-nerf-contraction-over-a-metric-map
    text: "Mip-NeRF 360 contracts unbounded coordinates into a bounded domain, and MERF swapped that rule for one preserving cheap ray-box intersection. NICE-SLAM's hierarchical feature grid and Point-SLAM's anchors are laid out in metric world space instead. What happens to far-field detail in each of those maps under either contraction, and which variant fits which?"
    anchors: ["contraction function", "hierarchical feature grid"]
    control: true
    requires: []
    reason_class: absent-relation
    note: "'contraction' occurs only in Mip-NeRF 360 and MERF (plus one daily digest). No SLAM paper in the corpus mentions contraction, unbounded scenes, or far-field parameterisation - the neural-SLAM papers are all indoor, room-scale and metric. NICE-SLAM's grid and Point-SLAM's anchors are never discussed under any coordinate warp, so the effect on far-field detail is asserted nowhere."
  - id: ctl2-slam-nerf-nothing-left-to-anneal
    text: "Plenoxels has no positional encoding at all: the smoothing an MLP used to supply was replaced by explicit total-variation and sparsity priors on voxel values. BARF blames NeRF's pose failures on the high-frequency bands of exactly that encoding. Which Plenoxels prior inherits the role BARF assigns to the masked bands, and why does the substitution not carry?"
    anchors: ["total-variation and sparsity priors", "high-frequency bands"]
    control: true
    requires: []
    reason_class: absent-relation
    note: "The Plenoxels paper contains no occurrence of pose, camera, extrinsic, tracking or registration - verified by exhaustive search over both its files. BARF never mentions voxel grids, total variation or sparsity. The corpus relates the total-variation and sparsity priors only to the smoothing an MLP used to supply, never to a pose-gradient landscape, so no document licenses a mapping from either prior onto BARF's masked bands."
  - id: ctl2-slam-nerf-occupancy-sharpening-online
    text: "UNISURF sharpens opacity around its occupancy boundary as training proceeds, so a uniform sampler ends up concentrated on the surface. NICE-SLAM's decoder emits occupancy and color throughout a live capture that never has a fixed training schedule. What sets the sharpening rate when frames arrive one at a time, and where does that leave the sampler?"
    anchors: ["occupancy boundary", "occupancy and color"]
    control: true
    requires: []
    reason_class: absent-relation
    note: "UNISURF's sharpening is described only as an early-to-late progression inside a fixed offline training run, with no rate, schedule or controlling parameter given. The NICE-SLAM paper contains no occurrence of 'sampl', so it has no sampler for a schedule to act on. Both papers share the word occupancy, which is exactly the spurious bridge; no document states what would govern sharpening under incremental frame arrival."
  - id: ctl2-slam-nerf-leaf-finetuning-between-keyframes
    text: "After baking, PlenOctrees fine-tuned octree leaf coefficients against the photometric loss and typically beat the NeRF it distilled. GS-SLAM's adaptive expansion strategy keeps growing a map that every incoming frame is simultaneously tracked against. What blocks an equivalent refinement pass between keyframes, and which of the two — the tracker or the map — objects first?"
    anchors: ["octree leaf coefficients", "adaptive expansion strategy"]
    control: true
    requires: []
    reason_class: absent-relation
    note: "PlenOctrees' leaf fine-tuning is described only as a post-hoc step on an already baked octree, offline and with poses fixed. GS-SLAM's adaptive expansion is described only as adding Gaussians where the map fails to explain incoming pixels and pruning those drifting off the surface. No document considers a refinement pass scheduled between keyframes, names anything that would block one, or attributes such an obstacle to a tracker rather than a map."
  - id: ctl2-slam-nerf-normal-prior-into-tracking
    text: "MonoSDF matches an off-the-shelf monocular predictor against the rendered surface normal its distance field yields analytically. The shallow MLP in Co-SLAM predicts signed distance and colour for every point a live RGB-D loop queries, but never renders a normal. What would such a prior add to camera tracking rather than to reconstruction, and how would the two systems weight it?"
    anchors: ["rendered surface normal", "signed distance and colour"]
    control: true
    requires: []
    reason_class: absent-relation
    note: "'surface normal' occurs in only three documents - IGR, MonoSDF and 2DGS - and in every case as reconstruction supervision, never as a tracking term. Co-SLAM renders no normal. No corpus document connects a monocular normal prior to camera tracking, to a tracking residual, or to any weighting against a photometric term, so the contrast being asked for is asserted nowhere."
  - id: ctl2-slam-nerf-baking-a-live-map
    text: "MERF bakes a trained field into a sparse grid plus three high-resolution 2D feature planes, so an unbounded scene streams into a browser in real time. The explicit primitive map of GS-SLAM can be displayed at any moment with no separate decoder pass. What would a mid-capture bake freeze in each case, and which of the three artefacts — grid, planes, primitives — survives a later pose correction?"
    anchors: ["2D feature planes", "explicit primitive"]
    control: true
    requires: []
    reason_class: absent-relation
    note: "Baking appears in the corpus only as an offline post-training step on a converged model (PlenOctrees, MERF, 2DGS, TripoSR). GS-SLAM's claim is narrower than it sounds: only that its explicit map needs no extra decoder pass to visualise. Nothing in the corpus discusses a mid-capture bake, what such a bake would have to freeze, or how a later pose correction would interact with baked structure."
  - id: ctl2-slam-nerf-dso-keeps-the-tv-prior
    text: "Direct Sparse Odometry keeps the total-variation smoothness prior that dense direct methods place on depth and layers photometric calibration over it; Plenoxels later put total variation back on voxel values after removing the network. What is each prior actually smoothing, and which failure did this corpus attribute to switching it off?"
    anchors: ["total-variation smoothness prior", "photometric calibration"]
    control: true
    requires: []
    reason_class: out-of-scope-claim
    note: "The premise is contradicted by the source: DSO 'drops the total-variation smoothness prior on depth and instead samples a fixed budget of pixels uniformly across regions of non-zero intensity gradient'. Plenoxels genuinely uses total-variation and sparsity priors, but the corpus contains no removal ablation for either prior - 'ablation' occurs once, in an unrelated repo README - and the two uses are never related to each other."
  - id: ctl2-slam-nerf-sdf-and-occupancy-swapped
    text: "NICE-SLAM's shared decoder predicts a signed distance field that Co-SLAM later traded for an occupancy field to gain speed, and both systems read their features out of voxel or hash grids rather than from a point set. What does that trade cost in surface sharpness, and why does each system name a different bottleneck?"
