    note: "Answer must separate optimisation-time multi-view inconsistency (the Janus pathology Instant3D attributes to score distillation) from a regressor trained against multi-view supervision, where consistency is baked in at training time rather than enforced per instance; TripoSR's rebalanced objective and filtered supervision are the relevant follow-up."
    hop_rationale: "'Janus' sits on the diffusion/score-distillation side and 'multi-view supervision' on the training side; a graph bridges them in two hops through Instant3D itself or a shared consistency concept. That bridge only shows both terms live in the same literature. Whether the failure mode transfers to a feed-forward regressor depends on how LRM obtains consistency, which the bridging node says nothing about."
  - id: lrm-data-scale-vs-quality-filter
    text: "LRM's generalisation argument is scale — about a million objects mixing Objaverse renders with real MVImgNet captures — while TripoSR's is quality-aware filtering of the same kind of corpus, and Zero-1-to-3 gets zero-shot behaviour from synthetic Objaverse renders alone. What does each treat as the binding constraint on generalisation, and where do the three positions actually conflict?"
