  - id: ctl2-surface-dyn-mesh-handles-vs-warp
    text: "SuGaR's final stage binds each Gaussian to a mesh face by a barycentric coordinate so sculpting, rigging and animation happen in conventional tools, and Nerfies instead learns a warp into a canonical template straight from monocular video. What does an editing pipeline keep from each of those two motion sources, and what does the binding forbid the warp from expressing?"
