  - id: lrm-mesh-extraction-cost-placement
    text: "TripoSR returns a mesh from an implicit triplane in under half a second, DreamGaussian gets one by converting an optimised Gaussian set through a Marching-Cubes-style step and refining UV texture, and LGM stops at multi-view Gaussian features. Where does the mesh-extraction cost sit in each pipeline, and what does the Gaussian output still owe a mesh consumer?"
