  - id: sparse-no-densification-loop
    text: "3DGS arrives at its primitive layout through an interleaved densification and pruning schedule; Scaffold-GS replaces that with anchor growing and pruning scored by how much each anchor's neural Gaussians contribute; MVSplat has neither, since its primitive count is fixed by input pixels the moment the forward pass runs. Explain which failures the two training-time schedules exist to fix, and which of those failures a feed-forward predictor has no mechanism to correct."
