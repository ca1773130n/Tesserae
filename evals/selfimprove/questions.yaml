  - id: ctl2-surface-dyn-sampler-bound-under-motion
    text: "VolSDF's bound on the opacity approximation error, stated in terms of the Laplace bandwidth, is what lets its importance sampler skip empty space, so name what plays that role where the surface has moved between timestamps and what the corpus gives as the bound's dynamic counterpart."
    anchors: ["opacity approximation error", "deformation field"]
    control: true
    requires: []
    reason_class: absent-relation
    note: "Zero documents contain both 'opacity approximation error' and any of 'deformation', 'dynamic' or '4D'. VolSDF's bound is stated only for a static ray, and no dynamic method in the corpus bounds its sampling error at all."
  - id: ctl2-surface-dyn-backbone-study-for-warp
    text: "MonoSDF compares monolithic MLPs, single-grid representations and multi-resolution grid encodings as SDF backbones, and reports that the monocular cues improve all of them; 4D-GS keeps its deformation field in a HexPlane-style decomposed voxel grid. Which of those three does the equivalent study rank first for a deformation field, and what does each gain there?"
