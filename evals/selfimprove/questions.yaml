    note: "No document extracts a mesh from a dynamic Gaussian field. 'Poisson reconstruction' occurs only in SuGaR and the 2026-04-25 digest, and no document containing it contains 'dynamic', 'temporal', '4D' or 'deformation'. Mesh connectivity across frames is discussed nowhere in the corpus."
  - id: ctl2-surface-dyn-distortion-under-deformation
    text: "2DGS's depth distortion term collapses the depth distribution along a ray onto a single disk; 4D-GS decodes per-primitive offsets of position, rotation and scale from a HexPlane-style grid through a lightweight MLP. What happens to that distortion term after the deformation has displaced each primitive, and which of the two quantities is recomputed first?"
