    note: "Both halves of the premise are contradicted. Plenoxels matches NeRF-quality view synthesis 'with no neural network at all' - there is no decoder to hand anything to. Instant-NGP states 'there is no explicit collision resolution'; fine-level collisions are settled implicitly by gradient updates that prefer to place visible content where collisions are absent. The collision-resolution step the question presupposes exists in neither system."
  - id: ctl2-slam-nerf-gaussian-slam-sensors-swapped
    text: "Gaussian Splatting SLAM is the RGB-D member of the pair and GS-SLAM the monocular one, so only GS-SLAM has to suppress scale drift while its counterpart reads depth straight off the sensor. What does the depth channel remove from the tracking objective, and why was a wider basin of convergence reported by only one of them?"
