    hop_rationale: "The anchors connect in two hops via 'FeedForward' or a sparse-view concept, which shows only that all three do sparse-view feed-forward prediction — the shared-infrastructure false positive exactly. Whether a reconstructor can represent uncertainty is a property of its output parameterisation and training objective, stated in the papers and not implied by co-membership in the feed-forward family."
  - id: lrm-where-3d-consistency-is-enforced
    text: "Magic123 buys geometric consistency by mixing a 2D prior with a 3D-aware diffusion prior under a scalar trade-off, while Instant3D pushes consistency into a fine-tuned generator that emits view-consistent images and then regresses them in one pass. Which component carries the consistency burden in each, and why does the Instant3D design expose no trade-off knob to set?"
