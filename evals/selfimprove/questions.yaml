    note: "The two systems are swapped. Gaussian Splatting SLAM (MonoGS) is the monocular system - 'the first SLAM system to use 3D Gaussian Splatting as its sole scene representation in the difficult monocular setting' - which suppresses scale drift and reports the wide basin of convergence, accepting RGB-D only as optional extra supervision. GS-SLAM is the RGB-D system. No corpus document reports any basin measurement with a depth channel ablated."
  - id: ctl2-slam-nerf-raft-correlation-lookup
    text: "DeepV2D's release was described as a starting point for later work on learned multi-view stereo and recurrent optical flow, and DROID-SLAM built its update operator on the iterative-refinement primitive that RAFT introduced. What does the RAFT correlation lookup supply that a plane-sweep cost volume does not, and which variable does each system point it at?"
