    note: "RAFT appears only as a bare name in DeepV2D, DROID-SLAM and the DROID-SLAM repo blurb, always as the source of an 'iterative refinement primitive'. The string 'correlation lookup' has zero occurrences across all 135 corpus files. No document describes RAFT's architecture or contrasts it with a plane-sweep cost volume; DROID-SLAM's own 4D correlation volume is a tempting substitute that answers a different question."
  - id: ctl2-slam-nerf-dvgo-tensorf-empty-space
    text: "Instant-NGP placed itself between two lines: the explicit-grid line of Plenoxels and DVGO, and the coordinate-MLP line of NeRF. MERF described its own plane decomposition as mirroring the TensoRF and K-Planes factorisation. What does each cited ancestor do about empty space, and which half of the trade-off is it invoked for here?"
