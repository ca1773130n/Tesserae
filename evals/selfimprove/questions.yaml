  - id: ctl2-surface-dyn-benchmark-transfer
    text: "NeuS and UNISURF report multi-view reconstruction on DTU and BlendedMVS, both of them mask-free. Nerfies validates differently — with a two-phone rig, one phone recording the training video and the second recording time-synchronized validation frames from another viewpoint. Name the protocol under which the deformable and the multi-view surface lines have been compared head to head, and state what it found."
