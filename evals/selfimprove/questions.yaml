# Questions for the FROZEN-corpus self-improvement experiment.
#
# Separate from `evals/growth/questions.yaml` on purpose. That set measures
# cumulative slices, so every question being answerable at the full corpus is
# its intended END state — and reusing it froze experiment 1 at 15/15 with
# nowhere to rise. Its hop budget is also swept against it specifically; adding
# 59 questions there would invalidate that calibration. Growth keeps its set,
# this experiment gets its own.
#
# Authored from the paper markdown under examples/demo-corpus, never from a
# compiled graph: a question written from the graph under test is answerable by
# that graph by construction, which is the circularity the whole rebuild exists
# to avoid. Then adversarially verified — every `requires` directory confirmed
# on disk, every anchor confirmed to occur in those papers' text, every claimed
# relationship confirmed to be stated rather than merely plausible, and every
# control confirmed unanswerable across all 50 papers rather than just its own
# cluster. One question was dropped at that stage for asserting an inheritance
# its papers never claim.
#
# `hop_rationale` records why a short generic path between the anchors is NOT
# evidence for that question. It is documentation, not scoring input: the
# ranked-retrieval metric this set was built for does not read it.
# NOTE ON CONTROLS. `legacy_gameable: true` marks the original 48. They are kept
# so earlier runs stay interpretable and MUST NOT be used to compute a
# hallucination rate: at 31 words against the live set's 57, a rule with no
# corpus access — "refuse anything under 40 tokens" — scored 2.1% hallucination
# on them while beating every genuine knowledge signal. The number they produce
# measures question style.
#
# The ctl2-* controls are length-matched (mean 56.1 vs 56.7) and that exploit
# scores 100% on them. They carry `reason_class`, which separates two
# capabilities that must not be pooled: absent-evidence probes test ABSTENTION,
# while out-of-scope-claim probes carry a false premise whose correct answer is
# a premise CORRECTION — substantive content, not silence.
questions:

  # ---- slam ----
  - id: slam-odo-photometric-calibration-to-dba
    text: "Direct sparse odometry made photometric calibration — exposure time, lens vignetting, response function — decisive for robustness under rolling shutter and exposure change. When the same photometric residual was later moved inside a differentiable Dense Bundle Adjustment layer, what took over that robustness role, and which intermediate architecture first established that the geometric solver itself could be trained end-to-end?"
    anchors: ["photometric calibration", "Dense Bundle Adjustment"]
    requires: ["1607.02565", "1812.04605", "2108.10869"]
    note: "Hard because the honest answer is a substitution, not an inheritance: DSO buys robustness with an explicit sensor model, DROID-SLAM buys it by training a ConvGRU update operator whose gradient flows back through the bundle-adjustment Jacobian, and it drops photometric calibration entirely. DeepV2D is the load-bearing middle term — it is where alternating pose/depth modules were first made differentiable — and DROID-SLAM's own text names it as the predecessor. A checker that only sees 'DSO and DROID-SLAM are both SLAM and both evaluated on EuRoC' has not answered anything."
    hop_rationale: "DSO and DROID-SLAM are one hop apart through several generic hubs — SLAM, EuRoC, monocular, bundle adjustment — and DROID-SLAM explicitly names DSO as a baseline, so a short path is guaranteed by co-citation alone. That path carries no claim about what replaced the photometric calibration, and it omits DeepV2D, without which the 'the solver became trainable' step is unsupported assertion rather than evidence."
  - id: slam-odo-grid-to-point-to-gaussian
    text: "Dense neural SLAM moved its scene features from a hierarchical feature grid to input-adaptive point anchors and then to anisotropic Gaussian primitives. For each of those two steps, what specific deficiency of the predecessor was named as the reason, and which deficiency was about memory rather than rendering cost?"
    anchors: ["hierarchical feature grid", "anisotropic Gaussian primitives"]
    requires: ["2112.12130", "2304.04278", "2311.11700"]
    note: "The two steps have different justifications and conflating them is the failure mode. NICE-SLAM's grid exists to stop a single shared MLP from globally forgetting; Point-SLAM replaces the fixed-resolution grid because anchor density should follow the information density of the input, which is a memory-and-empty-space argument; GS-SLAM replaces implicit anchoring because ray sampling coupled to MLP queries costs too much per pixel, which is a rendering-throughput argument. Answering requires all three papers' stated motivations, not a chronology."
    hop_rationale: "All three are dense RGB-D SLAM systems evaluated on Replica/TUM-RGBD and cite one another as lineage, so a two- or three-hop path between the grid and the Gaussian primitive is free. Such a path establishes only succession in time. The question asks which argument attaches to which step, and a co-citation edge is compatible with the arguments being swapped, so the path cannot discriminate a right answer from a wrong one."
  - id: slam-odo-ray-sampling-vs-rasteriser
    text: "Neural SLAM systems each paid for ray sampling in a different currency before splatting removed it. What did the point-anchored and hybrid-encoding systems each do to make ray sampling affordable, and what is the precise cost argument used to discard it in favour of a differentiable splatting rasteriser?"
    anchors: ["ray sampling", "differentiable splatting rasteriser"]
    requires: ["2304.04278", "2304.14377", "2311.11700", "2308.04079"]
    note: "Three distinct mitigations for one bottleneck: Point-SLAM places anchors only where information density warrants them so less compute is spent on empty space; Co-SLAM tunes a ray sampling strategy specifically so global bundle adjustment stays tractable at interactive rates; GS-SLAM argues the coupling of ray sampling to MLP queries imposes a per-pixel cost that caps incremental update rates, and inherits 3DGS's tile-based rasteriser instead. A 'both mention ray sampling' match is precisely the false positive to reject here."
    hop_rationale: "'Ray sampling' is shared vocabulary across every volume-rendering paper in the corpus, so it is a hub term and any two SLAM papers reach it in one hop. Co-occurrence at that hub says nothing about whether a paper optimised ray sampling, avoided it, or argued against it — which is the entire content of the question. The rasteriser anchor also resolves to 3DGS, which is not a SLAM paper at all, so the relationship must be traced through GS-SLAM's specific adoption claim rather than through the shared term."
  - id: slam-odo-windowed-to-global-ba
    text: "Windowed bundle adjustment over a keyframe budget was a defining efficiency choice of classical direct odometry and was carried into the first neural implicit SLAM systems as a small active-keyframe window. Which neural SLAM system abandoned it for global bundle adjustment over all keyframes, what made that affordable, and what failure mode did it claim the windowed alternative suffers?"
    anchors: ["windowed bundle adjustment", "global bundle adjustment"]
    requires: ["1607.02565", "2112.12130", "2304.14377"]
    note: "The chain crosses the classical/neural divide: DSO's joint windowed bundle adjustment over keyframes is the origin of the budget; NICE-SLAM keeps a sliding window of keyframes for its mapping thread; Co-SLAM goes global and attributes the affordability to its ray sampling strategy, claiming that local-window optimisation alone lets drift accumulate on long sequences. The tempting shortcut — 'both do bundle adjustment' — inverts nothing and explains nothing."
    hop_rationale: "The two anchors are near-synonyms in graph terms; any extractor will place both under a 'bundle adjustment' concept and connect them in one hop, which would score the question answerable from a single paper. Evidence here has to be a directional claim — that one scope superseded the other, for a stated reason, with a stated cost — and that claim is distributed over three papers none of which state it alone. A short path between two flavours of the same technique is the definition of insufficient evidence for this question."
  - id: slam-odo-hash-encoding-hole-filling
    text: "The fast-converging hash encoding was imported from offline radiance-field fitting into real-time SLAM, where incremental capture exposed a weakness it does not exhibit when fitting a fully observed scene. What is that weakness, what second encoding was added alongside to fix it, and which earlier neural SLAM system solved the same problem by a completely different mechanism?"
    anchors: ["hash encoding", "one-blob encoding"]
    requires: ["2201.05989", "2304.14377", "2112.12130"]
    note: "Instant-NGP's hash encoding is sold on convergence speed and high-frequency detail and never discusses unobserved regions, because offline fitting has few. Co-SLAM reports that purely parametric grids leave unobserved space noisy and adds coordinate-based one-blob encoding for surface coherence and hole filling. NICE-SLAM had already addressed plausible completion of unobserved regions, but with pre-trained geometric priors on the decoder MLPs — a prior, not an encoding. Getting the mechanism-versus-mechanism contrast right is the difficulty."
    hop_rationale: "Hash encoding and one-blob encoding are both named in Co-SLAM, so they are one hop apart inside a single document and a path exists the moment that paper is ingested. That path proves only that one system uses both. The question asks why the pairing was necessary — a property of incremental observation that Instant-NGP must supply — and asks for NICE-SLAM's non-encoding alternative, neither of which any edge between the two encodings can carry."
  - id: slam-odo-pose-gradient-basin
    text: "Optimising camera pose through a radiance-field renderer was reported to fall into local minima because of the encoding, and was fixed by annealing the encoding's frequency bands. The monocular Gaussian SLAM system makes the opposite claim about the same optimisation. What does it claim, and what property of the underlying representation — one that the offline splatting paper says forced a dependency on structure-from-motion — is offered as the reason?"
    anchors: ["positional encoding", "basin of convergence"]
    requires: ["2104.06405", "2308.04079", "2312.06741"]
    note: "BARF diagnoses a spiky pose-gradient landscape caused by high-frequency sinusoidal positional encoding and anneals it; MonoGS reports a wide basin of convergence when differentiating splat rendering directly with respect to camera parameters, and 3DGS supplies the setup by noting that vanilla splatting needs accurate per-image poses from an offline structure-from-motion stage. Nothing in the corpus links BARF and MonoGS directly, so the relationship has to be assembled from three papers with no citation edge between the endpoints."
    hop_rationale: "BARF and MonoGS are both tagged with pose estimation, bundle adjustment and novel view synthesis, so generic hubs put them within three hops of each other without either paper saying anything about the other. Worse, the honest answer is a contrast rather than an inheritance, and a short path is equally consistent with agreement, so path existence here is actively misleading. The 3DGS dependency on offline SfM poses is the only thing that makes the contrast meaningful, and it lives in a third paper that is not a SLAM paper."
  - id: slam-odo-primitive-reliability
    text: "Every explicit-primitive SLAM map needs a mechanism that stops it absorbing unreliable observations. Name the mechanism used by the point-anchored system and the two Gaussian systems respectively, and say which specific artefact each one is aimed at."
    anchors: ["reliability check", "geometric verification"]
    requires: ["2304.04278", "2311.11700", "2312.06741"]
    note: "Three mechanisms in the same functional slot, aimed at three different artefacts: Point-SLAM's reliability check on new candidate points keeps the cloud from absorbing transient observations under repeated revisits; GS-SLAM's coarse-to-fine selection of reliable Gaussians suppresses the influence of recently spawned or noisy primitives during pose optimisation, i.e. it protects tracking rather than the map; MonoGS's geometric verification and regularisation target floaters, sliding surfaces and scale drift specific to incremental monocular reconstruction. Mapping mechanism to artefact is where a shallow answer breaks."
    hop_rationale: "The three papers form a declared lineage — Point-SLAM's text names the Gaussian systems as successors that keep the explicit-primitive philosophy — so they are mutually one hop apart and a path is guaranteed. Succession does not imply the mechanisms are the same one refined, which is exactly the wrong answer available from the short path. Two of the three mechanisms also protect different stages (map versus tracking), a distinction no lineage edge encodes."
  - id: slam-odo-densification-trigger
    text: "Offline Gaussian Splatting decides where to clone and split primitives from positional-gradient magnitudes, a criterion later argued to be a biased proxy for per-pixel reconstruction error. What trigger do the incremental Gaussian SLAM systems use instead, and why does the online setting force that choice regardless of the offline critique?"
    anchors: ["Adaptive Density Control", "adaptive expansion strategy"]
    requires: ["2308.04079", "2311.11700", "2312.06741", "2404.06109"]
    note: "The convergence is the interesting part and it is not a citation: GS-SLAM's adaptive expansion adds Gaussians where the current map fails to explain incoming pixels and prunes those drifting off the surface, and MonoGS grows Gaussians on the same failure-to-explain criterion, because an incremental system has a live residual against a sensor stream and no notion of a training schedule. Revising Densification arrives at a pixel-error-driven trigger independently, from the offline side, by arguing the positional-gradient proxy is biased. Both anchor terms name density-control policies, so a checker must not collapse them into 'densification'."
    hop_rationale: "Every paper here descends from 3DGS and 'densification' is one of the densest hubs in the corpus, so all four are within two hops through it. That hub connects the anchors while erasing the only thing being asked: what each policy's trigger signal actually is. A generic path also cannot distinguish the SLAM systems' motivation (there is no batch schedule and the residual is live) from the offline paper's motivation (the proxy is statistically biased and produces floaters and runaway primitive counts), which is the substance of the answer."
  - id: slam-odo-realtime-budget
    text: "Gaussian Splatting is advertised as a real-time renderer at 1080p, yet the monocular SLAM system built on it runs at roughly 3 FPS while a classical sparse-odometry system from years earlier was real-time on a single CPU. What does the SLAM loop spend the budget on that offline differentiable rasterisation does not, and what does the RGB-D Gaussian SLAM system do to claw part of that cost back?"
    anchors: ["differentiable rasterisation", "camera tracking"]
    requires: ["1607.02565", "2308.04079", "2311.11700", "2312.06741"]
    note: "A representation's rendering throughput is not its SLAM throughput, and the corpus states the numbers separately in four places: DSO real-time on one CPU with a fixed pixel budget and no rendering at all; 3DGS at 30-plus FPS at 1080p given poses; MonoGS at roughly 3 FPS because every frame optimises pose by differentiating the render with respect to camera parameters; GS-SLAM recovering runtime through coarse-to-fine selection of reliable Gaussians and by taking depth from an RGB-D sensor rather than solving the monocular case. Reciting FPS numbers is not an answer; attributing them is."
    hop_rationale: "Rendering speed is shared infrastructure across the whole corpus — nearly every paper reports frames per second — so 'real-time' and 'differentiable rasterisation' connect to camera tracking through a benchmark-metric hub in one or two hops. Those edges are the archetype of the false positive this instrument exists to detect: two papers reporting the same metric is not a relationship. The answer requires attributing a per-frame optimisation cost that only appears when tracking and rendering share one representation, plus GS-SLAM's specific runtime-reduction claim."
  - id: slam-odo-cost-volume-lineage
    text: "What replaced the plane-sweep cost volume when the differentiable structure-from-motion idea was scaled from offline video-to-depth to full SLAM, what makes the replacement trainable end-to-end, and which class of downstream mapping system then consumed the result as a front end?"
    anchors: ["plane-sweep cost volume", "4D correlation volume"]
    requires: ["1812.04605", "2108.10869", "2112.12130"]
    note: "DeepV2D unrolls SfM into feature extraction, a plane-sweep cost volume and dense pose optimisation, alternating motion and depth to convergence offline. DROID-SLAM keeps the iterative-refinement primitive but swaps in a ConvGRU update operator over a 4D correlation volume between every pair of frames in a growing co-visibility graph, made trainable because the Dense Bundle Adjustment layer's Gauss-Newton step is differentiable and the photometric residual's gradient flows back through its Jacobian. DROID-SLAM's text then names radiance-field mapping systems such as NICE-SLAM as consumers of it as a front end, which closes the chain into the neural-implicit cluster."
    hop_rationale: "Both volume types are cost-volume-flavoured constructs authored by the same first author, so an author edge plus a shared 'multi-view geometry' hub puts them within two hops with no evidence about the substitution. That path also cannot supply the third clause: NICE-SLAM never mentions correlation volumes, and its role as a downstream consumer is asserted only in DROID-SLAM's text, so a checker relying on shared-term proximity between the two volume anchors will miss the only edge that makes the question a chain rather than a pair."
  - id: slam-odo-control-dba-gaussians
    text: "How does the Dense Bundle Adjustment layer solve jointly for camera pose and the covariances of anisotropic 3D Gaussians when the map is updated incrementally?"
    anchors: ["Dense Bundle Adjustment", "anisotropic 3D Gaussians"]
    control: true
    legacy_gameable: true
    requires: []
    note: "No paper in the 50-document corpus puts Gaussian primitives inside a Dense Bundle Adjustment layer. DROID-SLAM's DBA layer solves a Gauss-Newton step over per-pixel depth and per-frame pose on a co-visibility graph and predates 3D Gaussian Splatting by two years; it never mentions Gaussians. Both GS-SLAM and Gaussian Splatting SLAM optimise Gaussians through a splatting-based photometric-and-depth re-rendering loss and neither mentions bundle adjustment of covariances. Covariance is optimised in 3DGS only by offline gradient descent with known poses. The question is unanswerable, but the anchors are grounded and the path DROID-SLAM to SLAM to GS-SLAM to 3D Gaussian Splatting is short and inviting."
    hop_rationale: "This control exists precisely because a three-hop path does exist and is worthless: both anchors sit one hop from the SLAM hub, and GS-SLAM co-mentions SLAM and Gaussians while DROID-SLAM co-mentions SLAM and DBA. Any checker that accepts hub traversal as evidence will report this answered, and every other number it produces is then suspect."
  - id: slam-odo-control-one-blob-photometric
    text: "What does one-blob encoding contribute to the photometric calibration of exposure time and lens vignetting in direct visual odometry?"
    anchors: ["one-blob encoding", "photometric calibration"]
    control: true
    legacy_gameable: true
    requires: []
    note: "One-blob encoding appears only in Co-SLAM, where it is a smooth coordinate encoding added to a multi-resolution hash grid to encourage surface coherence and hole filling in unobserved regions. Photometric calibration appears only in Direct Sparse Odometry, where it is a camera sensor model covering exposure time, lens vignetting and the non-linear response function. They are not the same kind of object — a scene-encoding basis versus a camera-response model — and no document in the corpus relates them; DSO predates one-blob encoding by seven years and no neural SLAM paper in the corpus models exposure or vignetting at all. Both anchors are grounded, and both papers carry the same sub_topic, Visual SLAM and MVS, so a short path through that shared classification exists while no evidence does."
    hop_rationale: "Shared sub_topic plus the SLAM hub puts these two anchors within three hops for free, and both papers legitimately concern robustness of camera tracking, which makes a spurious connection sound reasonable when narrated. That is the trap: the corpus supports a plausible-sounding sentence about both terms without supporting a single sentence relating them."

  # ---- nerf ----
  - id: nerf-found-encoding-frequency-schedules
    text: "NeRF's sinusoidal positional encoding was later attenuated in frequency by several follow-ups for entirely different reasons. Which works did this, was each suppressing high frequencies to fix pixel-footprint aliasing, camera-pose registration, or deformation-field local minima, and how does an analytic expectation over a frustum differ from a training-time frequency mask?"
    anchors: ["integrated positional encoding", "coarse-to-fine annealing"]
    requires: ["2003.08934", "2103.13415", "2104.06405", "2011.12948"]
    note: "All four papers share the positional-encoding vocabulary, so lexical overlap is maximal while the claims are mutually exclusive. Mip-NeRF's damping is a closed-form expectation whose bandwidth is set by the conical frustum's spatial extent — a property of ray geometry, applied at every sample forever. BARF's and Nerfies' is a hand-scheduled mask over training time, applied because the gradient landscape with respect to camera pose (BARF) or to a deformation field (Nerfies) is spiky under high-frequency encodings. BARF itself notes the trick appeared concurrently in Nerfies for deformation while it applies it to extrinsic pose; getting the three apart requires reading mechanisms, not the shared term."
    hop_rationale: "Every paper here is one hop from NeRF, so 'integrated positional encoding -> NeRF -> coarse-to-fine annealing' is a generic 3-hop path that exists for any pair of NeRF descendants in this corpus. That path certifies only that both works touch NeRF's encoding; it carries no evidence about what each frequency modification is for, nor that one is permanent-and-analytic while the other is transient-and-scheduled. Evidence must come from each paper's own stated failure mode."
  - id: nerf-found-hierarchical-sampling-arc
    text: "NeRF trained a coarse and a fine network to decide where to place samples along a ray, Mip-NeRF then deleted one of them, and Mip-NeRF 360 added a network back. What made the deletion possible, what does the re-added network actually predict, and why is it not a return to NeRF's original design?"
    anchors: ["hierarchical sampling", "proposal MLP"]
    requires: ["2003.08934", "2103.13415", "2111.12077"]
    note: "The three-step story is only recoverable from the mechanism in each paper: NeRF's coarse network is a radiance network reused for importance sampling; Mip-NeRF collapses the pair into one MLP because IPE makes a single network scale-aware; Mip-NeRF 360's proposal MLP predicts only where mass lies along a ray and is supervised by the larger radiance MLP through online distillation, so it never produces colour at all. An answer that reports 'all three do hierarchical sampling' has the direction of both changes wrong."
    hop_rationale: "Both anchors co-occur inside the Mip-NeRF 360 document, so a path-finder resolves them at distance 0-2 through that single paper — an apparently strong path that proves nothing. A one-document path cannot show that the proposal MLP replaces an architecture introduced two papers earlier and deliberately removed in between; only NeRF's coarse/fine statement and Mip-NeRF's collapse-into-one-network claim establish that."
  - id: nerf-found-baking-to-unbounded
    text: "Real-time NeRF rendering began by baking a trained network into a lookup structure over a bounded object. What had to change about the scene parameterization before the same baking strategy could serve unbounded 360-degree captures in a browser, and why did the earlier structure not simply scale up?"
    anchors: ["sparse octree", "contraction function"]
    requires: ["2103.14024", "2111.12077", "2302.12249"]
    note: "Three documents each hold one third of the answer. PlenOctrees defines what baking is (evaluate the MLP densely, prune, store in a sparse octree, then fine-tune the leaves). Mip-NeRF 360 defines what has to be contracted and why unbounded content cannot sit in a uniformly sampled bounded volume. MERF states the gap — prior baking scales to bounded objects, not to Mip-NeRF 360-scale captures — and the specific constraint its own contraction must satisfy, efficient ray-box intersection for fast traversal, which is a rendering requirement absent from both predecessors."
    hop_rationale: "PlenOctrees and MERF are both 'real-time radiance field' papers that both mention in-browser rendering, so a co-occurrence path through real-time rendering is trivially available and would equally connect PlenOctrees to 3D Gaussian Splatting. The question turns on a traversal constraint stated in exactly one document, which is meaningless without the parameterization defined in a second and the baking procedure defined in a third."
  - id: nerf-found-view-dependence-sh-vs-mlp
    text: "Pushing view-dependent appearance into spherical harmonics is what let baked and grid-based radiance fields drop the viewing direction from the network entirely. Which works took that route, which later real-time unbounded system kept a small MLP as the view-dependent decoder instead, and what did that choice buy it?"
    anchors: ["spherical harmonics", "view-dependent color"]
    requires: ["2103.14024", "2112.05131", "2302.12249", "2308.04079"]
    note: "PlenOctrees retrains the radiance head to emit SH coefficients precisely so the MLP can be thrown away; Plenoxels stores SH per voxel with no network at all; 3D Gaussian Splatting carries SH per primitive. MERF is the deliberate exception — a small MLP decodes the combined sparse-grid and feature-plane features into density and view-dependent colour, which is what keeps the baked model inside a consumer memory budget. The negative case is the whole answer and is stated only in MERF."
    hop_rationale: "The two anchors co-occur inside PlenOctrees and again inside Plenoxels, so a path exists wholly within one document and would score answered without MERF ever being touched. Separately, 'spherical harmonics -> radiance field -> MERF' shows only that MERF is a radiance field. Neither path can express the discriminating fact — that one member of this family declined SH and why — so a short path is not evidence here."
  - id: nerf-found-pose-dependency-round-trip
    text: "BARF removed NeRF's dependence on poses from an offline SfM pipeline, the move to Gaussian primitives reintroduced a structure-from-motion requirement, and monocular Gaussian SLAM removed it again. What is each system depending on SfM for, and why is BARF's fix not directly transferable to the splatting case?"
    anchors: ["bundle adjustment", "camera tracking"]
    requires: ["2003.08934", "2104.06405", "2308.04079", "2312.06741"]
    note: "The dependencies are different objects. NeRF needs accurate poses from COLMAP; BARF recovers them by annealing positional-encoding frequencies inside a synthesis-based bundle adjustment — a mechanism that presupposes a coordinate MLP with a sinusoidal encoding, which 3DGS does not have. 3DGS additionally needs the SfM sparse point cloud as initialisation, not just the poses. MonoGS tracks by differentiating the splat rasterisation with respect to camera parameters and reports a wide basin of convergence. 'They all do bundle adjustment' misses every one of these distinctions."
    hop_rationale: "'bundle adjustment' and 'camera tracking' co-occur across the SLAM cluster (DROID-SLAM, Co-SLAM, MonoGS), so a short path between the anchors exists entirely inside SLAM documents that never mention BARF or NeRF's pose assumption. That path is evidence about visual SLAM, not about the radiance-field pose dependency being asked about, and it would score identically if BARF were absent from the slice."
  - id: nerf-found-hash-grid-adopters
    text: "The multiresolution hash grid was carried out of neural graphics primitives into text-to-3D, into SDF surface reconstruction, and into real-time SLAM. What did each adopter have to add around it, and which of them reports that a purely parametric grid leaves unobserved regions badly behaved?"
    anchors: ["multi-resolution hash grid", "one-blob encoding"]
    requires: ["2201.05989", "2211.10440", "2206.00665", "2304.14377"]
    note: "Instant-NGP claims the encoding is versatile; the adopters show what versatility costs. Magic3D uses it only for a coarse first stage before re-parameterising as a textured mesh for high-resolution SDS. MonoSDF benchmarks it against monolithic MLPs and single-resolution grids and finds it the best speed-quality trade-off, but only once monocular depth and normal priors are added. Co-SLAM must blend a smooth coordinate-based one-blob encoding into it because purely parametric grids leave unobserved space noisy — a limitation of the hash grid stated nowhere in Instant-NGP."
    hop_rationale: "Hash-encoding vocabulary appears across a large fraction of the corpus, so 'hash grid -> Instant-NGP -> any adopter' is available for every adopter and distinguishes none of them. It cannot say which adopter identified a deficiency or what compensating structure it introduced. The one-blob anchor is chosen deliberately because reaching it requires the Co-SLAM document specifically rather than the generic Instant-NGP hub."
  - id: nerf-found-capture-artifact-mechanisms
    text: "Vanilla NeRF breaks on real captures in two distinct ways, and two follow-ups fix them with opposite kinds of intervention — one reweights the photometric loss per pixel, the other penalises how radiance is distributed along a ray. Which failure does each target, and would either mechanism suppress the other's artifact?"
    anchors: ["transient head", "distortion-based regularizer"]
    requires: ["2003.08934", "2008.02268", "2111.12077"]
    note: "NeRF-W's transient head plus uncertainty field downweights pixels containing inconsistent observations — tourists, vehicles, scaffolding — and presupposes a per-image cause that a per-image embedding can absorb. Mip-NeRF 360's distortion regulariser penalises radiance smeared along a ray rather than concentrated, suppressing floaters and background haze that arise from unbounded-scene geometry ambiguity even when every observation is perfectly consistent. Neither addresses the other's failure, and saying so requires the causal claim in each paper rather than the shared word 'artifact'."
    hop_rationale: "The two papers are direct NeRF children sharing an author lineage, the whole metric set, and the phrase 'artifacts'. A path transient head -> NeRF-W -> NeRF -> Mip-NeRF 360 -> distortion regulariser is short and certifies only common ancestry. The question asks whether the two interventions are interchangeable, which no ancestry path can decide — an ancestry-only answer would wrongly imply the mechanisms are variants of one idea."
  - id: nerf-found-plane-factorization-objectives
    text: "The same axis-aligned feature-plane factorisation appears twice in this corpus within weeks, aimed at different things. What is each one optimising for, what does the memory-efficient one pair its planes with, and why does the other not need that companion structure?"
    anchors: ["2D feature planes", "planar factorization"]
    requires: ["2301.10241", "2302.12249"]
    note: "K-Planes generalises TensoRF's planar factorisation to d-choose-2 planes so that dimension-specific priors (temporal TV, multi-resolution spatial stacks, static-dynamic separation) become mechanical, and trains fast in pure PyTorch with no custom CUDA. MERF pairs high-resolution 2D planes with a sparse 3D feature grid whose empty space is pruned in the Plenoxels manner, because it is optimising a baked, low-memory, real-time artifact rather than training throughput; MERF itself says the decomposition mirrors K-Planes but is geared differently. Reproducing that distinction needs the sparse-grid ancestry as well as both plane papers."
    hop_rationale: "Both are explicit-representation radiance-field papers from the same months citing the same lineage, so any 'explicit representation' or 'factorised grid' hub yields a short path between the anchors. That path cannot separate a training-time factorisation from a bake-time one, which is the entire content of the question; it would read as answered even if MERF's sparse grid and lossless baking procedure were absent from the slice."
  - id: nerf-found-unbounded-without-contraction
    text: "Ray-marching methods needed a contraction of space to render unbounded scenes at speed, yet a rasterising primitive method reached real time on the same 360-degree captures without one. What property of the renderer removes the need for a contracted parameterisation, and what does the contraction buy the methods that still march rays?"
    anchors: ["ray-box intersection", "differentiable rasterisation"]
    requires: ["2111.12077", "2302.12249", "2308.04079"]
    note: "Mip-NeRF 360's contraction exists to balance near-field and far-field detail in a bounded domain; MERF's is additionally constrained to preserve efficient ray-box intersection because fast ray traversal is what real-time rendering needs; 3DGS never marches a ray at all — it projects and tile-sorts primitives front to back, explicitly sidestepping sampling along empty regions, and reports 30+ FPS at 1080p on unbounded scenes. The answer is a claim about rendering algorithms that no single paper in the corpus states."
    hop_rationale: "Contraction and rasterisation sit in the same 'unbounded, real-time' topical neighbourhood — MERF and 3DGS target the same regime and the same benchmark — so a topical path is guaranteed to exist. Following it would support the false inference that 3DGS also contracts space. Only the renderer-level mechanism quoted from each document distinguishes 'needs a traversal-friendly contraction' from 'needs no parameterisation of far-field space at all'."
  - id: nerf-found-scale-awareness-lod
    text: "Mip-NeRF made a radiance field scale-aware by encoding a pixel's footprint analytically. Where does the equivalent scale and level-of-detail behaviour live in the Gaussian-primitive line, is that mechanism analytic or learned, and what motivated it there?"
    anchors: ["conical frustum", "level-of-detail"]
    requires: ["2103.13415", "2308.04079", "2312.00109"]
    note: "Mip-NeRF's answer is a closed-form expectation of the sinusoidal encoding under a Gaussian approximating a conical frustum, so the feature bandwidth falls out of the frustum's spatial extent with no learned parameters. The Gaussian line has no such construction: 3DGS gives every primitive fixed attributes and anisotropic covariance, and Scaffold-GS makes appearance view- and distance-dependent by predicting each neural Gaussian's attributes from viewing direction and camera-to-anchor distance through a shared MLP, motivated by primitive bloat and view extrapolation rather than by aliasing. The corpus never draws the analogy; it has to be built from the three mechanisms."
    hop_rationale: "'conical frustum' lives in the NeRF lineage and 'level-of-detail' in the Gaussian lineage, and the two lineages are joined in two hops because 3DGS targets the mipnerf360 regime and Mip-NeRF 360 names 3D Gaussian Splatting. That link is about a shared benchmark and successor list, not about scale-aware representation; treating it as evidence is exactly the co-occurrence false positive this instrument is meant to expose."
  - id: nerf-found-control-antialiased-hash-grid
    text: "How is mip-NeRF's integrated positional encoding adapted to a multiresolution hash grid so that grid-based radiance fields stay anti-aliased across scales?"
    anchors: ["integrated positional encoding", "multi-resolution hash grid"]
    control: true
    legacy_gameable: true
    requires: []
    note: "Both anchors are grounded — IPE is defined only in Mip-NeRF, the hash grid in Instant-NGP with grounded uses in MonoSDF and Co-SLAM — but no document in the 50-paper corpus discusses aliasing in any grid, hash, or primitive representation: 'alias' occurs only in NeRF, Mip-NeRF and Mip-NeRF 360, none of which mention hash grids, and none of the grid papers mention scale, mipmapping, or supersampling. The work that actually performed this adaptation (Zip-NeRF) exists in the corpus solely as a bare name in one closing sentence of Mip-NeRF 360 — an ungrounded Paper node with no content behind it. Any path scored answerable here is running through that citation stub, which is precisely the false positive the instrument exists to catch."
  - id: nerf-found-control-in-the-wild-splatting
    text: "Which Gaussian Splatting method adopts NeRF-W's per-image appearance embedding to reconstruct landmarks from unconstrained tourist photo collections, and how does it deal with transient occluders?"
    anchors: ["appearance embedding", "3D Gaussian Splatting"]
    control: true
    legacy_gameable: true
    requires: []
    note: "'appearance embedding' occurs in exactly one document in the corpus (NeRF-W), and no Gaussian Splatting paper here touches illumination variation, exposure, unconstrained photo collections, or transient occluders — that vocabulary is confined to NeRF-W plus a few image-to-3D papers. Methods of this kind exist outside the corpus (GS-W, SWAG, VastGaussian), which is what makes the question sound answerable. With more than twenty Gaussian papers and NeRF-W all hanging off 'radiance field' and 'novel view synthesis', a plausible short path is certain to exist; following it would report a connection that no document in the corpus supports."

  # ---- surface ----
  - id: sdf-eikonal-to-poisson
    text: "The Eikonal regulariser is what keeps a neural SDF metric enough to extract a surface from — what do the Gaussian-based surface methods use in its place, and why can they not simply reuse it?"
    anchors: ["Eikonal", "Poisson reconstruction"]
    requires: ["2002.10099", "2106.12052", "2311.12775"]
    note: "Three facts in three papers, none of which states the whole thing. IGR introduced the Eikonal term as a replacement for pre-computed SDF supervision; VolSDF says explicitly that it adopts IGR's Eikonal loss to keep the SDF metric, which is what makes the Laplace-CDF density's argument meaningful; SuGaR supplies the reason the term is unavailable to it — Gaussians do not implicitly define a level set, so there is no field whose gradient could be constrained to unit norm, which is why it reaches for Poisson reconstruction over oriented Gaussian centres instead. Answering with 'both regularise geometry' is the failure mode."
    hop_rationale: "Eikonal → signed distance function → surface reconstruction → Poisson reconstruction is a generic three-hop path that every surface paper in the corpus satisfies by topic membership alone; UNISURF, NeuS and 2DGS would all sit on equivalent paths without saying anything about this substitution. Evidence has to be the specific SuGaR claim that Gaussians define no level set, joined to VolSDF's stated dependence on IGR's loss — a claim about why the transfer is impossible, which no amount of topical adjacency encodes."
  - id: sdf-occupancy-to-two-opacities
    text: "NeuS and VolSDF both replaced UNISURF's occupancy field with a signed distance function within days of each other — how does each turn that SDF into opacity along a ray, and what does each construction buy that the other's does not?"
    anchors: ["occupancy field", "Laplace cumulative distribution function"]
    requires: ["2104.10078", "2106.10689", "2106.12052"]
    note: "Requires knowing that UNISURF's contribution was the occupancy parameterisation that interpolates between surface and volume rendering, that NeuS builds opacity from the cumulative distribution of a logistic density and justifies it by first-order unbiasedness, and that VolSDF instead applies a Laplace CDF to the negative SDF and justifies it by a bound on the opacity-approximation error that in turn drives sampling. Same substitution, two different mathematical objects and two different arguments; a system that has only learned 'NeuS and VolSDF are both SDF + volume rendering' will conflate them."
    hop_rationale: "Both anchors sit one hop from 'volume rendering' and two from 'signed distance function', so a short path exists between virtually any pair of concepts in this cluster. That path is evidence only that the three papers share a rendering framework — precisely the shared-infrastructure false positive. The question turns on which distribution each paper composes with the SDF and what property each derives from it, which is stated nowhere except in the two papers' own method sections plus UNISURF's occupancy formulation as the thing being displaced."
  - id: sdf-sampler-lineage
    text: "Where to put samples along a ray was re-answered three times in this lineage — what did NeRF, UNISURF and VolSDF each use to decide, and which of them could actually bound the error it was making?"
    anchors: ["coarse-to-fine sampling", "opacity approximation error"]
    requires: ["2003.08934", "2104.10078", "2106.12052"]
    note: "NeRF's answer is statistical — a coarse network estimates where mass lies and a fine network importance-samples around it, with no error guarantee. UNISURF's is geometric — once the occupancy boundary is located, samples concentrate around it. VolSDF's is analytic — the Laplace bandwidth yields an explicit bound on the opacity-approximation error, so the sampler can place points where they provably matter. The chain is only visible if all three are read as successive answers to one question rather than as three independent sampling tricks."
    hop_rationale: "'Sampling' is shared infrastructure across every volume-rendering paper in the corpus, so a two- or three-hop path from NeRF's sampler to VolSDF's error bound is guaranteed and means nothing. What the question needs is the ordering and the escalation — heuristic, then geometric, then bounded — plus the fact that UNISURF's efficiency gain is a consequence of its occupancy formulation rather than a standalone sampler. A path through a generic 'ray sampling' node carries none of that."
  - id: sdf-mask-free-cost
    text: "Dropping the per-pixel object mask was the headline claim of UNISURF and NeuS — what was later diagnosed as the cost of leaning on the RGB loss alone, and what got put in the masks' place?"
    anchors: ["foreground mask", "monocular geometric cues"]
    requires: ["2104.10078", "2106.10689", "2206.00665"]
    note: "UNISURF and NeuS both remove the mask requirement of DVR/IDR, by different mechanisms (opacity that sharpens from volume to surface rendering; an unbiased opacity that keeps optimisation robust). MonoSDF then names the bill: with no mask and only a photometric loss, the constraint is too weak in textureless or sparsely observed regions, so it substitutes dense per-pixel supervision from off-the-shelf monocular depth and normal predictors. The relationship is causal — one paper's removed supervision is the later paper's diagnosed deficit — not merely 'these papers are about masks and cues'."
    hop_rationale: "Both anchors are adjacent to 'neural implicit surface reconstruction', so a short path is free. But a path proves only that masks and monocular cues are discussed in the same subfield; it does not encode that the monocular cues are a replacement for a constraint that UNISURF and NeuS deliberately gave up, nor that the failure appears specifically at room scale and in low-texture regions. That direction and that condition are the answer."
  - id: sdf-hashgrid-smoothness-deficit
    text: "Multi-resolution hash encodings buy speed but leave under-observed regions unconstrained — compare how a surface-reconstruction method and a real-time SLAM system each patched that same weakness."
    anchors: ["one-blob encoding", "monocular geometric cues"]
    requires: ["2201.05989", "2206.00665", "2304.14377"]
    note: "Instant-NGP's hash table has no built-in smoothness: features are updated only where rays land, and collisions are resolved by whatever gradients arrive. Two papers in different sub-areas hit this. MonoSDF ablates MLP versus single-resolution grid versus hash grid and finds monocular depth and normal cues improve every backbone, with the hash-grid variant giving the best speed-quality trade-off. Co-SLAM instead blends a coordinate-based one-blob encoding into the hash grid so unobserved space stays coherent rather than noisy. Same deficit, one external prior and one architectural prior — a cross-cluster synthesis that no single paper states."
    hop_rationale: "The two anchors live in different sub-areas and their only short connector is 'hash grid' or 'neural implicit', which is exactly the co-occurrence trap: MonoSDF and Co-SLAM both use hash encodings, and that alone would light up a three-hop path. Evidence for this question is the shared *diagnosis* — that a parametric grid under-constrains regions it has not seen — and that requires Instant-NGP's own description of collision handling as the middle term, plus each paper's stated remedy, not the fact that both cite the same encoding."
  - id: sdf-distortion-normal-transfer
    text: "2DGS strengthens its geometry with a depth-distortion term and a normal-consistency term — where did the distortion idea originate, and how does the normal it supervises differ from the one MonoSDF supervises?"
    anchors: ["distortion-based regularizer", "normal consistency"]
    requires: ["2111.12077", "2206.00665", "2403.17888"]
    note: "Mip-NeRF 360 introduced the distortion regulariser to suppress floaters and background haze in unbounded implicit scenes — a rendering-artefact fix. 2DGS reuses the same idea as a geometry constraint, pushing the depth distribution along a ray onto a single disk. The normal half is the sharper contrast: MonoSDF's rendered normal is the analytic gradient of the SDF, matched against a monocular normal prediction, whereas 2DGS's normal is a property of the flat primitive itself, matched against the gradient of the rendered depth map — no network prior involved. Both are 'normal supervision' and they are not the same thing."
    hop_rationale: "A path distortion-regulariser → regularisation → geometry → normal-consistency traverses only generic method-type nodes and would connect any two loss terms in the corpus. The question asks for a direction of borrowing across a representation boundary (implicit unbounded radiance field to explicit planar primitive) and for a distinction between two same-named supervisions whose sources differ — analytic SDF gradient versus rendered-depth gradient. Neither survives a hop count."
  - id: sdf-marching-cubes-applicability
    text: "Marching Cubes is called the default way to get a mesh out of a neural SDF — which methods in this corpus actually run it, on what field, and what property makes it inapplicable elsewhere?"
    anchors: ["Marching Cubes", "zero level set"]
    requires: ["2002.10099", "2106.10689", "2211.10440", "2311.12775"]
    note: "The answer has to separate three cases. IGR and NeuS give the precondition: a network whose zero level set is the surface, which is exactly what an isosurface extractor consumes. Magic3D applies marching cubes to a coarse NeRF density field and then keeps optimising the resulting textured mesh — an extraction from a field that was never an SDF. SuGaR states the negative case and the reason: Gaussians do not implicitly define a level set, so it runs Poisson reconstruction on oriented centres instead. A checker that treats 'Marching Cubes' as a shared tool node will report agreement where the corpus records an incompatibility."
    hop_rationale: "'Marching Cubes' and 'zero level set' are both one hop from 'mesh extraction' and from 'surface reconstruction', so a short path is unavoidable and would be produced by any pair drawn from this cluster. The question requires the applicability condition — that the algorithm needs an implicit field with a level set — and the roster of who satisfies it, who violates it, and who applies it to a non-SDF field anyway. That is a predicate over four papers, not an adjacency."
  - id: sdf-affine-to-raysplat
    text: "3DGS projects each Gaussian into screen space through a local affine approximation of the perspective transform — what did 2DGS have to put in its place once the primitive became a flat disk, and why does that change the recovered geometry rather than just the image?"
    anchors: ["local affine approximation", "ray-splat intersection"]
    requires: ["2308.04079", "2312.02121", "2403.17888"]
    note: "The affine approximation is never spelled out in the 3DGS paper itself — the gsplat mathematical supplement is the document that documents the projection and the covariance propagation through it. 2DGS then argues that a volumetric 3D Gaussian's silhouette changes with viewing angle, so the surface inferred from it is not view-consistent; collapsing to an oriented disk fixes the consistency but breaks the screen-space approximation, forcing an explicit perspective-correct ray-splat intersection. The chain runs implementation detail → representation defect → renderer replacement across three documents."
    hop_rationale: "Both anchors are within two hops of '3D Gaussian Splatting', which is the single densest node in the corpus — a short path here is close to guaranteed and carries no information. The question needs the causal link that the affine approximation is what a flat primitive can no longer use, and that fact is only reconstructible by pairing gsplat's account of what 3DGS's projection actually does with 2DGS's stated reason for abandoning it. Neither paper alone states the dependency."
  - id: sdf-bias-vs-view-inconsistency
    text: "Two papers here argue the recovered surface sits in the wrong place — NeuS blames a first-order bias, 2DGS blames view-inconsistent primitives. Is that the same error, and would either fix transfer to the other's representation?"
    anchors: ["first-order bias", "view-consistent geometry"]
    requires: ["2106.10689", "2308.04079", "2403.17888"]
    note: "They are not the same error and the corpus supports saying so. NeuS's bias is a property of the rendering integral: composing a logistic density with an SDF and integrating as in NeRF displaces the zero level set from the photometric minimum, and the fix is a different opacity construction on the same representation. 2DGS's inconsistency is a property of the primitive: a 3D Gaussian's silhouette is view-dependent, so different cameras disagree about the surface, and the fix is to change the primitive to a disk with one normal. A system that reads both as 'surface localisation error' collapses a rendering-integral defect into a representation defect."
    hop_rationale: "Both anchors are one hop from 'surface reconstruction' and two from 'volume rendering' versus 'rasterisation', so a path exists trivially and would equally connect any bias claim to any consistency claim in the corpus. The answer requires the mechanism behind each claim and a judgement about non-transferability — NeuS's opacity reformulation presupposes an SDF that 3DGS does not have, and 2DGS's flattening presupposes an explicit primitive that NeuS does not have. 3DGS is needed as the middle term for what a volumetric primitive is at all."
  - id: sdf-monocular-scale-ambiguity
    text: "A monocular depth prediction comes with unknown scale — what different devices do corpus methods use to make one usable, and which of them sidesteps the ambiguity rather than absorbing it?"
    anchors: ["scale-and-shift-invariant", "depth-order constraint"]
    requires: ["2105.06468", "2206.00665", "2311.13384"]
    note: "Three distinct treatments. Gao et al. use only the ordering the prediction implies, via a depth-order constraint, discarding magnitude entirely. MonoSDF keeps the magnitude but fits it away, matching the rendered depth of the SDF under a scale-and-shift-invariant loss. LucidDreamer never faces the problem in the same form: it uses the depth estimate together with a known camera pose to lift an inpainted image into new points, so the estimate manufactures geometry rather than constraining it. The interesting part of the answer is the third case, which is only visible if generation papers are read alongside reconstruction ones."
    hop_rationale: "'Monocular depth' connects all three papers in one hop, which is exactly the shared-input co-occurrence this instrument must not score. The question asks what each method does about scale ambiguity, and the three answers — order-only, invariant fitting, and lifting under known pose — are separate design decisions recorded in three method sections. A path through a shared 'monocular depth' node says the papers use the same input, which is the premise of the question rather than any part of its answer."
  - id: sdf-control-eikonal-distortion
    text: "Which method replaced the Eikonal regulariser with a depth-distortion term to stabilise signed distance fields on unbounded captures?"
    anchors: ["Eikonal", "depth distortion"]
    control: true
    legacy_gameable: true
    requires: []
    note: "Unanswerable from the full 50-paper corpus. 'Eikonal' occurs only in IGR and VolSDF; 'depth distortion' only in 2DGS, which uses no SDF and no Eikonal loss anywhere. Mip-NeRF 360's distortion regulariser is applied to a density field, never to a distance field, and no corpus paper proposes this substitution or evaluates on unbounded captures with an SDF. Both anchors are real and both sit inside the surface-reconstruction neighbourhood, so a checker scoring topical proximity will manufacture the link."
    hop_rationale: "Eikonal → signed distance function → geometric regularisation → depth distortion is a short, entirely generic path that exists because every one of these papers regularises geometry somehow. Any path reported here is spurious by construction: no document asserts a replacement, so there is nothing for a path to be evidence of."
  - id: sdf-control-poisson-monocular
    text: "How does SuGaR's Poisson reconstruction step consume the monocular geometric cues it uses to orient its Gaussians?"
    anchors: ["Poisson reconstruction", "monocular geometric cues"]
    control: true
    legacy_gameable: true
    requires: []
    note: "Unanswerable from the full corpus, and the premise is false. SuGaR orients its Gaussians with its own regulariser penalising deviation from the local tangent plane suggested by neighbouring primitives — no monocular predictor is involved anywhere in the paper. MonoSDF, the only source of 'monocular geometric cues', never extracts a mesh by Poisson reconstruction. No other corpus paper mentions Poisson reconstruction at all. The pairing is maximally tempting because both anchors concern surface orientation and normals, which is exactly the spurious connection this control is meant to catch."
    hop_rationale: "Both anchors are within two hops of 'surface normal' and of 'mesh reconstruction', so a graph will offer a short path and could dress it up as an answer. There is no evidence to be had: the question presupposes a pipeline stage no document in the corpus performs, so a reported connection is a false positive regardless of how short the path is."

  # ---- dynamic ----
  - id: dyn4d-anneal-two-pathologies
    text: "The same coarse-to-fine annealing of positional-encoding frequencies was introduced concurrently to rescue two different optimisations from local minima. Which two optimisation variables does it stabilise in each case, what is the distinct failure mode each faces, and which later deformable method reuses the schedule unchanged rather than reinventing it?"
    anchors: ["coarse-to-fine annealing", "bundle adjustment"]
    requires: ["2011.12948", "2104.06405", "2106.13228"]
    note: "Hard because the shared object is a training schedule, not a representation. Nerfies anneals it over the deformation MLP's encoding (local minima in the warp); BARF anneals the same bands over the radiance MLP to smooth the pose gradient landscape for synthesis-based bundle adjustment; HyperNeRF states it reuses Nerfies' coarse-to-fine encoding along with the elastic term. Answering requires holding all three and noticing BARF's own sentence that the trick 'appeared concurrently in Nerfies for deformation fields' — a concurrency claim, not a citation lineage."
    hop_rationale: "A 3-hop path from 'coarse-to-fine annealing' to 'bundle adjustment' exists trivially through NeRF, which every one of these papers extends and which itself contains the phrase 'hierarchical coarse-to-fine sampling' for a completely unrelated mechanism (ray importance sampling). That path is evidence of common ancestry only. The question asks which two *distinct* optimisation pathologies the annealing was aimed at and who inherited it, which the ancestry path cannot distinguish from NeRF's own unrelated coarse-to-fine sampling."
  - id: dyn4d-slice-keeps-warp-or-not
    text: "Two papers in this cluster both obtain a per-frame 3D scene by slicing a higher-dimensional field, but only one of them keeps the canonical-template warp. Which slice is taken through what, which paper retains the deformation field alongside its slice, and which limitation of a continuous deformation field is each slicing construction answering?"
    anchors: ["ambient coordinate", "temporal slicing"]
    requires: ["2011.12948", "2106.13228", "2402.03307"]
    note: "The trap is treating the two 'slices' as the same idea. HyperNeRF slices a higher-dimensional radiance field at a per-frame ambient coordinate but explicitly retains the Nerfies warp — observed points are warped to canonical 3D first, then the ambient slice is taken. 4DRotorGS slices anisotropic 4D XYZT Gaussians at render time and abandons the canonical-plus-deformation factorisation entirely, representing appearing/disappearing content as Gaussians with narrow temporal extent. Both are answering the same defect stated in Nerfies/HyperNeRF — a continuous deformation field cannot express a discontinuity — with opposite architectural verdicts on whether to keep the warp."
    hop_rationale: "Both anchors sit one hop from 'deformation field', so any graph containing the two papers yields a short path. But that path equally supports the false reading that 4DRotorGS is a Gaussian re-implementation of HyperNeRF's hyper-space. The question turns on a contrast the short path erases: one construction is composed with the warp, the other replaces it, and the evidence for that is a sentence-level claim inside each paper about what the canonical factorisation cannot absorb."
  - id: dyn4d-static-capacity-three-ways
    text: "Most of a casually captured video is static, and three papers here refuse to spend model capacity on that fact by three different mechanisms — a predicted blend, an initialisation choice, and a shared primitive set. What is each mechanism, and which of the three needs no additional network to decide what is static?"
    anchors: ["unsupervised blending weight", "static-dynamic decomposition"]
    requires: ["2105.06468", "2301.10241", "2310.08528"]
    note: "Gao et al. train a static NeRF and a time-conditioned dynamic NeRF and composite them with a blending weight the dynamic network itself predicts — so the split costs an extra head. K-Planes induces the same split for free by initialising the time-involving planes to the identity, so only genuinely time-varying content ever enters them. 4D-GS shares one canonical Gaussian set across all frames and predicts deformations, so static regions simply receive near-zero deformation. Only K-Planes' answer is an initialisation rather than a learned decision, and that is the discriminating detail."
    hop_rationale: "'unsupervised blending weight' and 'static-dynamic decomposition' will connect through the generic hub 'dynamic scene' in almost any graph built from this cluster, since all three papers are dynamic-scene papers. Co-membership in that topic is exactly the shared-infrastructure false positive: it does not encode that these are three competing solutions to one capacity-allocation problem, nor which of them is parameter-free."
  - id: dyn4d-planes-repurposed
    text: "The plane-factorisation idea gets reused three times in this corpus for three different jobs. Trace what the planes actually store in each case — the radiance field itself, a deformation field queried per primitive, or fine appearance detail added to a baked grid — and say which reuse changes the number of planes with the dimensionality of the scene."
    anchors: ["planar factorization", "HexPlane"]
    requires: ["2301.10241", "2310.08528", "2302.12249"]
    note: "K-Planes states the rule directly: d-choose-2 planes, six for a 4D scene, storing the radiance field, with temporal smoothness as a TV penalty on the time-axis planes. 4D-GS borrows a HexPlane-style decomposed neural voxel grid but stores a *deformation field* in it, decoded by a lightweight MLP into per-Gaussian position/rotation/scale offsets — the planes never carry radiance. MERF says outright that its three 2D feature planes 'mirror the TensoRF / K-Planes factorization but geared specifically for low-memory baking rather than fast training', and it stays 3D. Only K-Planes scales the plane count with d."
    hop_rationale: "'planar factorization' and 'HexPlane' are both plane-decomposition terms and will land within two hops of each other via TensoRF or 'explicit representation' in any reasonable graph. That proximity is precisely the co-occurrence artefact to guard against: the papers agree on the data structure and disagree on what it encodes, and a short path between two names for the same factorisation carries no information about whether the stored quantity is radiance or a warp."
  - id: dyn4d-rotor-generalises-what
    text: "A dynamic Gaussian method parameterises primitive orientation with a rotor from geometric algebra, saying it generalises the parameterisation used for 3D rotation. Which specific attribute of the static 3D primitive is being generalised, and which document in this corpus is the one that actually spells out the backward pass through that attribute?"
    anchors: ["RotorRepresentation", "anisotropic covariance"]
    requires: ["2308.04079", "2312.02121", "2402.03307"]
    note: "Three-way: 3DGS defines each primitive by position, a full 3x3 covariance with anisotropic covariance adapting to local geometry, opacity and SH colour; 4DRotorGS says its rotor generalises the quaternion used for 3D rotations to four dimensions while staying numerically stable — i.e. it generalises the rotation factor of that covariance, not the covariance wholesale. The gsplat supplement is the only document here that documents 'the exact gradient flow back through opacity, colour, position, scale, and rotation', which is what an implementer of the 4D rotor would need. 'quaternion' occurs in exactly one paper in the corpus, so the link cannot be found by term matching on the 3DGS side."
    hop_rationale: "3DGS is the hub of this entire corpus; every Gaussian paper is one hop from it, so 'RotorRepresentation' to 'anisotropic covariance' is a two-hop walk by construction. That walk says only 'this is a Gaussian method built on 3DGS'. The question needs the finer fact that the rotor replaces the rotation factor specifically, and that the gradient for that factor lives in a third document that is a maths supplement rather than a method paper — neither of which the hub edge encodes."
  - id: dyn4d-per-frame-cost
    text: "Two dynamic Gaussian methods report frame rates on the same RTX 3090 that differ by more than threefold. What has to be evaluated per Gaussian per frame in the slower one that the faster one does not evaluate at all, and which component do both leave essentially untouched from the static method they extend?"
    anchors: ["lightweight MLP", "differentiable rasteriser"]
    requires: ["2310.08528", "2402.03307", "2308.04079"]
    note: "4D-GS reports 82 FPS at 800x800 on an RTX 3090; 4DRotorGS reports 277 FPS on the same GPU (583 on a 4090). The mechanism is stated, not merely implied: 4D-GS fetches features from the decomposed neural voxel grid and decodes them through a lightweight MLP into per-Gaussian deformations at each timestamp, while 4DRotorGS's temporal slice yields effective 3D Gaussians directly, with slicing and splatting fused into CUDA kernels optimised alongside the existing 3DGS ones. Both retain 3DGS's tile-based differentiable rasteriser. The comparison is only legitimate because both quote the same GPU — noticing that is part of the difficulty."
    hop_rationale: "Both papers report FPS and both extend 3DGS, so a path through 'RealTimeRendering' or 'GaussianSplatting' is guaranteed. Shared metrics and a shared parent are the textbook shared-infrastructure false positive here. The answer requires the per-frame computational asymmetry — an MLP decode per primitive versus a slice — and the fact that the rasteriser is the *common* part, which no hub edge distinguishes from the parts that differ."
  - id: dyn4d-elastic-prior-outlived
    text: "Which regulariser in this cluster was imported from physical simulation to make a learned warp behave like soft-body deformation, which follow-up carried it over unchanged, and which later method's central argument makes the smoothness assumption that regulariser encodes the wrong assumption to be making?"
    anchors: ["elastic regularization", "abrupt motion"]
    requires: ["2011.12948", "2106.13228", "2402.03307"]
    note: "Nerfies introduces an elastic energy regulariser penalising non-rigid distortion of the deformation Jacobian, borrowed from physical simulation. HyperNeRF states it reuses that elastic regularisation together with the coarse-to-fine encoding. 4DRotorGS then argues that canonical-plus-deformation formulations fail on abrupt motions and emerging or disappearing content precisely because the deformation network must absorb discontinuities that violate its smoothness assumptions — which is a direct attack on the prior the elastic term enforces. The chain is inheritance followed by repudiation, and the repudiating paper never names the elastic term."
    hop_rationale: "A short path from 'elastic regularization' to 'abrupt motion' runs through 'deformation field', which all three papers touch. But that path is neutral about direction: it is equally consistent with 4DRotorGS *adopting* an elastic prior. The question asks for a critique relationship in which the third paper's objection is stated at the level of the factorisation rather than the regulariser by name, so the edge sign — inherit versus repudiate — is the whole content and a generic path carries none of it."
  - id: dyn4d-monocular-prior-consumption
    text: "Two under-constrained problems in this corpus are rescued by the same off-the-shelf ingredient — a monocular depth predictor never trained on the target scene. In one it becomes an ordering constraint, in the other a scale-and-shift-invariant loss against a rendered quantity. Which is which, what is the rendered quantity being compared against in the second, and what second cue accompanies each?"
    anchors: ["depth-order constraint", "monocular geometric cues"]
    requires: ["2105.06468", "2206.00665", "2106.10689"]
    note: "Gao et al. face infinitely many solutions consistent with one monocular video and add a depth-order constraint from monocular depth plus a 2D optical-flow loss and 3D scene-flow consistency. MonoSDF faces a photometric loss too weak on textureless or sparsely observed regions and converts monocular depth into a scale-and-shift-invariant loss against the rendered depth of the SDF, paired with a monocular surface-normal cue matched to the analytic SDF gradient. NeuS supplies the SDF-plus-volume-rendering pipeline MonoSDF augments and names the failure mode. The same prior, two different consumption patterns, in two different sub-fields."
    hop_rationale: "'monocular depth' occurs in five documents, so any path between these anchors is short and passes through a generic 'monocular prior' hub. That hub is exactly the co-occurrence that must not count: it does not record that one paper uses depth only for relative ordering between dynamic and static content while the other regresses it against a differentiable render of an SDF, nor that the two live in different problem settings (space-time view synthesis versus multi-view surface reconstruction) whose ill-posedness has different causes."
  - id: dyn4d-appearance-as-dimension
    text: "Capture-time appearance variation is absorbed two different ways here: as a per-image latent conditioning a black-box radiance MLP, and as an extra dimension of an explicit factorisation whose decoder is deliberately kept linear. Which paper does which, what does the second one claim it gives up by dropping the nonlinear decoder, and which earlier no-network radiance field makes that claim credible?"
    anchors: ["appearance embedding", "linear decoder"]
    requires: ["2008.02268", "2301.10241", "2112.05131"]
    note: "NeRF-W concatenates a per-image appearance embedding to the radiance MLP so photometric variation is a low-dimensional latent while geometry stays shared. K-Planes instead treats appearance as another axis of its d-choose-2 factorisation and shows a linear decoder with a learned global colour basis matches a nonlinear black-box MLP decoder — the 'white-box' claim. Plenoxels is the precedent that makes this plausible: it removed the network entirely, storing density and spherical-harmonic coefficients per voxel and matching NeRF quality, decoupling 'implicit' from 'works'. The chain is latent-conditioning versus extra-dimension, resolved by an explicit-representation lineage claim."
    hop_rationale: "'appearance embedding' and 'linear decoder' both hang off 'radiance field', giving a two-hop path in any graph containing NeRF-W and K-Planes. Shared descent from NeRF is not evidence that these are alternative treatments of the *same* nuisance variable, and the path says nothing about the decoder-quality claim or about Plenoxels supplying the earlier no-MLP result that the white-box argument leans on."
  - id: dyn4d-4d-memory-remedies
    text: "Why is a dense 4D representation untenable for video-length captures, and what are the two structurally different remedies proposed here — one quoting a compression factor measured against the dense 4D baseline, one changing what the footprint scales with? Which 3D-only predecessor established the pruning idea that neither of them relies on?"
    anchors: ["dense 4D grid", "canonical Gaussians"]
    requires: ["2301.10241", "2310.08528", "2112.05131"]
    note: "K-Planes quotes roughly 1000x memory compression versus a dense 4D grid, obtained by factorising into six planes rather than by pruning. 4D-GS attacks the same cost differently: because the canonical Gaussians are shared across all frames, the per-scene footprint scales with the size of the deformation grid rather than linearly with sequence length. Plenoxels is the 3D precedent that got its savings a third way — aggressively pruning empty space after a few iterations, leaving a thin shell of voxels — which is orthogonal to both. Distinguishing 'compress the grid', 'stop replicating per frame' and 'delete empty space' is the point."
    hop_rationale: "Both anchors are memory-cost terms in dynamic-scene papers and will connect through 'explicit representation' or 'dynamic scene' within three hops. That path supports only 'both care about memory', which is shared infrastructure. The question requires the denominator of each claim — one is a ratio against a dense 4D grid, the other is a change in what the footprint is proportional to — and these are not comparable numbers, a distinction no generic path preserves."
  - id: dyn4d-control-slicing-slam
    text: "How does temporal slicing of 4D Gaussians improve camera tracking in dense SLAM, and what does it do to the tracking drift reported for deforming scenes?"
    anchors: ["temporal slicing", "dense SLAM"]
    control: true
    legacy_gameable: true
    requires: []
    note: "Unanswerable from the whole 50-paper corpus. 'temporal slicing' occurs only in 4D-Rotor GS and 'dense SLAM' only in NICE-SLAM and GS-SLAM; not one of the six SLAM papers here (DSO, DeepV2D, DROID-SLAM, NICE-SLAM, Point-SLAM, Co-SLAM, GS-SLAM, Gaussian Splatting SLAM) so much as contains the word 'dynamic' — all of them assume a static scene. No document connects dynamic 4D primitives to camera tracking or reports drift on deforming scenes. Both anchors are real and both sit under 3D Gaussian Splatting, so a checker that walks the 3DGS hub will find a short path; that path is the false positive this control is built to catch."
  - id: dyn4d-control-sds-animates-warp
    text: "How is score distillation sampling used to supervise a deformation field so that a text prompt produces an animated 4D scene, and what stops the resulting motion from collapsing to a static result?"
    anchors: ["score distillation", "deformation field"]
    control: true
    legacy_gameable: true
    requires: []
    note: "Unanswerable from the whole corpus. 'score distillation' appears in six generation papers (DreamFusion, Magic3D, Zero-1-to-3, ProlificDreamer, DreamGaussian, Instant3D) and 'deformation field' in four dynamic papers (Nerfies, BARF, 4D-GS, 4D-Rotor GS), but the two sets are disjoint: none of the generation papers contains '4D', 'temporal' or any word for animation, and none of the dynamic papers uses a diffusion prior. There is no text-to-4D work in this corpus at all. The question is plausible because text-to-4D is a real research direction and because both anchors are well grounded — which is exactly why a checker that scores co-existence rather than a documented relationship will answer it."

  # ---- gen3d ----
  - id: t23d-resolution-bottleneck
    text: "High-resolution 3D output was unlocked twice in this line of work by changing where rendering happens rather than by scaling the prior — once inside per-prompt optimisation, once inside amortised prediction. What exactly was the bottleneck in each case, and why could the second one not be fixed by the same trick as the first?"
    anchors: ["high-resolution latent diffusion model", "resolution bottleneck"]
    requires: ["2209.14988", "2211.10440", "2311.04400", "2402.05054"]
    note: "The two bottlenecks are mechanically unrelated and are stated in different papers: DreamFusion/Magic3D's is *supervision* resolution (the prior renders the NeRF at low resolution, fixed by extracting a mesh and rasterising at the latent diffusion model's full operating resolution), while LGM's is *training-time memory* of predicting an entire implicit field, a diagnosis LGM makes about LRM/Instant3D and fixes by predicting Gaussians in image space so cost stays linear in pixel count. Answering needs all four: the low-res origin, the rasteriser fix, the feed-forward family being criticised, and the representation swap."
    hop_rationale: "Every paper here says 'high resolution' and every one involves a diffusion model, so a 3-hop path through a shared 'high-resolution'/'diffusion prior' node is essentially guaranteed and is equally consistent with the wrong answer — that LGM inherited Magic3D's rasteriser idea. Evidence for this question must distinguish two different *diagnoses* attached to two different papers, and must carry LGM's claim that the feed-forward group's cost scales with output resolution, which no path through a shared resolution concept encodes."
  - id: t23d-janus-lineage
    text: "Multi-view inconsistency was attacked at three different points of the pipeline: by conditioning the 2D model on relative camera pose, by blending a geometry-faithful prior against an imaginative one, and by generating a fixed set of consistent views so the inconsistency is gone before any 3D fitting starts. Which paper attacks which point, and which one actually names the artefact?"
    anchors: ["viewpoint-conditional", "Janus"]
    requires: ["2303.11328", "2306.17843", "2311.06214"]
    note: "DreamFusion claims consistency comes for free because every step samples a new camera; Zero-1-to-3 moves the fix into the prior itself (elevation/azimuth/radius conditioning trained on Objaverse renders); Magic123 moves it into a weighted mixture of a 2D and a 3D-aware prior; Instant3D moves it upstream of reconstruction entirely, emitting four canonicalised views, and is the only paper in the cluster that uses the name 'Janus'. The chain is the answer; any single pair gives a misleadingly simple story."
    hop_rationale: "'Janus' and 'viewpoint-conditional' will sit two hops apart through almost any diffusion-prior node in the graph, but that path supports only the claim that both concern view consistency. The question asks *where in the pipeline* each fix lives — prior, prior mixture, or pre-reconstruction view generation — which requires the per-paper mechanism, and specifically requires Instant3D's statement that canonicalised four-view generation avoids the artefact that single-image optimisation methods suffer. Co-occurrence under 'view consistency' is exactly the false positive this item is designed to expose."
  - id: t23d-mesh-second-stage
    text: "Three pipelines here end in a mesh stage that refines texture against a diffusion prior, but their first stages are a hash-grid NeRF, a volumetric NeRF, and a set of 3D Gaussians. What has to change in the extraction and re-parameterisation step for each starting representation, and what is identical across all three?"
    anchors: ["marching cubes", "UV-space"]
    requires: ["2211.10440", "2306.17843", "2309.16653"]
    note: "Magic3D extracts a triangle mesh by marching cubes and continues SDS on deformable vertex positions through a differentiable rasteriser; Magic123 swaps the volumetric NeRF for a memory-efficient differentiable mesh representation and continues at higher resolution; DreamGaussian exports geometry from an explicit Gaussian set via a Marching-Cubes-style step and then refines a UV-space texture. The invariant — a second stage that keeps diffusion supervision but drops volumetric rendering — only becomes visible across all three."
    hop_rationale: "A generic path 'marching cubes -> mesh -> texture' connects the anchors without saying anything about the *first* stage, which is the entire content of the question. Note also that 'marching cubes' appears in an unrelated Gaussian-surface paper in the corpus, so a short path through a mesh-extraction node can be built from documents that have no coarse-to-fine diffusion stage at all — the evidence must tie each extraction step to its specific predecessor representation."
  - id: t23d-vsd-diagnosis-portability
    text: "ProlificDreamer argues that score distillation's over-saturation and mode collapse are a property of the posterior being optimised, not of the 3D representation or of a hyperparameter setting. Which later methods keep that argument while discarding the representation it was derived on, and does the argument still apply once the per-prompt optimisation loop is replaced by a single forward pass?"
    anchors: ["single-particle limit", "amortised inference"]
    requires: ["2305.16213", "2309.16653", "2311.04400", "2311.06214"]
    note: "The claim only holds together across papers: ProlificDreamer derives SDS as a single-particle limit of VSD with a delta posterior and says the bias is toward the prior mean; DreamGaussian and Instant3D are named as inheriting the analysis while substituting Gaussians and a feed-forward reconstructor; LRM removes score distillation from the loop entirely in favour of amortised inference, which is where the diagnosis stops being actionable and diversity has to come from the diffusion sampler instead (Instant3D's stated route)."
    hop_rationale: "Both anchors are reachable through 'score distillation' in two hops, which would let a checker score this as answered from ProlificDreamer alone. But 'is the diagnosis still binding under amortisation?' cannot be settled by any document that only discusses SDS; it needs LRM's per-scene-optimisation-to-amortised-inference framing and Instant3D's claim that diversity now propagates from the diffusion sampler. A short path is evidence of a shared topic, not of the transfer-and-limit relationship being asked about."
  - id: t23d-prior-substitutes
    text: "Object-level generation buys geometric consistency from a 3D-aware prior, but no such prior exists at scene scale. What do the two scene-level pipelines here put in its place, and what does each substitution cost in terms of controllability and domain coverage?"
    anchors: ["3D-aware diffusion prior", "LLM-generated layout"]
    requires: ["2306.17843", "2311.13384", "2402.07207"]
    note: "Magic123 establishes what the 3D-aware prior is for — geometric fidelity, traded off against imaginativeness by a scalar. LucidDreamer replaces it with an iterative inpainting-plus-depth-lifting loop into a point cloud that then initialises Gaussian optimisation, keeping open-domain coverage but offering no per-object handle. GALA3D replaces it with an LLM-emitted layout of named objects and bounding boxes, which buys per-object editing and scale/contact correction but imposes an explicit object decomposition. GALA3D and LucidDreamer are explicitly framed as differing exactly in where scene structure comes from."
    hop_rationale: "All three papers mention a diffusion prior and Gaussians, so any short path establishes only shared machinery. The question is about *substitution*: what functional role the 3D-aware prior plays and what fills that role when it is unavailable. That is a claim about absence at scene scale, which no edge between two co-occurring concepts can carry — it requires Magic123's account of why the 3D prior is there and both scene papers' accounts of what they use instead."
  - id: t23d-lrm-axes
    text: "The large-reconstruction-model recipe has been altered along three separable axes: what conditions it, what it is trained on, and what representation it emits. For each follow-up in this corpus, which axis did it move, and which did it deliberately leave untouched?"
    anchors: ["triplane representation", "sparse-view reconstructor"]
    requires: ["2311.04400", "2311.06214", "2402.05054", "2403.02151"]
    note: "Instant3D moves only the conditioning (four canonicalised views instead of one image) and keeps the transformer-to-radiance-field template; TripoSR keeps the architecture deliberately close to LRM and moves data curation, augmentation, objective balance and inference engineering; LGM keeps feed-forward multi-view conditioning but replaces the implicit field with per-pixel Gaussians. Getting the 'left untouched' half right is what distinguishes real understanding from listing three successors."
    hop_rationale: "All four papers share the LargeReconstructionModel concept, so the anchors are one or two hops apart by construction and a path proves only membership in a family. The question demands an axis-by-axis attribution including negative claims (TripoSR explicitly does *not* change the headline architecture; Instant3D does *not* change the output representation), and negative claims are precisely what a connectivity path cannot supply."
  - id: t23d-speedup-attribution
    text: "Between the first score-distillation pipeline and the fastest single-image reconstructor here, runtime falls by roughly four orders of magnitude. Separate that reduction into the part won by changing the 3D representation, the part won by deleting the per-instance optimisation loop, and the part won by data curation and kernel-level engineering."
    anchors: ["progressive densification", "quality-aware filtering"]
    requires: ["2209.14988", "2211.10440", "2309.16653", "2311.04400", "2403.02151"]
    note: "The three mechanisms are attributable to different papers and are not additive in an obvious way: DreamGaussian's speedup (hours to ~2 minutes) comes from densifiable explicit primitives replacing per-ray MLP queries while the SDS loop is still there; LRM's (minutes to ~5 seconds) comes from deleting the loop entirely; TripoSR's (5 seconds to under half a second) comes from data filtering, augmentation, objective rebalancing and mixed-precision scheduling with the architecture held fixed. A reader who attributes all of it to 'feed-forward' gets the decomposition wrong."
    hop_rationale: "Both anchors sit near a generic 'efficiency/speed' region of any graph built from this corpus, and every one of these papers reports a runtime, so a short path is trivially available and would be shared infrastructure, not a relationship. The question needs each timing claim bound to its own causal mechanism, plus the ordering of the three steps — information that lives in the individual papers' comparisons against their named predecessors, not in any edge between densification and data filtering."
  - id: t23d-no-3d-data-erosion
    text: "The founding claim of this line was that 3D generation requires no 3D training data. Track how that constraint was relaxed — first synthetic renders used only to learn viewpoint control, then a roughly million-object mixture of synthetic renders and real captures — and identify which later method still honours the original claim, at what scale, and by what mechanism."
    anchors: ["no 3D training data", "MVImgNet"]
    requires: ["2209.14988", "2303.11328", "2311.04400", "2311.13384"]
    note: "DreamFusion's whole framing is that no large-scale 3D corpus exists, so the prior must be 2D. Zero-1-to-3 reintroduces 3D data but only as rendered Objaverse triplets for camera conditioning, arguing the object prior still comes from the Stable Diffusion backbone. LRM abandons the constraint outright, training on ~1M objects from Objaverse plus real MVImgNet captures. LucidDreamer is the one that still honours it, and at scene scale rather than object scale, using only an off-the-shelf image model plus monocular depth lifting."
    hop_rationale: "'No 3D training data' and 'MVImgNet' will connect through any 3D-generation hub node in two or three hops, and that path is compatible with the exact opposite reading — that the corpus uniformly avoids 3D supervision. The question needs the *direction and degree* of each relaxation (synthetic-only-for-pose vs synthetic-plus-real-at-scale) and a counterexample that preserves the original constraint at a different scale. Nothing about that ordering is recoverable from adjacency."
  - id: t23d-sds-conditional-prior
    text: "Score distillation is defined by dropping the score-Jacobian term so a frozen text-to-image prior — a prior with no notion of viewpoint — yields a stable per-step gradient. What changes about its behaviour when the prior being distilled is itself viewpoint-conditional, and how do pipelines that mix a viewpoint-agnostic prior with a geometry-aware one expose the resulting bias as a user-facing control?"
    anchors: ["score-Jacobian", "scalar trade-off"]
    requires: ["2209.14988", "2303.11328", "2305.16213", "2306.17843"]
    note: "DreamFusion defines the estimator and its omitted term; Zero-1-to-3 then plugs a viewpoint-conditional model into that same estimator for single-view reconstruction; ProlificDreamer's analysis says the SDS update is biased toward the prior mean, which is what makes the identity of the prior consequential rather than incidental; Magic123 turns the tension into an explicit scalar that trades imaginative novel views against faithfulness to the input. Four papers, and the mechanism only closes with all of them."
    hop_rationale: "'score-Jacobian' and 'scalar trade-off' each occur in exactly one paper, but both papers sit inside the same score-distillation neighbourhood, so a three-hop path through SDS is almost certain and demonstrates only that both are SDS-adjacent. The question asks what the estimator's known bias implies when the distilled prior changes character, and that requires ProlificDreamer's prior-mean argument to be joined to Zero-1-to-3's substitution and Magic123's blending parameter. A path through a shared SDS node carries none of those three claims."
  - id: t23d-control-ba-triplane
    text: "How is bundle adjustment used inside feed-forward reconstruction models to refine the input camera poses before the triplane is predicted, and how much does that refinement improve reconstruction quality?"
    anchors: ["bundle adjustment", "triplane"]
    control: true
    legacy_gameable: true
    requires: []
    note: "Both anchors are well grounded in the corpus but in disjoint literatures that no document links. Bundle adjustment appears only in pose-estimation and SLAM work (DeepV2D, BARF, DROID-SLAM, Co-SLAM); the triplane parameterisation appears only in LRM and TripoSR, neither of which contains any pose-refinement stage — they assume the input framing and, in the sparse-view case, canonicalised layouts with known relative poses. No paper in the 50-document corpus places a bundle-adjustment step inside a feed-forward reconstruction model, so any reported connection is a spurious path through generic camera-pose or 3D-reconstruction nodes."
  - id: t23d-control-rotor-sds
    text: "How is the geometric-algebra rotor parameterisation of dynamic Gaussians supervised by score distillation to produce animated text-to-3D assets, and what does it replace in the canonical-plus-deformation formulation?"
    anchors: ["geometric algebra", "Score Distillation Sampling"]
    control: true
    legacy_gameable: true
    requires: []
    note: "The rotor/geometric-algebra parameterisation appears in exactly one corpus paper (4D-Rotor Gaussian Splatting), which is a reconstruction method for captured dynamic scenes and contains no generative component, no text conditioning and no distillation of any kind. Score distillation appears only in the generation papers, none of which model time or motion. The corpus contains no 4D or animated generation paper at all, so the bridge the question presupposes does not exist; a positive answer means the checker connected 'dynamic Gaussians' to 'generative Gaussians' through shared representation nodes."

  # ---- gsplat ----
  - id: gs-core-sh-view-dependence
    text: "View-dependent colour has been encoded three different ways in this line of work: as a direction fed into the network, as baked spherical-harmonic coefficients attached to a voxel or to a primitive, and as attributes a shared network predicts per view. Trace that sequence — which paper removed the viewing direction from the network in order to bake it, which kept the harmonic coefficients with no network at all, and which one put viewing direction back in as a conditioning input, and what did the last one gain by doing so?"
    anchors: ["spherical harmonic", "viewing direction"]
    requires: ["2103.14024", "2112.05131", "2308.04079", "2312.00109"]
    note: "Hard because the sequence is non-monotonic: PlenOctrees removes the viewing direction from the MLP precisely so appearance can be tabulated, Plenoxels keeps SH but drops the network entirely, 3DGS stores SH per primitive rather than per voxel, and Scaffold-GS reverses the direction of travel by re-introducing view conditioning through a shared MLP in exchange for far fewer primitives. An answer that only says 'all four use spherical harmonics for view-dependent colour' has missed every actual relationship."
    hop_rationale: "Both anchor phrases occur inside each of the four papers, so a 1-hop co-occurrence link exists in every one of them and a 3-hop path through 'radiance field' or 'view-dependent colour' is available for free. The question is about ORDER and MOTIVE — direction removed to enable baking, then restored to suppress redundancy — and no anchor-to-anchor path, however short, encodes which paper moved which way or why."
  - id: gs-core-affine-vs-raysplat
    text: "3DGS projects its primitives to screen space through a local affine approximation of the perspective transform. Where in this corpus is that approximation and the covariance propagation through it written out in enough detail to reimplement, and which follow-up threw it away in favour of explicit ray-splat intersection — what geometric defect did that follow-up blame on the approximation, and why does its own primitive make the replacement necessary rather than optional?"
    anchors: ["affine approximation", "ray-splat intersection"]
    requires: ["2308.04079", "2312.02121", "2403.17888"]
    note: "The 3DGS paper itself never uses the phrase 'affine approximation' — it only describes the tile rasteriser and its closed-form backward pass — so the chain has to route through the gsplat supplement for the derivation and through 2DGS for the rejection. The defect (view-inconsistent silhouettes, hence non-view-consistent geometry) belongs to the volumetric primitive, which is why a flat disk forces perspective-correct intersection rather than merely permitting it."
    hop_rationale: "The two anchors co-occur in a single sentence of 2DGS, which names the affine approximation only to reject it — so a direct 1-hop link exists and is worthless as evidence. Real support requires the document that supplies the derivation (gsplat) and the document that introduced the projection being approximated (3DGS), neither of which is on the 1-hop path, and one of which never contains either anchor phrase."
  - id: gs-core-density-signal
    text: "Two follow-ups attack the same complaint — that vanilla Gaussian Splatting spawns primitives which overfit individual training views — but intervene on different quantities: one changes what the density controller is allowed to look at, the other changes what owns the primitives in the first place. What signal does each use to decide where new capacity goes, does either abandon the positional-gradient trigger outright, and at what granularity does each operate?"
    anchors: ["Adaptive Density Control", "anchor points"]
    requires: ["2308.04079", "2312.00109", "2404.06109"]
    note: "Distinct from the existing gs-densification question, which only asks what was wrong with the original heuristic. This one demands the comparison: a per-pixel error criterion replacing positional-gradient magnitude at primitive granularity, versus growing and pruning anchors scored by the rendering contribution of the neural Gaussians they own — two different granularities aimed at the same pathology, neither paper discussing the other."
    hop_rationale: "'Adaptive Density Control' occurs only in Revising Densification and 'anchor points' only in Scaffold-GS, and both papers cite 3DGS, so a 2-hop path through the shared parent exists automatically and would equally connect any two Gaussian follow-ups. Evidence has to show that both are replacements for the same gradient-magnitude trigger described in 3DGS and that they act at different levels of the representation — a fact no shared-parent edge carries."
  - id: gs-core-nonrgb-channels
    text: "Two papers push something other than RGB through the Gaussian rasteriser: semantic features distilled from 2D foundation models, and latent features decoded afterwards by a lightweight generative network. What did each have to change about the splatting pipeline before non-colour channels would train, which of the two treats the resolution and channel-statistics mismatch against its target maps as the central obstacle, and which of them still needs a photometric branch at all?"
    anchors: ["feature field", "3D feature Gaussians"]
    requires: ["2308.04079", "2312.03203", "2403.16292"]
    note: "Both attach vectors to Gaussians, which is exactly the co-occurrence trap. The real distinction: Feature 3DGS separates colour and feature branches and adapts the loss because SAM/CLIP-LSeg maps are coarser than RGB with different channel statistics, while latentSplat's Gaussians carry means and variances in a learned latent space that only becomes an image after the 2D generative decoder runs — so pixels are produced downstream of splatting rather than by it."
    hop_rationale: "The anchors are unique to two papers that never cite one another; their only link is the common 3DGS parent, giving a free 2-hop path shared with every other Gaussian variant in the corpus. Nothing in such a path distinguishes distillation targets from latent codes, or says which one renders pixels directly, so path existence cannot be evidence here."
  - id: gs-core-feedforward-diagnosis
    text: "Feed-forward Gaussian predictors disagree about why generalisation collapses: one blames a missing geometric prior and injects classical multi-view stereo, the other blames unmodelled uncertainty and turns the primitives into distributions. Which components of the original per-Gaussian parameterisation does each retain, what does each claim its fix buys over the regression baseline they both compare against, and which one's argument depends on the input views being weak or absent rather than merely few?"
    anchors: ["cost volume", "variational 3D Gaussians"]
    requires: ["2308.04079", "2403.14627", "2403.16292"]
    note: "Goes past the existing sparse-view-gs question, which asks only how Gaussian Splatting is made to work from few views. Here the answer must contrast the diagnoses: MVSplat keeps opacity, anisotropic covariance and spherical-harmonic colour and predicts them jointly with cost-volume-localised centres, while latentSplat replaces raw colour attributes with latent means and variances so uncertain regions are pulled to a generative prior — and both position themselves against pixelSplat."
    hop_rationale: "latentSplat names MVSplat once, in a parenthetical list of regression-based models, so a literal 1-hop edge between the two exists and carries none of the contrast. 'cost volume' also appears in DeepV2D, so an alternative short path runs through generic multi-view depth machinery that has nothing to do with Gaussian prediction. Only the shared pixelSplat baseline plus the per-primitive parameterisation inherited from 3DGS supports the actual answer."
  - id: gs-core-empty-space
    text: "Explicit radiance fields all refuse to spend computation on empty space, but by three different mechanisms: an octree that skips it at traversal time, a voxel grid that prunes it after a few iterations of training, and a primitive representation that never marches along a ray at all. Which of those does 3D Gaussian Splatting actually inherit, what does it substitute for ray traversal, and what new per-frame cost does that substitution create that neither of the other two pays?"
    anchors: ["empty space", "sparse octree"]
    requires: ["2103.14024", "2112.05131", "2308.04079"]
    note: "The trap is answering 'they all skip empty space'. The discriminating facts are that PlenOctrees prunes pre-tabulated MLP outputs into a sparse octree so traversal skips voids, Plenoxels prunes voxels early and leaves a thin shell around surfaces, and 3DGS avoids the problem representationally — a tile-based front-to-back sort of projected primitives — which buys real-time rendering at the price of a visibility-ordered sort that a grid never needs."
    hop_rationale: "'empty space' appears in five corpus papers including MERF and Point-SLAM, so the anchor pair sits a hop or two apart through several unrelated documents. The question hinges on a mechanism substitution and its cost, which is a claim about how rendering works in each representation; a path that merely records both papers discussing emptiness is precisely the false positive this instrument must reject."
  - id: gs-core-regularisation-after-mlp
    text: "Removing the MLP from a radiance field also removes the smoothing it implicitly supplied. What explicit priors did the voxel-grid line put in its place, what does Gaussian Splatting rely on instead given that it introduces no comparable smoothness prior, and which artefacts survived in the Gaussian setting until surface-aware regularisers and error-driven density control were proposed?"
    anchors: ["total-variation", "depth distortion"]
    requires: ["2112.05131", "2308.04079", "2403.17888", "2404.06109"]
    note: "Requires a negative fact — that 3DGS substitutes SfM initialisation plus an interleaved densify/prune schedule for regularisation rather than adding a prior — and then two later repairs of different kinds: 2DGS's depth-distortion and normal-consistency terms acting on geometry, and Revising Densification's pixel-error criterion acting on the schedule, aimed at floaters and under-densified regions."
    hop_rationale: "'total-variation' also appears in Direct Sparse Odometry, so a short path between the anchors can be assembled from documents that share nothing with this question, and any two of these papers are two hops apart via 'radiance field'. The claim under test is a substitution over time — implicit MLP smoothing, then explicit grid priors, then no prior at all, then surface-aware ones — which no static anchor-to-anchor path can witness."
  - id: gs-core-opacity-cloning-bias
    text: "The original density controller mishandles opacity when it clones a primitive, and a 2024 paper both names that bias and corrects it. A structured variant, meanwhile, never stores opacity on a primitive at all. State the bias precisely, and say whether a representation whose opacities are emitted per view by a shared network could exhibit the same failure during its own growing step."
    anchors: ["opacity handling", "neural Gaussians"]
    requires: ["2308.04079", "2404.06109", "2312.00109"]
    note: "The corpus supports this only by combination: the cloning-time doubling of effective opacity contribution is described in Revising Densification, the clone/split/prune schedule it corrects is in 3DGS, and Scaffold-GS's opacities are MLP outputs conditioned on view rather than stored parameters, so its anchor-growing step has no cloned parameter to double. No paper draws this comparison, so a correct answer must say so while still assembling the pieces."
    hop_rationale: "Opacity is an attribute discussed in nine corpus papers, so the anchors are a single hop apart through almost any Gaussian document. What is being asked is whether one paper's named implementation bias can occur in another paper's parameterisation — a mechanism-level inference that no edge between the two anchors asserts, and that a co-occurrence path would answer affirmatively for the wrong reason."
  - id: gs-core-init-replacement
    text: "The 3DGS optimisation is seeded from the sparse point cloud left by camera calibration, which decides where primitives start out. What plays that role in a model that never optimises per scene and instead localises centres in one forward pass, and what plays it in a variant that keeps per-scene optimisation but makes a sparse scaffold the thing being grown and pruned? Are those two substitutes doing the same job?"
    anchors: ["StructureFromMotion", "cost volume"]
    requires: ["2308.04079", "2403.14627", "2312.00109"]
    note: "MVSplat's plane-sweep cost volume supplies cross-view similarity scores that place Gaussian centres where the SfM seed used to, while Scaffold-GS keeps the seed idea but promotes it to a first-class structure whose anchors are grown by contribution scoring. One replaces initialisation with prediction, the other replaces a fixed seed with a maintained scaffold — same starting problem, different answers."
    hop_rationale: "'StructureFromMotion' appears in DROID-SLAM, Co-SLAM, DeepV2D and Gaussian Splatting SLAM, and 'cost volume' appears in DeepV2D too, so the anchors are joined by a short path entirely inside the SLAM/depth-estimation literature that says nothing about where Gaussian primitives are initialised. Only evidence that the cost volume substitutes for the SfM seed in Gaussian centre placement counts here."
  - id: gs-core-view-extrapolation
    text: "Two Gaussian methods claim better behaviour under large viewpoint change but mean different things by it: one predicts primitive attributes per view from anchors, the other samples from a latent distribution and decodes with a generative network. What does each blame the degradation on, and does either mechanism transfer to the other's setting — a per-scene optimised capture versus a feed-forward reconstruction from a couple of frames?"
    anchors: ["view-extrapolation", "generative decoder"]
    requires: ["2308.04079", "2312.00109", "2403.16292", "2403.14627"]
    note: "The two failures are not the same: Scaffold-GS's is redundant primitives that fit individual training views and therefore break when the camera leaves their neighbourhood, a pathology of per-scene optimisation; latentSplat's is missing information in regions the input views never covered, a pathology of feed-forward reconstruction that a deterministic regressor such as MVSplat answers with a single underconstrained guess. Anything that treats 'both handle big view changes' as the connection is exactly the false positive to catch."
    hop_rationale: "Each anchor is unique to one paper and the two papers never cite each other; the only connection is the 3DGS parent, a 2-hop path available to every Gaussian pair in the corpus. Answering requires distinguishing two different causes of the same symptom and bringing in MVSplat as the deterministic baseline latentSplat argues against, which no path between the anchors expresses."
  - id: gs-core-control-adc-hash
    text: "How does the cap on the total number of primitives in revised Adaptive Density Control interact with the collision behaviour of a multiresolution hash encoding when Gaussian primitives are stored in the hash table?"
    anchors: ["Adaptive Density Control", "multiresolution hash encoding"]
    control: true
    legacy_gameable: true
    requires: []
    note: "Both anchors are genuine and unique: Adaptive Density Control appears only in Revising Densification, the multiresolution hash encoding only in Instant-NGP. But no paper in the 50-document corpus stores Gaussian primitives in a hash table, and none relates a primitive budget to hash collisions — Instant-NGP's collisions are disambiguated by gradient updates on a fixed-size table, a mechanism with no primitive count in it at all. The question is answerable only by inventing a system the corpus does not contain."
    hop_rationale: "A 2-3 hop path exists trivially: both papers are radiance-field methods that discuss speed/quality trade-offs and both are cited as baselines across the corpus, so a checker following 'radiance field' or 'training efficiency' will connect them. That path is exactly the spurious connection this control is designed to expose; only a document describing hashed Gaussian storage would count, and there is none."
  - id: gs-core-control-tv-neural-gaussians
    text: "Which total-variation prior from the voxel-grid radiance field line is carried over to regularise the neural Gaussians predicted per anchor, and what does that prior do to the level-of-detail behaviour?"
    anchors: ["total-variation", "neural Gaussians"]
    control: true
    legacy_gameable: true
    requires: []
    note: "Plenoxels really does replace the MLP's implicit smoothing with explicit total-variation and sparsity priors, and Scaffold-GS really does predict neural Gaussians per anchor and report level-of-detail gains — but no corpus document transfers a total-variation prior onto a Gaussian representation. Scaffold-GS's anchors are grown and pruned by rendering contribution, and its level-of-detail behaviour comes from view-conditioned attribute prediction, not from any smoothness term. The question presupposes an inheritance the corpus never records."
    hop_rationale: "The anchors sit close together by construction: 'total-variation' occurs in Plenoxels (and, unrelatedly, in Direct Sparse Odometry) while 'neural Gaussians' occurs in Scaffold-GS, and both papers connect within a couple of hops through explicit-representation and regularisation vocabulary. Short-path evidence would therefore confirm a transfer that does not exist, which is precisely the failure mode being probed."

  # ---- dso ----
  - id: dso-photometric-residual-kept-frontend-replaced
    text: "Direct Sparse Odometry minimises a photometric error produced by a hand-engineered front end that needs no keypoint detectors. Trace what Teed and Deng's learned successors kept from that residual and what they threw away: which module now produces the revisions that the residual used to drive, and which of the two systems introduced that module first?"
    anchors: ["photometric error", "ConvGRU update operator"]
    requires: ["1607.02565", "1812.04605", "2108.10869"]
    note: "Gold: DSO supplies the dense photometric residual and the hand-engineered, keypoint-free front end; DROID-SLAM states that it replaces that front end with a recurrent network while the gradient of the photometric residual still supervises the update; DeepV2D supplies the earlier iterative-refinement architecture the ConvGRU operator descends from. The relation is inheritance-with-substitution, not co-membership in a topic."
    hop_rationale: "Both anchors sit inside the 'Visual SLAM and MVS' sub-topic, so any graph will offer a two-hop path anchor->sub_topic->anchor for literally every pair of terms drawn from these papers. That path is equally short for 'inverse depth' and 'plane-sweep cost volume', so its existence carries no information about which component was preserved across the substitution. Answering requires the directed DSO->DeepV2D->DROID lineage edges plus the specific statement that the residual survived while the front end did not."
  - id: dso-inverse-depth-vs-pixelwise-depth
    text: "DSO represents geometry as inverse depth for a fixed budget of pixels in a reference keyframe, while DROID-SLAM revises pixelwise depth for the entire frame on every update. What changed in the optimiser that made the dense parameterisation affordable, and which earlier architecture by the same authors already estimated dense depth by alternating with a pose stage?"
    anchors: ["inverse depth", "pixelwise depth"]
    requires: ["1607.02565", "2108.10869", "1812.04605"]
    note: "Gold: DSO's sparse inverse-depth parameterisation with uniform pixel sampling; DROID-SLAM's Dense Bundle Adjustment layer solving a Gauss-Newton step that makes per-pixel depth revisions tractable; DeepV2D as the earlier dense-depth-by-alternation design. The question is about why sparsity was a compute concession and what removed it."
    hop_rationale: "'inverse depth' and 'pixelwise depth' are near-synonymous surface forms, so an embedding- or lexeme-driven graph will link them at distance one or two through any generic 'depth estimation' node. That short path asserts only that both papers estimate depth — the shared-infrastructure false positive. The question needs the causal claim that the DBA layer is what buys density, which lives on a different edge entirely."
  - id: dso-calibrate-vs-embed-brightness
    text: "Frame-to-frame brightness inconsistency gets three different treatments in this corpus: measured and divided out, absorbed into a per-image latent, or left for a learned front end to tolerate. Which system models lens vignetting, exposure time and the camera response function explicitly, which one instead fits a per-image appearance embedding alongside a transient head, and what does the deep SLAM system offer in place of either?"
    anchors: ["lens vignetting", "per-image appearance embedding"]
    requires: ["1607.02565", "2008.02268", "2108.10869"]
    note: "Gold: DSO's full photometric calibration (exposure, vignetting, response) as an explicit nuisance model; NeRF-W's appearance embedding plus transient uncertainty as a learned nuisance model over the same physical variation; DROID-SLAM offering neither, relying on trained robustness. Controls-adjacent trap avoided: this is not 'both handle images', it is three competing treatments of one identified nuisance variable."
    hop_rationale: "The anchors live in different sub-topics (visual odometry vs neural radiance fields) yet both hang off generic photometric-loss and metric nodes, so a two-hop path exists that would equally connect any calibration term to any embedding trick anywhere in the corpus. Such a path is evidence of shared vocabulary, not of the substitution relationship being asked about; the answer depends on recognising exposure variation as the common target, which only the mechanism prose states."
  - id: dso-alternation-vs-joint-gauss-newton
    text: "DeepV2D alternates its motion module and depth module to convergence at inference time; DROID-SLAM instead projects each proposed revision onto geometrically consistent solutions with a Gauss-Newton step inside a differentiable layer. What does the joint solve buy that alternation cannot give, and which classical system in this corpus was already optimising camera motion and geometry jointly before either of them?"
    anchors: ["motion module", "Gauss-Newton step"]
    requires: ["1812.04605", "2108.10869", "1607.02565"]
    note: "Gold: DeepV2D's two-stage alternation converging at inference; DROID-SLAM's DBA layer performing a joint Gauss-Newton update; DSO's joint windowed bundle adjustment over pose and inverse depth as the classical precedent that the deep line rediscovered. Answer must state that alternation converges only to a fixed point of the block updates while the joint solve moves both variable groups along coupled directions."
    hop_rationale: "Both anchors are one hop from a 'BundleAdjustment' method node, and that node connects essentially every optimisation term in this theme, so a short path proves only that all three papers optimise something. The question asks which of alternation and joint solving is a strictly weaker update rule and who used the stronger one first, which requires the per-paper mechanism descriptions and the DSO precedence claim, none of which a generic-node path expresses."
  - id: dso-cost-volume-vs-correlation-volume
    text: "Both Teed-and-Deng systems build a volume before predicting an update, but the two volumes index different quantities. What does the plane-sweep cost volume enumerate, what does the 4D correlation volume enumerate, and why did moving from fixed-length video-to-depth to incremental SLAM over a growing keyframe graph force the change?"
    anchors: ["plane-sweep cost volume", "4D correlation volume"]
    requires: ["1812.04605", "2108.10869"]
    note: "Gold: DeepV2D's plane sweep enumerates depth hypotheses against a reference view under epipolar constraints; DROID-SLAM's 4D volume enumerates pairwise pixel correspondences between every frame pair in the graph. The switch follows from having no fixed reference frame and an unbounded frame set. Both required papers are in-pool."
    hop_rationale: "Same two authors, same sub-topic and one shared method label, so a path of length two via the author or method node exists for every pair of terms in these two papers — including pairs with no relationship at all. Distinguishing a depth-hypothesis sweep anchored to one reference view from an all-pairs correspondence volume over a growing graph requires the mechanism paragraphs, so path length here is uninformative by construction."
  - id: dso-local-window-vs-global-bundle-adjustment
    text: "Which systems here confine optimisation to a local set of keyframes and which pay for a solve over all of them? Name the concrete failure the corpus attributes to local-window optimisation on long sequences, and say which system added the global solve specifically to remove it."
    anchors: ["sliding window of keyframes", "global BundleAdjustment"]
    requires: ["1607.02565", "2108.10869", "2112.12130", "2304.14377"]
    note: "Gold: DSO's joint windowed bundle adjustment over a keyframe window; NICE-SLAM's mapping on a sliding window of keyframes; Co-SLAM's explicit claim that global bundle adjustment over all keyframes is essential because local-window optimisation lets drift accumulate on long sequences; DROID-SLAM's graph-wide DBA as the third position. Co-SLAM is the single out-of-pool paper."
    hop_rationale: "Windowing is stock SLAM vocabulary: both anchors attach to the same 'SLAM' and 'BundleAdjustment' method nodes, giving a two-hop path between them and between any other pair of keyframe-related terms in four different papers. That path never states who drifts, which is the entire content of the question — the drift claim is a single sentence in Co-SLAM that must be joined to NICE-SLAM's window and DSO's window to be meaningful."
  - id: dso-synthesis-alignment-vs-classical-direct
    text: "BARF argues that fitting a radiance field to observed images is, to first order, the same problem as classical image alignment. Which system in this corpus minimises that same residual with no learned representation at all, and what extra object does BARF have to anneal during optimisation that the classical system never introduces in the first place?"
    anchors: ["Lucas-Kanade alignment", "photometric error"]
    requires: ["2104.06405", "1607.02565", "2003.08934"]
    note: "Gold: BARF's theoretical link from synthesis-based bundle adjustment to Lucas-Kanade alignment; DSO as the corpus's direct photometric-residual system with no representation to anneal; NeRF supplying the sinusoidal positional encoding that BARF identifies as the source of the spiky pose gradient. NeRF is the single out-of-pool paper."
    hop_rationale: "Every alignment-flavoured term in this corpus reduces to 'photometric', so a generic photometric-loss node puts BARF within two hops of any direct method and of most radiance-field papers. Such a path would be produced for the far weaker claim 'both use a photometric loss'. The question turns on what BARF has that DSO does not — a high-frequency encoding whose bands must be masked — which is a third node in a different sub-topic and not on any short path between the anchors."
  - id: dso-who-owns-the-camera-pose
    text: "A casual capture arrives without camera poses. Compare the two answers this corpus gives: dispense with the offline COLMAP step by folding registration into the rendering objective, versus place a deep SLAM system with a Dense Bundle Adjustment layer in front of the map. What does each assume about pose initialisation, and where does NICE-SLAM's own tracking sit between them?"
    anchors: ["COLMAP", "Dense Bundle Adjustment"]
    requires: ["2104.06405", "2108.10869", "2112.12130"]
    note: "Gold: BARF removing the SfM prerequisite by joint pose-and-scene gradient descent, tolerating heavily perturbed or uninitialised cameras; DROID-SLAM serving as the front end that supplies poses to radiance-field mapping systems; NICE-SLAM estimating its own pose by minimising the mapping losses with the scene frozen, i.e. owning tracking but assuming small inter-frame motion."
    hop_rationale: "'COLMAP' and 'Dense Bundle Adjustment' both sit adjacent to a StructureFromMotion/BundleAdjustment method node, so the two-hop path exists and says only that both papers concern pose estimation — true of a dozen corpus papers. The question asks who owns the pose estimate and under what initialisation assumption, a division of labour stated only in BARF's motivation and in DROID-SLAM's description of itself as a front end for later mapping systems."
  - id: dso-gradients-through-the-solver
    text: "Two systems here send gradients through a geometric solver rather than around it. Say what the bundle-adjustment Jacobian is actually supervising in DROID-SLAM, contrast it with the way depth supervision in DeepV2D also trains the pose stage, and explain why BARF locates the difficulty in the gradient landscape with respect to camera pose rather than in the solver."
    anchors: ["bundle-adjustment Jacobian", "gradient landscape"]
    requires: ["2108.10869", "1812.04605", "2104.06405"]
    note: "Gold: DROID-SLAM backpropagates the photometric residual through the BA Jacobian so the update network is supervised by a geometrically consistent solve; DeepV2D's cross-stage gradient flow means depth supervision trains the pose head and vice versa; BARF has no solver at all — the objective is differentiable everywhere but the landscape in pose is spiky because of positional encoding. All three in-pool."
    hop_rationale: "All three papers are joined by SLAM/BundleAdjustment method labels and by the shared metric set, so any two of their terms are two hops apart. Short paths cannot distinguish 'differentiates through a solver' from 'has a differentiable objective', which is exactly the distinction the question asks for; getting it right requires the Jacobian sentence in DROID-SLAM and the landscape sentence in BARF to be read against each other."
  - id: dso-depth-sensor-required-or-optional
    text: "Which of these systems needs a depth sensor by construction and which treat depth as optional extra supervision? Contrast a model trained on monocular video that transparently ingests stereo or RGB-D at test time with a dense system whose photometric and geometric losses presuppose RGB-D, and with the monocular Gaussian system that accepts depth without any architectural change."
    anchors: ["stereo or RGB-D", "photometric and geometric losses"]
    requires: ["2108.10869", "2112.12130", "2312.06741"]
    note: "Gold: DROID-SLAM trains monocular and upgrades at inference with no retraining; NICE-SLAM's tracking and mapping objectives are RGB-D losses, so depth is structural; MonoGS is monocular-first and folds depth in as additional supervision when available. Gaussian Splatting SLAM is the single out-of-pool paper."
    hop_rationale: "'RGB-D' is a corpus-wide token attached to at least six papers, so the anchors are two hops apart through any sensor or dataset node, and that path is present whether a system requires depth or merely accepts it. The question is precisely about that modality — required versus optional versus upgrade-at-test-time — which no generic sensor node encodes."
  - id: dso-which-map-can-render-a-new-view
    text: "Rank the maps these three systems maintain by what can be done with them: which map can synthesise an image from a viewpoint that was never observed, and what exactly is missing from the other two — sparse geometry with intensity samples on one side, per-keyframe depth on the other?"
    anchors: ["sparse geometry", "occupancy and color"]
    requires: ["1607.02565", "2108.10869", "2112.12130"]
    note: "Gold: DSO keeps sparse inverse-depth points sampled at high-gradient pixels — no appearance model for unobserved rays; DROID-SLAM keeps per-pixel depth and poses over the keyframe set — geometry but no view-dependent radiance; NICE-SLAM's decoder turns interpolated grid features into occupancy and colour, which is what makes novel-view rendering possible. All in-pool."
    hop_rationale: "Each of the three papers is one hop from the shared PSNR/SSIM/LPIPS metric nodes, so the anchors are joined by a short path that would suggest all three render images — the exact false positive this batch's controls exist to catch, since only one of them can. The answer requires reading what each system actually stores, which is a property of the representation description, not of the metrics attached to the paper."
  - id: dso-where-the-geometric-prior-enters
    text: "Compare three places a geometric prior can be injected when photometric evidence is too weak: pre-trained geometric priors baked into a decoder, an off-the-shelf monocular depth predictor converted into a scale-and-shift-invariant loss, and a depth module trained end-to-end inside the geometry solver. Which of the three requires no supervision from the target scene, and which is doing completion of space that was never observed?"
    anchors: ["pre-trained geometric priors", "monocular depth predictor"]
    requires: ["2112.12130", "2206.00665", "1812.04605"]
    note: "Gold: NICE-SLAM's pretrained decoder priors fill unobserved regions plausibly (completion); MonoSDF's monocular depth and normal predictors are general-purpose networks never trained on the target scene, applied as dense per-pixel losses; DeepV2D's depth module is trained end-to-end and carries a learned prior inside the solver rather than as a loss. MonoSDF is the single out-of-pool paper."
    hop_rationale: "'prior' and 'depth' vocabulary connects these anchors through generic DepthEstimation and NeuralImplicitSurface method nodes in two hops, and that path is identical for any pair of papers that mention learned depth. The question distinguishes three different insertion points — decoder initialisation, auxiliary loss, in-solver module — and asks which one completes unobserved space; that trichotomy is nowhere on a short generic path."
  - id: dso-failures-data-versus-representation
    text: "Sort the pose-estimation failures in this corpus by cause. Which ones are properties of the capture (rolling shutter, motion blur, exposure change), which are the catastrophic tracking failures that a learned front end was shown to reduce, and which are local minima manufactured by the representation itself rather than by anything in the images?"
    anchors: ["rolling shutter", "local minima"]
    requires: ["1607.02565", "2108.10869", "2104.06405"]
    note: "Gold: DSO attributes robustness under rolling shutter, motion blur and exposure change to photometric calibration — data-side failures; DROID-SLAM claims substantially fewer catastrophic tracking failures than ORB-SLAM and DSO — front-end failures; BARF's local minima come from high-frequency positional encoding, i.e. the representation creates the failure even with clean images. All in-pool."
    hop_rationale: "Failure vocabulary is diffuse and every SLAM paper here is two hops from every other through the sub-topic node, so a short anchor-to-anchor path would be found even between two failure modes with nothing in common. The question's content is the taxonomy — whether the cause sits in the sensor, in the front end, or in the parameterisation — and that classification exists only by reading the three explanations side by side."
  - id: dso-smoothness-prior-dropped-then-restored
    text: "DSO deliberately drops the total-variation smoothness prior that dense direct methods relied on and samples a fixed budget of pixels with non-zero intensity gradient instead. Which later explicit representation in this corpus puts total-variation and sparsity priors back, and how does NICE-SLAM keep unobserved regions plausible without either? What representational difference explains the same prior being harmful in one case and necessary in the other?"
    anchors: ["total-variation smoothness prior", "total-variation and sparsity priors"]
    requires: ["1607.02565", "2112.05131", "2112.12130"]
    note: "Gold: DSO removes the TV prior because sparse, gradient-selected samples do not need — and are slowed by — a smoothness coupling; Plenoxels reintroduces explicit TV and sparsity priors precisely because a dense free voxel grid has no implicit MLP smoothing; NICE-SLAM uses pretrained decoder priors instead of an explicit smoothness term. Plenoxels is the single out-of-pool paper."
    hop_rationale: "The two anchors share the literal token 'total-variation', so any lexical or embedding graph links them at distance one — the shortest possible path, and completely uninformative here, because the question is about a reversal: one paper removes the prior and the other restores it for a representation with opposite density. A short path signals term identity, not the sparse-versus-dense argument that makes the reversal coherent."
  - id: dso-two-senses-of-coarse-to-fine
    text: "'Coarse-to-fine' names two unrelated mechanisms in this corpus: a schedule over training time that progressively unmasks encoding frequencies, and a spatial hierarchy of grids at coarse, mid, and fine resolutions all queried at once. Which of the two changes the optimisation landscape for camera pose, which paper did the schedule appear in concurrently for a deformation field, and does the spatial hierarchy help pose estimation at all?"
    anchors: ["coarse-to-fine annealing schedule", "coarse, mid, and fine resolutions"]
    requires: ["2104.06405", "2112.12130", "2011.12948"]
    note: "Gold: BARF's annealing is a schedule over optimisation time applied to extrinsic pose; Nerfies used the same annealing concurrently for the deformation field; NICE-SLAM's three-level grid is a spatial multi-resolution decomposition addressing scaling and locality, not the pose landscape. Nerfies is the single out-of-pool paper. The trap is treating the shared phrase as one concept."
    hop_rationale: "The anchors share the words 'coarse' and 'fine', so string- or embedding-similarity gives an immediate short link — and that link is actively misleading, since the two mechanisms operate on different axes (training time versus space) and only one touches pose. A question whose correct answer is 'these two short-path neighbours are not the same thing' is exactly where path length must not be taken as evidence."
  - id: dso-alternation-inference-loop-vs-system-threads
    text: "Distinguish two kinds of alternation that look alike on paper: a depth module and a motion stage alternated until convergence within one inference pass, versus mapping and tracking threads that are decoupled and run alternately as a live system. What does each alternation buy, and what does DROID-SLAM gain by folding both variable groups into one differentiable update instead?"
    anchors: ["depth module", "mapping and tracking threads"]
    requires: ["1812.04605", "2112.12130", "2108.10869"]
    note: "Gold: DeepV2D alternates as an inference-time fixed-point iteration that improves accuracy on a fixed clip; NICE-SLAM alternates as a systems decision so mapping can run at a different rate from tracking, each freezing the other's variables; DROID-SLAM updates pose and depth together in one DBA step and so has no alternation of either kind. All in-pool."
    hop_rationale: "Both anchors are one hop from generic SLAM and DepthEstimation nodes, making them two hops apart the same way every module name in this theme is. The question separates an algorithmic convergence loop from a concurrency arrangement — two things that a generic 'alternates' edge would conflate — so a short path is precisely the evidence that must be distrusted here."
  - id: dso-allocating-compute-by-image-content
    text: "DSO spends a fixed budget of pixels wherever there is non-zero intensity gradient; Point-SLAM places its anchors according to local information density, densifying textured regions and sparing flat walls. State what the two selection criteria share and where they differ in what they are trying to conserve, then say why DROID-SLAM needs no such criterion."
    anchors: ["intensity gradient", "information density"]
    requires: ["1607.02565", "2304.04278", "2108.10869"]
    note: "Gold: both criteria are image-content-driven allocations, but DSO is conserving CPU time in a real-time optimiser over a sparse point set while Point-SLAM is conserving memory in a neural point cloud that must not absorb every observation; DROID-SLAM allocates uniformly because the DBA layer works on dense per-pixel depth on GPU. Point-SLAM is the single out-of-pool paper."
    hop_rationale: "Both anchors attach to sampling/representation vocabulary shared by most of the SLAM sub-topic, so a two-hop path exists and would equally connect any sampling term to any density term across seven papers. What makes the pairing meaningful is that the two criteria optimise different budgets — compute versus memory — which is stated only in the two papers' own motivations and cannot be read off any short path."
  - id: dso-monocular-scale-ambiguity-three-answers
    text: "A monocular camera cannot fix metric scale from images alone. Collect the corpus's three responses: extending a direct odometry system to stereo, RGB-D and inertial inputs; training on monocular video and ingesting stereo at test time; and suppressing scale drift by geometric verification of explicit primitives. Which of the three leaves the trained model itself untouched, and which changes the sensor rig?"
    anchors: ["monocular video", "scale drift"]
    requires: ["1607.02565", "2108.10869", "2312.06741"]
    note: "Gold: DSO's follow-ups add stereo/RGB-D/inertial hardware; DROID-SLAM keeps one monocular-trained model and simply accepts stronger input at test time — the model is untouched; MonoGS stays monocular and fights scale drift with geometric verification and regularisation of Gaussians. Gaussian Splatting SLAM is the single out-of-pool paper."
    hop_rationale: "'monocular' is one of the most connected tokens in the corpus, adjacent to the dynamic-NeRF papers as well as every SLAM paper, so the anchors sit two hops apart through it regardless of whether scale is involved. The question asks where each fix intervenes — hardware, inference-time input, or regularisation — a three-way distinction that a hub token like 'monocular video' actively obscures."
  - id: dso-implicit-map-and-the-return-to-explicit
    text: "NICE-SLAM and DROID-SLAM are cast as opposite ends of the explicit-implicit spectrum for online SLAM. Say precisely what is implicit about the hierarchical feature grid, what DROID-SLAM stores in its place, and what the later systems built on a differentiable splatting rasteriser recovered by making the map explicit again."
    anchors: ["hierarchical feature grid", "differentiable splatting rasteriser"]
    requires: ["2112.12130", "2108.10869", "2311.11700"]
    note: "Gold: NICE-SLAM's grid stores features that mean nothing without the shared decoder MLP — geometry is implicit in decoder weights; DROID-SLAM stores explicit poses and per-pixel depth but cannot render appearance; GS-SLAM's explicit primitives restore direct inspectability and drop the per-pixel MLP query cost that bounds neural SLAM update rates. GS-SLAM is the single out-of-pool paper."
    hop_rationale: "Both anchors are representation nouns inside the SLAM sub-topic, so a two-hop path through it exists for them and for every other representation pair in the corpus. The question needs the direction of the argument — implicit map, then a purely geometric map, then a deliberate return to explicit primitives with a stated cost motive — which is a temporal and causal ordering that adjacency alone does not encode."
  - id: dso-control-tartanair-calibrated-dso
    text: "On the TartanAir sequences, how much of DROID-SLAM's robustness advantage survives once DSO is supplied with full photometric calibration for those sequences, and what trajectory-error gap remains between the two after that correction?"
    anchors: ["TartanAir", "photometric calibration"]
    control: true
    legacy_gameable: true
    requires: []
    note: "Unanswerable from the 50-paper corpus. TartanAir appears only as one of DROID-SLAM's evaluation benchmarks and photometric calibration only as a DSO component; no paper evaluates DSO on TartanAir, no paper reports numeric trajectory errors of any kind (the corpus records only PSNR/SSIM/LPIPS as metric labels), and no paper contains a calibration ablation. Verified: the string 'absolute trajectory error' occurs nowhere in the corpus."
    hop_rationale: "Both anchors are one hop from their respective papers and those papers cite each other, so a retrieval system will return a short, confident path and still have no numbers to answer with. This control exists to show that a short anchor-to-anchor path is not evidence of answerability."
  - id: dso-control-loop-closure-module
    text: "Which place-recognition module does DROID-SLAM use to propose loop closures over its keyframe graph, and how does its acceptance threshold compare with the keyframe-selection rule used by NICE-SLAM when it advances its sliding window of keyframes?"
    anchors: ["keyframe graph", "sliding window of keyframes"]
    control: true
    legacy_gameable: true
    requires: []
    note: "Unanswerable from the 50-paper corpus on both halves. Verified by exhaustive string search: neither 'loop closure' nor 'place recognition' occurs anywhere in the 50 papers, and no paper states any keyframe-selection or acceptance threshold. The anchors themselves are genuine corpus terms — 'keyframe graph' from DeepV2D's description of DROID-SLAM, 'sliding window of keyframes' from NICE-SLAM — so the question sounds like a normal cross-paper systems comparison."
    hop_rationale: "The anchors are two well-connected keyframe terms in the same sub-topic, so the graph offers a short path and plausible neighbours; the missing content is a mechanism that no document contains, which no amount of path quality can supply."
  - id: dso-control-annealing-schedule-form
    text: "What functional form does BARF's coarse-to-fine annealing schedule take over the positional encoding bands — linear or exponential in training iteration — and what does its ablation report about pose error when the schedule is run twice as fast?"
    anchors: ["coarse-to-fine annealing schedule", "positional encoding"]
    control: true
    legacy_gameable: true
    requires: []
    note: "Unanswerable from the 50-paper corpus. The corpus describes the annealing only qualitatively (high-frequency bands masked early, progressively re-enabled) and gives no functional form, no iteration counts, and no schedule-rate ablation; Nerfies, which uses the same trick, is equally qualitative, and no other paper discusses annealing rates. The anchors both occur in several corpus papers, so the question looks answerable."
    hop_rationale: "'positional encoding' is a hub token spanning five papers and sits adjacent to the annealing anchor in both BARF and Nerfies, so the shortest possible path exists between the anchors. The question fails on granularity rather than connectivity — the corpus stores the mechanism but not its parameters — which is exactly the case where path length misleads."

  # ---- nslam ----
  - id: nslam-anchor-density-vs-hierarchical-grid
    text: "Point-SLAM argues it needs less memory than fixed-resolution grid encodings because it adapts anchor point density to the information density of the input, while NICE-SLAM's hierarchical feature grid is what keeps its runtime roughly constant in scene size. What does each design hold constant and what does it let vary, and how does Co-SLAM's hash-grid-plus-coordinate hybrid avoid having to choose?"
    anchors: ["anchor point density", "hierarchical feature grid"]
    requires: ["2304.04278", "2112.12130", "2304.14377"]
    note: "Answer needs Point-SLAM's stated comparison target (fixed-resolution grids as used by iMAP and NICE-SLAM), NICE-SLAM's per-observation local grid update, and Co-SLAM's separate justification for hashing (convergence speed and high-frequency detail, not memory)."
    hop_rationale: "Both anchors are one hop from the generic 'dense neural RGB-D SLAM' hub, so every pair of SLAM papers in this corpus enjoys a two-hop path through it. That path says only 'both are scene representations'; it cannot express the directional claim that Point-SLAM's memory argument is stated against grid encodings of NICE-SLAM's kind, nor that Co-SLAM's grid was chosen for a different reason than the one Point-SLAM attacks."
  - id: nslam-unobserved-space-completion
    text: "NICE-SLAM completes unobserved regions with pre-trained geometric priors sitting on its decoder MLPs, while Co-SLAM leans on one-blob encoding to keep unobserved space coherent. Where does the completion prior physically live in each system, and what does Point-SLAM's incremental point growth do about space that was never observed at all?"
    anchors: ["pre-trained geometric priors", "one-blob encoding"]
    requires: ["2112.12130", "2304.14377", "2304.04278"]
    note: "The contrast is prior-in-the-decoder-weights versus prior-in-the-input-encoding versus no completion prior at all (Point-SLAM only grows anchors where input evidence arrives). Corpus states each explicitly."
    hop_rationale: "A short path exists via 'MLP' or 'encoding', both of which every neural SLAM paper touches. Such a path is agnostic about *where* smoothness is injected, which is exactly the discriminating fact here — two systems with an identical one-hop encoding neighbourhood can put the completion prior in opposite places, so adjacency is not evidence."
  - id: nslam-keyframe-window-vs-global-ba
    text: "Co-SLAM claims a global bundle adjustment over all keyframes is required where a small active window lets drift accumulate — the regime NICE-SLAM works in with its sliding window of keyframes. What does Co-SLAM's ray sampling have to supply to make the global solve affordable at interactive rates, and how does GS-SLAM control the same drift without any global adjustment?"
    anchors: ["window of keyframes", "global bundle adjustment"]
    requires: ["2112.12130", "2304.14377", "2311.11700"]
    note: "Gold needs NICE-SLAM's windowed mapping thread, Co-SLAM's ray-sampling-enabled all-keyframe BA plus its long-sequence drift claim, and GS-SLAM's coarse-to-fine reliable-Gaussian selection as the alternative stabiliser."
    hop_rationale: "'Bundle adjustment' and 'keyframe' co-occur in nearly every SLAM paper here, so a generic BA node links the anchors in two hops for DSO, DROID-SLAM, BARF and Co-SLAM alike. That path cannot say which system's window Co-SLAM was arguing against, nor that GS-SLAM declines the global solve entirely — the answer is a disagreement, not a shared topic."
  - id: nslam-per-pixel-cost-implicit-vs-splatting
    text: "GS-SLAM blames the low incremental update rates of earlier neural SLAM on coupling ray sampling to MLP queries. For Point-SLAM and Co-SLAM specifically, name what is queried per sample along a ray, and state which part of that path GS-SLAM's differentiable splatting rasteriser removes rather than merely accelerates."
    anchors: ["ray sampling", "differentiable splatting rasteriser"]
    requires: ["2311.11700", "2304.04278", "2304.14377"]
    note: "Point-SLAM interpolates per-point features near anchors, Co-SLAM concatenates hash-grid and one-blob features into a shallow MLP predicting SDF and colour; splatting replaces the sampled-query path with a sorted rasterisation of projected primitives."
    hop_rationale: "'Ray sampling' sits on the shared volume-rendering hub that also connects NeRF, NeuS and Mip-NeRF, so a two-hop path to any rendering technique is free in this corpus. The question turns on GS-SLAM's cost attribution to two named predecessors and on what each of those actually evaluates per sample — content a rendering-hub path is blind to."
  - id: nslam-pose-gradient-explicit-map
    text: "Gaussian Splatting SLAM reports a wide basin of convergence when camera tracking is done by differentiating splat rendering with respect to camera parameters. Point-SLAM and NICE-SLAM also recover pose by minimising a re-rendering loss against their maps, so what is structurally different about where the pose gradient originates, and why does the monocular setting need the wider basin in the first place?"
    anchors: ["wide basin of convergence", "re-rendering loss"]
    requires: ["2312.06741", "2304.04278", "2112.12130"]
    note: "Implicit systems backpropagate through sampled MLP/feature queries with the scene frozen; MonoGS differentiates the rasteriser directly and has no depth term to anchor the residual, which is why basin width is the headline property."
    hop_rationale: "Every system here minimises a photometric residual, so 're-rendering loss' is a hub term with a one-hop link to all five pool papers. A hub path shows the loss is shared; it cannot show that the gradient path differs (sampled implicit query versus differentiated rasterisation) or that basin width is claimed as a consequence of that difference."
  - id: nslam-transient-geometry-guards
    text: "Point-SLAM gates new anchors behind a reliability check, GS-SLAM prunes drifting primitives as part of its adaptive expansion strategy, and Gaussian Splatting SLAM adds geometric verification. Which shared failure mode of incremental reconstruction are all three guarding against, and at which point in the loop — insertion, optimisation, or pruning — does each one intervene?"
    anchors: ["reliability check", "adaptive expansion strategy"]
    requires: ["2304.04278", "2311.11700", "2312.06741"]
    note: "All three prevent transient or unsupported geometry from becoming permanent map content; the discriminator is stage of intervention (Point-SLAM at candidate insertion, GS-SLAM at prune time, MonoGS post-hoc via verification and regularisation)."
    hop_rationale: "A generic 'map maintenance' or 'pruning' neighbour connects the anchors quickly, and pruning appears in half the Gaussian papers here including purely offline ones. Membership in that neighbourhood is not evidence for the incremental-specific claim: an offline densification schedule prunes too, yet has no transient-observation problem to solve."
  - id: nslam-anchor-features-vs-neural-gaussians
    text: "Scaffold-GS hangs view-conditioned neural Gaussians off a sparse set of anchor points; Point-SLAM hangs decoded features off incrementally grown point anchors. What does the view-conditioning express that Point-SLAM's per-anchor features cannot, and which of the two anchoring styles does GS-SLAM's incremental map actually adopt?"
    anchors: ["anchor points", "neural Gaussians"]
    requires: ["2312.00109", "2304.04278", "2311.11700"]
    note: "Scaffold-GS predicts splat attributes per view from anchor plus viewing direction; Point-SLAM's anchors carry static features decoded per query; GS-SLAM keeps a flat set of free Gaussians expanded adaptively, i.e. neither hierarchy."
    hop_rationale: "The word 'anchor' occurs in 3DGS, Scaffold-GS, Point-SLAM and GS-SLAM, so a lexical anchor node joins them in one hop each. That co-occurrence is exactly the false positive to reject: Scaffold-GS anchors are view-conditioned generators inside a batch pipeline, Point-SLAM anchors are online evidence carriers, and the question is which semantics GS-SLAM inherited."
  - id: nslam-hash-encoding-inheritance
    text: "Co-SLAM's multi-resolution hash grid is inherited from Instant-NGP's hash encoding. Which property that Instant-NGP deliberately accepts is the one that leaves unobserved space badly behaved and therefore forces Co-SLAM to add a coordinate encoding for surface coherence, and why does Point-SLAM's anchoring not run into it?"
    anchors: ["multi-resolution hash grid", "surface coherence"]
    requires: ["2304.14377", "2201.05989", "2304.04278"]
    note: "Instant-NGP has no explicit collision resolution — fine-level collisions are disambiguated only by gradient updates from observed content, so never-supervised cells stay arbitrary; Point-SLAM allocates anchors only where evidence arrives, so unobserved space holds nothing rather than noise."
    hop_rationale: "Instant-NGP is cited by half the corpus, so any hash-using paper is two hops from it through a 'hash encoding' node. Being downstream of Instant-NGP does not imply inheriting the collision behaviour as a *problem*: Magic3D and MonoSDF use the same encoding with no completion prior, so only the mechanism-level claim distinguishes Co-SLAM's fix."
  - id: nslam-offline-sfm-to-online-init
    text: "Vanilla 3DGS optimisation is seeded by poses and a sparse cloud from an offline Structure from Motion stage. What supplies that initialisation online in Gaussian Splatting SLAM's monocular loop versus GS-SLAM's adaptive expansion strategy under RGB-D, and what had Point-SLAM already had to solve for the same reason one generation earlier?"
    anchors: ["Structure from Motion", "adaptive expansion strategy"]
    requires: ["2312.06741", "2311.11700", "2304.04278"]
    note: "MonoGS states the offline-SfM dependency explicitly and replaces it with direct tracking plus growth where pixels are unexplained; GS-SLAM expands from RGB-D evidence; Point-SLAM grows its cloud incrementally with reliability gating. No 3DGS paper is needed to answer."
    hop_rationale: "'Structure from Motion' is a corpus-wide hub touching DeepV2D, DROID-SLAM, BARF and every Gaussian paper, giving free short paths. Such a path cannot distinguish systems that consume SfM output from systems whose contribution is removing the SfM stage, which is the entire content of the question."
  - id: nslam-dba-vs-alternating-optimisation
    text: "DROID-SLAM places a differentiable Dense Bundle Adjustment layer at the core of its optimiser, while NICE-SLAM alternates mapping and tracking threads that each freeze what the other optimises. Where does Co-SLAM's global bundle adjustment fall between those two, and what does it still give up relative to a joint depth-and-pose solve?"
    anchors: ["Dense Bundle Adjustment", "global bundle adjustment"]
    requires: ["2108.10869", "2112.12130", "2304.14377"]
    note: "DROID-SLAM solves geometry and pose jointly through a differentiable Gauss-Newton step with gradients flowing through the BA Jacobian; NICE-SLAM never optimises both at once; Co-SLAM widens the keyframe set but keeps the neural map as the geometry parameterisation."
    hop_rationale: "Both anchors contain 'bundle adjustment', so a lexical or method-type node connects them in one hop, and BARF and DSO hang off the same node. Lexical proximity is precisely the wrong signal here: the question is about which variables are solved simultaneously, and three systems on that same node give three different answers."
  - id: nslam-map-readout-explicit-vs-decoder
    text: "GS-SLAM points out that as an explicit primitive representation its map can be visualised at any moment without a further pass through a separate decoder. Spell out what NICE-SLAM's shared decoder MLP and Co-SLAM's hybrid encoding must each run to produce the same view, and argue why that difference matters for live monitoring of a long capture rather than for final reconstruction quality."
    anchors: ["explicit primitive", "shared decoder MLP"]
    requires: ["2311.11700", "2112.12130", "2304.14377"]
    note: "Implicit maps require sampling plus decoding (trilinear feature lookup into the shared MLP for NICE-SLAM, hash plus one-blob features into a shallow MLP for Co-SLAM) before anything is visible; the corpus frames the explicit advantage as debugging and live monitoring, not accuracy."
    hop_rationale: "'Rendering' bridges the anchors trivially since all three systems render. The claim under test is an operational property — inspectability of the map between frames — which no rendering-hub path encodes, and which is separable from rendering quality where these systems are near-equal."
  - id: nslam-thin-structures-vs-oversmoothing
    text: "Gaussian Splatting SLAM claims reconstruction of tiny and even transparent objects that implicit neural SLAM handles poorly. Using NICE-SLAM's own diagnosis of over-smoothed reconstructions and Co-SLAM's deliberately smoothness-inducing coordinate encoding, explain what in those implicit pipelines suppresses exactly such structures."
    anchors: ["transparent objects", "over-smoothed"]
    requires: ["2312.06741", "2112.12130", "2304.14377"]
    note: "NICE-SLAM attributes over-smoothing to a shared global MLP and answers it only partly with local grids; Co-SLAM actively injects smoothness for hole filling; MonoGS ties thin-structure recovery to primitives being explicit and tied to image evidence. The trade-off is the answer."
    hop_rationale: "Reconstruction quality is a shared attribute of every paper here, so quality-metric nodes (PSNR, LPIPS) put the anchors within two hops of each other and of thirty unrelated papers. That is the shared-infrastructure false positive: what is needed is the causal link from a smoothness prior deliberately added for hole filling to a specific class of geometry it destroys."
  - id: nslam-imap-forgetting-inheritance
    text: "NICE-SLAM's hierarchical grid exists to stop the global forgetting produced by iMAP's single shared MLP. Which half of that fix does Point-SLAM keep once it swaps grids for anchors driven by input information density, which half does it discard, and what does Co-SLAM's hybrid do about the same forgetting problem?"
    anchors: ["global forgetting", "information density"]
    requires: ["2112.12130", "2304.04278", "2304.14377"]
    note: "The retained idea is locality of parameter updates; the discarded one is a fixed-resolution container. Co-SLAM keeps locality via the hash grid but reintroduces a global smooth term through one-blob encoding, which is a partial re-coupling."
    hop_rationale: "NICE-SLAM is named as an ancestor by both successors, so a citation-style edge connects them directly; that edge alone would satisfy a naive retriever. Inheritance is not the question — which specific property was preserved versus dropped is, and a lineage edge carries no such decomposition."
  - id: nslam-coarse-to-fine-name-collision
    text: "'Coarse-to-fine' names two unrelated mechanisms in this literature: BARF anneals positional encoding frequencies to smooth the pose landscape, while GS-SLAM selects reliable Gaussians coarse-to-fine during pose optimisation. What quantity is being coarsened in each case, and does Gaussian Splatting SLAM's direct optimisation against Gaussians require either device?"
    anchors: ["coarse-to-fine", "positional encoding"]
    requires: ["2311.11700", "2104.06405", "2312.06741"]
    note: "BARF coarsens the representation's frequency content; GS-SLAM coarsens the set of primitives trusted for the residual; MonoGS reports a wide convergence basin from the rasteriser itself and introduces neither schedule. A retriever that treats the phrase as one concept will fail this."
    hop_rationale: "This is a deliberate lexical trap: a shared 'coarse-to-fine' term node links BARF, GS-SLAM, Nerfies and Magic3D in one hop each, and that path is maximally short while being semantically empty. Only the mechanism-level distinction — frequency schedule versus primitive-trust schedule — answers the question, so short path length here is actively anti-correlated with relevance."
  - id: nslam-where-to-add-capacity
    text: "Revising Densification argues that the positional-gradient trigger in Adaptive Density Control is a biased proxy for per-pixel reconstruction error. Compare that trigger against the signals Point-SLAM and GS-SLAM use to decide where to add capacity online, and say which of the two SLAM signals is closer in spirit to the pixel-error criterion."
    anchors: ["Adaptive Density Control", "information density"]
    requires: ["2404.06109", "2304.04278", "2311.11700"]
    note: "GS-SLAM expands where the map fails to explain incoming pixels, which is a residual-driven trigger like the proposed fix; Point-SLAM's trigger is input information density, an image-content measure independent of current map error."
    hop_rationale: "Densification is a hub concept spanning every Gaussian paper here, so both anchors sit within two hops of it. Hub membership cannot separate a gradient-magnitude proxy from a residual-driven one from a content-driven one — three triggers that look identical at the level of 'adds primitives' and differ precisely where the question probes."
  - id: nslam-surface-field-vs-primitive-drift
    text: "Co-SLAM's shallow MLP predicts signed distance and NICE-SLAM's decoder predicts occupancy and color, so both carry an explicit notion of where a surface lies. GS-SLAM's Gaussians carry no such field; what does it use in its place to keep primitives on geometry, and what capability does it forfeit by not having one?"
    anchors: ["distance and colour", "occupancy and color"]
    requires: ["2304.14377", "2112.12130", "2311.11700"]
    note: "GS-SLAM substitutes pruning of primitives that drift from the surface plus depth-supervised re-rendering; without a level set it has no direct surface extraction, which is what SuGaR-style follow-ups later address."
    hop_rationale: "Both anchors are decoder-output types and therefore hang off a common 'implicit surface' node shared with NeuS, UNISURF and VolSDF, giving short generic paths. The question asks what a system *lacking* that node does instead, so proximity between the two implicit anchors is irrelevant evidence — the informative link is an absence."
  - id: nslam-monocular-ambiguity-vs-depth
    text: "NICE-SLAM and GS-SLAM both supervise with RGB-D photometric and geometric losses. Which specific ambiguities appear in Gaussian Splatting SLAM only because that depth term is unavailable, and what mechanism does it introduce to suppress scale drift while keeping the RGB-D path unchanged architecturally?"
    anchors: ["scale drift", "photometric and geometric"]
    requires: ["2312.06741", "2311.11700", "2112.12130"]
    note: "MonoGS names floaters, sliding surfaces and scale drift as monocular-specific, handles them with geometric verification and regularisation over explicit primitives, and accepts depth as an extra supervision signal without changing the architecture."
    hop_rationale: "All three papers attach to an 'RGB-D loss' node, so a two-hop path is guaranteed and says only that they share a residual formulation. What is being asked is what breaks when one term of that residual is deleted — a subtraction that a shared-loss adjacency cannot represent at any path length."
  - id: nslam-what-is-frozen-in-each-stage
    text: "NICE-SLAM alternates mapping and tracking with one side frozen each turn, Point-SLAM drives both stages from the same point-based field, and GS-SLAM runs a two-track loop over its Gaussian map. For each, state which variables are optimised together and which are held fixed, and what that implies about how a pose error can propagate into map geometry."
    anchors: ["two-track loop", "point-based field"]
    requires: ["2311.11700", "2304.04278", "2112.12130"]
    note: "NICE-SLAM freezes pose while updating grids and freezes the scene while refining pose; Point-SLAM lets one loss update both per-point features and the current pose; GS-SLAM separates tracking from mapping but shares the primitive set. The consequence for error propagation is the synthesis step."
    hop_rationale: "Every SLAM paper here contains both a tracking and a mapping stage, so a generic 'tracking/mapping' node offers a one-hop connection to all five pool papers. The discriminating content is the optimisation schedule — what is simultaneous versus alternating — which that node flattens away entirely."
  - id: nslam-what-is-optimised-per-primitive
    text: "Point-SLAM optimises per-point feature vectors that a decoder turns into radiance, while the gsplat reference documents gradients flowing back into opacity, colour, position, scale and rotation under tile-based rasterisation. Which parameter set does Gaussian Splatting SLAM actually update during live mapping, and what does that change about correcting the map after a bad pose estimate?"
    anchors: ["per-point feature vectors", "tile-based rasterisation"]
    requires: ["2304.04278", "2312.02121", "2312.06741"]
    note: "MonoGS updates the geometric primitive parameters directly, so map correction is a change of geometry rather than of latent features that a fixed decoder must reinterpret; gsplat supplies the exact backward path these SLAM systems reuse."
    hop_rationale: "gsplat is described as the low-level substrate for the whole splatting ecosystem, so a short path from it to any Gaussian SLAM paper exists by construction. Substrate proximity does not tell you which parameters a given system leaves frozen online, nor that Point-SLAM's optimisation target is latent rather than geometric — that contrast is the question."
  - id: nslam-anisotropic-covariance-online
    text: "3D Gaussian Splatting gives every primitive a full anisotropic covariance adapted to local geometry during its densification schedule, whereas Point-SLAM's anchors carry no shape parameters at all and were later succeeded by anisotropic Gaussian primitives. What does per-primitive covariance buy in incremental RGB-D capture, and how does GS-SLAM stop freshly spawned, badly shaped Gaussians from corrupting pose estimation?"
    anchors: ["anisotropic covariance", "anisotropic Gaussian primitives"]
    requires: ["2308.04079", "2304.04278", "2311.11700"]
    note: "Genuinely about 3DGS's own covariance parameterisation, not a background citation: the answer needs how anisotropy adapts a primitive to local surface shape, why that replaces a denser isotropic anchor set, and GS-SLAM's coarse-to-fine reliable-Gaussian selection as the guard on new primitives."
    hop_rationale: "3DGS is the corpus hub, so it is within two hops of almost everything and any Gaussian-related pair connects through it for free — which is why hub adjacency is worthless evidence here. The question demands the parameterisation-level fact (covariance shapes a primitive to local geometry) plus a specific downstream guard, neither of which a hub path distinguishes from the thirty other papers that merely cite 3DGS."
  - id: nslam-ctl-euroc-matched-budget-ate
    text: "At a matched ray-sampling budget, does Co-SLAM's one-blob encoding or Point-SLAM's point anchoring yield lower absolute trajectory error on the EuRoC MAV sequences, and how does the gap change between the difficult and easy sequences?"
    anchors: ["one-blob encoding", "EuRoC"]
    control: true
    legacy_gameable: true
    requires: []
    note: "Unanswerable from the whole corpus. EuRoC appears only in the DSO and DROID-SLAM entries; neither Co-SLAM nor Point-SLAM is reported on it, no absolute trajectory error figures appear anywhere in the corpus, and no matched-sampling-budget head-to-head between these two systems is described. Both anchors occur, which makes the question look answerable by association."
    hop_rationale: "A path from the one-blob anchor to the EuRoC anchor is short — Co-SLAM to SLAM hub to DSO or DROID-SLAM, both of which carry EuRoC — so a graph will happily surface a two- or three-hop route. The route is real and the answer still does not exist, which is exactly the false positive this control is meant to catch."
  - id: nslam-ctl-memory-footprint-replica
    text: "How much GPU memory does GS-SLAM's adaptive expansion strategy consume per Replica scene compared with NICE-SLAM's hierarchical feature grid at equivalent reconstruction quality, and at what scene size does the ordering reverse?"
    anchors: ["adaptive expansion strategy", "hierarchical feature grid"]
    control: true
    legacy_gameable: true
    requires: []
    note: "Unanswerable: no paper in the corpus reports absolute memory figures for any SLAM system. Point-SLAM claims memory reduction only qualitatively and relative to grid encodings; GS-SLAM and NICE-SLAM report no footprint at all, and no crossover analysis versus scene size exists anywhere."
    hop_rationale: "Both anchors are strong, well-connected concepts within the neural SLAM neighbourhood and share the Replica dataset node, so retrieval will return exactly the two right documents with high confidence. Retrieving the right documents is not the same as the documents containing quantitative memory numbers, which they do not."
  - id: nslam-ctl-sh-degree-monocular-tracking
    text: "To which spherical harmonics degree does Gaussian Splatting SLAM truncate its primitives during live monocular tracking, and how does that truncation interact with its geometric verification step when the camera revisits a specular surface?"
    anchors: ["spherical harmonics", "geometric verification"]
    control: true
    legacy_gameable: true
    requires: []
    note: "Unanswerable: spherical harmonics appear in the corpus only as the view-dependent colour encoding of 3DGS and in the PlenOctrees/Plenoxels entries. No SLAM paper here states an SH degree, no truncation is described, and no interaction between colour-basis order and geometric verification or specular revisits is discussed anywhere."
    hop_rationale: "The two anchors are separated by a plausible short path — MonoGS to Gaussian representation to 3DGS's spherical-harmonic colour — so the graph can connect them confidently in two hops. The connection encodes only that MonoGS uses Gaussians whose colour is generally SH-encoded; the specific hyper-parameter and its interaction are absent from every document, so any confident answer is fabrication."

  # ---- nrf ----
  - id: nrf-transient-masking-vs-deformation-modelling
    text: "Two NeRF successors confront a scene that is not static: one downweights the pixels where the observations disagree with each other, the other fits a warp so the disagreement is explained rather than discarded. What does each mechanism presuppose about the moving content, and what would NeRF-W's transient head do to the subject Nerfies is trying to reconstruct?"
    anchors: ["transient head", "deformation field"]
    requires: ["2008.02268", "2011.12948"]
    note: "NeRF-W's transient head plus per-image uncertainty downweights the photometric loss where observations are inconsistent; it presupposes that the moving content is a nuisance appearing in a few captures (tourists, vehicles, scaffolding) and is disposable. Nerfies' continuous volumetric deformation field maps every observed point into a canonical template so the moving content IS the reconstruction target, presupposing near-rigid, continuous motion over a monocular capture. Applied to a Nerfies capture, NeRF-W's uncertainty would mask the deforming subject as a transient occluder. The two interventions are not variants of one 'handle non-static scenes' idea, and NeRF supplies the static-scene assumption both react to."
    hop_rationale: "Both papers are direct NeRF children, share an author (Martin-Brualla), share the whole PSNR/SSIM/LPIPS metric set and the phrase 'NeRF assumes a static scene', so 'transient head -> NeRF-W -> NeRF -> Nerfies -> deformation field' is a short path available for any pair of NeRF descendants in this corpus. It certifies shared ancestry and shared vocabulary about scenes that change, and would be unchanged if the two mechanisms were swapped. It cannot decide whether the interventions are interchangeable or mutually destructive, which is exactly what is asked."
  - id: nrf-continuity-limit-two-escapes
    text: "A deformation field that maps observations into a single canonical template cannot express a discontinuity, so a scene whose topology changes breaks it. Two later works escape by making the representation live in a higher-dimensional space and taking a slice, but one keeps the canonical template and one abandons it. What is each one slicing through, and what job does the retained deformation field still do in the method that keeps it?"
    anchors: ["ambient coordinate", "temporal slicing"]
    requires: ["2011.12948", "2106.13228", "2402.03307"]
    note: "HyperNeRF keeps Nerfies' warp but demotes it: observed points are first warped into canonical 3D coordinates, then the radiance field is sliced at that frame's ambient coordinate in a higher-dimensional space, level-set style, so the topological change is absorbed by the extra axis rather than by the deformation. 4D-Rotor Gaussian Splatting rejects the canonical-plus-deformation factorisation entirely: each primitive is a 4D XYZT Gaussian with a rotor-parameterised orientation, and rendering takes a temporal slice at time t, so appearing and disappearing content is carried by primitives with narrow temporal extent. Both are 'slice a higher-dimensional object', but one slices a learned state axis inside a canonical framework and the other slices literal time after deleting that framework."
    hop_rationale: "'Deformation field' occurs in Nerfies, HyperNeRF, 4D-GS and 4D-Rotor, and all of them sit in the corpus's dynamic-reconstruction cluster, so a two-hop path from the ambient coordinate to temporal slicing through 'deformation field' or 'dynamic scene' is guaranteed. That path asserts only co-membership in dynamic reconstruction and actively supports the wrong inference that HyperNeRF's ambient axis is time. Separating a learned state coordinate sliced inside a canonical framework from a temporal slice that replaces the framework requires each paper's own construction."
  - id: nrf-elastic-prior-survives-topology
    text: "Nerfies stabilises its warp with an elastic energy borrowed from physical simulation that penalises non-rigid distortion of the deformation Jacobian. Its follow-up targets scenes where a connected component splits or merges, which is not elastic motion at all, yet keeps that regulariser. Where does the topological change get absorbed if not in the deformation, and why does the elastic prior not fight it?"
    anchors: ["elastic energy", "topological change"]
    requires: ["2011.12948", "2106.13228"]
    note: "In HyperNeRF the deformation field is retained but no longer has to carry the discontinuity: points are warped into canonical 3D coordinates while the topological change is expressed by moving along the ambient axis and slicing the higher-dimensional field. Because the warp only ever represents the part of the change that really is a soft-body deformation, Nerfies' elastic energy and its coarse-to-fine encoding schedule are reused unmodified. Either paper alone gives the wrong story: Nerfies presents elasticity as what makes deformation work, HyperNeRF states that a continuous deformation field cannot represent a discontinuity at all."
    hop_rationale: "Nerfies and HyperNeRF are the same team, one is the direct follow-up of the other, and both documents contain both anchor strings, so the anchors resolve at distance zero to two inside a tightly connected pair. A path that short is guaranteed and evidentially empty here: it cannot show that a prior described as essential in the first paper survives into a regime that violates its motivating assumption, nor which component takes over the violated part. That claim exists only in the contrast between the two mechanisms."
  - id: nrf-jacobian-vs-eikonal-priors
    text: "Two coordinate-network methods in this corpus regularise the derivative of the network rather than its output: one penalises how the Jacobian of a warp departs from rigidity, the other pins the gradient norm of a learned field to one everywhere. What degenerate solution is each ruling out, and would swapping the two terms preserve either method's guarantee?"
    anchors: ["elastic regularization", "Eikonal regularizer"]
    requires: ["2011.12948", "2106.13228", "2002.10099"]
    note: "Nerfies' elastic energy penalises non-rigid distortion of the deformation Jacobian so the warp behaves like a soft-body deformation instead of an arbitrary reshuffling of space that a monocular capture cannot disambiguate; HyperNeRF reuses it verbatim. IGR's Eikonal term forces unit gradient norm everywhere so the network remains a metric distance function and cannot collapse to the degenerate solution that vanishes only near the input points, and the authors prove it biases toward smooth zero level sets. One is a prior on the plausibility of motion, the other on the metric validity of a field; neither substitutes for the other, and only IGR's is accompanied by a proof."
    hop_rationale: "Both anchors are 'a regulariser on a coordinate-based MLP', and IGR reaches the NeRF lineage in two hops through NeuS and VolSDF, which the corpus explicitly ties to NeRF's volume rendering. A short path therefore exists through any 'regularization' or 'implicit representation' hub, and the same path would equally connect the Eikonal term to Mip-NeRF 360's distortion regulariser or Plenoxels' total-variation prior. What each term forbids is stated only as each paper's own degenerate case, which no topical hub carries."
  - id: nrf-coarse-to-fine-name-collision
    text: "'Coarse-to-fine' names two different objects in the NeRF line: one schedules where samples are placed along a ray, the other schedules which frequency bands of the input encoding are active. Which paper owns which, which one is annealed over training rather than resolved per ray, and which of the two does HyperNeRF inherit?"
    anchors: ["hierarchical coarse-to-fine sampling", "coarse-to-fine annealing"]
    requires: ["2003.08934", "2011.12948", "2106.13228"]
    note: "NeRF's coarse-to-fine is spatial and permanent: a coarse network estimates where mass lies along a ray and a fine network importance-samples around it, and both networks still exist at convergence. Nerfies' is temporal and transient: high-frequency bands of the deformation network's positional encoding are masked early and released as training proceeds, purely to escape the local minima that high-frequency encodings induce in an ill-posed warp; at convergence nothing is masked. HyperNeRF reuses the second, together with the elastic term, and changes nothing about sampling. Conflating the two yields the false claim that Nerfies altered NeRF's sampling scheme."
    hop_rationale: "'Coarse-to-fine' is one of the most widely shared strings in this corpus, occurring in NeRF, Nerfies, BARF, HyperNeRF, Magic3D, Magic123 and GS-SLAM, so the anchors are joined in one or two hops through the phrase itself. That is the co-occurrence false positive in its purest form: a lexical hub linking two mechanisms that act on different variables (sample position versus encoding bandwidth) at different times (per ray forever versus over the training schedule). Only the per-paper mechanism separates them."
  - id: nrf-latent-interpolation-kinds
    text: "Both NeRF-W and HyperNeRF advertise smooth interpolation in a learned per-observation code, but one interpolation moves the scene's lighting and the other moves the scene's configuration. What is held fixed in each case, and why is only one of the two codes able to change the density field?"
    anchors: ["appearance embedding", "moment-interpolation"]
    requires: ["2008.02268", "2106.13228", "2003.08934"]
    note: "NeRF-W's per-image appearance embedding is concatenated to the radiance MLP input only, so interpolating it re-lights a landmark while geometry stays shared across the whole collection; that sharing is the point, since thousands of internet photos must agree on one surface. HyperNeRF's ambient coordinate indexes a slice of a higher-dimensional field, so moving between moments changes density as well as radiance at a point, which is how a mouth opens. Vanilla NeRF has neither code and can only interpolate camera pose. The discriminating fact is which part of NeRF's 5D function the latent is permitted to touch."
    hop_rationale: "Both works are direct NeRF descendants that report interpolation results and both latents are per-observation embeddings, so any path through NeRF, 'latent' or 'novel view synthesis' connects the anchors in two or three hops. Following it predicts that the two interpolations are the same operation, which is precisely wrong: the path cannot express that one code is barred from the density head by construction while the other exists to change it. The evidence is architectural placement, stated separately in each paper."
  - id: nrf-appearance-latitude-vs-ambiguity
    text: "Letting radiance vary per image gives the optimizer another way to explain a photometric residual without correcting the geometry. What keeps NeRF-W's appearance latent from absorbing geometric error, and how does the unbounded-scene line attack the same ambiguity from the loss side rather than the architecture side?"
    anchors: ["appearance embedding", "shape-radiance ambiguities"]
    requires: ["2008.02268", "2111.12077"]
    note: "NeRF-W's containment is architectural: the embedding is low-dimensional, per-image, and enters only the radiance branch, so density is forced to be the single explanation shared by every photograph in the collection. Mip-NeRF 360 names floaters and shape-radiance ambiguities as properties of unbounded captures even when every observation is consistent, and attacks them with a distortion-based regulariser that penalises radiance smeared along a ray instead of concentrated. One constrains what the extra freedom may touch, the other penalises the geometry that such freedom would buy; neither paper draws the comparison."
    hop_rationale: "Mip-NeRF 360 and NeRF-W are two NeRF children in the same real-world-capture neighbourhood, evaluated with the same metrics and both discussing artifacts, so a short path through NeRF or 'radiance field' is certain. It certifies that both study degraded reconstructions. It cannot say whether a per-image appearance latent worsens shape-radiance ambiguity or is structurally prevented from doing so, which needs NeRF-W's placement of the embedding together with Mip-NeRF 360's independent statement of the ambiguity."
  - id: nrf-warp-vs-static-dynamic-split
    text: "For casually captured video, one family warps the entire scene into a single canonical template while another keeps two radiance fields and learns how to mix them at each point. What does each assume about the fraction of the scene that actually moves, and which assumption makes a mostly static background cheap in one design and wasteful in the other?"
    anchors: ["canonical template", "blending weight"]
    requires: ["2011.12948", "2106.13228", "2105.06468"]
    note: "Nerfies and HyperNeRF route every observed point through a deformation field into one canonical template, so static background pays the same warp cost as the deforming subject and any error in the warp contaminates it. Gao et al. deliberately decompose into a static NeRF and a time-conditioned dynamic NeRF composited by an unsupervised blending weight, arguing that in a monocular clip most of each frame is static, that forcing everything through a 4D MLP wastes capacity and over-smooths static regions, and that the split lets the static field exploit multi-frame parallax. The two designs disagree about where capacity should go, and no single document states the trade-off."
    hop_rationale: "All three papers are monocular dynamic radiance-field papers published within months, all cite NeRF, and they are joined by 'dynamic scene' and 'monocular video' hubs, so the anchors are two hops apart regardless of content. Such a path shows co-membership in the dynamic cluster and would connect the canonical template equally well to 4D-GS or K-Planes. It carries no claim about capacity allocation or about which architecture pays for the static background, which is the substance of the question."
  - id: nrf-frequency-lever-needs-an-encoding
    text: "Nerfies' stabiliser operates on the frequency bands of a sinusoidal input encoding. Plenoxels reports NeRF-quality results with no positional encoding and no network at all, replacing the MLP's implicit smoothness with explicit priors. What regularising role does each paper attribute to the encoding, and what becomes of a frequency-annealing schedule in a representation that has no frequency bands?"
    anchors: ["positional encoding", "total-variation"]
    requires: ["2003.08934", "2011.12948", "2112.05131"]
    note: "NeRF introduces the sinusoidal encoding to raise the representable frequency so the MLP can fit sharp content. Nerfies shows the same encoding makes a deformation field's optimisation landscape spiky and masks its high bands early, releasing them over training. Plenoxels removes both encoding and network and states that the regularisation the MLP implicitly provided must be replaced by explicit total-variation and sparsity priors on the voxels. The consequence, assembled from three documents, is that frequency annealing is not a portable stabiliser: it presupposes a band-structured encoding, and the grid line's substitute is a smoothness penalty on stored values, not a schedule over features."
    hop_rationale: "Positional encoding is NeRF's most-cited component and Plenoxels' own text mentions it in order to deny using it, so 'positional encoding -> NeRF -> Plenoxels -> total-variation' is a guaranteed short path certifying only that Plenoxels belongs to the NeRF lineage. It cannot distinguish 'no encoding is used here' from 'the schedule over that encoding is what stabilises my optimisation', and would look identical if Nerfies' local-minima claim were absent from the slice."
  - id: nrf-baking-vs-per-image-latent
    text: "Baking a radiance field replaces the network with a lookup structure whose only remaining conditioning is viewing direction, expanded per voxel in spherical harmonics. What does NeRF-W's per-image code make vary that such a table has no slot for, and what would have to change for a baked field to keep it?"
    anchors: ["latent code", "spherical-harmonic expansion"]
    requires: ["2008.02268", "2103.14024"]
    note: "PlenOctrees retrains NeRF's radiance head to emit the coefficients of a spherical-harmonic expansion precisely so the viewing-direction input and the MLP can be discarded; colour then depends on position and direction alone, evaluated by an inexpensive dot product per voxel. NeRF-W's colour additionally depends on which photograph is being explained, through a low-dimensional per-image latent code that is a function of neither position nor direction, so it has no representation in a baked SH table; retaining it would mean one coefficient set per appearance condition or keeping a decoder network. The corpus states each half and never joins them."
    hop_rationale: "PlenOctrees and NeRF-W both descend from NeRF and both discuss how view-dependent colour is produced, so a two-hop path through NeRF or the radiance MLP always exists. It supports only 'both modify how colour is produced'. It cannot express that one method's conditioning variable is per-observation and therefore incompatible with the other's storage layout, a claim about representational capacity that neither document makes on its own."
  - id: nrf-second-density-two-intents
    text: "Two NeRF variants add a second density field composited along the same ray: in one the second field is thrown away at render time, in the other it is the content the viewer came for. What is each second field conditioned on, and how does each decide, per point, how much of it to use?"
    anchors: ["transient density", "static NeRF"]
    requires: ["2008.02268", "2105.06468", "2003.08934"]
    note: "NeRF-W's transient head, conditioned on a per-image embedding, predicts a transient density and colour together with an uncertainty field that downweights the loss; the transient field exists to absorb photo-bombers and scaffolding and is dropped when rendering a clean landmark. Gao et al.'s dynamic NeRF is conditioned on a time embedding, and an unsupervised blending weight predicted by the dynamic network sets the per-point mixture with the static NeRF; that second field is the moving subject and is rendered. Structurally these are near-identical two-field compositings over NeRF's emission-absorption integral with opposite conditioning variables and opposite purposes."
    hop_rationale: "Both are 'a second radiance field layered on NeRF' and both papers cite NeRF as the base, so 'transient density -> NeRF-W -> NeRF -> Gao et al. -> static NeRF' is short and unavoidable. That path supports the false reading that transient content and dynamic content are one category. Per-image versus per-time conditioning, and whether the second field survives into the final render, live only in the mechanism descriptions."
  - id: nrf-ambient-vs-time-index
    text: "One dynamic method conditions its field on a time embedding taken from the frame index; another gives each frame a learned coordinate in an ambient space and slices there. Why is the learned coordinate not just a reparameterisation of time, and what does it allow when a scene returns to a configuration it has been in before?"
    anchors: ["hyper-space", "time embedding"]
    requires: ["2106.13228", "2011.12948", "2105.06468"]
    note: "Gao et al.'s dynamic field is conditioned on a time embedding, so two frames far apart in time are far apart in the conditioning variable even when the scene looks identical. HyperNeRF's frame is a slice of a hyper-space at a learned ambient coordinate; nothing ties that coordinate to frame ordering, so recurring configurations can map to nearby slices and interpolation between moments is a path in state space rather than in time. Nerfies is required because the ambient axis is defined on top of its canonical-template warp rather than instead of it, which is what makes the ambient coordinate a state rather than a clock."
    hop_rationale: "Both anchors sit in dynamic-NeRF documents that descend from NeRF and are cross-linked through the monocular dynamic cluster, so a short path through 'dynamic scene', 'deformation field' or NeRF itself is certain. Following it licenses the summary 'both condition the field on the timestamp', which is the exact error under test. Whether the conditioning variable is observed or learned is a per-paper construction that no shared hub encodes."
  - id: nrf-what-the-renderer-kept
    text: "Across NeRF's appearance and deformation descendants most changes happen before the MLP: a warp of the input coordinates, an extra input dimension, a concatenated code, while the volume rendering integral is left alone. Which of these works actually changes the compositing along the ray, what does it add there, and why could the others not have achieved their goal at that stage?"
    anchors: ["volume rendering integral", "uncertainty field"]
    requires: ["2003.08934", "2008.02268", "2011.12948", "2106.13228"]
    note: "Nerfies warps observed 5D coordinates into a canonical template and HyperNeRF adds an ambient input dimension and slices; both are input-side edits that leave NeRF's emission-absorption volume rendering integral untouched. NeRF-W is the exception: it composites a second transient density and colour along the same ray and emits a per-pixel uncertainty field that reweights the photometric loss, editing the rendering and the objective rather than only the input. The reason is structural: an inconsistent observation cannot be repaired by relocating a query point, because the offending content genuinely exists in that image and not in others."
    hop_rationale: "All four papers form a tight citation star around NeRF and share the entire rendering vocabulary, so the anchors connect in one or two hops through NeRF's own document. That is the strongest path available and it proves only that every one of these methods renders by volume rendering, which is shared infrastructure. It offers no way to tell which method modified the integral and which modified its inputs, which is the whole question."
  - id: nrf-supervision-escalation
    text: "NeRF needs only posed images and a photometric loss. Two monocular follow-ups both call their problem under-determined but pay for it differently: one adds priors requiring no extra data, the other imports predictions from off-the-shelf 2D networks. List what each adds, and say which of those additions would still be needed if the capture were multi-view instead of monocular."
    anchors: ["monocular video", "optical-flow loss"]
    requires: ["2011.12948", "2105.06468", "2003.08934"]
    note: "Nerfies adds only internal structure, an elastic energy on the deformation Jacobian plus a coarse-to-fine schedule on encoding frequencies, and buys extra evidence with hardware (a second, time-synchronised phone) rather than with priors. Gao et al. add external supervision: 3D scene-flow consistency between adjacent frames, a depth-order constraint from monocular depth prediction, and a 2D optical-flow loss tying dynamic-field motion to off-the-shelf flow estimates. NeRF's own requirement, posed images and differentiable rendering and nothing else, is the baseline that makes the escalation visible. Multi-view capture removes the motion-versus-parallax confound motivating the flow and depth-order terms but not the ill-posedness of a free-form warp."
    hop_rationale: "'Monocular video' occurs in Nerfies, Gao et al. and DROID-SLAM, so a two-hop path from it to any dynamic-NeRF component exists through the monocular-capture hub, and both follow-ups are NeRF children besides. A path of that shape reports that the works share a capture modality. It says nothing about which one buys constraints with data and which with priors, and a graph could produce it while containing none of the three loss terms the question names."
  - id: nrf-two-illposednesses
    text: "One paper says some of its input observations should not be trusted; another says its inputs are perfectly good yet admit infinitely many explanations. Which mechanism belongs to which diagnosis, and could a per-pixel uncertainty ever resolve the second problem?"
    anchors: ["uncertainty field", "flow consistency"]
    requires: ["2008.02268", "2105.06468", "2011.12948"]
    note: "NeRF-W's uncertainty field concerns observation validity: a pixel showing a tourist is inconsistent with the rest of the collection, so downweighting it recovers the landmark. Gao et al. state that the monocular dynamic problem admits infinitely many solutions that explain the input video exactly, so no reweighting helps and the fix must add constraints (scene-flow consistency, depth ordering, optical flow) that prefer one exact explanation over others. Nerfies makes the same kind of identifiability claim from another direction: its warp is prone to local minima and needs an elastic prior and an annealing schedule, not a robust loss. Telling 'bad data' apart from 'insufficient data' is the entire answer."
    hop_rationale: "Every document here is a NeRF descendant working on non-static real capture, and both anchors are 'a term added to make NeRF training behave', so a hub path through NeRF or 'regularization' resolves them in two hops. The same path would connect the uncertainty field to Mip-NeRF 360's distortion term or to Nerfies' elastic energy, treating robustness and identifiability as one topic, which is exactly the conflation the question is built to detect."
  - id: nrf-intervention-sites
    text: "NeRF's static-scene assumption breaks on real captures in distinct ways. For transient occluders and for a scene whose topology changes, say where in the pipeline the corresponding fix is installed - an extra output head, a warp of the input coordinates, or an extra input dimension - and why the two fixes cannot be exchanged."
    anchors: ["transient occluder", "topological change"]
    requires: ["2008.02268", "2106.13228", "2011.12948"]
    note: "Transient occluders are handled by a second output head predicting transient density and colour plus an uncertainty, driven by a per-image embedding, because the offending content really is present in some captures and must be modelled in order to be discarded. Topological change is handled by adding an input dimension, the ambient coordinate whose slice defines each frame's radiance field, layered on Nerfies' input-coordinate warp, because the offending change is in the scene itself and must be represented rather than downweighted. Swapping them fails both ways: an uncertainty mask would erase the opening mouth, and an ambient axis would legitimise a photobomber as a scene state."
    hop_rationale: "The three papers share an author lineage, share NeRF as parent, and share the framing that vanilla NeRF assumes a static scene, so the anchors land two hops apart through NeRF or 'radiance field'. Such a path certifies that all three describe departures from the static assumption. It provides no way to distinguish an output-head fix from an input-dimension fix, and would score answered even if no statement of where either intervention sits were present."
  - id: nrf-direction-vs-illumination-confound
    text: "In an unstructured photo collection every picture is taken from a different direction and under different light, so one surface point is a different colour twice over. NeRF already lets colour depend on direction - what prevents that existing freedom from absorbing the lighting change, and what does the corpus report happens when it is the only freedom available?"
    anchors: ["view-dependent emitted radiance", "photometric variation"]
    requires: ["2003.08934", "2008.02268"]
    note: "NeRF's direction dependence is a function of the ray alone and is shared by every image looking along that ray, so it can express a specularity but not a per-capture change: two photographs taken from the same viewpoint on different days must produce the same output. NeRF-W reports that vanilla NeRF under variable illumination and transient occluders produces severe artifacts, which is why photometric variation gets its own per-image embedding while geometry stays shared. The reasoning that the direction input is structurally incapable of absorbing capture-time variation is stated nowhere; it must be built from NeRF's definition of the 5D function together with NeRF-W's failure report."
    hop_rationale: "NeRF-W is a direct child of NeRF and restates its 5D formulation, so the anchors sit at distance one across a single citation edge, the shortest path the corpus can offer and worthless here. Proximity establishes descent, not that one conditioning variable is incapable of standing in for the other; the answer is a claim about what the direction argument can vary over, which the edge does not carry."
  - id: nrf-level-set-name-collision
    text: "'Level set' names two unrelated constructions in this corpus: in one, the reconstructed surface is a level set of a learned scalar field; in the other, a whole frame's radiance field is a slice of a higher-dimensional field. Which papers use which, what does the second actually import from classical level-set methods, and is any distance function involved?"
    anchors: ["level set methods", "zero level set"]
    requires: ["2106.13228", "2106.10689"]
    note: "NeuS represents geometry as the zero level set of a signed distance function, and its technical content is entirely about deriving opacity from that SDF without biasing the recovered surface location. HyperNeRF borrows only the idea behind level-set methods, that an evolving surface can be modelled as slices of a higher-dimensional object, and applies it to whole radiance fields indexed by an ambient coordinate: there is no distance function, no zero set and no surface extraction. Nerfies is required because the object being sliced is its canonical template. An answer that files HyperNeRF under implicit-surface methods has followed the shared phrase instead of the mechanism."
    hop_rationale: "'Level set' occurs in IGR, NeuS, VolSDF, HyperNeRF and SuGaR, so the anchors are joined by a one- or two-hop lexical path through the phrase itself, and the two clusters connect again through NeRF's volume rendering. That is a textbook co-occurrence path: it asserts a shared concept where the corpus contains one shared word attached to different objects. Only each paper's construction shows that one level set is a surface and the other is a time slice."
  - id: nrf-deformable-evaluation-protocol
    text: "NeRF's benchmark protocol holds out views of a scene that never changes, which is impossible when the subject is moving. What capture arrangement was built to obtain ground truth for a deforming scene, and what two separate tasks does the follow-up report on because a single novel-view number no longer covers the capability?"
    anchors: ["time-synchronized validation frames", "held-out novel views"]
    requires: ["2011.12948", "2106.13228"]
    note: "Nerfies builds a two-phone rig: one phone records the training video while the second records time-synchronized validation frames from a different viewpoint, giving held-out novel views of an actively deforming subject, something NeRF's static protocol produces for free and a monocular deforming capture cannot produce at all. HyperNeRF then splits evaluation into moment interpolation, which has no ground truth of the same kind, and novel-view synthesis at fixed moments, reporting 4.1% and 8.6% LPIPS error reductions over Nerfies respectively. The protocol change is a consequence of the representation change, not an evaluation detail."
    hop_rationale: "Both anchors occur inside the Nerfies document, so a path-finder resolves them at distance zero within one paper: maximal apparent support and no evidential value for a question about what NeRF's protocol assumed and what HyperNeRF had to add. Separately, all three papers are joined through NeRF and the shared PSNR/SSIM/LPIPS metric set, which is shared infrastructure - reporting the same metrics is not evidence about how ground truth was obtained."
  - id: nrf-control-in-the-wild-deformable
    text: "Which method combines NeRF-W's per-image appearance embedding with a Nerfies-style deformation field, so that an unconstrained collection of photographs of a subject that also moves non-rigidly is reconstructed with illumination variation and deformation handled together?"
    anchors: ["appearance embedding", "deformation field"]
    control: true
    legacy_gameable: true
    requires: []
    note: "'Appearance embedding' occurs in exactly one document of the 50-paper corpus (NeRF-W), and no deformable or dynamic paper here - Nerfies, HyperNeRF, Gao et al., 4D-GS, 4D-Rotor - mentions illumination, exposure, appearance variation or unconstrained photo collections; that vocabulary is confined to NeRF-W (with 'illumination' appearing elsewhere only in DreamFusion, and 'exposure' only in Direct Sparse Odometry). No document describes a method that combines the two, so the question is unanswerable from the corpus while naming two capabilities it really does contain."
    hop_rationale: "Both anchors hang directly off NeRF, so 'appearance embedding -> NeRF-W -> NeRF -> Nerfies -> deformation field' is a guaranteed four-hop path and shorter ones exist through 'radiance field' or 'novel view synthesis'. A path that certain is worthless as evidence for a combined method: it certifies only that both mechanisms are NeRF extensions. Scoring this answerable is precisely the co-occurrence false positive the control exists to catch."
  - id: nrf-control-test-time-appearance-fitting
    text: "When NeRF-W is evaluated on a held-out photograph from an internet collection, that image's appearance latent code was never optimised during training. How is the code obtained at evaluation time, and how does the reported PSNR account for the portion of the image used to fit it?"
    anchors: ["latent code", "PSNR"]
    control: true
    legacy_gameable: true
    requires: []
    note: "The corpus says what NeRF-W's latent code is for, but no document states any evaluation-time procedure for obtaining one: 'test-time', 'held out', 'evaluation protocol', 'ablation' and 'ablate' occur nowhere across the 50 papers (only DROID-SLAM contains 'test time', about something else), and NeRF-W's prose reports no numeric results at all. The real answer - fitting the embedding on part of the test image and scoring the remainder - exists only outside the corpus, so any answer here is fabricated or a refusal."
    hop_rationale: "PSNR is reported by nearly every document in the corpus and 'latent code' sits in NeRF-W, which is one hop from the metric through its own results paragraph, so a path is trivially found and is always about shared evaluation infrastructure. The question asks for a protocol, which no path length can supply when no document contains one; a short path here measures only that both anchors are grounded."
  - id: nrf-control-ambient-dimension-ablation
    text: "How many dimensions does HyperNeRF's ambient space use, and what does the ablation over that dimensionality show about the trade-off between interpolation plausibility and reconstruction sharpness?"
    anchors: ["ambient coordinate", "level set methods"]
    control: true
    legacy_gameable: true
    requires: []
    note: "Both anchors are grounded in HyperNeRF and occur in no other document, so they resolve inside one paper and a path is certain. But the corpus contains no ablation of anything: the strings 'ablation' and 'ablate' appear in none of the 50 papers, and the only quantities in HyperNeRF's text are the 4.1% and 8.6% LPIPS reductions over Nerfies. The dimensionality of the ambient space and any sweep over it exist only in the original publication, so the corpus cannot support an answer."
    hop_rationale: "A same-document co-occurrence gives distance zero between the anchors, the strongest signal a path-based scorer can see, while the question asks for a hyperparameter and an ablation curve that the document does not contain. This is the case where path length is maximally misleading: the connection is real and the answer is absent, so any 'answerable' verdict is measuring grounding of the anchors rather than availability of the evidence."

  # ---- samp ----
  - id: samp-collapsed-mlp-then-proposal
    text: "Mip-NeRF removed NeRF's separate coarse and fine networks and rendered with one MLP, on the grounds that a scale-aware encoding makes a single network sufficient at every sampling level. Mip-NeRF 360 then reintroduced a second, smaller network trained by online distillation. What made a second network necessary again, and why is the proposal MLP not simply a return to NeRF's coarse network?"
    anchors: ["integrated positional encoding", "proposal MLP"]
    requires: ["2103.13415", "2111.12077", "2003.08934"]
    note: "Answer needs three separate facts: NeRF's coarse net is a second radiance field used for importance sampling; Mip-NeRF could drop it because IPE lets one MLP consume features at any scale; Mip-NeRF 360's proposal MLP is not a radiance field at all — it predicts where mass lies and is supervised by the radiance MLP, reintroduced for efficiency on large scenes, not for multi-scale capacity."
    hop_rationale: "Both anchors sit one hop from generic hubs ('positional encoding', 'MLP', 'hierarchical sampling'), so a two-hop path exists between essentially any encoding and any sampler in this corpus and is worthless as evidence. The question turns on why the count of networks went 2 -> 1 -> 2 with a different role each time; that reasoning lives in the method paragraphs of the two Barron papers plus NeRF's description of coarse/fine importance sampling, and no edge between IPE and the proposal MLP encodes it."
  - id: samp-contraction-ray-box-tradeoff
    text: "MERF introduces its own contraction instead of reusing Mip-NeRF 360's non-linear scene parameterization. Which render-time operation does MERF's contraction have to keep cheap, why does the Mip-NeRF 360 parameterization not keep it cheap, and how does that requirement relate to the empty-space skipping that PlenOctrees depends on for real-time rendering?"
    anchors: ["non-linear scene parameterization", "ray-box intersection"]
    requires: ["2111.12077", "2302.12249", "2103.14024"]
    note: "MERF states explicitly that its contraction, unlike Mip-NeRF 360's, is designed to preserve efficient ray-box intersection because fast ray traversal needs it; PlenOctrees supplies the reason traversal cost dominates once the MLP is baked away into a sparse octree that skips empty space."
    hop_rationale: "A short path exists because both papers cite the same unbounded-scene regime and both contain the word 'contraction' — a co-occurrence any fusion baseline finds. But the question asks which downstream renderer operation forced a redesign, which requires reading MERF's justification against Mip-NeRF 360's parameterization goal (bounded domain for sampling) and PlenOctrees' traversal-bound cost model. A generic 'both do unbounded scenes' link would connect these anchors even if MERF had reused the earlier warp verbatim, so it is not evidence."
  - id: samp-floaters-priors-vs-pruning
    text: "Three mechanisms target wasted or wrongly placed density: Mip-NeRF 360's distortion-based regularizer, Plenoxels' total-variation and sparsity priors on voxel values, and MERF's pruning of empty space from its sparse feature grid. Which one acts on the distribution of weights along a ray during optimisation, which acts on the representation's stored values, and which cannot remove a floater at all?"
    anchors: ["distortion-based regularizer", "total-variation"]
    requires: ["2111.12077", "2112.05131", "2302.12249"]
    note: "Requires separating a regulariser on ray-weight concentration (Mip-NeRF 360, aimed at floaters and background haze) from smoothness/sparsity priors that stand in for the MLP's implicit regularisation (Plenoxels) from a memory-driven post-hoc pruning of unoccupied cells (MERF), which removes empty space but not a floater that carries density."
    hop_rationale: "All three anchors reach each other in two hops through 'radiance field' or 'regularisation', which would be equally true of any two regularisers in the corpus. What the question actually needs is the target of each mechanism — ray-weight distribution vs voxel values vs occupancy — and that distinction is stated only inside each paper's own description, never on a path between them."
  - id: samp-hash-collisions-under-multiscale
    text: "Instant-NGP does no explicit collision resolution: at fine levels the table is undersized and collisions are settled by gradient updates that prefer to put visible content where collisions are absent. Mip-NeRF's multiscale benchmark shows the same content at several resolutions during training and testing. What does that regime do to the assumption behind implicit collision disambiguation, and how does Mip-NeRF 360's contraction change which levels of the table visible content ends up occupying?"
    anchors: ["hash collisions", "conical frustum"]
    requires: ["2201.05989", "2103.13415", "2111.12077"]
    note: "Needs Instant-NGP's stated collision mechanism (gradient-averaged, biased toward visible content, resolved by the multiresolution structure), Mip-NeRF's diagnosis that a representation with no footprint input mis-serves content observed at several scales, and Mip-NeRF 360's contraction, which compresses far-field content so that it maps to fewer, coarser cells."
    hop_rationale: "Instant-NGP and Mip-NeRF are one hop apart through 'input encoding' and Instant-NGP names Mip-NeRF directly as a speed baseline, so a one- or two-hop path is guaranteed and tells you nothing. The question is about an interaction — what multi-resolution training data does to a collision-resolution scheme that assumes a single dominant occupant per fine cell — which no citation edge represents."
  - id: samp-planes-inside-contraction
    text: "MERF's three high-resolution 2D feature planes are described as mirroring the K-Planes / TensoRF factorisation, but MERF's planes live inside a contracted bounded volume while K-Planes' planes are axis-aligned in world space and combined by element-wise multiplication. What does contraction do to the resolution a plane devotes to far-field content, and why does that trade matter more for MERF's goal than for K-Planes'?"
    anchors: ["2D feature planes", "element-wise multiplication"]
    requires: ["2302.12249", "2301.10241", "2111.12077"]
    note: "Requires knowing that MERF geared the factorisation toward low-memory baking rather than fast training, that its planes are indexed in contracted coordinates where the far field is compressed toward infinity (Mip-NeRF 360's contraction rule, which MERF modifies), and that K-Planes' planes assume an untransformed coordinate system with per-axis priors."
    hop_rationale: "MERF names the K-Planes factorisation outright, so the shortest path is one hop and would be found for any question that merely asks 'what does MERF borrow'. Here the answer hinges on what changes when the same planar decomposition is indexed in warped coordinates and on why a memory-bound baker cares about far-field resolution allocation more than a training-speed-bound method — a comparison none of the three papers states, and which the direct citation edge does not encode."
  - id: samp-fewer-queries-vs-cheaper-queries
    text: "Mip-NeRF 360 and Instant-NGP both attack the cost of ray marching but at different layers of the stack: one cuts how many expensive queries a ray needs, the other cuts the cost of each query. What does online distillation assume about the radiance network it distils from, and does that assumption still hold when the radiance network is a tiny MLP reading a hash table rather than a deep coordinate MLP?"
    anchors: ["online distillation", "fully fused CUDA kernels"]
    requires: ["2111.12077", "2201.05989", "2003.08934"]
    note: "Needs the premise of hierarchical sampling from NeRF (queries are the dominant cost, so spending fewer of them pays), Mip-NeRF 360's proposal-MLP scheme (worth it only when the radiance query is far more expensive than the proposal query), and Instant-NGP's per-query cost collapse via fused kernels and a tiny MLP, which shrinks the gap the distillation is monetising."
    hop_rationale: "Both papers sit under the same 'faster radiance fields' umbrella and each is one hop from NeRF, so any generic path connects them without saying anything. The question requires an economic argument about the ratio of proposal-query cost to radiance-query cost, which exists only by combining Mip-NeRF 360's motivation with Instant-NGP's stated per-query speedup; no edge in a citation-shaped graph carries a cost ratio."
  - id: samp-frustum-gaussian-under-contraction
    text: "Mip-NeRF encodes a conical frustum as a multivariate Gaussian whose spatial extent damps the encoding's high frequencies in proportion to that extent. Mip-NeRF 360 keeps this machinery but warps coordinates through a non-linear contraction, and MERF then swaps in a contraction chosen for cheap ray traversal. What happens to a frustum's Gaussian once its coordinates are contracted, and which of the two contractions is friendlier to a scale-aware encoding?"
    anchors: ["integrated positional encoding", "contraction function"]
    requires: ["2103.13415", "2111.12077", "2302.12249"]
    note: "The IPE construction is defined in unwarped space and its damping is keyed to world-space extent; a piecewise contraction that is near-linear in the near field and strongly compressive in the far field changes both the Gaussian's shape and the extent-to-frequency mapping. MERF's contraction is optimised for a different property (ray-box intersection), not for preserving that mapping."
    hop_rationale: "Mip-NeRF 360 is a direct descendant of Mip-NeRF and both are one hop from MERF via the unbounded-scene benchmark, so a two-hop path is guaranteed by lineage alone. But lineage does not tell you what a coordinate warp does to an encoding defined as an expectation over a spatial Gaussian; that requires the construction from one paper and the warp's piecewise behaviour from the other two, none of which is expressible as an edge between the anchors."
  - id: samp-aliasing-survives-baking
    text: "MERF claims its baking procedure is lossless — the parameterisation used during optimisation is the one used at render time — and that quality stays close to a fully trained Mip-NeRF 360. Mip-NeRF's argument is that a representation with no pixel-footprint input aliases when viewing scale changes. Which claim does baking actually preserve, and which anti-aliasing property is not carried into the baked grid-and-planes model?"
    anchors: ["lossless", "anti-aliasing"]
    requires: ["2302.12249", "2111.12077", "2103.13415"]
    note: "'Lossless' in MERF means no train/render parameterisation mismatch, not scale invariance; the baked representation is interpolated from a grid plus planes with no footprint input, so whatever anti-aliasing survives comes from the trained model's inherited Mip-NeRF-360 lineage rather than from anything the baked format computes at render time."
    hop_rationale: "'Anti-aliasing' and 'lossless' both attach to the radiance-field cluster and MERF cites Mip-NeRF 360 directly, so a short path is unavoidable. The question needs the reader to notice that MERF's word 'lossless' quantifies a different thing than Mip-NeRF's word 'aliasing' — a semantic mismatch between two claims, which is exactly what a path between the two anchors cannot express."
  - id: samp-oneblob-hybrid-encoding
    text: "Co-SLAM pairs a multi-resolution hash grid with a smooth one-blob coordinate encoding, arguing that purely parametric grids leave unobserved space noisy while the smooth branch encourages surface coherence. Read that against Instant-NGP's account of why hash collisions can be left to gradients and against Mip-NeRF's account of what a scale-aware encoding damps. Is Co-SLAM's smooth branch doing the same job as Mip-NeRF's damping, or a different one?"
    anchors: ["one-blob encoding", "hash collisions"]
    requires: ["2304.14377", "2201.05989", "2103.13415"]
    note: "Different jobs: Mip-NeRF damps frequency as a function of sample footprint to prevent scale-dependent aliasing in observed content; Co-SLAM's smooth encoding supplies an extrapolation prior for content never observed, a regime Instant-NGP's collision argument explicitly does not cover because it reasons about where visible content lands."
    hop_rationale: "Co-SLAM cites the hash grid directly, so 'one-blob encoding' and 'hash collisions' are one hop apart inside a single paper's method description. That proximity would exist for any question about Co-SLAM's encoding. Distinguishing an aliasing prior from a completion prior requires Mip-NeRF's separate account of what damping is for, which is two papers away and not on the short path."
  - id: samp-splat-footprint-vs-cone
    text: "3D Gaussian Splatting rasterises projected primitives in sorted tiles rather than sampling along rays, so nothing in the pipeline receives the pixel footprint that Mip-NeRF's cone supplies. Where in the splatting pipeline is a primitive's screen-space extent actually determined, and what does that imply for the resolution-change aliasing that Mip-NeRF's multiscale benchmark and Mip-NeRF 360's unbounded captures were built to expose?"
    anchors: ["visibility-aware tile rasteriser", "conical frustum"]
    requires: ["2308.04079", "2103.13415", "2111.12077"]
    note: "Genuinely about 3DGS's own rasteriser: extent comes from projecting each Gaussian's 3x3 covariance into screen space per view, so footprint is a property of the primitive and camera rather than of the pixel; the anti-aliasing question is then whether covariances learned at one training resolution remain correct at another, which the two Barron benchmarks were designed to surface."
    hop_rationale: "3DGS and Mip-NeRF are joined by the whole novel-view-synthesis cluster and by shared benchmarks, giving a two-hop path for free that carries no information. The answer requires locating the footprint decision inside the projection step of the rasteriser and contrasting it with an encoding that takes footprint as an input — a mechanism-level comparison, not an association."
  - id: samp-tile-sort-vs-ray-box
    text: "For real-time rendering of unbounded scenes MERF keeps ray traversal and designs its contraction so ray-box intersection stays cheap, while 3D Gaussian Splatting drops traversal entirely for a tile-based front-to-back sort of projected primitives. What does each pay in the far field of a 360-degree capture, and which of the two still needs an explicit structure for empty space?"
    anchors: ["ray-box intersection", "tile-based"]
    requires: ["2302.12249", "2308.04079", "2111.12077"]
    note: "About the rasteriser's own cost model: splatting's cost scales with projected primitives and sorting, so empty space costs nothing and no acceleration structure is needed, while MERF must skip empty space during traversal and therefore constrains its contraction; the far field of a Mip-NeRF-360-style capture stresses primitive count on one side and traversal length on the other."
    hop_rationale: "Both methods are labelled real-time unbounded rendering and both benchmark on the mipnerf360 suite, so a short path through that shared node exists for any pair of methods in this regime — precisely the false positive the controls are meant to catch. The question needs each system's rendering cost model and where empty space enters it, which appears only inside the respective method descriptions."
  - id: samp-densification-trigger-proxies
    text: "Adaptive Density Control fires on positional-gradient magnitude, which Rota Bulo et al. argue is a biased proxy for per-pixel reconstruction error. Mip-NeRF 360's proposal MLP allocates samples according to predicted mass along the ray, and Instant-NGP allocates capacity by fixed resolution levels with no per-scene allocation decision at all. Rank the three by how directly their signal tracks where the render is actually wrong."
    anchors: ["Adaptive Density Control", "proposal MLP"]
    requires: ["2404.06109", "2111.12077", "2201.05989"]
    note: "Three different signals: a gradient proxy corrected to per-pixel error by Rota Bulo et al.; a distilled estimate of where transmittance mass sits, supervised by the radiance MLP rather than by residual error; and a static multiresolution allocation that never adapts, relying on hash collisions plus gradients to sort out where capacity ends up."
    hop_rationale: "'Densification' and 'sampling' are both children of the generic 'where to spend capacity' notion, so an abstract path exists between any densifier and any sampler. Answering requires knowing what each signal is a proxy for — error, mass, or nothing — which is stated only inside the three method sections and cannot be recovered from adjacency."
  - id: samp-multiscale-benchmark-instrument
    text: "Mip-NeRF reports a 17% error reduction on the original NeRF synthetic dataset and 60% on the multiscale variant it introduces alongside it, and Mip-NeRF 360 likewise ships its own benchmark with its method. What does the gap between those two numbers say about what the original NeRF benchmark could not measure, and what regime does the mipnerf360 suite add on top of that?"
    anchors: ["multiscale", "mipnerf360"]
    requires: ["2103.13415", "2111.12077", "2003.08934"]
    note: "The original benchmark holds capture resolution fixed, so a scale-aware representation can only show a modest gain there; the multiscale variant varies it deliberately and the gain quadruples, which is the evidence that the earlier suite was blind to the failure. The mipnerf360 suite then varies depth range and camera orientation rather than resolution, exposing a different failure."
    hop_rationale: "Both anchors are dataset names in the same lineage, one hop apart via the Mip-NeRF -> Mip-NeRF 360 succession, and any question about either paper would traverse it. What is asked is what a benchmark can and cannot measure, inferred from the size of the gap between two reported numbers under the same method — a reading of the results paragraphs of two papers plus NeRF's original evaluation setup."
  - id: samp-supersampling-cost-argument
    text: "Mip-NeRF dismisses supersampling as impractical because each ray needs hundreds of MLP evaluations, and offers a closed-form encoding instead. Instant-NGP and Plenoxels then made a single query orders of magnitude cheaper. Does Mip-NeRF's case against supersampling survive that change, and which part of its argument is about cost while which part is about the representation itself?"
    anchors: ["supersampling", "multiresolution hash"]
    requires: ["2103.13415", "2201.05989", "2112.05131"]
    note: "The cost half of the argument weakens once a query is a hash lookup plus tiny MLP or a trilinear interpolation of voxel coefficients; the representational half does not, because supersampling still only approximates the footprint integral and leaves the underlying field with no notion of scale, which is what the multiscale result measures."
    hop_rationale: "Instant-NGP names Mip-NeRF as a speed baseline and Plenoxels sits in the same acceleration cluster, so the anchors are one to two hops apart regardless of the question. The value here is in testing whether an argument survives an assumption change, which requires the specific cost premise from one paper and the specific per-query speedup from two others; no path asserts that a premise was invalidated."
  - id: samp-where-parameters-live
    text: "Three efficiency claims sit side by side: Mip-NeRF is half the size because it merges two MLPs into one, Instant-NGP is fast because parameters move into a hash table read by a tiny network, and MERF's stated goal is memory consumption at render time. For each, say which resource the claim is about — trained parameter count, per-query compute, or resident memory while rendering — and which two of the three can be traded against each other."
    anchors: ["half the size", "memory consumption"]
    requires: ["2103.13415", "2201.05989", "2302.12249"]
    note: "Mip-NeRF's claim is parameter count (and a 7% speedup) from network merging; Instant-NGP trades parameter count upward (a large table) to buy per-query compute; MERF trades both to fit a render-time memory budget on consumer GPUs and in a browser. Recognising that the three words 'smaller' mean three different resources is the whole answer."
    hop_rationale: "All three papers are one hop from 'efficient radiance fields', so any two of these anchors are trivially connected — and a bare co-occurrence of efficiency claims is exactly the shared-infrastructure false positive to avoid. Distinguishing parameter count from per-query compute from resident memory requires reading what each paper's number is actually counting, which no edge label records."
  - id: samp-level-selection-vs-concatenation
    text: "Classical mipmapping selects a single level using the pixel footprint. Instant-NGP concatenates trilinearly interpolated features from all L levels and lets the network sort it out, K-Planes stacks spatial planes at several resolutions, and Mip-NeRF damps frequencies continuously by frustum extent. Which of these actually chooses a scale per sample, and which merely make several scales simultaneously available?"
    anchors: ["mipmapping", "trilinearly interpolated"]
    requires: ["2201.05989", "2103.13415", "2301.10241"]
    note: "Only Mip-NeRF conditions on the sample's own footprint; Instant-NGP and K-Planes offer a multiresolution basis with no footprint input, so scale mixing is learned from the training distribution rather than selected per query. Mip-NeRF invokes mipmapping by analogy but implements damping, not level selection."
    hop_rationale: "'Multiresolution' links all three papers in one hop, and that link is exactly the generic similarity that must not count as evidence — every multiscale representation touches it. The discriminating fact is whether the footprint is an input to the query, which is stated in each method description and is invisible from a path through a shared multiresolution concept."
  - id: samp-online-vs-bake-distillation
    text: "Two distillations run in opposite directions: Mip-NeRF 360 distils a large radiance MLP into a small proposal network during training, while PlenOctrees and MERF distil a trained model into an explicit structure after training. What is transferred in each case — where mass lies, or what the scene looks like — and why can MERF's baking not take over the proposal network's job?"
    anchors: ["online distillation", "baking"]
    requires: ["2111.12077", "2302.12249", "2103.14024"]
    note: "Online distillation transfers a sampling distribution and is consumed during optimisation to place samples; baking transfers appearance and density into a lookup structure and is consumed after training to remove the network from the render loop. Baking cannot substitute because it presupposes the trained field the proposal network was needed to obtain efficiently."
    hop_rationale: "'Distillation' is a single lexical hub joining both anchors in two hops, and the surface similarity of the word is what makes this question a trap rather than an easy one. Answering requires knowing what each procedure transfers and when in the pipeline it runs, which comes from Mip-NeRF 360's training description and from PlenOctrees'/MERF's post-training baking descriptions."
  - id: samp-sh-vs-tiny-decoder
    text: "PlenOctrees eliminates the view-direction input by baking spherical-harmonic coefficients into each voxel so that render time is a cheap direction-dependent dot product. MERF instead keeps a small MLP to decode view-dependent colour from its grid and plane features, as Instant-NGP keeps a tiny MLP after the hash lookup. Given that MERF's binding constraint is memory rather than per-sample compute, why is a shared decoder the cheaper choice for it?"
    anchors: ["spherical-harmonic", "tiny MLP"]
    requires: ["2302.12249", "2103.14024", "2201.05989"]
    note: "SH coefficients are stored per cell, so their cost scales with the number of occupied cells — bad under a memory budget — while a small decoder is a single shared parameter block amortised over the whole scene, paid in per-sample compute instead. Instant-NGP shows the same trade: a big feature table plus a tiny shared network."
    hop_rationale: "MERF cites PlenOctrees as its baking predecessor, so the anchors are one hop apart via that lineage and would be regardless of which appearance model each chose. The question is a cost-model comparison — per-cell storage versus shared parameters under a stated binding constraint — which requires MERF's memory framing, PlenOctrees' render-time argument, and Instant-NGP's table-plus-tiny-network split simultaneously."
  - id: samp-anneal-vs-ipe-damping
    text: "BARF masks the high-frequency bands of the sinusoidal positional encoding early in training and re-enables them later so that pose gradients stay smooth. Mip-NeRF damps those same bands per sample, in closed form, according to the frustum's spatial extent. Would Mip-NeRF's damping give BARF what its annealing schedule gives it, and what does Mip-NeRF 360's contraction do to a scheme whose damping is keyed to world-space extent?"
    anchors: ["coarse-to-fine annealing", "integrated positional encoding"]
    requires: ["2104.06405", "2103.13415", "2111.12077"]
    note: "No: BARF's schedule is a function of training time and is global, chosen to smooth the pose-gradient landscape early, whereas IPE's damping is a per-sample function of geometry that does not shrink as poses converge and is not under the optimiser's control. Mip-NeRF 360's contraction further changes world-space extent non-uniformly, so damping strength becomes depth-dependent."
    hop_rationale: "Both anchors attach to 'positional encoding' and both papers descend from NeRF, guaranteeing a two-hop path that would exist even if the two mechanisms had nothing in common beyond the word 'frequency'. The answer needs the variable each damping is a function of — training iteration versus sample footprint — and what a coordinate warp does to the latter; that is three method descriptions, not a path."
  - id: samp-ctl-zipnerf-multisampling
    text: "Zip-NeRF combines a multiresolution hash encoding with anti-aliasing. How many multisamples does it draw per conical frustum, and what downweighting rule does it apply to hash-grid features so that the result approximates Mip-NeRF's integrated positional encoding?"
    anchors: ["integrated positional encoding", "multiresolution hash"]
    control: true
    legacy_gameable: true
    requires: []
    note: "Zip-NeRF appears exactly once in the corpus, as a name in a list of later users of the mipnerf360 benchmark inside Mip-NeRF 360's prose; no corpus document describes its method. Both ingredients the question names are present (IPE in Mip-NeRF, the hash encoding in Instant-NGP), which makes the question sound answerable, but the multisample count and the feature-downweighting rule are properties of a paper that is not among the 50 and appear nowhere in any document."
    hop_rationale: "The two anchors are two hops apart via NeRF and via the shared unbounded-scene benchmark, so retrieval will happily return a confident-looking path between IPE and hash encodings. Any such path is spurious here: it connects the ingredients without touching the method that combines them, and no traversal length recovers content the corpus does not contain."
  - id: samp-ctl-hash-table-size-knee
    text: "At which hash-table size does Instant-NGP's reconstruction quality stop improving on outdoor 360-degree captures, and how much resident memory does MERF's sparse feature grid need to reach the same quality on those scenes?"
    anchors: ["multiresolution hash", "sparse feature grid"]
    control: true
    legacy_gameable: true
    requires: []
    note: "Both anchors are real corpus concepts in papers that are in the pool, but every document in this corpus is prose: there are no hyperparameter sweeps, no per-scene tables, and no memory measurements anywhere. Instant-NGP's table-size knee and any MERF megabyte figure are simply absent, so the comparison cannot be produced no matter how well the two papers are retrieved."
    hop_rationale: "Instant-NGP and MERF are one or two hops apart through the unbounded-scene and efficient-representation clusters, so a graph will return a strong, short, entirely genuine connection between the anchors — and it still yields nothing, because the missing content is numeric detail below the granularity of every document, not a missing link between them."
  - id: samp-ctl-antialiased-splatting-filter
    text: "Which 3D smoothing filter and screen-space dilation does the anti-aliased Gaussian-splatting variant apply so that densification stays stable when test images are rendered at a resolution different from the training images?"
    anchors: ["anti-aliasing", "densification"]
    control: true
    legacy_gameable: true
    requires: []
    note: "The corpus treats anti-aliasing only on the radiance-field side (Mip-NeRF, Mip-NeRF 360) and treats splatting densification only through 3DGS and Revising Densification, neither of which discusses resolution-change aliasing or any smoothing or dilation filter. Scale-aware splatting methods are not among the 50 papers, so the filter named in the question does not exist anywhere in the corpus."
    hop_rationale: "'Anti-aliasing' and 'densification' are each one hop from the novel-view-synthesis hub and both appear in papers that cite one another's lineage, so a short plausible path is guaranteed. That path is precisely the false positive to catch: co-occurrence of the two topics in one corpus is not the same as a document describing a method that joins them, and none does."

  # ---- expl ----
  - id: expl-sh-provenance-baked-vs-optimised
    text: "A spherical-harmonic appearance basis is used to encode view-dependent colour in a baked octree, in a network-free voxel grid, and in a splat rasteriser. For each, where do the coefficients actually come from, and what supplies their gradients once they exist?"
    anchors: ["spherical-harmonic expansion", "front-to-back alpha compositing"]
    requires: ["2103.14024", "2112.05131", "2312.02121"]
    note: "PlenOctrees supplies coefficients predicted by a retrained radiance head and then fine-tuned as octree leaves; Plenoxels supplies coefficients that are free variables optimised from scratch against the photometric loss with no network anywhere; gsplat supplies per-primitive coefficients whose forward evaluation and analytic gradients are documented as part of the rasteriser's backward pass. A correct answer must separate 'baked then refined', 'never networked', and 'hand-derived gradients in a kernel'."
    hop_rationale: "Both anchors hang off the generic 'view-dependent colour' hub that nearly every corpus paper touches (3DGS, MERF, MVSplat, Scaffold-GS), so a two-hop path SH -> colour -> compositing exists corpus-wide and would be found for any pair of radiance-field papers. That path says nothing about coefficient provenance, which is the entire question: the discriminating edges are 'MLP output pre-tabulated then leaves fine-tuned', 'coefficients as primal variables under explicit priors', and 'gradients written out per parameter in a kernel'."
  - id: expl-fixed-spherical-basis-vs-learned-color-basis
    text: "Two papers both remove nonlinearity from the appearance path: one factorises colour onto a fixed analytic angular basis, the other pairs a linear feature decoder with a basis learned from data. What does each buy, what does each cost, and what does the network-free voxel grid show about whether any decoder is needed at all?"
    anchors: ["closed-form spherical basis functions", "learned color basis"]
    requires: ["2103.14024", "2301.10241", "2112.05131"]
    note: "PlenOctrees needs a closed-form angular basis precisely because the representation must be tabulated per voxel with the direction input removed from the network; K-Planes' learned global colour basis is not angular at all, it is a shared appearance dictionary that makes a linear decoder competitive with an MLP; Plenoxels stores SH per voxel and has no decoder. The answer must note the fixed-basis choice is driven by bakeability, the learned-basis choice by interpretability/white-box regularisation."
    hop_rationale: "A short path exists through 'appearance decoder' or 'view-dependent colour', concepts shared by every radiance-field paper in the corpus, so proximity alone is uninformative. The question turns on a trade the hub cannot encode: a fixed analytic basis is a precondition for tabulating appearance without the network, while a learned basis is a precondition for the white-box claim, and both are contrasted against the case where no decoder exists at all."
  - id: expl-plenoxels-inherits-drops-octree-bake
    text: "When the octree method's successor removed the neural network entirely, which parts of the earlier pipeline survived unchanged and which stage disappeared? Be specific about what replaced the pre-tabulation step and what happened to the empty-space strategy."
    anchors: ["pre-tabulating", "trilinearly interpolating"]
    requires: ["2103.14024", "2112.05131"]
    note: "Survived: SH coefficients as the appearance carrier, direct optimisation of stored coefficients against the photometric loss, aggressive removal of empty space. Disappeared: training a NeRF at all, and therefore the pre-tabulation/bake stage; the octree traversal structure is replaced by a sparse voxel grid queried by trilinear interpolation, and the pruning happens after a few iterations of training rather than after a bake."
    hop_rationale: "These two papers share authors and an explicit predecessor/descendant citation, so a one-hop lineage edge almost certainly exists between them and any short path is guaranteed. But a lineage edge asserts only that one follows the other; it does not record which pipeline stage was deleted (the bake), which was preserved (coefficient fine-tuning under a photometric loss), and which was reimplemented differently (octree skipping versus prune-to-a-thin-shell). The question is answerable only from the stage-level detail in both texts."
  - id: expl-where-the-mlp-smoothness-prior-went
    text: "Removing the coordinate MLP from a radiance field removes an implicit smoothness prior along with it. What replaced that prior in the network-free voxel method, and how did the planar-factorisation method reuse the same tool per axis for a different purpose?"
    anchors: ["positional encoding", "total-variation"]
    requires: ["2112.05131", "2301.10241", "2003.08934"]
    note: "NeRF supplies the mechanism being removed: a sinusoidally positionally encoded MLP whose smoothness is implicit and never written down. Plenoxels states the substitution directly, replacing that implicit regularisation with explicit total-variation and sparsity priors on voxel values and dropping positional encoding entirely. K-Planes reuses TV but axis-selectively, as temporal smoothness on the time-involving planes, which is a different objective from the spatial denoising Plenoxels needs."
    hop_rationale: "Positional encoding and total variation would be linked through generic hubs such as 'NeRF', 'regularisation' or 'radiance field' that connect essentially the whole corpus, so a short path is expected regardless of the question. The claim being asked for is causal and directional: the prior did not merely coexist with the MLP, it was supplied by it, and the explicit methods had to re-state it by hand, with the later method applying it per dimension. No generic adjacency encodes that substitution."
  - id: expl-sparsity-versus-planar-factorisation-memory
    text: "Two different mechanisms shrink an explicit radiance field: pruning almost everything, and factorising the volume into planes. A later baking-oriented system uses both at once. Which mechanism does it assign to which job, and why is that split not the same as the one the planar method makes?"
    anchors: ["sparsity priors", "feature planes"]
    requires: ["2112.05131", "2301.10241", "2302.12249"]
    note: "MERF uses a coarse sparse grid with empty space pruned for near-surface volumetric content and high-resolution 2D feature planes to add detail at near-zero memory, explicitly framed as the TensoRF/K-Planes decomposition repurposed for low-memory baking rather than fast training or dimension scaling. Plenoxels' sparsity is a training-time prune to a thin shell; K-Planes' planes exist to make d-dimensional scaling and priors tractable, with the 1000x figure quoted against a dense 4D grid."
    hop_rationale: "Sparsity and factorisation both sit under an 'efficiency / memory' hub that touches most corpus papers, so a two-hop path is cheap and generic. The question requires the motive attached to each mechanism in each paper -- baking budget versus training speed versus dimensional scaling -- and the observation that the same factorisation appears with a different purpose. Motive is not recoverable from proximity."
  - id: expl-traversal-cost-octree-skip-vs-contraction
    text: "Real-time rendering of a baked field depends on cheap ray traversal. One method gets it from a hierarchical structure that skips empty space; a later unbounded-scene method had to constrain its coordinate contraction so traversal stayed cheap. What breaks if the contraction is chosen for reconstruction quality alone, and how does the thin-shell pruning approach relate to both?"
    anchors: ["sparse octree", "ray-box intersection"]
    requires: ["2103.14024", "2302.12249", "2112.05131"]
    note: "MERF states the constraint explicitly: unlike the Mip-NeRF 360 style parameterisation, its contraction is designed to preserve efficient ray-box intersection because fast traversal is a hard requirement for real-time rendering; a quality-first contraction warps the domain so box tests along the ray stop being cheap. PlenOctrees gets the same property structurally by skipping empty space in a sparse octree, and Plenoxels reaches it a third way by pruning to a thin shell of voxels around the surface."
    hop_rationale: "Both anchors are acceleration-structure vocabulary and would connect through a 'real-time rendering' hub shared by PlenOctrees, MERF, 3DGS and the SLAM papers, so a short path is nearly guaranteed and carries no information. The question is a constraint-propagation one: a design decision made for reconstruction quality (the contraction) can destroy a rendering-time requirement (cheap intersection tests), and the three papers each pick a different way to keep empty space from being traversed. That trade lives in the texts, not in the adjacency."
  - id: expl-ray-integral-versus-sorted-alpha-compositing
    text: "One family accumulates colour by evaluating an integral along a ray through an interpolated field; the other projects primitives and blends them in sorted order. What does each rule demand of the underlying representation, and at what point in each pipeline is the angular colour basis actually evaluated?"
    anchors: ["emission-absorption volume rendering integral", "tile-based rasterisation"]
    requires: ["2112.05131", "2312.02121", "2103.14024"]
    note: "Plenoxels and PlenOctrees need a structure that can be traversed and skipped, with density and SH colour fetched by interpolation or lookup at sample points along the ray, so the angular basis is evaluated per sample; gsplat needs projected footprints that can be sorted and composited front-to-back in tiles, so the SH evaluation happens once per primitive per view before compositing. The answer must state the representational demands (traversable/skippable versus projectable/sortable), not merely that both produce colour."
    hop_rationale: "Every NeRF-lineage paper mentions the volume rendering integral and every splatting paper mentions compositing, so a path through the 'volume rendering' hub joins the anchors for any pair drawn from those two families -- this is exactly the shared-infrastructure false positive. Answering needs the per-representation requirements each rule imposes and the differing position of the SH evaluation in the pipeline, which the hub edge does not carry."
  - id: expl-who-writes-the-backward-pass
    text: "Making a radiance field explicit moves the gradient work somewhere. In one case gradients for every primitive parameter are derived and documented by hand; in another the optimisation is direct because there is no deep network to differentiate through; in a third the authors emphasise that the whole thing runs in a framework with no custom kernels. What is the trade being made in each case?"
    anchors: ["backward pass", "pure PyTorch"]
    requires: ["2112.05131", "2312.02121", "2301.10241"]
    note: "gsplat exists because the gradients through opacity, colour, position, scale and rotation must be spelled out at kernel level for anyone reimplementing or extending splatting; Plenoxels emphasises that there is no autodiff through a deep network, the voxel coefficients are optimised directly; K-Planes emphasises fast optimisation in pure PyTorch with no custom CUDA. The synthesis is that explicitness relocates cost between hand-derived kernels and framework-differentiable formulations, and each paper picked a different side."
    hop_rationale: "'Backward pass' and 'pure PyTorch' both attach to a generic implementation hub that would join any two systems papers in the corpus, so a short path proves nothing. The question asks for a trade-off statement -- who pays for differentiability, the kernel author or the framework, and what each choice buys in speed and extensibility -- which requires the specific implementation claims of all three texts rather than their co-membership in an 'implementation' neighbourhood."
  - id: expl-plane-product-versus-hash-concatenation
    text: "One method fuses features sampled from several planes by multiplying them elementwise; another concatenates features fetched from many hash levels. What does each fusion rule imply about how much work the decoder must do, and how does the no-decoder voxel case bound the comparison?"
    anchors: ["element-wise multiplication", "multi-resolution hash table"]
    requires: ["2301.10241", "2112.05131", "2201.05989"]
    note: "K-Planes' multiplicative fusion plus a learned colour basis is what lets a linear decoder match a nonlinear MLP; Instant-NGP concatenates trilinearly interpolated features across geometrically spaced levels and hands the result to a tiny MLP that must disambiguate, among other things, hash collisions; Plenoxels is the limiting case where the interpolated values are already density and SH colour and there is no decoder at all. The answer must connect fusion rule to required decoder capacity."
    hop_rationale: "Both anchors are grid-feature-encoding vocabulary and would connect through a generic 'feature encoding' or 'explicit grid' hub that links Plenoxels, K-Planes, Instant-NGP, MERF, Co-SLAM and NICE-SLAM alike, so a short path is guaranteed for any pair of them. The discriminating content is the consequence for the decoder -- multiplicative fusion supporting a linear decoder versus concatenation requiring an MLP to resolve collisions -- which no adjacency between the encoding terms expresses."
  - id: expl-explicit-grids-need-explicit-priors
    text: "Explicit parametric fields behave badly where the data does not constrain them. Identify the same underlying weakness as it appears in a network-free voxel grid, in a planar factorisation with per-dimension penalties, and in a real-time SLAM system that deliberately adds a smooth coordinate encoding alongside its hash grid."
    anchors: ["one-blob encoding", "TV penalty"]
    requires: ["2112.05131", "2301.10241", "2304.14377"]
    note: "Co-SLAM adds a one-blob coordinate encoding specifically because purely parametric grids leave unobserved space noisy, and it needs surface coherence in regions the camera has not seen; Plenoxels says outright that the MLP's implicit regularisation must be replaced by explicit total-variation and sparsity priors; K-Planes turns the same tool into dimension-specific priors such as a TV penalty on time planes. The shared cause is that a local parametric parameter is only constrained where a ray touched it."
    hop_rationale: "The anchors come from different sub-fields (neural SLAM encodings and radiance-field regularisers) and any path between them would run through broad hubs like 'encoding', 'regularisation' or 'hash grid' that connect a third of the corpus, so distance here reflects vocabulary overlap rather than the relationship asked about. The question needs a shared-cause diagnosis -- locality of explicit parameters implies no free interpolation into unobserved space -- stated from three different papers' own justifications for adding a prior."
  - id: expl-was-the-mlp-capacity-or-smoothing
    text: "One result fine-tunes baked leaf values and ends up equal to or better than the network it was baked from; another trains equivalent stored values from scratch and matches the network's quality. Taken together, what do these two results imply about what the coordinate MLP was contributing?"
    anchors: ["octree leaf coefficients", "voxel coefficients"]
    requires: ["2103.14024", "2112.05131"]
    note: "PlenOctrees shows the baked representation is differentiable and that optimising leaf coefficients against the photometric loss typically improves on the source NeRF rather than merely matching it; Plenoxels shows the same class of stored coefficients reaches NeRF-level PSNR/SSIM/LPIPS with no network in the loop at all, provided explicit priors are added. The joint inference is that the MLP was contributing optimisation-time smoothing rather than representational capacity the stored field lacks."
    hop_rationale: "The two anchors are structurally parallel names for stored coefficients and both attach to 'photometric loss', so a short path through that shared loss term almost certainly exists -- and the same path exists between any two per-scene optimised methods in the corpus. What the question requires is an inference neither paper states alone: post-bake improvement plus from-scratch parity jointly implicate the network as a prior, not as capacity. Adjacency cannot supply a joint inference."
  - id: expl-affine-projection-versus-ray-splat-view-consistency
    text: "The screen-space projection used by splatting rests on an approximation of the perspective transform. Which downstream property does that approximation compromise, why is it tolerable for view synthesis but not for geometry, and how does a field queried by interpolation avoid the problem entirely?"
    anchors: ["local affine approximation", "ray-splat intersection"]
    requires: ["2312.02121", "2403.17888", "2112.05131"]
    note: "gsplat documents the local affine approximation of the perspective transform and the covariance propagation built on it; 2DGS replaces that screen-space approximation with explicit perspective-correct ray-splat intersection because a volumetric primitive's silhouette changes with viewpoint and the inferred surface is therefore not view-consistent; Plenoxels is the contrast case where density and colour are functions of a 3D location, so there is no view-dependent footprint to approximate in the first place."
    hop_rationale: "2DGS names and rejects the screen-space approximation directly, so a one-hop citation-style path between the anchors is likely and tells you only that one is an alternative to the other. The question needs the reason the approximation is acceptable for photometric novel-view quality yet fatal for view-consistent geometry, plus the observation that an interpolated field never has the problem -- neither of which is carried by the adjacency between the two projection techniques."
  - id: expl-sh-colour-path-versus-feature-channels
    text: "Rasterising arbitrary distilled channels through a splatting renderer is not the same as rasterising colour. Which assumptions of the documented angular-colour path fail for distilled channels, and which of those assumptions were inherited from the earlier decision to factorise appearance onto an angular basis?"
    anchors: ["spherical-harmonic colour evaluation", "feature distillation"]
    requires: ["2312.02121", "2103.14024", "2312.03203"]
    note: "gsplat documents SH colour evaluation, its gradients and its basis convention: appearance is low-dimensional, parameterised by viewing direction, and supervised at RGB resolution. Feature 3DGS reports that a naive port fails because foundation-model feature maps are coarser than RGB and their channel statistics differ, requiring separated colour and feature branches and an adapted loss. PlenOctrees supplies why the angular basis was adopted in the first place: to remove the direction input so appearance becomes tabulatable."
    hop_rationale: "Both anchors sit inside the Gaussian-rendering neighbourhood, where any two terms are within a hop or two of the 3DGS hub, so proximity is expected for any pair of splatting concepts. The answer requires naming which specific properties of the colour path (low channel count, direction parameterisation, RGB-resolution supervision) a distilled feature channel violates, and tracing the direction-parameterisation assumption back to the appearance factorisation that motivated it. That is a chain of assumptions, not a neighbourhood."
  - id: expl-per-primitive-covariance-versus-fixed-voxel-footprint
    text: "A splat carries its own anisotropic extent, while a voxel field has whatever footprint the grid spacing gives it. What does the per-primitive extent buy at a fixed primitive count, and what does the projection machinery required to render it cost that an interpolated grid never pays?"
    anchors: ["anisotropic covariance", "perspective transform"]
    requires: ["2308.04079", "2312.02121", "2112.05131"]
    note: "3DGS's own mechanism is at issue: the anisotropic covariance is what lets a single primitive adapt to local geometry, and it is optimised through scale and rotation rather than as a raw matrix. gsplat supplies the cost side -- projecting that covariance requires the local affine approximation of the perspective transform plus explicit gradients for scale and rotation. Plenoxels is the contrast: uniform grid footprint, trilinear interpolation, no projection approximation, and resolution bought only by more voxels or finer spacing."
    hop_rationale: "gsplat's projection section connects covariance and the perspective transform directly, so a one-hop path between the anchors is essentially certain and is pure shared infrastructure of the splatting pipeline. The question asks for a cross-representation trade: adaptive per-primitive resolution paid for with a projection approximation and hand-derived gradients, versus uniform resolution with no approximation. The comparison term is a paper the short path never touches."
  - id: expl-capacity-allocation-densify-prune-multiresolution
    text: "Three explicit representations decide differently where to spend parameters: one clones and splits primitives during training, one prunes almost everything early and keeps a thin shell, one pre-allocates a stack of resolutions. Compare the triggers, and say which of the three gives a user a direct handle on the speed/quality trade."
    anchors: ["densification and pruning schedule", "sparse 3D voxel grid"]
    requires: ["2308.04079", "2112.05131", "2301.10241"]
    note: "This targets 3DGS's own densification mechanism: an interleaved clone/split/prune schedule run alongside optimisation and driven by the optimiser's own signals, whose primitive count is emergent. Plenoxels prunes empty space aggressively after a few iterations, so capacity is fixed early by occupancy rather than by error. K-Planes allocates a multi-resolution stack of spatial planes up front, so capacity is a hyperparameter of the factorisation and the memory figure is quoted against a dense grid."
    hop_rationale: "All three anchors' neighbourhoods are joined by generic 'explicit representation' and 'efficiency' hubs, so any pair here is a couple of hops apart no matter the question. What must be recovered is the trigger for each allocation decision and its consequence -- emergent primitive counts versus occupancy-driven early pruning versus a pre-declared resolution stack -- and which of those exposes a knob rather than an outcome. A generic path expresses none of that."
  - id: expl-multi-resolution-is-not-anti-aliasing
    text: "Several methods advertise multi-resolution structure, but only some of them address what happens when training and test views observe the scene at different scales. Distinguish the multi-resolution that buys detail from the multi-resolution that buys scale-awareness, and say what an explicit plane or voxel field would have to add to obtain the latter."
    anchors: ["integrated positional encoding", "multi-resolution stack of spatial planes"]
    requires: ["2301.10241", "2103.13415", "2201.05989"]
    note: "Mip-NeRF's integrated positional encoding is an expectation of the encoding over a conical frustum, so features are damped in proportion to the pixel footprint -- scale-awareness derived from the rendering geometry. K-Planes' multi-resolution stack of spatial planes and Plenoxels' grid resolution are capacity constructs with no notion of pixel footprint. A correct answer must say the explicit field would need its interpolation kernel to depend on the ray's footprint, not merely more levels."
    hop_rationale: "'Multi-resolution' is precisely the shared vocabulary that makes a short generic path appear between these anchors -- Instant-NGP, K-Planes, NICE-SLAM, Mip-NeRF and MERF are all reachable through it -- and that path is the false positive this question exists to defeat. Being nearby in a multi-scale neighbourhood is not evidence that a method is anti-aliased; the distinction requires the mechanism (integration over a frustum versus a stack of grids) from the papers themselves."
  - id: expl-time-planes-versus-deformation-grid
    text: "Two systems factorise a 4D problem with planes but apply the factorisation to different objects: one to the radiance field itself, one to a field that deforms primitives over time. What does the second one's decoder have to output for rendering to work, and which constraint does that impose that the first never faces?"
    anchors: ["HexPlane", "d choose 2 planes"]
    requires: ["2301.10241", "2312.02121", "2310.08528"]
    note: "K-Planes puts time into the representation directly with xt, yt and zt planes and decodes features to density and colour. 4D-GS factorises a deformation field in HexPlane style and its lightweight MLP must emit per-Gaussian deformations of position, rotation and scale. gsplat supplies why that matters: those are exactly the primitive parameters the rasteriser differentiates, so the deformation output must be differentiable splat parameters, and the canonical Gaussians remain shared across time."
    hop_rationale: "HexPlane-style and d-choose-2 factorisations are the same family and are frequently described in the same breath, so a one- or two-hop path between the anchors is close to certain -- and it establishes only family resemblance. The question asks what the factorisation is applied to and what that entails downstream: deforming primitives constrains the decoder's output space to renderable, differentiable splat parameters, a constraint absent when the planes are the field. Family resemblance carries no such entailment."
  - id: expl-time-planes-versus-4d-slicing-appearing-content
    text: "Content that appears or disappears mid-sequence is the hard case for dynamic reconstruction. Contrast how a time-plane factorisation and a 4D-primitive-plus-slicing formulation each represent such content, and state what each pays for that ability."
    anchors: ["temporal slicing", "time-involving planes"]
    requires: ["2301.10241", "2402.03307"]
    note: "4D-Rotor rejects the canonical-plus-deformation factorisation because a deformation network's smoothness assumption is violated by abrupt motion and appearing/disappearing content; it instead gives each primitive a temporal extent and slices the 4D field at render time, producing effective 3D Gaussians for the standard rasteriser (the pipeline gsplat documents), at the cost of a 4D orientation parameterisation. K-Planes represents time as features on the time-involving planes, initialised to identity so only genuinely time-varying content is modelled there, paying in shared plane capacity rather than per-primitive extent."
    hop_rationale: "Both anchors sit in the dynamic/4D neighbourhood where 4D-GS, 4D-Rotor, K-Planes, Nerfies and HyperNeRF are mutually a couple of hops apart via 'dynamic scene' and 'deformation field', so a short path is guaranteed by topic membership alone. The question needs behaviour at a specific failure case -- discontinuous appearance -- and the resource each design spends to handle it, which topic co-membership does not encode."
  - id: expl-direction-removed-then-put-back
    text: "One method deliberately removed the viewing direction from the network so appearance could be tabulated; a later structured-primitive method reintroduces a shared network that consumes the viewing direction at render time. What changed in the objectives between those two decisions, and what does the angular-coefficient route cost that the view-conditioned route avoids?"
    anchors: ["SH coefficients", "neural Gaussians"]
    requires: ["2103.14024", "2312.02121", "2312.00109"]
    note: "PlenOctrees removes the direction input precisely so that a fixed set of SH coefficients per voxel can be stored and looked up, which is what makes real-time and in-browser rendering possible. Scaffold-GS goes the other way: anchors own neural Gaussians whose attributes are predicted on the fly by a shared MLP fed the viewing direction and camera distance, which handles view-dependent appearance with far fewer primitives. gsplat documents the coefficient-storage route's per-primitive SH cost and gradients, which is what the anchor-based route trades away."
    hop_rationale: "SH coefficients and neural Gaussians are both attached to the 'Gaussian appearance' hub, so a short path exists between them and between almost any pair of appearance terms in the splatting literature. The question asks about a reversal of design intent across time -- bakeability motivating a stored angular basis, then primitive-count and view-adaptivity motivating a view-conditioned network -- plus the per-primitive storage cost that motivates the reversal. Directionality of intent is not something a proximity path can assert."
  - id: expl-train-time-versus-render-time-speedup-accounting
    text: "Two explicit methods both claim large speedups over the same coordinate-MLP baseline, but they are not measuring the same thing. Separate the render-time claim from the training-time claim in each, and say which baseline number each is actually being compared against."
    anchors: ["octree optimization", "two orders of magnitude faster"]
    requires: ["2103.14024", "2112.05131", "2003.08934"]
    note: "PlenOctrees' headline is a rendering claim -- pre-tabulation into an octree gives 800x800 frames at over 150 FPS, thousands of times faster than NeRF inference -- while its training claim is secondary: the octree optimisation step means full NeRF convergence is no longer required before baking. Plenoxels' headline is a training claim, roughly 11 minutes per scene versus 1-2 days for NeRF, two orders of magnitude, at matched PSNR/SSIM/LPIPS. NeRF supplies the common baseline: days of training and slow ray-marched inference."
    hop_rationale: "Every fast-radiance-field paper is a hop from NeRF and from a generic 'speed' hub, so the anchors are trivially connected and that connection would be found for any efficiency question in the corpus -- 'both are faster than NeRF' is exactly the shared-infrastructure trap. The question demands separating two different denominators (render throughput versus optimisation wall-clock) and attributing each to the mechanism responsible, which requires the papers' own accounting rather than their shared ancestry."
  - id: expl-control-sh-degree-truncation-curve
    text: "For the octree-baked radiance representation, how many spherical-harmonic bands are retained per leaf, and how does reconstruction quality fall off as the stored coefficients are truncated to shrink the payload for in-browser delivery?"
    anchors: ["SH coefficients", "in-browser rendering"]
    control: true
    legacy_gameable: true
    requires: []
    note: "Unanswerable from the corpus. The corpus records that the method stores a fixed set of SH coefficients per voxel and that the representation is amenable to in-browser rendering, but it never states the SH degree or band count, never gives a per-leaf coefficient budget, and contains no truncation ablation or quality-versus-coefficient-count curve. No other corpus document supplies SH degrees either -- the splatting papers and the gsplat supplement mention SH colour and basis conventions without any degree, byte budget, or truncation study -- so the numeric answer exists nowhere in the 50 documents, while both anchors do occur."
    hop_rationale: "Control: the two anchors are one hop apart inside a single document, so any retriever will connect them confidently and surface that document, which is exactly the trap. Short distance here is evidence only of co-mention of SH storage and browser delivery; it is not evidence that a band count or a truncation curve exists anywhere, and no gold set can be assigned."
  - id: expl-control-matched-memory-psnr-crossover
    text: "At a matched memory budget, where does the sparse-voxel representation overtake the planar-factorised one in PSNR, and how large is the gap at the budget where the planar method reports its 1000x compression?"
    anchors: ["sparse 3D voxel grid", "1000x compression"]
    control: true
    legacy_gameable: true
    requires: []
    note: "Unanswerable from the corpus. Both anchors occur -- the voxel method is described as a sparse 3D voxel grid and the planar method quotes 1000x compression against a dense 4D grid -- but the corpus contains no per-method metric tables at all, only qualitative parity claims against NeRF. The two methods are never evaluated against each other, never at a controlled memory budget, and no corpus document reports a memory-versus-PSNR curve for either, so no crossover point or gap magnitude can be derived."
    hop_rationale: "Control: these two explicit-representation papers share authors, a lineage edge and a metrics list, so the anchors will sit a hop or two apart and a graph will look highly confident. That closeness reflects shared infrastructure -- both report PSNR, both are explicit fields -- and not the existence of the controlled comparison being requested, which is the precise false positive this control is meant to catch."
  - id: expl-control-degenerate-gaussian-numerics
    text: "In the documented backward pass of the splatting library, what numerical safeguards are applied when a primitive's anisotropic covariance degenerates toward zero scale, and at what threshold are the resulting gradients clamped?"
    anchors: ["backward pass", "anisotropic covariance"]
    control: true
    legacy_gameable: true
    requires: []
    note: "Unanswerable from the corpus. The corpus states which quantities the forward and backward passes cover -- opacity, colour, position, scale, rotation, SH colour, covariance propagation through the projection -- but records no numerical-stability handling: no epsilon clamping, no degenerate-scale guard, no gradient threshold. No other corpus document specifies kernel-level numerical safeguards for splatting either, so the specific safeguard and threshold asked for appear in none of the 50 documents, while both anchors are common corpus vocabulary."
    hop_rationale: "Control: covariance and the backward pass are adjacent within the splatting-mathematics document and across every 3DGS-family paper, so the path is as short as it gets. Proximity here certifies only that the library differentiates covariance parameters; the question asks for implementation-level guards and a numeric threshold that no document records, so a confident short-path retrieval would be a pure false positive."

  # ---- sdf ----
  - id: sdf-eikonal-metric-precondition
    text: "VolSDF defines volume density as the Laplace CDF applied to the negative SDF, with a bandwidth that sets how thick the density shell around the surface is. Why does that construction only mean what it claims if the network's gradient has unit norm everywhere, which earlier objective supplies that guarantee, and does NeuS's opacity construction rest on the same precondition?"
    anchors: ["cumulative distribution function", "Eikonal"]
    requires: ["2106.12052", "2002.10099", "2106.10689"]
    note: "VolSDF supplies the Laplace-CDF density, the bandwidth, and the explicit statement that it uses IGR's Eikonal loss to keep the SDF metric; IGR supplies what the Eikonal term actually enforces (unit-norm gradient in ambient space) and why; NeuS supplies its own logistic-CDF opacity, which is likewise a function of an SDF and so inherits the same requirement that the field be a true distance."
    hop_rationale: "IGR is a direct, named ancestor of VolSDF, so a citation-style graph gives a one-hop Eikonal->VolSDF path for free; that edge is evidence of influence, not of the specific claim asked about — that the bandwidth is only interpretable in world units because |grad f| = 1, and that a non-metric field would silently rescale the shell. The path also says nothing about whether NeuS's differently-constructed opacity shares the precondition, which is the second half of the question."
  - id: sdf-occupancy-to-sdf-swap
    text: "UNISURF parameterises geometry as an occupancy field, while NeuS and VolSDF substitute a signed distance function. Beyond making mesh extraction easier, what does the SDF give the renderer itself that an occupancy probability cannot, and what formal analysis did that substitution make possible in each of the two successors?"
    anchors: ["occupancy field", "signed distance"]
    requires: ["2104.10078", "2106.10689", "2106.12052"]
    note: "UNISURF states the occupancy formulation and that its successors swapped in an SDF and refined the bias analysis; NeuS states what the SDF enables — a bias analysis of the rendered surface location and an unbiased opacity; VolSDF states the other consequence — density as an explicit function of the signed distance, which yields the opacity error bound and the sampler."
    hop_rationale: "All three papers sit in one tight cluster and share the anchors' vocabulary, so 'occupancy field' and 'signed distance' are two hops apart through any shared node like volume rendering or DTU. A short path via that shared infrastructure is exactly the false positive here: it does not encode that the SDF's signed magnitude is what makes an analytic statement about surface location possible, which occupancy — a probability with no metric meaning off the boundary — cannot support."
  - id: sdf-bias-vs-error-bound
    text: "NeuS argues its opacity is unbiased to first order; VolSDF instead derives a bound on the opacity approximation error along the ray. These are different formal guarantees about the same rendering integral. What does each one actually control, which one constrains the sampler rather than the surface location, and what does neither of them claim?"
    anchors: ["unbiased", "opacity approximation error"]
    requires: ["2106.10689", "2106.12052"]
    note: "NeuS supplies the bias notion — the recovered zero level set drifting from where the photometric residual is minimised — and the first-order unbiasedness claim; VolSDF supplies the error bound expressed in terms of bandwidth and its use to drive sampling; UNISURF supplies the origin of the bias question and the statement that both successors refine it."
    hop_rationale: "NeuS and VolSDF were published days apart on the same problem, so any co-citation or same-topic edge links the anchors in one or two hops without distinguishing the guarantees. The question turns on the fact that a first-order bias statement is about where the surface lands while an opacity bound is about how badly the discretised integral can be wrong — two claims a proximity path treats as interchangeable."
  - id: sdf-anneal-vs-bandwidth
    text: "UNISURF anneals its renderer during training so that early iterations behave like soft volume rendering and later ones collapse to surface rendering, whereas VolSDF stays a volume renderer and controls sharpness through a learned bandwidth parameter. Both tighten opacity around the surface; what does each buy, and why does one of them still need an explicitly soft early phase while the other does not?"
    anchors: ["surface rendering", "bandwidth parameter"]
    requires: ["2104.10078", "2106.12052"]
    note: "UNISURF describes the schedule and its purpose — gradients flowing along whole rays so bad initialisations recover — and the later collapse to crisp mask-free surfaces; VolSDF describes the Laplace bandwidth that concentrates density in a thin shell; NeuS supplies the third position, a fixed-form logistic opacity whose sharpness is likewise learned rather than scheduled."
    hop_rationale: "UNISURF is cited by both successors, so 'surface rendering' reaches 'bandwidth parameter' quickly through the shared surface-from-volume topic node. Proximity cannot say which of the two mechanisms is a training schedule imposed from outside the model and which is a parameter the loss itself optimises, and it is precisely that difference — schedule versus learned scale — the question asks about."
  - id: sdf-sampling-lineage
    text: "NeRF places samples with hierarchical coarse-to-fine sampling driven by a coarse network's guess about where mass lies. UNISURF and VolSDF both replace that with a geometry-driven sampler. How do the two replacements differ in what justifies sample placement — an empirical estimate of where the surface is versus a quantity that can be bounded — and which one still degrades if the geometry estimate is wrong early in training?"
    anchors: ["hierarchical coarse-to-fine sampling", "opacity approximation error"]
    requires: ["2003.08934", "2104.10078", "2106.12052"]
    note: "NeRF supplies the coarse/fine importance-sampling baseline; UNISURF supplies sampling concentrated around the learned occupancy boundary once the model knows where the surface is; VolSDF supplies the error-bounded sampler justified by the opacity-approximation bound in terms of the bandwidth."
    hop_rationale: "NeRF is the common ancestor of both surface papers, so the anchors are two hops apart through it in any citation-shaped graph and both papers literally contain the word sampling. That generic adjacency is the trap: the question needs the distinction between a heuristic that assumes the geometry estimate is already good and a sampler whose placement follows from a proven bound, which no path length can express."
  - id: sdf-mask-free-two-routes
    text: "IDR reconstructs clean geometry but needs per-pixel object masks. UNISURF, NeuS, and VolSDF each drop that requirement. For each of the three, what concretely takes the mask's place — what supplies the inside/outside or foreground signal that the mask used to supply — and which of the three still reports matching rather than beating IDR?"
    anchors: ["per-pixel object masks", "IDR"]
    requires: ["2104.10078", "2106.10689", "2106.12052"]
    note: "UNISURF replaces the mask by letting soft volume rendering distribute opacity along whole rays before sharpening, and reports parity with IDR without masks; NeuS replaces it with an unbiased SDF-driven opacity and reports beating both UNISURF and IDR on thin structures; VolSDF reports outperforming IDR, which it notes requires masks, using the Laplace-CDF density."
    hop_rationale: "IDR is named in all three required papers, so 'IDR' and 'per-pixel object masks' are one hop apart by co-occurrence alone. Co-occurrence of a baseline name with the word masks is shared background, not an answer: the question asks what mechanism in each paper substitutes for the mask signal, and the three mechanisms differ even though the citation pattern is identical."
  - id: sdf-supervision-swap-points-to-pixels
    text: "IGR fits an SDF to raw point clouds using a zero-set term plus an Eikonal term. NeuS and VolSDF have no points at all, only pixels and a photometric residual. Which half of IGR's objective survived unchanged into the volume-rendering methods, which half had to be replaced, and what replaced it?"
    anchors: ["point clouds", "photometric residual"]
    requires: ["2002.10099", "2106.10689", "2106.12052"]
    note: "IGR supplies the two-term objective and the role of each term; NeuS supplies the photometric residual as the sole geometry signal and the bias between it and the zero level set; VolSDF states outright that it retains the Eikonal loss to keep the SDF metric while geometry supervision comes from rendering."
    hop_rationale: "IGR is the acknowledged ancestor of both, so a short path exists by construction. But the question is a decomposition — the Eikonal half transfers verbatim while the zero-set data term has no analogue once there are no points, and the rendering loss constrains geometry only indirectly through opacity. An ancestry edge asserts inheritance without saying which term was inherited, which is the entire content here."
  - id: sdf-monosdf-normal-prior
    text: "MonoSDF supervises the analytic gradient of its SDF with a monocular surface-normal predictor. What property of the field makes that gradient a usable surface normal in the first place, which paper's loss enforces it, and what happens to the normal supervision if that property is only weakly enforced?"
    anchors: ["rendered surface normal", "Eikonal"]
    requires: ["2206.00665", "2002.10099"]
    note: "MonoSDF supplies the normal loss matched against the analytic SDF gradient; IGR supplies the Eikonal regulariser that makes the gradient unit-norm and hence a normal rather than an arbitrary direction with arbitrary magnitude; VolSDF supplies the intermediate step in which an SDF backbone keeps the Eikonal loss inside a volume-rendering pipeline."
    hop_rationale: "MonoSDF is a direct descendant of the SDF line and names its ancestors, so 'analytic gradient' and 'Eikonal' connect in one or two hops through the SDF concept node. That path is compatible with a purely nominal inheritance; the question requires the causal chain — no unit-norm constraint, no meaningful normal, and a normal-matching loss that would then be fighting the field's scale rather than its orientation."
  - id: sdf-monosdf-diagnosis
    text: "NeuS attributes its improvement to an opacity that is unbiased to first order. MonoSDF later argues that at room scale the binding failure is elsewhere. What does MonoSDF claim the photometric objective of NeuS and VolSDF simply cannot see, why does an unbiased opacity not fix it, and what does MonoSDF add instead?"
    anchors: ["unbiased", "monocular geometric cues"]
    requires: ["2106.10689", "2206.00665", "2106.12052"]
    note: "NeuS supplies the unbiasedness claim and the object-scale benchmarks it was validated on; MonoSDF supplies the diagnosis that the RGB loss is too weak in textureless or low-overlap regions and the two monocular cues that densify supervision; VolSDF supplies the second method sharing the same photometric-only assumption that MonoSDF says breaks."
    hop_rationale: "A retriever can link the anchors through the SDF-reconstruction topic in two hops because MonoSDF names NeuS and VolSDF in its opening sentence. But naming them as predecessors is not the same as the claim asked for: that correcting a rendering-integral bias and adding an external prior address disjoint failure modes, so one cannot substitute for the other no matter how short the path between them."
  - id: sdf-2dgs-normals-for-free
    text: "2DGS has to add an explicit normal consistency regulariser tying its disks' normals to the gradient of the rendered depth map. The SDF line obtains consistent normals without any such term. Where do those normals come from, what has to be regularised instead to keep them valid, and why is the 2DGS term needed only in the primitive-based representation?"
    anchors: ["normal consistency", "Eikonal"]
    requires: ["2403.17888", "2002.10099", "2106.12052"]
    note: "2DGS supplies the normal consistency and depth distortion regularisers and the reason they are needed — independent primitives with no shared field to differentiate; IGR supplies the Eikonal constraint that makes the SDF gradient a normal by construction; VolSDF supplies the statement that an SDF backbone yields smooth surfaces with usable normals inside a volume renderer."
    hop_rationale: "Both anchors are regularisation terms in surface-oriented reconstruction papers, so a generic path through 'surface normal' or 'regulariser' is short and says nothing. The question is about a representational asymmetry — one field differentiates to a normal everywhere, a cloud of independent disks has no field to differentiate — and short co-topic paths connect the two terms precisely because they look interchangeable at that level."
  - id: sdf-level-set-vs-poisson
    text: "SuGaR argues Marching Cubes cannot be applied to a Gaussian field because Gaussians define no level set, and runs Poisson reconstruction on oriented Gaussian centres instead. What does Poisson reconstruction require as input that Marching Cubes over a neural SDF does not, and which IGR input regime is the closest analogue of that requirement?"
    anchors: ["Marching Cubes", "unoriented points"]
    requires: ["2311.12775", "2002.10099", "2106.10689"]
    note: "SuGaR supplies the no-level-set argument, the Poisson step, and its reliance on oriented centres; IGR supplies the contrast that its objective fits surfaces from oriented and unoriented points alike, with normals optional in the zero-set term; NeuS supplies the SDF whose zero level set makes Marching Cubes the default extraction route."
    hop_rationale: "Mesh extraction is a shared topic across the whole reconstruction corpus, so 'Marching Cubes' and 'unoriented points' link quickly through a surface-reconstruction hub. Hub proximity cannot express the actual dependency: Poisson consumes oriented samples and fails without orientation, whereas a level-set extractor consumes a scalar field and derives orientation from it — which is why the IGR unoriented setting is the interesting comparison rather than a coincidental one."
  - id: sdf-disentangle-shape-appearance
    text: "In NeRF the volume density is produced by an MLP head sitting beside the radiance output; in VolSDF it is derived from the SDF. VolSDF claims this buys unsupervised disentanglement of shape and appearance, so scenes can be recombined. Why does NeRF's parameterisation block that, and does NeuS's opacity construction obtain the same property or only a superficially similar one?"
    anchors: ["shape and appearance", "volume density"]
    requires: ["2106.12052", "2003.08934", "2106.10689"]
    note: "NeRF supplies the joint 5D MLP that emits density and view-dependent radiance from the same trunk; VolSDF supplies the inversion — density as a function of geometry rather than geometry read off an arbitrary level set of density — and the shape/appearance swapping it enables; NeuS supplies the parallel case of an SDF-driven opacity with a separate radiance branch."
    hop_rationale: "NeRF is the ancestor of every method here and 'volume density' occurs in most of them, so the anchors are one hop apart through NeRF itself. Ancestry is not the claim: the question turns on which module owns geometry in each parameterisation, and a short NeRF-to-VolSDF path is equally consistent with VolSDF merely reusing NeRF's rendering equation, which is the reading the question is designed to exclude."
  - id: sdf-degenerate-vs-local-minima
    text: "IGR's stated danger is a degenerate zero-loss solution; UNISURF's is an initialisation the optimiser cannot escape; NeuS's is the local minima that trap mask-based surface rendering. Which of these three is a defect of the objective and which of the rendering model, and where do the fixes end up doing the same job?"
    anchors: ["Eikonal regularizer", "local minima"]
    requires: ["2002.10099", "2104.10078", "2106.10689"]
    note: "IGR supplies the degenerate solution — a network vanishing outside the point cloud's support — and the Eikonal term that makes the loss non-zero almost everywhere; UNISURF supplies the soft early phase that lets gradients flow through whole rays so bad initialisations recover; NeuS supplies the local-minima charge against DVR/IDR-style surface rendering and the volume-rendering inheritance that avoids it."
    hop_rationale: "Optimisation pathologies are discussed in all three papers, so any path through 'optimisation' or 'loss' is short and generic. The question needs the three failures separated by where they live — a loss with a spurious global optimum, a renderer with vanishing off-surface gradients, and a renderer whose gradients exist only at the current surface intersection — a distinction that a shared-topic hop actively obscures by making them look like one problem."
  - id: sdf-labels-then-and-now
    text: "IGR's selling point was removing the inside/outside labels that Occupancy-Networks-style training needed. A year later UNISURF reintroduced a binary inside/outside field. What supplies its supervision so that no labels are needed after all, and what reason did NeuS and VolSDF then have for reverting to a signed distance function?"
    anchors: ["inside/outside labels", "occupancy field"]
    requires: ["2002.10099", "2104.10078", "2106.12052", "2106.10689"]
    note: "IGR supplies the comparison against Occupancy Networks needing explicit inside/outside labels and DeepSDF needing precomputed SDF samples; UNISURF supplies the occupancy field relaxed to a probability and trained purely from multi-view images without masks; VolSDF supplies the reason for going back to an SDF — density as a function of geometry, an opacity error bound, and usable normals."
    hop_rationale: "Occupancy is the literal subject of both anchors, so a lexical or topical path between them is trivially short. That short path suggests continuity when the actual history is a reversal followed by a second reversal, each for a different reason: labels were removed by changing the data term, occupancy returned because images supply the signal, and it left again because a probability carries no metric structure to bound or to differentiate."
  - id: sdf-hash-grid-vs-smooth-sdf
    text: "MonoSDF compares monolithic MLP, single-resolution voxel-grid, and hash-grid backbones for the same SDF pipeline and finds the hash grid gives the best speed-quality trade-off. Given that the field still has to remain a valid distance function, which regulariser from the earlier SDF line is holding it together across those backbones, and what does MonoSDF's normal loss add on top of it that the regulariser alone cannot?"
    anchors: ["hash grid", "Eikonal"]
    requires: ["2206.00665", "2002.10099"]
    note: "MonoSDF supplies the backbone study and the two monocular losses; IGR supplies the Eikonal constraint that any SDF backbone must satisfy regardless of encoder; VolSDF supplies the precedent of carrying that constraint into a volume-rendering SDF pipeline whose density depends on the field being metric."
    hop_rationale: "MonoSDF names both the hash grid and its SDF ancestry, so the anchors co-occur within two hops through MonoSDF alone. Co-occurrence does not carry the point at issue — that the Eikonal term is a property requirement on the field rather than on the architecture, so swapping encoders changes speed and smoothness priors but not the constraint, while the normal loss supplies orientation information the constraint deliberately says nothing about."
  - id: sdf-thin-structures-bias
    text: "NeuS singles out thin structures and self-occlusion as the regime where prior methods break, and separately argues that naive SDF-to-density conversion misplaces the surface by a first-order bias. How does NeuS tie those two claims together, and what does UNISURF's occupancy sharpening do in the same thin-structure case?"
    anchors: ["thin structures", "occupancy field"]
    requires: ["2106.10689", "2104.10078"]
    note: "NeuS supplies both the bias argument — the recovered zero level set drifting from the photometric optimum — and the empirical claim of sharper, more complete reconstructions on thin structures and self-occlusion versus UNISURF and IDR; UNISURF supplies the occupancy sharpening and boundary-concentrated sampling; VolSDF supplies the competing shell-thickness control through bandwidth."
    hop_rationale: "NeuS explicitly compares against UNISURF, so the anchors are one hop apart through that comparison edge. A comparison edge only records that one outperformed the other; the question asks why a location error of fixed magnitude is fatal when the structure's own thickness is of that order, and how sharpening opacity around a boundary interacts with the same geometry — neither of which a beats-baseline relation encodes."
  - id: sdf-slam-picks-a-side
    text: "Co-SLAM's shallow decoder predicts signed distance and colour from its hybrid encoding rather than the occupancy that earlier neural SLAM systems decoded — the same choice UNISURF and then NeuS/VolSDF argued over offline. Which of the offline arguments for the SDF carry over when the input is incremental RGB-D with real depth, and which of them lose their force?"
    anchors: ["signed distance", "occupancy field"]
    requires: ["2304.14377", "2112.12130", "2104.10078", "2106.10689"]
    note: "Co-SLAM supplies the SDF-decoding design, the hybrid hash plus one-blob encoding, and the surface-coherence concern in unobserved regions; UNISURF supplies the occupancy formulation and its rationale; NeuS supplies the SDF rationale rooted in unbiased volume rendering of photometric residuals, which is exactly the part that weakens once a depth sensor supplies geometry directly."
    hop_rationale: "Neural SLAM and neural implicit surfaces share the representation vocabulary, so 'signed distance' and 'occupancy field' are close through any representation hub. Hub proximity is what makes this question hard rather than easy: the answer must separate arguments that are about the rendering integral, which a depth sensor partly moots, from arguments about the field itself — metric structure, gradients, surface completion in unobserved space — which survive the change of setting."
  - id: sdf-shape-radiance-ambiguity
    text: "Mip-NeRF 360 attacks floaters and shape-radiance ambiguities with a distortion-based regulariser applied to an otherwise free density field. VolSDF instead removes the freedom by making density a function of the signed distance. What does the SDF construction structurally rule out that the distortion term can only penalise, and what ambiguity does it fail to remove even so?"
    anchors: ["shape-radiance ambiguities", "cumulative distribution function"]
    requires: ["2111.12077", "2106.12052", "2106.10689"]
    note: "Mip-NeRF 360 supplies the ambiguity and floater diagnosis in unbounded scenes and its regularisation-by-penalty response; VolSDF supplies the Laplace-CDF density that forces mass into a thin shell around a single level set, plus the disentanglement claim; NeuS supplies the reminder that even a well-formed SDF renderer can put the surface in the wrong place if the opacity is biased."
    hop_rationale: "Both papers are radiance-field descendants of NeRF and both discuss density along a ray, so a two-hop path through NeRF or through 'volume rendering' is guaranteed. That path cannot distinguish a soft penalty on smeared contributions from a reparameterisation that makes smeared density unrepresentable, and the question exists to force exactly that distinction, including the residual ambiguity the reparameterisation leaves untouched."
  - id: sdf-unisurf-inheritance
    text: "UNISURF keeps NeRF's ray compositing but discards its volume density in favour of an occupancy field. What precise property of NeRF's density made it unsuitable for surface extraction — not merely that it is noisy — and which of the two later SDF-based fixes addresses that property most directly?"
    anchors: ["volume density", "occupancy field"]
    requires: ["2003.08934", "2104.10078", "2106.12052", "2106.10689"]
    note: "NeRF supplies the density-and-radiance MLP trained only by photometric loss with no geometry supervision; UNISURF supplies the claim that this density does not admit accurate surfaces and that occupancy has a boundary by construction; VolSDF supplies the sharper diagnosis, that geometry had to be read off an arbitrary level set of a density with no canonical threshold, which the Laplace-CDF density removes."
    hop_rationale: "NeRF to UNISURF is a single citation hop and both anchors appear in UNISURF itself, so the path is as short as it can be. Short here is uninformative: the question asks for the reason the density is unusable — no canonical level set, so the extraction threshold is a free parameter — a statement that lives in VolSDF and is not implied by any adjacency between NeRF and UNISURF."
  - id: sdf-where-eikonal-is-sampled
    text: "IGR enforces its Eikonal term everywhere in the ambient space, which is what rules out the degenerate solution. VolSDF's importance sampler deliberately avoids spending samples on empty space. What does that do to the region where the Eikonal constraint is actually enforced during training, and how does the same tension appear in NeuS's sampling of its logistic opacity?"
    anchors: ["unit norm gradient", "importance sampler"]
    requires: ["2002.10099", "2106.12052", "2106.10689"]
    note: "IGR supplies the ambient-space scope of the Eikonal term and the argument that a loss non-zero almost everywhere is what prevents collapse; VolSDF supplies the bound-driven importance sampler that concentrates evaluations near the surface and away from empty space, and its retention of the Eikonal loss; NeuS supplies the parallel case of sampling concentrated where the logistic opacity is non-negligible."
    hop_rationale: "IGR and VolSDF are joined by an explicit uses-the-Eikonal-loss relation, so the anchors are one or two hops apart in any graph built from those papers. That relation records reuse, not the conflict the question is about: the sampler that makes rendering efficient also narrows the support on which the regulariser is evaluated, so the far-field guarantee IGR proved is no longer being enforced where IGR assumed it would be."
  - id: sdf-control-eikonal-weight-ablation
    text: "Across the DTU scans, which Eikonal loss weight does VolSDF report as optimal, and how much chamfer distance does halving that weight cost?"
    anchors: ["Eikonal", "chamfer"]
    control: true
    legacy_gameable: true
    requires: []
    note: "The corpus documents are prose summaries and CC0 abstracts; none of them contains a hyperparameter table, a loss-weight sweep, or a single chamfer distance value. 'Chamfer' appears in the corpus only inside IGR's phrase 'chamfer-style fitting', and no per-scan DTU numbers exist anywhere, so no weight and no cost can be recovered even by combining every document."
    hop_rationale: "Control: the anchors are genuinely present and close together in the SDF cluster, which is what makes the question look answerable. Any short path found here is evidence of topical proximity only; the quantities asked for are absent from the corpus, so retrieval quality cannot help."
  - id: sdf-control-voxurf-mechanism
    text: "Voxurf is listed as one of the works extending NeuS. What does it change about NeuS's logistic density formulation in order to run on a voxel grid, and what accuracy does that cost on the standard benchmarks?"
    anchors: ["Voxurf", "logistic function"]
