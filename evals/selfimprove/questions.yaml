    hop_rationale: "Both anchors are camera-parameter concepts and merge at a generic pose/camera node. Merging there records only that all three papers involve cameras, which is the definition of shared infrastructure. The question asks which stage treats pose as given, which as fixed by construction, and which as unmodelled, a distinction visible only in each paper's conditioning description."
  - id: lrm-resolution-cost-asymmetry
    text: "ProlificDreamer renders at 512×512 inside a per-scene optimisation, and LGM presents 512 as a hard-won training resolution for feed-forward models. Why is high resolution comparatively cheap for the optimisation-based method and expensive for an amortised predictor of LRM's kind, and what does moving prediction into image space change?"
