    hop_rationale: "Both anchors are diffusion-adjacent and sit within two hops via 'Diffusion' or 'ScoreDistillation'. That path records only that both papers use diffusion machinery. The question turns on which stage of each pipeline carries the stochasticity, and on the absence of any such stage in LRM, which a generic diffusion hop cannot express."
  - id: lrm-cost-volume-vs-attention-prior
    text: "MVSplat argues that a plane-sweep cost volume localises Gaussian centres better than learned attention and buys generalisation with roughly a tenth of the parameters, while LRM and Instant3D put no explicit geometric prior into their cross-attention reconstructors. State the disagreement precisely, and explain why Instant3D's fixed four-view layout weakens MVSplat's argument in that particular setting."
