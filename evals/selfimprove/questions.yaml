  - id: sparse-photometric-only-breaks
    text: "MVSplat trains every Gaussian parameter under photometric supervision alone and argues the cost volume keeps that well-posed. latentSplat adds a multi-view consistency loss plus a generative decoder because a deterministic regressor collapses on underconstrained regions, and Scaffold-GS blames photometric fitting for redundant primitives that overfit individual training views. Reconcile the three positions: when is photometric-only supervision enough, and what goes wrong on each side when it is not?"
