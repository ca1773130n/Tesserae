  - id: ctl2-slam-nerf-orbslam-map-points
    text: "DSO was reported to beat ORB-SLAM-style indirect baselines under rolling shutter and exposure change, and DROID-SLAM is credited with avoiding the catastrophic tracking failures that hit ORB-SLAM and DSO alike. What does the ORB-SLAM map-point management contribute to either failure, and why do the two papers blame different stages?"
