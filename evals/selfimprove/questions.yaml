  - id: sparse-costvolume-empty-overlap
    text: "MVSplat scores cross-view similarity in a cost volume to localise Gaussian centres, so in a region only one input view can see there is nothing left to score. latentSplat instead lets its variational 3D Gaussians carry a wide variance there and hands a sample to a generative decoder. Contrast what each method actually emits for a single-view-covered region, and explain why MVSplat's photometric-only recipe cannot supply what the variance term supplies."
