    hop_rationale: "Control: 'Voxurf' and 'logistic density' co-occur inside the NeuS document itself, giving a zero-to-one-hop path that is maximally misleading. The path proves only that NeuS named a successor; the mechanism asked about is nowhere in the corpus."
  - id: sdf-control-idr-surface-loss
    text: "IDR is the mask-supervised baseline that UNISURF, NeuS, and VolSDF all measure themselves against. What is IDR's own differentiable surface-rendering objective composed of, and how does its mask term interact with its Eikonal term during optimisation?"
    anchors: ["IDR", "Eikonal"]
    control: true
    legacy_gameable: true
    requires: []
    note: "IDR is referenced across four corpus documents, but always and only as a baseline characterised by needing masks; the IDR paper is not in the 50-document corpus. Its loss composition, its mask term, and any interaction with an Eikonal term are never stated, so the question cannot be answered from the corpus at any retrieval depth."
    hop_rationale: "Control: both anchors occur in the same documents — VolSDF names IDR and states it uses the Eikonal loss — so a one-hop path exists and looks like strong evidence. It supports only the fact that both terms belong to this literature, not the internal composition of a method the corpus never describes."

  # ---- geo ----
  - id: geo-poisson-replaces-marching-cubes
    text: "SuGaR extracts its mesh with Poisson reconstruction rather than the Marching Cubes step that neural-SDF pipelines such as MonoSDF rely on. What property of an SDF backbone makes Marching Cubes available there, what does an optimised Gaussian field lack that rules it out, and how does 2D Gaussian Splatting's choice of primitive change the input that any extraction algorithm is handed?"
    anchors: ["Poisson reconstruction", "Marching Cubes"]
    requires: ["2311.12775", "2206.00665", "2403.17888"]
    note: "A correct answer must tie Marching Cubes to the existence of an implicit zero level set (MonoSDF's SDF + volume rendering), quote SuGaR's reason that Gaussians define no level set so the operator does not transfer, and note that 2DGS's oriented disks are themselves tangent-plane samples of the surface, i.e. the extractor's input is already surface-like."
    hop_rationale: "Both anchors appear in one sentence of SuGaR's own abstract, so a one-hop co-occurrence path exists by construction and proves nothing. The question turns on two facts that document does not carry: why the operator is legitimate on MonoSDF's implicit field, and what 2DGS's primitive substitutes for the missing level set. A retriever that stops at the SuGaR-internal edge returns the anchors without any of the content that decides the answer."
  - id: geo-where-normals-come-from
    text: "MonoSDF supervises its rendered surface normal with an off-the-shelf monocular predictor, while 2DGS's normal consistency term needs no external network at all. Identify what each method treats as the ground truth for a normal, and explain why the disk representation can self-supervise a quantity that the SDF-plus-volume-rendering pipeline of NeuS and MonoSDF has to import from outside."
    anchors: ["rendered surface normal", "normal consistency"]
    requires: ["2206.00665", "2403.17888", "2106.10689"]
    note: "Answer must state that in the NeuS/MonoSDF lineage the normal is the gradient of the SDF — free to compute but unconstrained where the photometric loss is weak, hence the imported monocular normal prior — while 2DGS's disk has an intrinsic orientation, so its normal term compares two internal quantities (disk normals vs the gradient of the rendered depth map) and adds consistency rather than information."
    hop_rationale: "Any generic 'surface normal' node links the two anchors in one hop, and both papers do compute normals — that shared infrastructure is precisely the false positive. What decides the answer is where the normal is *defined* and whether the supervision is external or internal, which requires NeuS's SDF-normal construction on one side and 2DGS's disk geometry on the other; a short path through the shared concept states neither."
  - id: geo-distortion-term-lineage
    text: "2DGS's depth distortion term and MonoSDF's depth-consistency loss both act on depth along a ray, yet only one of them descends from Mip-NeRF 360's distortion-based regularizer. Which is which, what supervision signal does each consume, and what specific artefact does each remove?"
    anchors: ["depth distortion", "distortion-based regularizer"]
    requires: ["2403.17888", "2206.00665", "2111.12077"]
    note: "Correct answer: 2DGS's term is the descendant — self-supervised, concentrating ray mass on a single disk, targeting the smeared contributions and floaters Mip-NeRF 360 identified; MonoSDF's loss is scale-and-shift-invariant supervision against an external monocular depth prediction, targeting ambiguity in low-texture and sparsely observed regions. The two are not variants of each other."
    hop_rationale: "The anchors are lexically near-identical ('distortion'), so an embedding or string path is trivially short and would fire on any pair of regularisers. Distinguishing an inherited self-regulariser from an externally supervised depth loss requires Mip-NeRF 360's statement of what its distortion penalty is for, and MonoSDF's statement of where its prior comes from — the short path actively conflates them."
  - id: geo-primitive-budget-vs-anchor-growth
    text: "Revising Densification adds a mechanism that caps the total number of primitives, while Scaffold-GS keeps the count down by attaching bundles of neural Gaussians to a sparse set of anchor points. Contrast what each mechanism actually controls, and say which of the two is compatible with SuGaR's requirement that the primitives fed into mesh extraction sit on the scene surface."
    anchors: ["total number of primitives", "anchor points"]
    requires: ["2404.06109", "2312.00109", "2311.12775"]
    note: "Answer must separate a scheduling cap on an existing ADC loop (a direct speed/quality dial that says nothing about where primitives go) from a structural reparameterisation that ties primitives to scaffold geometry and predicts their attributes per view; then note the tension with SuGaR, whose Poisson step consumes fixed, surface-aligned oriented centres rather than view-conditioned, on-the-fly splats."
    hop_rationale: "Both anchors reduce to 'fewer Gaussians', so a generic efficiency node connects them in one hop and would match any two compression papers. The answer depends on a mechanism-level distinction (count cap vs view-conditioned prediction) and on a third constraint — SuGaR's need for persistent surface-aligned centres — which no short efficiency path expresses."
  - id: geo-eikonal-has-no-gaussian-analogue
    text: "The Eikonal regularizer introduced by Implicit Geometric Regularization is what keeps MonoSDF's distance field metric and its level set well behaved. SuGaR has no comparable term because Gaussians do not implicitly define a level set. What does SuGaR's alignment regulariser constrain instead, and which of the Eikonal term's guarantees is simply given up in the Gaussian branch?"
    anchors: ["Eikonal regularizer", "level set"]
    requires: ["2002.10099", "2206.00665", "2311.12775"]
    note: "Answer must state that the Eikonal term constrains the field globally (unit-norm gradient everywhere, so the zero set is a smooth manifold and normals are meaningful off-surface), whereas SuGaR's term is local and relational — it penalises elongation away from the neighbours' tangent plane — so nothing constrains the space between primitives; the guarantee lost is a well-defined, metric implicit function from which a surface can be read anywhere."
    hop_rationale: "Inside the SDF literature 'Eikonal' and 'level set' are near-synonymous and co-occur in IGR, NeuS and MonoSDF, so the anchors are one hop apart in the densest part of the graph. But the question is about an *absence* on the Gaussian side, and a short path between two SDF concepts cannot represent the fact that the Gaussian branch has no such object; only SuGaR's own statement plus IGR's account of what the term buys makes the trade legible."
  - id: geo-two-answers-to-view-inconsistency
    text: "SuGaR and 2DGS start from the same complaint — an optimised 3D Gaussian cloud is not a surface — but SuGaR keeps volumetric primitives and adds a term pulling each toward its neighbours' local tangent plane, whereas 2DGS changes the primitive so that view-consistent geometry holds by construction. What does the regularisation route fail to guarantee that the representation route obtains for free, and how does Revising Densification categorise these two lines relative to its own contribution?"
    anchors: ["view-consistent geometry", "local tangent plane"]
    requires: ["2311.12775", "2403.17888", "2404.06109"]
    note: "Answer must observe that a penalised 3D Gaussian is only approximately flat and its silhouette still varies with viewing angle, so view consistency is a soft objective that competes with the photometric loss, while a disk has one normal and one location and is consistent exactly; and that Revising Densification groups both as structural variants that change the primitive, as opposed to its own change to the densification schedule."
    hop_rationale: "SuGaR and 2DGS name each other as the two lines of surface-aware Gaussian work, so a sibling edge puts the anchors one hop apart. That edge asserts they are alternatives — it does not say which guarantee is soft and which is structural, nor place them on the axis (primitive vs schedule) that Revising Densification introduces. The short path is the exact false positive here."
  - id: geo-affine-projection-vs-ray-splat
    text: "The gsplat supplement documents the local affine approximation used to push a Gaussian's covariance into screen space; 2DGS discards it in favour of explicit ray-splat intersection. What error does the affine step introduce that matters for geometry but is largely invisible in appearance metrics, and why can SuGaR keep using the unmodified splatting renderer while still targeting surface accuracy?"
    anchors: ["ray-splat intersection", "local affine approximation"]
    requires: ["2403.17888", "2312.02121", "2311.12775"]
    note: "Answer must connect the approximation being local and per-view (so the same primitive projects to slightly different footprints from different cameras, i.e. a view-dependent geometric bias absorbed by opacity and colour in a photometric objective) with 2DGS's perspective-correct derivation; and explain that SuGaR does not read geometry out of the rasteriser at all — its surface comes from regularised primitive centres passed to Poisson, so projection error degrades its appearance term, not its extraction input."
    hop_rationale: "gsplat is named as the substrate that surface-aware variants including 2DGS and SuGaR reuse, so an 'implementation' hop links the anchors immediately. That edge records reuse; it says nothing about which approximation error propagates into geometry, nor why one of the two reusers is indifferent to it. Answering requires 2DGS's error argument and SuGaR's extraction path, neither of which lies on the substrate edge."
  - id: geo-textureless-constraint-gap
    text: "MonoSDF traces its failures to the ambiguity of the RGB reconstruction loss in low-texture, weakly observed regions. 2DGS's depth distortion and normal consistency terms are self-supervised: they read only the model's own renders. Do those terms supply the constraint MonoSDF says is missing, and what does SuGaR fall back on in the same regions?"
    anchors: ["RGB reconstruction loss", "depth distortion"]
    requires: ["2206.00665", "2403.17888", "2311.12775"]
    note: "Answer must conclude that they do not — self-consistency terms make an under-determined solution cleaner and sharper but add no information about which of the many photometrically equivalent geometries is right, so a textureless wall can be confidently wrong and perfectly self-consistent; SuGaR is in the same position, its regulariser being a neighbourhood-smoothness prior. Only MonoSDF's external monocular cues add information."
    hop_rationale: "'Photometric loss is weak' and 'so add a regulariser' are adjacent generic ideas, and a two-hop path through any regularisation node connects them for almost any pair of papers. The answer hinges on a distinction that path erases — whether a term injects external information or only enforces internal agreement — which needs MonoSDF's diagnosis and the explicit statement of what 2DGS's and SuGaR's terms consume."
  - id: geo-optimising-after-extraction
    text: "SuGaR's refinement pins each Gaussian to a mesh face by a barycentric coordinate and keeps optimising mesh and primitives jointly; Magic3D's second stage extracts a mesh and optimises deformable vertex positions through a differentiable rasteriser. Both keep training after extraction. Compare what is free to move and what supervises the motion in each, and contrast both with 2DGS, where the mesh is a read-out rather than an optimisation variable."
    anchors: ["barycentric coordinate", "deformable vertex positions"]
    requires: ["2311.12775", "2211.10440", "2403.17888"]
    note: "Answer must distinguish SuGaR (primitives parameterised on faces, mesh and Gaussians co-optimised through the splatting renderer under a multi-view photometric objective, purpose = editable asset) from Magic3D (vertices themselves displaced, supervised by SDS against a high-resolution latent diffusion prior, purpose = generation with no ground-truth views), and note that 2DGS never reopens the mesh — geometry quality has to be won during radiance-field training."
    hop_rationale: "Both sit under a generic 'mesh refinement with a differentiable renderer' idea, one hop from either anchor, and that similarity is superficial: one binds primitives to a fixed topology under real-view photometric supervision, the other displaces geometry under a generative prior with no reference views. Establishing which is which requires each paper's supervision signal, and the third contrast requires 2DGS — none of it lies on the shared refinement node."
  - id: geo-marching-cubes-in-generative-pipelines
    text: "SuGaR argues Marching Cubes does not transfer from Neural SDFs to Gaussian fields, yet DreamGaussian exports its generated Gaussians to a textured mesh through a Marching-Cubes-style step. What makes that acceptable in the generative setting and not in the reconstruction setting, and what does MonoSDF's pipeline give the operator that DreamGaussian's does not?"
    anchors: ["Marching Cubes", "textured mesh"]
    requires: ["2311.12775", "2309.16653", "2206.00665"]
    note: "Answer must contrast the fidelity contract: MonoSDF hands Marching Cubes a genuine implicit field whose zero set is the surface, so the mesh is metrically meaningful; DreamGaussian has no such field and no ground-truth geometry to be accurate against — its mesh only has to be plausible and is then re-textured against the diffusion prior, so noise from the improvised level set is repaired downstream. SuGaR's objection is a reconstruction-accuracy objection, not an implementability one."
    hop_rationale: "Marching Cubes is a shared operator node, so both papers are one hop from it and from each other — and that path only says 'both mention Marching Cubes', which is exactly the shared-infrastructure false positive. Deciding when the operator is defensible needs each paper's accuracy requirement and MonoSDF's evidence of what a real implicit field supplies; the operator node encodes none of that."
  - id: geo-thin-structure-failure-modes
    text: "NeuS credits its unbiased opacity formulation for recovering thin structures at the zero level set, while 2DGS credits perspective-correct ray-splat intersection for recovering thin surfaces. Are these two claims about the same failure? Give the mechanism by which a thin plate degrades in each representation, and say where MonoSDF's monocular cues would and would not help."
    anchors: ["thin surfaces", "zero level set"]
    requires: ["2403.17888", "2106.10689", "2206.00665"]
    note: "Answer must separate the mechanisms: in NeuS the failure is a first-order bias that shifts the recovered zero level set away from where the photometric residual is minimised, a rendering-integral problem; in 2DGS the failure is a volumetric primitive with thickness whose footprint changes per view under an approximate projection, a primitive-geometry problem. MonoSDF's cues help with the weakly constrained flat regions around a thin structure but do not correct either bias, and a monocular predictor is itself unreliable on thin geometry."
    hop_rationale: "'Thin structures' is claimed by both papers, so lexical retrieval places the anchors one hop apart, and both claims sound identical at that resolution. Only the underlying mechanisms — an opacity-construction bias versus a primitive-shape and projection error — discriminate them, and those live in separate documents that the shared phrase never links causally."
  - id: geo-flatness-vs-split-trigger
    text: "SuGaR's regulariser drives the optimisation toward thin, surface-conforming primitives, but densification still fires on positional-gradient magnitudes inherited from Adaptive Density Control. Explain how making a Gaussian nearly degenerate along one axis changes what a clone or split decision does to it, and whether 2DGS — whose primitive is flat by construction — inherits the same interaction."
    anchors: ["positional-gradient magnitudes", "surface-conforming primitives"]
    requires: ["2404.06109", "2311.12775", "2403.17888"]
    note: "Answer must reason that the trigger measures positional gradient, which is agnostic to primitive shape, so a flattened primitive under-served in its tangent directions is treated exactly like a fat one; splitting a degenerate Gaussian propagates the degeneracy along the surface (arguably benign) while cloning duplicates it in place, and neither operation is aware of the regulariser's objective. 2DGS has the same shape/trigger mismatch by default because it retains 3DGS's density-control schedule while changing the primitive — which is precisely the axis Revising Densification says its own work operates on."
    hop_rationale: "Densification and regularisation act on the same primitives inside one training loop, so a one-hop 'optimisation of Gaussians' path always exists. That path cannot state the interaction, because neither paper describes it: it must be composed from Revising Densification's account of what the trigger measures and SuGaR's account of what its term does to primitive shape. A short generic path is evidence of co-location, not of the mechanism."
  - id: geo-clone-opacity-vs-single-peak-depth
    text: "Revising Densification reports a bias in ADC's opacity handling during cloning that inflates effective opacity, while 2DGS's depth distortion term wants the mass along each ray concentrated on a single disk. Explain how a cloning rule that leaves two overlapping primitives at doubled effective opacity works against that objective, and what SuGaR's surface alignment would do with the same duplicate pair."
    anchors: ["opacity handling", "depth distortion"]
    requires: ["2404.06109", "2403.17888", "2311.12775"]
    note: "Answer must trace the chain: cloning places near-coincident primitives whose combined alpha over-explains the pixel, so the optimiser is not pushed to merge or move them; the ray's depth distribution acquires mass at two nearby depths, which is exactly the smear the distortion term penalises, putting the two objectives in direct conflict during densification. SuGaR's alignment term is neighbourhood-based and would find the duplicate mutually consistent — it flattens, it does not deduplicate."
    hop_rationale: "Opacity and per-ray depth co-occur in any description of alpha compositing, so the anchors are one hop apart through the rendering model itself. What the question needs is a causal chain across two papers — a densification bug in one, a geometric objective in the other, and the interference between them — which the compositing node cannot supply and which neither paper states on its own."
  - id: geo-cost-volume-vs-monocular-prior
    text: "MonoSDF injects geometry through losses built on a monocular depth predictor, while MVSplat injects it through a plane-sweep cost volume that decides where Gaussian centres are placed. Both are called geometry priors but enter the pipeline at different points. Which of the two could supply what 2DGS's purely self-supervised regularisers cannot, and what does each cost at inference time?"
    anchors: ["plane-sweep cost volume", "monocular depth predictor"]
    requires: ["2206.00665", "2403.14627", "2403.17888"]
    note: "Answer must locate each prior: MonoSDF's acts as a per-pixel loss during per-scene optimisation (external network run once per view, no inference cost after training, but subject to scale/shift ambiguity handled by the invariant loss), MVSplat's acts as an architectural inductive bias inside a feed-forward predictor (cross-view similarity resolves depth, cost paid in the single forward pass, requires several posed views). Both add information 2DGS's self-consistency terms lack; the monocular route works from a single view, the cost-volume route needs multi-view overlap and so is weakest exactly where MonoSDF's sparse-viewpoint case bites."
    hop_rationale: "'Geometry prior' is a category node that both anchors sit one hop from, and that node would equally connect any depth-supervised method to any stereo method. Answering needs the entry point (loss term vs primitive placement), the supervision regime (single-image predictor vs cross-view similarity) and the cost profile — distinctions the category collapses, which is why a short path here is not evidence."
  - id: geo-pixel-error-under-pose-error
    text: "GS-SLAM grows its map with an adaptive expansion strategy keyed on pixels the current map fails to explain — essentially the per-pixel error function that Revising Densification proposes as an offline densification criterion. In SLAM that residual also contains camera-pose error. What does that contamination do to the criterion, and would 2DGS's view-consistent disks make the coupling better or worse?"
    anchors: ["adaptive expansion strategy", "per-pixel error function"]
    requires: ["2404.06109", "2311.11700", "2403.17888"]
    note: "Answer must state that offline the residual is attributable to the representation alone because poses come from a fixed SfM pass, so error-driven densification is well posed; in SLAM a misaligned pose produces large residuals over correctly modelled regions, so the criterion spawns primitives to absorb tracking error — the failure GS-SLAM's reliability/coarse-to-fine Gaussian selection exists to damp. A view-consistent primitive helps, because with a disk the residual under a wrong pose cannot be explained away by reshaping the primitive per view, making the pose error more identifiable rather than absorbable."
    hop_rationale: "Both anchors reduce to 'add primitives where the render is wrong', so a shared-criterion path is one hop and immediately available. That path presupposes the residual means the same thing in both settings — which is exactly what the question denies. Establishing the contamination requires GS-SLAM's tracking loop and the offline paper's assumption of fixed poses, plus 2DGS's consistency argument for the last part."
  - id: geo-oriented-points-for-poisson
    text: "Poisson reconstruction consumes oriented points. SuGaR obtains them as oriented Gaussian centres only after a regulariser has made neighbouring primitives agree on a tangent plane, whereas each 2D Gaussian carries a single normal from the outset. What does that difference imply about noise in the Poisson input, and which stage of SuGaR's pipeline becomes redundant if the primitives are disks?"
    anchors: ["oriented Gaussian centres", "single normal"]
    requires: ["2311.12775", "2403.17888"]
    note: "Answer must note that SuGaR's orientations are inferred from a neighbourhood consensus, so they are only as good as the regulariser's convergence and degrade where the surface is thin or the neighbourhood spans two surfaces, while a disk's normal is a primitive parameter optimised against the image evidence directly; hence the alignment-regularisation stage — the step whose purpose is to manufacture orientation — is what a disk representation makes unnecessary, not the Poisson step itself."
    hop_rationale: "A generic 'normals' node sits one hop from both anchors, and both papers obviously involve normals — the shared-infrastructure trap. The answer requires knowing where each orientation comes from (inferred consensus vs optimised parameter) and then reasoning about which SuGaR stage that makes redundant, a claim neither paper makes and no short path carries."
  - id: geo-extraction-cost-vs-training-cost
    text: "SuGaR advertises minutes where Neural SDFs need hours, but MonoSDF had already accelerated the SDF line with Instant-NGP's hash encoding. Break the comparison down: which portion of the neural-SDF cost is per-scene optimisation and which is mesh extraction, and which of the two does SuGaR's route actually remove?"
    anchors: ["hash encoding", "mesh extraction"]
    requires: ["2311.12775", "2206.00665", "2201.05989"]
    note: "Answer must attribute the hours mainly to per-scene optimisation of the implicit field — the cost the hash encoding attacks by replacing many MLP evaluations with interpolated table lookups — and note that Marching Cubes over a trained field is comparatively cheap. SuGaR's saving therefore comes from the splatting optimisation being fast to begin with, not from Poisson beating Marching Cubes; the honest comparison is against a hash-grid MonoSDF, not against a monolithic-MLP baseline."
    hop_rationale: "Speed claims are shared infrastructure: nearly every paper in the corpus claims to be faster than its predecessor, so any 'fast/efficient' node connects these anchors in one or two hops and would fire indiscriminately. The question demands cost attribution across three documents — where the hours are spent, what the hash encoding removes, and what SuGaR replaces — which is precisely what a generic speed path cannot supply."
  - id: geo-error-driven-densification-in-flat-regions
    text: "Revising Densification triggers cloning and splitting from a per-pixel error function, while MonoSDF's central argument is that in textureless areas the photometric residual is small even where the geometry is badly wrong. Does a pixel-error criterion densify where the geometry needs it in such regions, and would 2DGS's depth-distortion and normal-consistency terms detect what the pixel error misses?"
    anchors: ["per-pixel error function", "textureless areas"]
    requires: ["2404.06109", "2206.00665", "2403.17888"]
    note: "Answer must identify the contradiction: a pixel-error trigger is blind exactly where MonoSDF says the constraint is missing, because low texture means low residual regardless of geometry — so error-driven density control is strictly better than the positional-gradient proxy on high-frequency content while inheriting the same blindness on flat surfaces. 2DGS's terms detect inconsistency, not error, so they can flag a smeared or badly oriented flat region that costs nothing photometrically, but they still cannot say where the surface should be."
    hop_rationale: "Any 'reconstruction quality' node puts the anchors two hops apart, and both papers discuss where reconstructions go wrong. The answer, though, is a conflict between two papers' assumptions — residual as sufficient densification signal versus residual as uninformative in flat regions — and a shared quality node encodes neither assumption, so a short path between the anchors would be a coincidence of topic rather than evidence."
  - id: geo-adc-clone-mechanics
    text: "3D Gaussian Splatting's interleaved densification and pruning schedule clones and splits primitives on positional gradient; Revising Densification calls that criterion a proxy and separately corrects a bias in the clone operation's opacity. Which artefact class does each of the two fixes remove, and which of them would still be needed if the primitive were 2DGS's flat disk instead of a 3D Gaussian?"
    anchors: ["interleaved densification", "Adaptive Density Control"]
    requires: ["2404.06109", "2308.04079", "2403.17888"]
    note: "Answer must map fix to artefact: the pixel-error trigger addresses under-densified missing structure and runaway counts in high-frequency scenes (artefacts of a gradient proxy), while the opacity correction addresses the skew from a clone's doubled effective opacity, which manifests as floating Gaussians and biased optimisation. The opacity correction is primitive-independent and would still be required under 2DGS, since it is a property of the clone operation and alpha compositing, not of the primitive's dimensionality."
    hop_rationale: "ADC and 3DGS's densification schedule are literally the same mechanism, so the anchors are one hop apart in the densest neighbourhood of this corpus — the path is guaranteed and carries no discriminating information. The question needs the artefact-to-fix mapping (only in the revision paper) plus a judgement about which fix survives a change of primitive (needs 2DGS), neither of which the identity edge between the anchors contains."
  - id: geo-covariance-projection-inconsistency
    text: "3D Gaussian Splatting gives each primitive an anisotropic covariance and projects it through a screen-space affine approximation; 2DGS blames precisely this pair — volumetric extent plus approximate projection — for multi-view inconsistent geometry. Separate the two causes: which part of the inconsistency would survive if the projection were exact, and which of the two does SuGaR attack while keeping the 3D covariance?"
    anchors: ["screen-space affine approximation", "anisotropic covariance"]
    requires: ["2403.17888", "2308.04079", "2311.12775"]
    note: "Answer must attribute the residual inconsistency to volumetric extent — a 3D ellipsoid presents a different silhouette from every direction, so even an exact projection leaves the inferred surface view-dependent — with the affine approximation adding a second, projection-side error that 2DGS removes via ray-splat intersection. SuGaR attacks only the extent, and only softly, by penalising elongation away from the neighbours' tangent plane; it inherits the projection approximation unchanged."
    hop_rationale: "Both anchors occur in the same sentence of 2DGS's critique, so a one-hop intra-document path exists and is worthless here. The question requires decomposing a single stated cause into two independent ones and then mapping a third method onto that decomposition — and SuGaR's document never mentions the affine projection at all, so the mapping has to be inferred from what SuGaR does and does not change."
  - id: geo-ctrl-chamfer-ablation-numbers
    text: "On DTU, what Chamfer distance does SuGaR's Poisson reconstruction achieve compared with 2DGS trained with its depth distortion term switched off?"
    anchors: ["Poisson reconstruction", "depth distortion"]
    control: true
    legacy_gameable: true
    requires: []
    note: "Unanswerable from the corpus: no document reports numeric per-scene or per-dataset reconstruction metrics of any kind — the material carries only qualitative claims and metric *names* (PSNR, SSIM, LPIPS) in front matter — and no ablation that disables 2DGS's depth-distortion term appears anywhere. Chamfer distance is never reported for any method, and DTU is mentioned only as an evaluation set for NeuS/UNISURF/VolSDF."
    hop_rationale: "Control. Both anchors occur in the corpus and their papers are one hop apart as sibling surface-aware Gaussian methods, so a short, confident path certainly exists — that is the trap. The path carries the two methods but no numbers and no ablation, so any retrieval that scores this question as answerable is producing a false positive on topical adjacency."
  - id: geo-ctrl-anchor-disk-hybrid
    text: "How does Scaffold-GS's view-conditioned MLP over anchor points behave when its neural Gaussians are replaced by planar disks rendered with ray-splat intersection — does the anchor growing-and-pruning procedure still converge?"
    anchors: ["anchor points", "ray-splat intersection"]
    control: true
    legacy_gameable: true
    requires: []
    note: "Unanswerable from the corpus: no document proposes, implements, or evaluates a hybrid of anchor-based structuring with 2D disk primitives. Scaffold-GS predicts attributes of volumetric neural Gaussians and 2DGS changes the primitive without any anchor structure; nothing in the 50 papers reports convergence behaviour for the combination, so any answer would be invention dressed in corpus vocabulary."
    hop_rationale: "Control. Both anchors are real concept strings whose papers share a sub-topic, so they are two hops apart at most via the Gaussian-splatting neighbourhood, and the retrieved context will look highly relevant. Relevance is exactly what is misleading here: the corpus supports each half and says nothing about their composition, so a short path is evidence of a plausible-sounding non-question."
  - id: geo-ctrl-normal-predictor-identity
    text: "Which network does MonoSDF's monocular surface-normal predictor use, and how much does the normal consistency term degrade when that predictor is replaced by a weaker one?"
    anchors: ["monocular surface-normal predictor", "normal consistency"]
    control: true
    legacy_gameable: true
    requires: []
    note: "Unanswerable from the corpus on two counts: no document names any specific monocular predictor architecture — MonoSDF's are described only as general-purpose off-the-shelf estimators — and 'normal consistency' is 2DGS's self-supervised term, which is not driven by MonoSDF's predictor at all, so the question also asserts a dependency that no document supports. No predictor-swap study exists anywhere in the 50 papers."
    hop_rationale: "Control. The two anchors both concern surface normals and sit one hop from any generic normal-supervision node, so a short path is essentially guaranteed and will retrieve both MonoSDF and 2DGS. The path cannot expose that the question fuses two unrelated mechanisms and asks for an architecture name and an ablation the corpus never records — precisely the false positive the controls are meant to catch."

  # ---- dyn ----
  - id: dyn-canonical-template-abandoned
    text: "Nerfies warps every observed point into a single canonical template before a NeRF is evaluated. Which later corpus method keeps that canonical template but lifts it into a higher-dimensional ambient space, and which one abandons the canonical-plus-deformation factorisation altogether in favour of anisotropic 4D XYZT Gaussians? State what each of the two remedies adds as an extra dimension and what class of scene content motivated it."
    anchors: ["canonical template", "anisotropic 4D XYZT Gaussians"]
    requires: ["2011.12948", "2106.13228", "2402.03307"]
    note: "Answer: HyperNeRF keeps the template and adds an abstract ambient coordinate per frame, sliced at render time, motivated by topological change (mouth opening, fruit being sliced); 4D-Rotor GS keeps no template at all and makes time a real dimension of the primitive, motivated by abrupt motion and emerging/disappearing content. The distinction that must be synthesised is that HyperNeRF's extra dimension is not time, while 4DRotorGS's is."
    hop_rationale: "'canonical template' and '4D XYZT Gaussians' are both reachable in one hop from the sub_topic 'Dynamic and 4D Reconstruction' and from the shared DeformationField method tag, so a generic short path exists between them and is worthless here: it says the two are both dynamic-scene methods but not that one retains and lifts the template while the other discards it. Answering requires the directed critique edge from 4DRotorGS back onto the canonical formulation plus HyperNeRF's specific ambient-slice remedy, which a topical co-membership path cannot supply."
  - id: dyn-static-dynamic-split-three-mechanisms
    text: "Three corpus methods exploit the fact that most of a dynamic capture is static, but by different machinery: one predicts an unsupervised blending weight between two radiance fields, one initialises its time-involving planes to the identity, and one shares a canonical Gaussian set across all frames. Which is which, and which of the three needs no supervision signal beyond the photometric loss to induce the split?"
    anchors: ["blending weight", "time-involving planes"]
    requires: ["2105.06468", "2301.10241", "2310.08528"]
    note: "Answer: Gao et al. (blend of static NeRF and time-conditioned dynamic NeRF, weight predicted by the dynamic net, learned unsupervised); K-Planes (identity init of the xt/yt/zt planes so only genuinely time-varying content departs from identity); 4D-GS (canonical Gaussians shared, deformation MLP predicts departures). All three are photometric-only for the split itself, but K-Planes' is a pure initialisation/prior choice while Gao's is a learned extra output head."
    hop_rationale: "A short path exists via the RadianceField method tag shared by Gao et al. and K-Planes, and via 'dynamic scene' as a topic — one or two hops, and completely uninformative, because it does not distinguish an architectural two-branch split from a parameter-initialisation trick from primitive sharing. The question turns on the mechanism attached to each paper, so any path that merely establishes topical adjacency between the anchors is a false positive of exactly the kind that shared-infrastructure retrieval produces."
  - id: dyn-plane-features-decode-target
    text: "K-Planes and 4D-GS both sample features from a decomposed planar factorisation of a 4D volume, yet the two decode those features into completely different quantities. What does each decode into, and which of the two therefore still needs a separate underlying primitive to render at all? Contrast both with the dynamic method in the corpus that uses no grid or plane factorisation whatsoever."
    anchors: ["decomposed neural voxel", "feature planes"]
    requires: ["2301.10241", "2310.08528", "2402.03307"]
    note: "Answer: K-Planes decodes plane features into density and colour directly (the field is the scene); 4D-GS decodes them, through a lightweight MLP, into per-Gaussian deformations of position, rotation and scale, so it still needs the canonical 3D Gaussians to rasterise. 4D-Rotor GS uses neither, carrying time inside the primitive. The shared 'planar factorisation' vocabulary hides a difference in what the factorisation is a factorisation of."
    hop_rationale: "Both anchors sit one hop from the generic notion of a factorised grid (HexPlane/TensoRF lineage), and K-Planes and 4D-GS are two hops apart through any explicit-representation hub, so a short generic path is essentially guaranteed and proves only that both papers factorise something. It is not evidence for the discriminating fact asked about — that one factorisation outputs radiance and the other outputs deformations of a separate primitive — which lives in each paper's own decoder description."
  - id: dyn-what-4d-memory-scales-with
    text: "Both K-Planes and 4D-GS argue against materialising a dense four-dimensional volume, but they quantify the saving against different baselines. What does K-Planes claim its compression factor is measured against, and what does 4D-GS say its per-scene memory footprint scales with instead of sequence length? For the corpus method that stores full 4D primitives rather than a canonical set plus a grid, what plays the role of the stored quantity?"
    anchors: ["full 4D grid", "deformation grid"]
    requires: ["2301.10241", "2310.08528", "2402.03307"]
    note: "Answer: K-Planes claims roughly 1000x compression versus a full dense 4D grid, achieved by the d-choose-2 planar factorisation; 4D-GS's footprint scales with the size of the deformation grid because canonical Gaussians are shared across all frames, rather than linearly with the number of frames; 4D-Rotor GS stores the set of 4D XYZT Gaussians themselves, with temporal extent per primitive. Requires reading three different storage arguments and noticing they are baselined differently."
    hop_rationale: "'full 4D grid' and 'deformation grid' both contain the word grid and both attach to memory-efficiency claims, so a lexical or one-hop concept path links them trivially while conflating two different objects — a hypothetical dense baseline versus an actual stored structure. Evidence for this question has to attach each claim to its own paper and its own baseline; a short path that merely co-locates 'grid' and 'compression' would score well and answer nothing."
  - id: dyn-anisotropic-covariance-into-four-dimensions
    text: "3D Gaussian Splatting renders by fitting each primitive an anisotropic covariance that adapts to local geometry. When that primitive is extended to four dimensions, what mathematical machinery does the corpus say replaces the 3D rotation parameterisation, and why is it presented as the generalisation of quaternions rather than a stack of Euler-style angles? Contrast with the dynamic Gaussian method that leaves the covariance three-dimensional and predicts changes to its rotation and scale over time instead."
    anchors: ["anisotropic covariance", "geometric algebra"]
    requires: ["2308.04079", "2402.03307", "2310.08528"]
    note: "Answer: 4D-Rotor GS parameterises the orientation of a 4D Gaussian with a rotor drawn from geometric algebra, presented as the numerically stable generalisation of the quaternion parameterisation of 3D rotations; 3DGS's own anisotropic covariance is the thing being generalised; 4D-GS keeps 3D Gaussians and instead has its MLP predict deformations of position, rotation and scale per timestamp. This is a genuine question about 3DGS's covariance parameterisation, not a background citation."
    hop_rationale: "3DGS is the hub of this corpus, so almost any Gaussian-splatting anchor reaches 'anisotropic covariance' within one or two hops through the extends/builds-on edges that every splatting paper carries; such a path is evidence for nothing except that the later papers are splatting papers. The question needs the specific claim that the rotor generalises quaternion rotation to 4D while keeping stability, which is stated only inside 4DRotorGS and is not implied by any inheritance edge."
  - id: dyn-coarse-to-fine-means-three-things
    text: "The phrase coarse-to-fine names three different mechanisms in this corpus: an annealing schedule over positional-encoding frequencies, a hierarchical sampling scheme along a ray, and a multi-resolution stack of spatial feature planes. Which paper introduces each, which of the three is a fix for an optimisation landscape rather than for sampling efficiency or spatial detail, and what failure would occur without it?"
    anchors: ["coarse-to-fine annealing", "hierarchical coarse-to-fine sampling"]
    requires: ["2011.12948", "2003.08934", "2301.10241"]
    note: "Answer: Nerfies (frequency annealing on the deformation network's positional encoding, an optimisation fix — without it the deformation field falls into local minima induced by high-frequency encodings); NeRF (coarse then fine network importance-sampling along the ray, a sampling-efficiency mechanism); K-Planes (multi-resolution spatial planes, a detail/capacity mechanism). Only Nerfies' is about the loss landscape."
    hop_rationale: "The two anchors share the literal string 'coarse-to-fine', so a lexical or synonym edge joins them in a single hop and is actively misleading — that short path is precisely the false positive here, since the whole point is that the identically-named mechanisms solve unrelated problems in different papers. Evidence must come from each paper's own account of what breaks without its version, which no name-similarity path encodes."
  - id: dyn-monocular-priors-external-vs-intrinsic
    text: "Two monocular dynamic reconstruction papers in the corpus resolve the same ill-posedness with different kinds of prior: one imports signals from off-the-shelf predictors, including a depth-order constraint, while the other adds a self-contained energy borrowed from physical simulation. Name the mechanisms on each side, say which of the two carries a dependency on an external model at training time, and state which of these regularisers the topology-handling follow-up explicitly reuses."
    anchors: ["depth-order constraint", "elastic regularization"]
    requires: ["2105.06468", "2011.12948", "2106.13228"]
    note: "Answer: Gao et al. use 3D scene-flow consistency between adjacent frames, a depth-order constraint from monocular depth predictions, and a 2D optical-flow loss tied to off-the-shelf flow estimates — external dependencies; Nerfies uses an elastic energy penalty on the deformation Jacobian plus coarse-to-fine encoding annealing — internal, no external predictor. HyperNeRF explicitly reuses Nerfies' elastic regularisation and coarse-to-fine encoding."
    hop_rationale: "Both anchors are regularisation terms in monocular dynamic papers filed under the same sub_topic, so a two-hop path through 'regulariser' or through the ill-posed-monocular framing exists and shows only that both papers regularise. That does not separate a prior that needs a pretrained depth or flow network from one that is a differential-geometry energy computed from the model's own Jacobian, nor does it establish which one the later paper inherited — both of which are stated only in the paper texts."
  - id: dyn-heldout-view-for-a-moving-subject
    text: "Evaluating novel-view synthesis of a deforming subject is obstructed by the fact that the ground-truth view at a given instant cannot be recaptured later. Describe the capture arrangement one corpus paper built to obtain time-synchronised held-out views, and explain why the other monocular dynamic paper, which demonstrates space-time interpolation on casually captured clips, cannot produce the same kind of ground truth."
    anchors: ["two-phone rig", "space-time interpolation"]
    requires: ["2011.12948", "2105.06468"]
    note: "Answer: Nerfies records with two mobile phones on a rig — one captures the training video, the second captures time-synchronised validation frames from a different viewpoint, giving genuine held-out novel views of an actively deforming subject. Gao et al.'s casually captured single-camera videos provide no second simultaneous viewpoint, so evaluation there rests on qualitative/interpolation results rather than held-out ground truth at the same instant."
    hop_rationale: "Both papers report PSNR/SSIM/LPIPS and sit in the same sub_topic, so a one-hop metric-sharing path connects the anchors — and that path is the textbook shared-infrastructure false positive, since reporting the same metrics says nothing about how ground truth was obtained. The answer depends on a capture-protocol detail present in only one paper and its absence in the other, which no metric or topic edge can express."
  - id: dyn-two-things-called-slicing
    text: "Two corpus methods render a frame by taking a slice through a higher-dimensional field, yet the coordinate being sliced means different things. In one, the slice index is an abstract per-frame code with no physical units; in the other it is the rendering timestamp itself. Identify both, say which one still runs a deformation field before slicing, and explain why only one of the two can represent a topological change without any warp."
    anchors: ["ambient coordinate", "temporal slicing"]
    requires: ["2106.13228", "2402.03307", "2011.12948"]
    note: "Answer: HyperNeRF slices at a learned per-frame ambient coordinate and still warps observed points into canonical 3D coordinates first (the Nerfies deformation field is retained), so its slice handles topology while the warp handles motion; 4D-Rotor GS slices the 4D Gaussian field at the render time t directly, producing 3D Gaussians with no warp at all. Nerfies is needed because it is the deformation field HyperNeRF retains."
    hop_rationale: "'ambient coordinate' and 'temporal slicing' both attach to the generic idea of slicing a higher-dimensional representation, giving a plausible one- or two-hop conceptual path that is exactly wrong for this question: the shared word 'slice' is the trap, since one axis is a learned abstract code and the other is physical time. Distinguishing them, and noting that only HyperNeRF still applies a warp beforehand, requires the papers' own definitions rather than any similarity link."
  - id: dyn-direction-of-the-warp
    text: "Nerfies' deformation field and 4D-GS's deformation network both map between a canonical and an observed configuration, but they run in opposite directions and act on different objects. For each, state what is deformed — coordinates fed to a field, or the parameters of a primitive — and in which direction the mapping goes. Then say why the corpus's 4D-Gaussian method needs no such mapping in either direction."
    anchors: ["deformation field", "per-Gaussian deformations"]
    requires: ["2011.12948", "2310.08528", "2402.03307"]
    note: "Answer: Nerfies warps each observed 5D coordinate backwards into canonical template space, where a static NeRF is evaluated — the deformation acts on query coordinates. 4D-GS goes forwards: given a timestamp it predicts per-Gaussian deformations of position, rotation and scale applied to the shared canonical Gaussians — the deformation acts on primitive parameters. 4D-Rotor GS makes time a Gaussian dimension and reads out a frame by slicing, so no canonical-to-observed mapping exists."
    hop_rationale: "Both papers carry the DeformationField method tag, so a one-hop path through that tag links the anchors and establishes only that both deform something. The question asks what is deformed and in which direction — an attribute of each method's formulation, not of the shared tag — so a method-tag path is a false positive, and answering it requires the coordinate-warp description in Nerfies against the parameter-deformation description in 4D-GS."
  - id: dyn-handwritten-cuda-versus-framework-code
    text: "One dynamic radiance-field method in the corpus advertises that it trains in pure PyTorch with no custom kernels, while the fastest dynamic Gaussian method attributes its rendering rates to a hand-optimised CUDA implementation of its slicing and splatting. Identify both, name the earlier corpus method whose fully fused CUDA kernels set this precedent for radiance fields, and state what each side claims to gain by its choice."
    anchors: ["pure PyTorch", "fully fused CUDA kernels"]
    requires: ["2301.10241", "2402.03307", "2201.05989"]
    note: "Answer: K-Planes trains quickly in pure PyTorch with no custom CUDA, trading peak speed for a white-box, easily-modified model; 4D-Rotor GS implements temporal slicing and splatting in a highly optimised CUDA framework and reports 277 FPS on an RTX 3090 and 583 FPS on an RTX 4090; Instant-NGP is the corpus precedent for end-to-end fully fused CUDA kernels with attention to memory bandwidth. The trade is implementation accessibility versus achievable throughput."
    hop_rationale: "Instant-NGP is cited from many corpus papers as a speed baseline, so a short path from any efficiency-related anchor to 'fully fused CUDA kernels' exists and merely reflects its hub status, not any relationship to K-Planes' deliberately kernel-free stance. The question depends on a stated design trade-off inside each paper, and a generic hop through a fast-rendering hub would retrieve the wrong evidence with high confidence."
  - id: dyn-what-the-number-four-refers-to
    text: "Across the corpus's dynamic methods, four is attached to different objects: 4D neural voxels, 4D XYZT Gaussians, a full 4D grid used as a compression baseline, and a 4D MLP that one monocular paper explicitly declines to force the whole scene through. Attribute each usage to its paper and say, for each, whether the four-dimensional object is the scene representation itself, an auxiliary structure, or a rejected baseline."
    anchors: ["4D neural voxels", "4D MLP"]
    requires: ["2310.08528", "2402.03307", "2301.10241", "2105.06468"]
    note: "Answer: 4D-GS's 4D neural voxels are an auxiliary deformation-encoding structure over shared 3D Gaussians; 4D-Rotor GS's XYZT Gaussians are the representation itself; K-Planes' full 4D grid is a rejected dense baseline against which it claims roughly 1000x compression; Gao et al.'s 4D MLP is a rejected architecture — forcing the static background through it wastes capacity and over-smooths, which is why the static/dynamic split exists."
    hop_rationale: "Every anchor here contains '4D', so lexical and topical edges connect them within one hop, and that path is precisely the error mode: it treats four mentions of four-dimensionality as one concept when three of the four papers use it for structurally different objects, one of which is a baseline nobody implements. Only the per-paper text distinguishes representation from auxiliary grid from strawman."
  - id: dyn-which-parts-stay-neural
    text: "Rank the corpus's three explicit dynamic representations by how much neural network remains at inference: one uses a linear feature decoder with a learned colour basis and calls itself a white-box model, one keeps a lightweight MLP to turn grid features into primitive updates, and one has no per-query network in the rendering path at all. Identify each and name the component that remains learned but non-neural in the last case."
    anchors: ["linear feature decoder", "lightweight MLP"]
    requires: ["2301.10241", "2310.08528", "2402.03307"]
    note: "Answer: K-Planes replaces the MLP decoder with a linear decoder over a learned colour basis, claiming white-box status with comparable quality; 4D-GS retains a lightweight MLP that decodes voxel features into per-Gaussian deformations; 4D-Rotor GS evaluates no network per frame — rendering is temporal slicing plus splatting, with the learned but non-neural parameters being the 4D Gaussians themselves (position, rotor orientation, scale, opacity, colour)."
    hop_rationale: "Both anchors are decoder components in factorised radiance-field methods, one hop apart through any 'decoder' or 'explicit representation' concept, and such a path supports the false conclusion that the three methods differ only in decoder size. What the question actually needs — that one method removes the per-query network from the render path entirely — is a structural claim in 4DRotorGS that no decoder-similarity path touches."
  - id: dyn-abrupt-motion-breaks-smoothness
    text: "4D-Rotor GS argues that canonical-space methods fail on abrupt motions because the deformation network must absorb discontinuities. Which corpus paper's regulariser most directly encodes the smoothness assumption being violated, and does the critique also apply to the dynamic Gaussian method that predicts deformations with a small MLP over a voxel grid? Justify from how each represents motion."
    anchors: ["abrupt motions", "elastic energy"]
    requires: ["2402.03307", "2011.12948", "2310.08528"]
    note: "Answer: Nerfies' elastic energy penalty on the deformation Jacobian explicitly pushes the warp toward soft-body, near-rigid behaviour, which is the smoothness assumption abrupt motion violates; the coarse-to-fine frequency schedule reinforces it. The critique does extend to 4D-GS, which is also canonical-plus-deformation — its lightweight MLP over the decomposed voxel grid must represent the discontinuity as a deformation of persistent shared Gaussians — whereas 4D-Rotor GS gives appearing/disappearing content its own primitives with narrow temporal extent."
    hop_rationale: "Nerfies and 4D-GS both carry deformation-field machinery, so a short path joins the anchors through the deformation concept and shows only that a critique of deformation fields could touch both. The question demands that the reader work out that 4D-GS falls inside the criticised class despite being a Gaussian method contemporaneous with the critic — an inference from the two methods' motion representations, not from any citation or tag edge, which is why a generic path would be no evidence."
  - id: dyn-where-the-frame-rate-gap-comes-from
    text: "Two dynamic Gaussian methods in the corpus report very different rendering rates on the same class of GPU, one around 82 FPS at 800x800 and the other several times higher. Explain the structural difference in what each must compute before rasterising a frame — temporal slicing and splatting versus a query into a neural voxel grid followed by an MLP — and say why the plane-factorised radiance field in the corpus cannot reach either figure regardless of implementation."
    anchors: ["temporal slicing and splatting", "neural voxel grid"]
    requires: ["2402.03307", "2310.08528", "2301.10241"]
    note: "Answer: 4D-GS must, per timestamp, sample its decomposed neural voxel grid and run a lightweight MLP to produce per-Gaussian deformations before splatting — 82 FPS at 800x800 on an RTX 3090. 4D-Rotor GS only slices its 4D Gaussians at t in a hand-optimised CUDA pipeline and splats — 277 FPS on a 3090, 583 on a 4090. K-Planes renders by sampling planes and decoding per query point along rays in pure PyTorch, an integration-based path with no rasteriser, so it is not in that regime."
    hop_rationale: "Both anchors belong to real-time dynamic Gaussian methods that share the RealTimeRendering tag and the FPS metric, so a one-hop path through either exists and is the archetypal shared-infrastructure false positive — reporting FPS is not a relationship. Attributing the gap to per-frame MLP evaluation versus pure slicing requires each paper's own description of the per-timestamp work, which the tag path does not carry."
  - id: dyn-temporal-smoothness-prior-versus-discontinuity
    text: "K-Planes makes temporal smoothness easy to impose as a penalty on its time-axis planes, and Nerfies' regularisers similarly bias toward smooth deformation. Name the corpus method whose central claim would be undermined by imposing such a prior, and explain what it uses in place of smooth motion to represent content that appears or disappears mid-sequence."
    anchors: ["temporal smoothness", "narrow temporal extent"]
    requires: ["2301.10241", "2011.12948", "2402.03307"]
    note: "Answer: 4D-Rotor GS. Its selling point is fidelity under sudden movement and emerging/disappearing content, achieved by giving such content 4D Gaussians with narrow temporal extent rather than a smooth deformation of a persistent primitive; a temporal-smoothness prior over the representation would suppress exactly the discontinuities it exists to capture. K-Planes' TV penalty on time-involving planes and Nerfies' elastic energy are the two explicit smoothness impositions being contrasted."
    hop_rationale: "Both anchors are temporal-modelling terms in the dynamic sub_topic, so a two-hop path exists via 'time axis' or 'dynamic scene' and would connect any pair of these papers. But the question is about a conflict — a prior that helps two methods would break a third's core claim — and conflict is not what topical adjacency encodes; only the papers' stated motivations establish that narrow temporal extent is a deliberate alternative to smoothness rather than another flavour of it."
  - id: dyn-how-many-planes-carry-time
    text: "For a four-dimensional scene, how many feature planes does the d-choose-2 construction require, and which of them involve the time axis? Compare with the plane arrangement described for the deformation-encoding grid of the dynamic Gaussian method inspired by HexPlane, and state what the fourth dynamic method in the corpus uses instead of any plane decomposition."
    anchors: ["six planes", "three orthogonal planar projections"]
    requires: ["2301.10241", "2310.08528", "2402.03307"]
    note: "Answer: K-Planes needs six planes for d=4 — xy, xz, yz, xt, yt, zt — with the last three carrying time and initialised to identity so only genuinely time-varying content deviates; static d=3 needs three. 4D-GS's HexPlane-style grid is described as three orthogonal planar projections plus a small set of feature planes encoding the 4D function, feeding a deformation MLP. 4D-Rotor GS uses no planes: motion lives in the 4D primitive and is read out by slicing."
    hop_rationale: "'six planes' and 'three orthogonal planar projections' are near-synonymous surface forms of planar factorisation and will be one hop apart under any lexical or concept linking, which is misleading because the two factorise different functions to different ends — a radiance field versus a deformation field. Counting planes and identifying which axes they span is a per-paper detail that a similarity path flattens rather than resolves."
  - id: dyn-poses-for-casually-captured-motion
    text: "Nerfies and the monocular dynamic view-synthesis paper both reconstruct from handheld, casually captured video. The coarse-to-fine annealing of positional-encoding frequencies that Nerfies applies to its deformation field appears in one other corpus paper applied to a different unknown, framed as synthesis-based bundle adjustment. Identify that paper and unknown, and explain why the failure it targets is a live risk in exactly this capture setting."
    anchors: ["coarse-to-fine annealing", "bundle adjustment"]
    requires: ["2011.12948", "2105.06468", "2104.06405"]
    note: "Answer: BARF, applying the same frequency-masking schedule to camera extrinsics — it jointly optimises poses and the radiance field because high-frequency positional encoding makes the pose gradient landscape spiky. BARF states the trick appeared concurrently in Nerfies for deformation fields. The risk is live for casual handheld dynamic captures like Nerfies' selfies and Gao et al.'s monocular clips, where the upstream SfM pose estimate is exactly what a moving scene degrades."
    hop_rationale: "BARF and Nerfies share the coarse-to-fine annealing string, so a lexical edge joins the anchors in one hop; that shortcut supports the wrong reading, namely that the two solve the same problem, when one anneals to escape deformation-field local minima and the other to make camera pose recoverable. Establishing which unknown each optimises, and why casual monocular capture of a deforming scene is where the pose assumption is fragile, needs all three papers' text."
  - id: dyn-what-the-shared-rasteriser-receives
    text: "Both dynamic Gaussian methods in the corpus ultimately hand 3D Gaussians to the same style of differentiable tile rasteriser, whose gradients with respect to position, scale, rotation, opacity and colour are documented in the corpus's mathematical supplement for a splatting library. For each method, state what produces the 3D Gaussians the rasteriser receives at time t, and which method therefore has an extra learned module sitting between the stored parameters and that backward pass."
    anchors: ["differentiable rasteriser", "front-to-back alpha compositing"]
    requires: ["2310.08528", "2402.03307", "2312.02121"]
    note: "Answer: 4D-GS produces them by deforming shared canonical Gaussians with an MLP over decomposed voxel features, so gradients pass through that MLP before reaching stored parameters; 4D-Rotor GS produces them by temporally slicing its 4D Gaussians, so gradients reach the primitives directly. The gsplat supplement is the corpus reference for the projection, tile rasterisation, front-to-back alpha compositing and the exact gradient flow through position, scale, rotation, opacity and colour that both reuse."
    hop_rationale: "Every Gaussian paper in this corpus is within one or two hops of the rasteriser concept and of the gsplat supplement, which explicitly names dynamic methods among its reusers, so a short generic path is guaranteed and only restates ecosystem membership. The question asks what stands between stored parameters and the backward pass in each method — an asymmetry between the two that no shared-substrate path expresses."
  - id: dyn-ctrl-hexplane-parameter-budget
    text: "At matched reconstruction quality on dynamic scenes, how many parameters does HexPlane's own four-dimensional decomposition use compared with K-Planes' six-plane factorisation, and which of the two reports the better memory-to-quality ratio?"
    anchors: ["HexPlane", "six planes"]
    control: true
    legacy_gameable: true
    requires: []
    note: "Unanswerable from the corpus: HexPlane is named only as the inspiration for 4D-GS's decomposed neural voxel encoding and has no paper of its own in the 50-document set, so no HexPlane parameter count, quality figure, or memory ratio exists anywhere. K-Planes reports only a roughly 1000x compression against a dense 4D grid, never a parameter-level comparison against HexPlane, and no other corpus paper benchmarks the two against each other."
    hop_rationale: "Both anchors are one or two hops apart in any graph built from this corpus, since 4D-GS mentions HexPlane and shares the planar-factorisation concept with K-Planes, so a retriever will find a short, confident path and be tempted to answer. That path carries only the inspiration relation, not any parameter budget for a paper the corpus does not contain — making short-path proximity actively misleading here, which is what this control is for."
  - id: dyn-ctrl-dnerf-benchmark-head-to-head
    text: "On the D-NeRF synthetic dynamic benchmark, what PSNR do 4D Gaussian Splatting and 4D-Rotor Gaussian Splatting each report, and by what margin does the winner lead?"
    anchors: ["D-NeRF", "4D-Rotor Gaussian Splatting"]
    control: true
    legacy_gameable: true
    requires: []
    note: "Unanswerable from the corpus: D-NeRF appears only as a named baseline inside the Nerfies text, with no dataset description or numbers, and neither dynamic Gaussian paper in the corpus records any dataset or reconstruction-quality figure — both list FPS as their only metric (82 FPS at 800x800 for 4D-GS; 277 and 583 FPS for 4D-Rotor GS). No corpus document contains a PSNR value for either method on any named dynamic benchmark, so no head-to-head margin can be derived."
    hop_rationale: "'D-NeRF' and '4D-Rotor Gaussian Splatting' are both inside the dynamic sub_topic and both attach to evaluation vocabulary, so a two-hop path through the dynamic-scene or metric nodes is easy to produce and looks like support for a benchmark comparison. It is not: proximity through a benchmark-flavoured hub is precisely the false positive this control catches, since the corpus stores no dataset entries and no PSNR values for either method."
  - id: dyn-ctrl-elastic-regulariser-ablation
    text: "By how much does LPIPS degrade when the elastic regularization is ablated from HyperNeRF's ambient-slice model, and does removing it hurt moment interpolation or novel-view synthesis more?"
    anchors: ["elastic regularization", "ambient slice"]
    control: true
    legacy_gameable: true
    requires: []
    note: "Unanswerable from the corpus: HyperNeRF's text states only that Nerfies' elastic regularization and coarse-to-fine positional encoding are reused, and reports aggregate improvements over Nerfies of 4.1% LPIPS for moment interpolation and 8.6% for novel-view synthesis. No corpus document reports an ablation of the elastic term in either Nerfies or HyperNeRF, so neither the magnitude nor the per-task split of its removal can be recovered."
    hop_rationale: "The two anchors co-occur inside a single paper's description — HyperNeRF reuses the elastic regulariser and performs the ambient slice — so the shortest possible path exists and a retriever will return that passage with high confidence. A zero-hop co-occurrence is still no evidence for an ablation number that was never measured in the corpus, which makes this the strongest form of the plausible-but-unanswerable trap."

  # ---- sds ----
  - id: sds-score-jacobian-vs-vsd
    text: "DreamFusion's SDS deliberately drops the score-Jacobian term of the diffusion model to obtain a stable per-step update, while ProlificDreamer's Variational Score Distillation adds a second, learned score alongside the frozen prior. What does VSD's extra score term restore at the same point in the objective, and why does Magic3D's fidelity gain over DreamFusion require touching neither term?"
    anchors: ["score-Jacobian", "Variational Score Distillation"]
    requires: ["2209.14988", "2305.16213", "2211.10440"]
    note: "Gold: DreamFusion states SDS skips the score-Jacobian term to get a backpropagatable per-step update; ProlificDreamer states SDS is the single-particle/delta-posterior limit of VSD and that the resulting score is biased toward the prior mean, which the learned variational score corrects; Magic3D's contributions (hash-grid coarse stage, mesh stage against a high-resolution latent diffusion model) are representation- and resolution-level, leaving the estimator identical. The answer must place all three changes at their correct level of the pipeline."
    hop_rationale: "All three papers carry the TextTo3D + Diffusion method tags and both successors cite DreamFusion, so a two-hop path anchor -> DreamFusion -> anchor exists for essentially any pair of terms in this theme. That path only proves shared lineage. Answering requires the direction and location of each modification: that the Jacobian omission is a deliberate estimator-level trade, that VSD's second score acts at exactly that estimator, and that Magic3D's improvement is orthogonal to it. A generic lineage edge encodes none of those distinctions, so a short path is not evidence."
  - id: sds-resolution-vs-posterior-diagnosis
    text: "Magic3D and ProlificDreamer both claim DreamFusion's results are insufficiently detailed but blame different causes: the resolution at which the prior supervises versus the shape of the distribution SDS optimises. If a pipeline adopted Magic3D's high-resolution latent diffusion model supervision while keeping plain SDS, which paper's reported failure mode would survive, and why?"
    anchors: ["high-resolution latent diffusion model", "over-saturation"]
    requires: ["2211.10440", "2305.16213", "2209.14988"]
    note: "Gold: Magic3D attributes low quality to low-resolution image-space supervision and fixes it with the latent diffusion + rasterizer stage; ProlificDreamer attributes over-saturation, over-smoothing and low diversity to the point-estimate treatment of the 3D parameter, a property of the objective that higher-resolution supervision cannot remove. Correct answer: the saturation/diversity pathology survives; blur from supervision resolution does not."
    hop_rationale: "Both anchors sit inside papers that share the Diffusion/TextTo3D tags and both papers name DreamFusion, so a retriever can join them in one or two hops through the common ancestor or through the shared 'diffusion prior' concept. That connection is symmetric and says nothing about which deficiency each fix removes. The question demands a causal attribution per paper and a counterfactual composition of the two fixes, which is only recoverable by reading each paper's stated diagnosis, not from the fact that they are adjacent in a citation graph."
  - id: sds-hashgrid-vs-time-schedule
    text: "Magic3D accelerates DreamFusion by replacing vanilla NeRF with an Instant-NGP sparse 3D hash grid, whereas ProlificDreamer reports gains from a distillation time schedule and density initialisation that it explicitly calls orthogonal to the distillation algorithm. Which of these changes would transfer unchanged to a pipeline built on a different 3D representation, and which is bound to the backbone?"
    anchors: ["sparse 3D hash grid", "distillation time schedule"]
    requires: ["2211.10440", "2305.16213", "2201.05989"]
    note: "Gold: Instant-NGP supplies the multi-resolution hash encoding and its speed claim; Magic3D adopts it as the coarse-stage backbone, so the speedup is representation-bound; ProlificDreamer's time schedule and density initialisation are described as design-space choices orthogonal to the distillation algorithm and therefore portable across backbones. The answer must separate backbone-level from schedule-level acceleration."
    hop_rationale: "Instant-NGP is cited by a large fraction of the corpus and Magic3D lists HashEncoding among its methods, so 'sparse 3D hash grid' reaches almost any radiance-field term in one hop; likewise both anchors connect through the generic 'faster optimisation' notion. Such a path cannot distinguish an acceleration that presupposes a hash-grid field from one that only reweights the diffusion timesteps. The transfer argument requires reading ProlificDreamer's orthogonality claim and Magic3D's dependence on the Instant-NGP structure, which no short generic edge carries."
  - id: sds-mesh-stage-lineage
    text: "Magic3D extracts a triangle mesh by marching cubes and keeps optimising it, ProlificDreamer appends a mesh fine-tuning stage after its NeRF, and DreamGaussian exports a mesh from an optimised Gaussian set. For each, what representation does the mesh initialise from and what supervises the mesh stage, and which of the three changes the distillation objective at that transition rather than only the geometry?"
    anchors: ["marching cubes", "mesh fine-tuning"]
    requires: ["2211.10440", "2305.16213", "2309.16653"]
    note: "Gold: Magic3D initialises the mesh from the coarse hash-grid NeRF via marching cubes and continues SDS against a high-resolution latent diffusion model through a differentiable rasterizer; ProlificDreamer initialises the mesh from its VSD-optimised NeRF and fine-tunes it with VSD, i.e. the objective differs; DreamGaussian exports from Gaussians and refines UV-space texture against the diffusion prior. Only ProlificDreamer's mesh stage runs a different distillation objective than DreamFusion-style SDS."
    hop_rationale: "'Marching cubes' and 'mesh fine-tuning' both belong to the generic mesh-extraction cluster that touches SuGaR, DreamGaussian, Magic123 and Magic3D, so a one-hop path via 'textured mesh' or 'mesh extraction' exists trivially and would also connect papers irrelevant to score distillation. The question is about which upstream representation feeds each mesh and whether the loss changes at the handoff — a directed, per-paper pairing of (source representation, supervising objective) that a shared 'mesh' node flattens away entirely."
  - id: sds-two-stage-vs-compositional
    text: "Magic3D's coarse-to-fine pipeline and GALA3D's instance-scene compositional optimisation are both two-phase, but they split the problem along different axes. What is carried from the first phase to the second in each, and in what different way does DreamFusion's single-stage SDS loop fail in each of the two settings?"
    anchors: ["coarse-to-fine", "instance-scene compositional optimisation"]
    requires: ["2211.10440", "2402.07207", "2209.14988"]
    note: "Gold: Magic3D splits along fidelity/representation (coarse hash-grid NeRF -> textured mesh at higher resolution), so DreamFusion's failure there is slowness and low-resolution supervision; GALA3D splits along scene scope (per-object layout-guided Gaussians -> joint instance-scene refinement that also revises the layout), so DreamFusion's failure there is the collapse of a monolithic field on multi-object prompts. The answer must name both axes and both distinct failure modes."
    hop_rationale: "'Coarse-to-fine' is one of the most generic strings in the corpus — NeRF's hierarchical sampling, Magic123, and several SLAM papers use it — so a short path from it to any optimisation term is guaranteed and carries no information. The relationship asked for is that two superficially identical staged pipelines partition different variables, and that the same baseline fails for unrelated reasons in each. Establishing that needs both papers' motivations read side by side; the generic staged-optimisation edge would equally connect Magic123 or NICE-SLAM, which are irrelevant here."
  - id: sds-monolithic-field-collapse
    text: "GALA3D claims SDS-based pipelines collapse on prompts naming several distinct entities. Which property of DreamFusion's Score Distillation Sampling update leaves a single monolithic field unable to enforce separation and scale between objects, and why do GALA3D's adaptive geometric constraints act at a place ProlificDreamer's fix to the same objective never touches?"
    anchors: ["adaptive geometric constraints", "Score Distillation Sampling"]
    requires: ["2402.07207", "2209.14988", "2305.16213"]
    note: "Gold: DreamFusion's update is a single prompt-conditioned image-space score applied to one global field rendered from a random camera, with no notion of instances; GALA3D adds per-object Gaussian groups with bounding-box-derived geometric priors, i.e. structure in the representation; ProlificDreamer changes the estimator (particles / variational score) but keeps one undifferentiated scene parameterisation, so it cannot supply inter-object constraints. Answer must contrast representation-level versus estimator-level intervention."
    hop_rationale: "'Score Distillation Sampling' is the hub term of this entire theme and is one hop from every generative paper in the corpus, including GALA3D's own framing sentence, so a short path is unavoidable and meaningless. The question requires identifying the specific missing ingredient (no instance decomposition in the score's input) and then showing that a correction to the same objective (VSD) is not a substitute. That is an argument about where in the pipeline each method intervenes, which no SDS-adjacency edge expresses."
  - id: sds-layout-vs-inpainting
    text: "GALA3D's layout-guided 3D Gaussian representation and LucidDreamer's Dreaming and Alignment loop both build multi-object scenes from 2D diffusion priors with no scene-scale 3D data. Where does scene structure come from in each, and which of the two still relies on a DreamFusion-style score gradient to place geometry rather than on lifted image content?"
    anchors: ["layout-guided 3D Gaussian representation", "Dreaming and Alignment"]
    requires: ["2402.07207", "2311.13384", "2209.14988"]
    note: "Gold: GALA3D gets structure from an LLM-emitted layout of named objects and boxes, then optimises Gaussians under conditioned diffusion guidance in the SDS lineage; LucidDreamer gets structure by inpainting novel views and lifting them with monocular depth into a point cloud, then runs a standard photometric 3DGS fit — no score distillation places its geometry. The corpus states the two differ mainly in inpainting-driven point cloud versus LLM layout."
    hop_rationale: "Both papers are Gaussian-based open-domain scene generators and the corpus explicitly calls them contemporaries, so a one-hop 'related work' style link between them almost certainly exists; that link states similarity, which is the opposite of what the question needs. The answer hinges on an asymmetry — one pipeline derives geometry from lifted 2D content and photometric fitting, the other from a layout prior plus diffusion-guided optimisation — so the very edge a retriever would find (they are alike) is misleading unless the mechanisms are read."
  - id: sds-diversity-source
    text: "ProlificDreamer treats SDS's low-diversity outputs as a consequence of collapsing the 3D parameter to a point estimate, while Instant3D inherits diversity from its diffusion sampler and never runs a distillation loop at all. Which of the two removes the cause DreamFusion's formulation introduces, and which merely avoids being exposed to it?"
    anchors: ["low-diversity", "diffusion sampler"]
    requires: ["2305.16213", "2311.06214", "2209.14988"]
    note: "Gold: DreamFusion optimises one deterministic 3D parameter set against a frozen prior; ProlificDreamer diagnoses this as the source of mode collapse and fixes it by making the parameter a random variable (VSD); Instant3D replaces per-prompt optimisation with a multi-view generator plus feed-forward reconstruction, so the diversity comes from ancestral sampling and the SDS collapse mechanism is simply never instantiated. The distinction is fix-versus-sidestep."
    hop_rationale: "Diversity is a shared vocabulary item across every generative paper here, and Instant3D names ProlificDreamer directly when discussing speed, so a one- or two-hop path exists purely from co-mention. Co-mention does not distinguish removing a cause from avoiding a regime. The question needs ProlificDreamer's causal account of mode collapse plus Instant3D's architectural claim that no distillation loop is run, and then the judgement that only the former addresses the mechanism — a comparison no short generic edge encodes."
  - id: sds-view-consistency-vs-janus
    text: "DreamFusion argues its output is view-consistent because a random camera is sampled at every step against a single prompt-conditioned distribution. Instant3D asserts that this class of per-prompt optimisation is exactly what produces Janus artefacts. Which assumption in DreamFusion's argument does that deny, and does ProlificDreamer's analysis of the SDS estimator support or undercut Instant3D's position?"
    anchors: ["random camera", "Janus"]
    requires: ["2209.14988", "2311.06214", "2305.16213"]
    note: "Gold: DreamFusion assumes that constraining every random-camera render toward one prompt-conditioned image distribution is sufficient for 3D consistency; Instant3D denies this because a 2D prior with no cross-view coupling admits per-view canonical interpretations (Janus), and fixes it by generating canonicalised view-consistent images first; ProlificDreamer's finding that the SDS score is biased toward the prior mean and mode-seeking supports the claim that per-view prior optimisation locks onto canonical interpretations."
    hop_rationale: "'Random camera' and 'Janus' both attach to the generic multi-view-consistency concept that touches nearly every generative and novel-view-synthesis paper in the corpus, so a two-hop route through 'view consistency' is trivial and would also connect Zero-1-to-3, LGM and MVSplat. The question asks which specific premise of one paper's consistency argument another paper contradicts, and whether a third paper's estimator analysis is corroborating evidence. That is a stance-and-support relation over three texts, which a shared-topic path cannot certify."
  - id: sds-speedup-compatibility
    text: "Magic3D buys speed with a hash-grid coarse stage and a differentiable rasterizer at mesh resolution; DreamGaussian buys it by distilling into explicit Gaussians grown by progressive densification. Both measure against DreamFusion. Do the two speedups attack the same cost or compose, and which of them also changes what the diffusion prior is asked to supervise?"
    anchors: ["differentiable rasterizer", "progressive densification"]
    requires: ["2211.10440", "2309.16653", "2209.14988"]
    note: "Gold: DreamFusion's dominant cost is querying the NeRF MLP at many points per ray; Magic3D removes part of it with a hash grid and moves supervision to a rasterised mesh at latent-diffusion resolution (changing what is supervised); DreamGaussian removes the same sampling cost by replacing the implicit volume with explicit primitives that densify toward occupied regions, while still supervising rendered novel views by SDS. The answer must separate the shared bottleneck from the supervision change."
    hop_rationale: "Both anchors sit under the umbrella of 'fast differentiable rendering', which links Magic3D, DreamGaussian, 3DGS and Instant-NGP within one hop; any retriever will find that route, and it says only that both papers render quickly. The question demands an accounting of which underlying cost each removes and whether the supervision target changes with it, i.e. whether the two accelerations are redundant. Redundancy-versus-composition is not a property of adjacency, so a short path is not evidence."
  - id: sds-conditioned-diffusion-vs-particles
    text: "GALA3D refines its scene with a conditioned diffusion prior applied over per-object Gaussian groups, while ProlificDreamer's particle-based variational framework maintains an ensemble of whole-scene parameterisations. Both decline to commit to a single 3D estimate — what exactly is being multiplied in each case, and would GALA3D's grouping deliver the diversity benefit VSD claims?"
    anchors: ["conditioned diffusion", "particle-based variational framework"]
    requires: ["2402.07207", "2305.16213", "2209.14988"]
    note: "Gold: ProlificDreamer multiplies hypotheses over the same scene (particles approximating a posterior over 3D parameters), which is what buys diversity and fixes SDS's mode-seeking bias; GALA3D multiplies entities within one scene (per-object Gaussian groups under layout constraints), which buys compositional control, not posterior coverage. Both depart from DreamFusion's single global point estimate but along orthogonal axes; grouping alone does not give VSD's diversity."
    hop_rationale: "Both anchors reduce to 'multiple things optimised under a diffusion prior', a shared abstraction reachable in one hop through the Diffusion tag that also captures LGM's multi-view stack and DreamGaussian's primitive set. That abstraction is precisely the trap: superficially both papers hold several parameter groups at once. Answering requires distinguishing multiplicity over hypotheses from multiplicity over objects, and then denying that one implies the other — a discrimination that a short generic path actively encourages getting wrong."
  - id: sds-control-axes-editing
    text: "Magic3D's image-conditioned generation, Magic123's textual inversion token, and GALA3D's controllable editing all hand the user control, but at different stages. Which handle acts on the diffusion guidance and which acts on the 3D representation, and which of them still exists after the asset has been exported?"
    anchors: ["image-conditioned generation", "controllable editing"]
    requires: ["2211.10440", "2402.07207", "2306.17843"]
    note: "Gold: Magic3D's reference image steers texture/style while the prompt steers content — guidance-side control during optimisation; Magic123's textual inversion encodes the reference identity into a token reused by the diffusion guidance — also guidance-side; GALA3D's control is representation-side, since objects in the layout can be moved, resized or swapped and re-optimised, and the per-object Gaussian grouping persists in the output asset."
    hop_rationale: "'Controllability' is a claim made by most generative papers in the corpus, so both anchors sit one hop from a generic control/editing concept that also reaches Feature 3DGS and Scaffold-GS. Such a path shows only that each paper advertises control. The question requires locating each mechanism on the pipeline (prior conditioning versus scene parameterisation) and then reasoning about persistence after export, which depends on what the output representation actually retains — information the generic 'supports editing' edge deliberately abstracts away."
  - id: sds-initialisation-corrected-later
    text: "Three initialisations in this line are later revised by the optimisation itself: ProlificDreamer's density initialisation, Magic3D's coarse NeRF that seeds the mesh stage, and GALA3D's coarse layout priors from an LLM. In which of these is the initialisation an explicit variable the later stage is permitted to change, and what does the paper say goes wrong if it is left as given?"
    anchors: ["density initialisation", "coarse layout priors"]
    requires: ["2305.16213", "2402.07207", "2211.10440"]
    note: "Gold: GALA3D explicitly adjusts the LLM-derived layout during instance-scene compositional optimisation so that scale, contact and relative position become plausible — the layout is a variable; Magic3D's coarse NeRF is consumed as an initialisation and re-parameterised into a deformable mesh, so it is transformed rather than corrected as a prior; ProlificDreamer's density initialisation is a fixed design choice reported as an orthogonal improvement, not something re-estimated. Answer must identify GALA3D as the case with a mutable prior."
    hop_rationale: "Initialisation is shared infrastructure across the corpus — 3DGS's SfM seeding, LucidDreamer's point cloud, NeRF's coarse network — so a one-hop path through a generic 'initialisation' concept connects the anchors and dozens of irrelevant papers. What the question needs is a modal distinction: is the initial estimate frozen, transformed, or treated as an optimisable prior that the second stage corrects. That status is stated in each paper's own description of its second stage and is invisible to any 'both use an initialisation' edge."
  - id: sds-frozen-prior-constraint
    text: "DreamFusion stresses that it requires no modifications to the image diffusion model. Instant3D fine-tunes a text-to-image model to emit four canonicalised view-consistent images, and ProlificDreamer trains a second score network beside the pretrained prior. Which of those two actually breaks DreamFusion's constraint, and what does each purchase by its relationship to the prior?"
    anchors: ["no modifications to the image diffusion model", "view-consistent images"]
    requires: ["2209.14988", "2311.06214", "2305.16213"]
    note: "Gold: Instant3D breaks the constraint — it fine-tunes the diffusion model itself, buying multi-view consistency and Janus avoidance plus feed-forward speed; ProlificDreamer leaves the pretrained prior frozen and adds a separate learned variational score, so DreamFusion's purity claim survives while the estimator bias is corrected. The distinction is modifying the prior versus augmenting the objective around a frozen prior."
    hop_rationale: "Every paper in this theme uses a pretrained 2D diffusion prior, so both anchors are one hop from that hub and a path will always exist; it establishes only shared dependence on the same class of model. The question turns on a fine distinction — fine-tuning the prior's weights versus training an auxiliary network beside untouched weights — which the hub node explicitly abstracts over. Getting it right requires reading Instant3D's first stage and ProlificDreamer's construction of VSD, not observing that all three sit next to 'diffusion prior'."
  - id: sds-zero123-prior-swap
    text: "Zero-1-to-3 drops a viewpoint-conditional diffusion model into the same distillation loop DreamFusion defined. Which components of that recipe are prior-agnostic and therefore unchanged by the swap, and would ProlificDreamer's finding that the SDS score is biased toward the prior mean still apply once the prior is pose-conditioned?"
    anchors: ["viewpoint-conditional", "prior mean"]
    requires: ["2303.11328", "2209.14988", "2305.16213"]
    note: "Gold: DreamFusion's loop — random camera render, noise, use the denoising direction as a gradient through a differentiable renderer, with the Jacobian term skipped — is agnostic to which conditional diffusion model supplies the score, which is why Zero-1-to-3 can substitute its Objaverse-trained pose-conditioned model and use it as an SDS prior for single-view reconstruction; ProlificDreamer's bias argument is about the delta-posterior treatment of the 3D parameter, not about the prior's conditioning, so it still applies."
    hop_rationale: "Zero-1-to-3 cites DreamFusion for SDS and ProlificDreamer analyses SDS, so both anchors are within two hops of the SDS hub and a path is guaranteed by construction of this literature. That path shows shared use of one loss and nothing about substitutability. The question needs a decomposition of the loop into prior-dependent and prior-independent parts, plus a judgement that a bias derived from the parameterisation persists under a change of prior — a transfer argument that a co-citation edge cannot support."
  - id: sds-gala3d-init-vs-3dgs
    text: "3D Gaussian Splatting seeds primitives from a Structure-from-Motion point cloud and grows them with an interleaved densification and pruning schedule driven by reconstruction gradients from captured views. A generated scene has neither an SfM cloud nor ground-truth images. What does GALA3D's layout-guided 3D Gaussian representation supply in place of that seeding, and what provides the gradient that densification would otherwise consume?"
    anchors: ["interleaved densification and pruning", "layout-guided 3D Gaussian representation"]
    requires: ["2402.07207", "2308.04079", "2209.14988"]
    note: "Gold: 3DGS's two enabling mechanisms are SfM initialisation near the true surface and gradient-triggered clone/split/prune; GALA3D replaces the first with LLM-derived per-object bounding boxes and per-object Gaussian groups under adaptive geometric constraints, and replaces the photometric gradient with score gradients from a conditioned diffusion prior in the DreamFusion lineage, applied to renders of the composed scene."
    hop_rationale: "GALA3D is tagged GaussianSplatting and 3DGS is the representation hub of the corpus, so the anchors are joined in one hop by construction — that edge is the single least informative link available here. The question asks what substitutes for two specific 3DGS mechanisms whose preconditions (captured views, SfM geometry) do not exist in a generative setting, which requires knowing what those mechanisms depend on and what the generative pipeline supplies instead. 'GALA3D uses Gaussians' is exactly the shared-infrastructure fact that must be excluded as evidence."
  - id: sds-covariance-vs-vertex-dof
    text: "Compare the geometric degrees of freedom exposed to the optimiser in three text-to-3D backbones: 3DGS's per-primitive anisotropic covariance, Magic3D's mesh with deformable vertex positions, and GALA3D's per-object Gaussian groups under box-derived constraints. Which parameterisation lets the optimisation change topology, and which confines it to local shape refinement?"
    anchors: ["anisotropic covariance", "deformable vertex positions"]
    requires: ["2308.04079", "2211.10440", "2402.07207"]
    note: "Gold: 3DGS's free primitives with full 3x3 anisotropic covariance plus clone/split/prune can add or remove content and thus change effective topology; Magic3D's stage-two mesh has a fixed connectivity extracted by marching cubes, so vertex deformation refines shape but cannot re-open topology, which is why the coarse stage must get the shape right first; GALA3D keeps Gaussians' freedom but bounds each group geometrically to its layout box, restricting where capacity may go."
    hop_rationale: "Both anchors are per-primitive parameter names attached to their papers' representation sections, and both are one hop from the generic 'differentiable geometry parameters' notion shared by SuGaR, 2DGS and Scaffold-GS. That path says the three methods all optimise geometry. The question is about the reach of each parameterisation — whether the gradient can add, remove or reconnect content, or only nudge existing elements — which depends on connectivity constraints and densification rules described in the respective papers, not on the fact that all three optimise geometric parameters."
  - id: sds-volumetric-effects-vs-mesh
    text: "ProlificDreamer offers complex effects such as smoke and translucency as evidence that VSD retains fine volumetric structure. Magic3D converts its field into a triangle mesh at stage two, and DreamGaussian exports a mesh as its final asset. At which point in each pipeline would such an effect stop being representable, and what does each paper offer in its place?"
    anchors: ["complex effects", "triangle mesh"]
    requires: ["2305.16213", "2211.10440", "2309.16653"]
    note: "Gold: ProlificDreamer's evidence lives in the 512x512 NeRF renders, i.e. in the volumetric stage, before its optional mesh fine-tuning; Magic3D's marching-cubes extraction at the start of stage two commits the scene to surface geometry with a deformable-vertex mesh and UV texture; DreamGaussian's Marching-Cubes-style export plus UV texture refinement does the same after the Gaussian stage. Each mesh paper trades volumetric expressiveness for graphics-pipeline compatibility and speed."
    hop_rationale: "'Triangle mesh' sits in the mesh-extraction cluster that touches half the corpus, and 'complex effects' reduces to a generic quality claim, so a two-hop path through 'high fidelity output' or 'mesh export' is trivially available and would connect SuGaR or Magic123 just as well. The question asks where along each pipeline a specific representational capability is surrendered and what compensates — a stage-level localisation across three different pipelines. A generic quality/mesh path gives no stage information at all."
  - id: sds-control-vsd-particle-count
    text: "How many particles does ProlificDreamer's Variational Score Distillation ensemble maintain in its reported experiments, and how far does sample diversity fall as the particle count is reduced toward the single-particle limit?"
    anchors: ["Variational Score Distillation", "particle-based variational framework"]
    control: true
    legacy_gameable: true
    requires: []
    note: "Unanswerable from the corpus: ProlificDreamer is described as updating 'a small ensemble' of 3D parameterisations and SDS is identified as the single-particle/delta-posterior limit, but no particle count is stated anywhere, and no measurement — no table, metric or qualitative trend — relates diversity to particle count. No other paper in the 50-document corpus reruns VSD or ablates it, so the number and the trend exist nowhere in the text."
    hop_rationale: "Both anchors occur in the same paper and are effectively zero hops apart, so any retriever returns a confident, tightly connected neighbourhood. That is exactly the false positive to catch: topical adjacency at maximum strength while the requested quantity is absent from both endpoints. A short path here is evidence of nothing but shared vocabulary."
  - id: sds-control-schedule-numbers
    text: "Over which diffusion timestep range does ProlificDreamer's distillation time schedule anneal from slow to fast, and at what grid resolution does Magic3D's sparse 3D hash grid stop subdividing during the coarse stage?"
    anchors: ["distillation time schedule", "sparse 3D hash grid"]
    control: true
    legacy_gameable: true
    requires: []
    note: "Unanswerable from the corpus: both techniques are named and their purpose described — a slow-to-fast annealing of distillation timesteps, and an Instant-NGP-style hash grid used to accelerate the coarse stage — but no hyperparameter values appear for either. The corpus states Instant-NGP's typical level count in general terms only, never Magic3D's configuration, and gives no timestep bounds, noise levels or schedules for any distillation method."
    hop_rationale: "The two anchors are joined within two hops through the DreamFusion-successor lineage and through the shared 'faster/better text-to-3D optimisation' framing, so a plausible path is guaranteed. Retrieval will surface both methods' descriptive paragraphs and look authoritative, yet neither paragraph contains a single numeric setting. Path length is uninformative precisely because the missing content is numeric detail the prose never carried."
  - id: sds-control-gala3d-user-study
    text: "In the head-to-head user study comparing GALA3D's controllable editing against LucidDreamer's generated scenes, what percentage of raters preferred GALA3D, and which prompt set was used?"
    anchors: ["controllable editing", "user study"]
    control: true
    legacy_gameable: true
    requires: []
    note: "Unanswerable from the corpus: the only human-preference number in the 50 papers is Magic3D's 61.7% preference over DreamFusion. GALA3D and LucidDreamer are described only as contemporaries in open-domain scene generation that differ in whether structure comes from an inpainting-driven point cloud or an LLM layout; no head-to-head comparison, no rater study, and no shared prompt set between them appears anywhere."
    hop_rationale: "'User study' retrieves Magic3D's genuine study and 'controllable editing' retrieves GALA3D, and the two are within two hops through the text-to-3D lineage, so a short, plausible path exists and will tempt an answer that transplants Magic3D's 61.7% onto a comparison that was never run. The path is real; the study is not, which is exactly the confusion this control is meant to expose."

  # ---- i23 ----
  - id: i23-3d-prior-vs-sds-gradient
    text: "Magic123 blends a 2D text-to-image prior with a 3D-aware diffusion prior under a single scalar trade-off, but the distillation gradient it inherits was originally defined against a frozen 2D prior alone. Which corpus method actually produces a model able to score a novel view given a target camera, what conditioning does building it require, and what does pushing the trade-off toward the 3D side cost in the exploration/exploitation terms Magic123 uses?"
    anchors: ["3D-aware diffusion prior", "Score Distillation Sampling"]
    requires: ["2306.17843", "2303.11328", "2209.14988"]
    note: "Answer joins three facts: DreamFusion defines SDS as a per-step gradient from a frozen 2D prior through a differentiable renderer, skipping the score-Jacobian; Zero-1-to-3 supplies the viewpoint-conditional model, trained on Objaverse renders as (source view, relative pose, target view) triplets; Magic123 states that leaning on the 3D prior keeps the object faithful but risks blandness while the 2D side gives imagination at the cost of geometric drift."
    hop_rationale: "Score distillation is named in five corpus papers, so 'Magic123 -> SDS' is a one-hop edge that any generative paper would satisfy; that edge says only 'this is an optimisation-based generator'. The question needs the specific provenance of the 3D-aware prior (Zero-1-to-3's relative-pose training triplets) and DreamFusion's characterisation of the gradient as a single frozen-prior estimate. A short generic path through 'diffusion prior' carries neither the training-data requirement nor the directional cost of the trade-off, so proximity here is shared vocabulary, not evidence."
  - id: i23-monocular-depth-two-roles
    text: "A monocular depth predictor shows up in three different structural roles in this corpus: as a regulariser that stops a single-view-supervised radiance field collapsing, as the lifting operator that turns an inpainted image into a new chunk of 3D points, and as a dense scale-and-shift-invariant loss for an implicit surface. What specific failure does each role prevent, and which of the three would still be needed if perfect ground-truth depth were available?"
    anchors: ["degenerate solutions", "monocular geometric cues"]
    requires: ["2306.17843", "2311.13384", "2206.00665"]
    note: "Magic123: monocular depth regularisation prevents degenerate flat or hollow solutions under reference-view supervision. LucidDreamer: depth converts an inpainted view plus known pose into new points, i.e. it is the geometry-creation step, not a regulariser. MonoSDF: depth (plus normals) is dense supervision compensating weak photometric constraint in textureless or sparsely observed regions. Only the lifting role remains structurally necessary with perfect depth; the other two are cures for weak supervision."
    hop_rationale: "Both anchors are depth-flavoured, so an embedding or a 'DepthEstimation' method node will place them a hop or two apart for free — and that adjacency is exactly the false positive, since it only says 'both papers touch monocular depth'. The question turns on the role depth plays in each pipeline (regulariser vs. lifting operator vs. dense loss) and on a counterfactual about ground-truth depth, which requires reading what each paper says depth is protecting against. Shared use of an off-the-shelf depth predictor is shared infrastructure, not the relationship being asked for."
  - id: i23-densification-without-sfm
    text: "3D Gaussian Splatting's interleaved densification and pruning schedule was designed for primitives already seeded near the surface by a structure-from-motion pass. DreamGaussian keeps progressive densification with no capture to seed it, and AGG discards the growth loop entirely in favour of a cascaded super-resolution stage. What does each generative method use in place of the reconstruction-time signal that told the schedule where to add capacity, and what changes about where primitives end up?"
    anchors: ["progressive densification", "densification and pruning"]
    requires: ["2309.16653", "2401.04099", "2308.04079"]
    note: "3DGS's clone/split/prune schedule is triggered during optimisation against multi-view photometric evidence, with SfM points anchoring the start. DreamGaussian replaces that evidence with SDS gradients from a 2D diffusion prior and argues densification naturally biases capacity toward populated regions, unlike NeRF's expensive empty-space pruning. AGG has no growth loop at all: a coarse Gaussian set is predicted, then a 3D Gaussian super-resolution module raises primitive count and local detail in a forward pass."
    hop_rationale: "The two anchors are near-synonymous densification phrases, so a short lexical path between them is guaranteed and tells you nothing — it merely says both papers densify Gaussians. What the question asks is which signal licenses each densification decision (photometric residual with SfM seeding, score-distillation gradient with random seeding, or a learned upsampler with neither), so a path that connects the two densification terms without traversing the initialisation and supervision differences is a false positive by construction."
  - id: i23-mesh-extraction-routes
    text: "DreamGaussian exports geometry from its Gaussians with a Marching-Cubes-style step and then refines texture in UV space; the surface-aligned line of work argues Marching Cubes does not apply to a Gaussian cloud at all, because Gaussians define no level set, and runs Poisson reconstruction on oriented centres instead; Magic123 avoids the question by switching stage two to a differentiable mesh representation. What assumption about the primitive cloud does each route depend on, and why can a generative pipeline tolerate an extraction step a reconstruction pipeline rejects?"
    anchors: ["Marching-Cubes-style", "Poisson reconstruction"]
    requires: ["2309.16653", "2306.17843", "2311.12775"]
    note: "SuGaR's objection is explicit: Gaussians do not implicitly define a level set, so it regularises primitives to be thin and surface-conforming and then runs Poisson on oriented centres. DreamGaussian's cloud never has to be metrically faithful to a captured scene — its target is a plausible textured asset, and the UV-space refinement against the diffusion prior repairs what extraction loses. Magic123 never has a primitive cloud to extract from, moving instead to a differentiable mesh at higher resolution."
    hop_rationale: "Both anchors are mesh-extraction techniques, so any 'mesh extraction' concept node puts them two hops apart, and that path is generic to a dozen surface papers in the corpus. The question hinges on a disagreement — one paper uses a Marching-Cubes-style step on Gaussians and another argues that step is ill-posed for Gaussians — plus the reason the disagreement is tolerable in the generative setting. A short path through a shared technique category cannot distinguish agreement from disagreement, which is precisely the content here."
  - id: i23-what-replaces-the-sds-loop
    text: "AGG removes the per-instance optimization loop that DreamGaussian still pays and predicts Gaussians in a single forward pass. When the distillation loop disappears, what takes over the job the diffusion prior's novel-view gradient was doing, and what does the corpus's large feed-forward radiance-field model reveal about the data scale that substitution demands?"
    anchors: ["per-instance optimization", "ScoreDistillation"]
    requires: ["2401.04099", "2309.16653", "2311.04400"]
    note: "DreamGaussian's supervision at generation time is the 2D diffusion prior via SDS on randomly sampled views. AGG replaces per-instance score distillation with a trained image-to-Gaussian mapping, so supervision moves to training time. LRM shows the price of amortisation: ~1M objects from Objaverse plus real MVImgNet captures with multi-view supervision and a 500M-parameter transformer, and it is the corpus's evidence that the shift from per-scene optimisation to amortised inference is bought with data and capacity."
    hop_rationale: "'ScoreDistillation' is a method tag shared by five corpus papers, so it sits one hop from almost every generative node; reaching it from AGG's 'per-instance optimization' proves only that AGG mentions the thing it is replacing. The answer requires knowing what supervision remains once the loop is gone and importing LRM's training-corpus scale as the cost of that trade — a fact that lives in a paper neither anchor names. A short path between the anchors is an artefact of the SDS hub, not evidence about amortisation cost."
  - id: i23-object-orbit-vs-scene-walk
    text: "Zero-1-to-3 and DreamGaussian generate an object viewed by cameras orbiting it, whereas LucidDreamer drives a camera through a scene into regions no input pixel ever covered. In each pipeline, what supplies the content for a view with no support in the input, and why does the scene case need an inpainting-and-alignment loop where the object case can rely on a single pose-conditioned sample?"
    anchors: ["viewpoint-conditional", "inpainting"]
    requires: ["2311.13384", "2303.11328", "2309.16653"]
    note: "Zero-1-to-3 fills unseen regions by sampling the viewpoint-conditional model at the requested relative pose; DreamGaussian fills them by accumulating SDS gradients from a 2D prior over randomly sampled cameras into the Gaussian set. LucidDreamer cannot sample a whole scene view at once, so it projects the accumulated point cloud, inpaints only the masked remainder, lifts it with depth, and then aligns overlapping chunks — the loop exists because scene extent grows monotonically rather than being bounded by an orbit."
    hop_rationale: "Both anchors are ways of invoking a 2D diffusion model, so a generic 'diffusion prior' hop connects them cheaply while saying nothing about camera regime. The distinction the question asks for is structural — bounded orbit around an object versus unbounded traversal of a scene — and it determines why one method can sample a full target view and the other must inpaint a masked projection and then merge. Two nodes both hanging off 'diffusion' is shared infrastructure, exactly the false positive to reject."
  - id: i23-multiview-consistency-injection
    text: "Three fixes for the same weakness of a 2D prior: conditioning it on an explicit relative camera transformation, mixing it with a 3D-aware prior under a scalar weight, and fine-tuning it to emit four canonicalised views at once to avoid the Janus artefact. Rank the three by how much they demand of the 2D model itself, and say which leaves geometric drift as a knob the user still has to tune."
    anchors: ["relative camera viewpoint", "Janus"]
    requires: ["2306.17843", "2303.11328", "2311.06214"]
    note: "Zero-1-to-3 fine-tunes a Stable-Diffusion-style model to be viewpoint-conditional on elevation/azimuth/radius. Instant3D fine-tunes a 2D model to emit four structured, view-consistent images with canonicalised layout so a sparse-view reconstructor can consume them, and names Janus artefacts as the thing this avoids. Magic123 leaves consistency as an interpolation: the 2D side drifts geometrically, the 3D side is faithful but bland, and the scalar trade-off is the exposed knob."
    hop_rationale: "'Relative camera transformation' and 'Janus' both sit under multi-view consistency, so a two-hop path via any consistency-flavoured concept is easy and generic — every generative paper here worries about consistency. The question is comparative: it asks which of three interventions modifies the 2D model, which composes two models, and which leaves a manual knob, and that ordering cannot be read off a shared-topic edge. A short path would show co-membership in a problem area, not the differing commitments of the three fixes."
  - id: i23-tradeoff-knob-vs-vsd-diagnosis
    text: "Variational Score Distillation diagnoses SDS's over-saturation and mode collapse as a consequence of treating the 3D parameters as a single point estimate against a frozen prior. Magic123 instead exposes a trade-off parameter interpolating between a 2D and a 3D prior, calling the ends imaginative and precise. Are the two mechanisms addressing the same failure, and which of the two does DreamGaussian inherit when it distils a 2D prior into Gaussians?"
    anchors: ["Variational Score Distillation", "trade-off parameter"]
    requires: ["2306.17843", "2309.16653", "2305.16213"]
    note: "ProlificDreamer's target is a posterior-shape defect: SDS is the single-particle, delta-posterior limit of VSD and is biased toward the prior mean, which is why samples saturate and collapse in diversity. Magic123's knob is not about posterior shape at all — it balances geometric faithfulness against stylistic richness between two different priors. DreamGaussian's stage one is plain SDS against a 2D prior, so it inherits the pathology VSD diagnoses, and the corpus notes later Gaussian work inherits ProlificDreamer's analysis while substituting representations."
    hop_rationale: "VSD and Magic123's knob will both attach to a 'diffusion prior' or 'score distillation' hub, so a two-hop path exists and merely records that both papers tune how a prior is used. The question demands separating a distributional diagnosis (point estimate vs. particle ensemble) from a prior-mixing weight and then attributing which one bites DreamGaussian — a judgement that requires the actual content of each mechanism. Short-path proximity here would confirm only shared membership in the SDS literature, which is the trap."
  - id: i23-reference-identity-across-views
    text: "Keeping generated views recognisably the same object as the input is handled three ways in this corpus: a token learned by textual inversion, direct conditioning on the source image plus a pose offset, and re-projecting already-committed geometry into the next view before generating it. Which of the three constrains appearance only, which constrains geometry as well, and what does each lose as the camera moves far from the reference?"
    anchors: ["textual inversion", "point cloud"]
    requires: ["2306.17843", "2303.11328", "2311.13384"]
    note: "Magic123's textual inversion captures the reference image's identity as a reusable token for the diffusion guidance — an appearance-level constraint, paired separately with depth regularisation for geometry. Zero-1-to-3 conditions on the input image with a relative pose, tying both appearance and viewpoint but only within one generated view. LucidDreamer's projected point cloud is a hard geometric constraint carried into the inpainting prompt, and its weakness is accumulated drift across overlapping chunks, which Alignment exists to smooth."
    hop_rationale: "A path from 'textual inversion' to 'point cloud' via 'diffusion' or 'identity' is short and uninformative: both are simply things pipelines do. The question requires classifying each mechanism by what it constrains (appearance vs. geometry) and naming its far-camera failure, which is stated in three different papers and nowhere adjacent. Any generic hop between a conditioning trick and a geometric structure would connect dozens of unrelated pairs in this corpus, so the path length carries no evidence about this particular comparison."
  - id: i23-gaussian-init-without-capture
    text: "In reconstruction, a Gaussian field is seeded from a sparse structure-from-motion point cloud so primitives begin near the true surface. LucidDreamer manufactures a seed by depth-lifting inpainted views into an aggregated cloud; DreamGaussian forgoes any such seed and starts sparse. Which property of the SfM seed does the depth-lifted cloud reproduce, which does it not, and which stage of each pipeline absorbs the difference?"
    anchors: ["sparse PointCloud", "estimated depth maps"]
    requires: ["2311.13384", "2309.16653", "2308.04079"]
    note: "3DGS's seed is anchored to real observed geometry from an SfM pass, which is what makes the subsequent densification well-posed. LucidDreamer's cloud reproduces the spatial anchoring — points sit where a depth estimate says surfaces are — but not the multi-view-verified metric consistency, which is why the Alignment step must smooth inconsistencies before the Gaussian optimisation refines colour and density. DreamGaussian reproduces neither and lets progressive densification under SDS gradients discover occupancy from scratch."
    hop_rationale: "Both anchors are point-producing artefacts, so a path via 'PointCloud' is one hop and would link SfM seeding to any depth-lifting method in the corpus, including SLAM papers that have nothing to do with generation. The question is about what the seed guarantees (observation-verified geometry) versus what a generated seed can only approximate, and where each pipeline pays for the gap. Proximity through a shared data structure is precisely the shared-infrastructure signal the controls are designed to catch."
  - id: i23-synthetic-train-real-eval
    text: "Zero-1-to-3 trains only on rendered synthetic objects yet claims zero-shot transfer to photographs, sketches and paintings; Magic123 argues the right evaluation regime is unposed in-the-wild images rather than synthetic renders; the large feed-forward reconstructor mixes synthetic renders with real captures. What does each credit for closing the synthetic-to-real gap, and which of the three explanations does not lean on a pretrained 2D backbone?"
    anchors: ["Objaverse", "in-the-wild"]
    requires: ["2303.11328", "2306.17843", "2311.04400"]
    note: "Zero-1-to-3 credits the broad object prior of the Stable Diffusion backbone it fine-tunes, which survives training on Objaverse renders. Magic123 makes it an evaluation argument: in-the-wild inputs rather than synthetic ShapeNet renders are the appropriate regime for single-image 3D. LRM credits training breadth and model capacity — roughly a million objects combining Objaverse with real MVImgNet captures at 500M parameters — and is the one whose generalisation claim does not rest on an inherited 2D image prior."
    hop_rationale: "'Objaverse' and 'in-the-wild' co-occur in the same paragraph of more than one paper, so the anchors are trivially close and that closeness only signals 'this paper trains on rendered data and tests on real images'. The question asks for the causal story each paper tells about why transfer works, and those stories differ in kind — inherited 2D prior versus data scale versus a claim about evaluation protocol. A short path between a dataset name and a distribution descriptor is dataset-mention infrastructure, not evidence about attribution of generalisation."
  - id: i23-coarse-to-fine-lineage
    text: "The coarse-then-mesh recipe reaches image-to-3D from the text-to-3D side: a hash-grid radiance field, then a marching-cubes mesh refined through a differentiable rasteriser at the diffusion model's own resolution. Magic123 keeps two stages but changes what supervises them; DreamGaussian keeps two stages but replaces the coarse representation outright. For each, state what stage one produces, what stage two is actually optimising, and what each pays for its stage-two resolution gain."
    anchors: ["coarse-to-fine", "differentiable mesh representation"]
    requires: ["2306.17843", "2309.16653", "2211.10440"]
    note: "Magic3D: stage one is an Instant-NGP-accelerated radiance field under SDS; stage two extracts a mesh via marching cubes and continues SDS through a differentiable rasteriser against a high-resolution latent diffusion model. Magic123 keeps NeRF-then-mesh but supervises both stages with a reference view plus mixed 2D and 3D priors, moving to a memory-efficient differentiable mesh representation. DreamGaussian replaces the coarse NeRF with Gaussians grown by densification and its stage two refines UV-space texture rather than geometry, which is why its speed-up is not paid for in geometric refinement."
    hop_rationale: "'Coarse-to-fine' is a description that fits seven corpus papers including NeRF and BARF, so it is a hub term and any mesh-stage node sits a hop or two from it. That path establishes only that a pipeline has two stages. The question asks what each stage optimises and what the second stage trades away, which differs between a mesh under high-resolution SDS, a memory-efficient mesh under mixed priors, and a UV texture refinement over an already-extracted Gaussian mesh. Pipeline-shape similarity is exactly the generic evidence to discount here."
  - id: i23-where-vs-what-split
    text: "AGG splits the prediction of Gaussian locations from opacity, colour, scale and rotation, arguing that placing primitives near the surface is the better-conditioned half; the sparse-view predictor instead localises centres with a plane-sweep cost volume and predicts the remaining parameters jointly with them. What plays the role of that geometric prior in an optimisation-based Gaussian generator, and which of the three obtains primitive positions with no multi-view evidence at all?"
    anchors: ["hybrid intermediate representation", "cost volume"]
    requires: ["2401.04099", "2309.16653", "2403.14627"]
    note: "AGG decomposes location from appearance and lets the streams interact through a hybrid intermediate representation, because locating primitives is better conditioned than predicting everything jointly. MVSplat gets the same 'where' information from classical geometry — cross-view similarity over depth hypotheses in a plane-sweep cost volume — and argues a small geometry prior is worth a lot of capacity and data. DreamGaussian has neither: positions emerge from progressive densification driven by SDS gradients, i.e. from a 2D prior with no multi-view evidence."
    hop_rationale: "Both anchors are internal representations of feed-forward Gaussian predictors, so a hop through 'GaussianSplatting' or 'FeedForward' connects them and would equally connect pixelSplat, latentSplat and LGM. The question separates three sources for primitive placement — a learned decomposed stream, a classical cost volume, and gradient-driven densification — and asks which needs no multi-view evidence. Membership in the feed-forward Gaussian family is shared infrastructure; the placement mechanism is the relationship, and it is not recoverable from a short generic path."
  - id: i23-resolution-bottleneck
    text: "Two feed-forward Gaussian generators answer the resolution problem differently: one cascades a coarse Gaussian set into a 3D Gaussian super-resolution module that raises primitive count, the other predicts per-pixel Gaussian features in image space through an asymmetric U-Net so memory stays linear in pixel count. DreamGaussian's answer is a third thing entirely. Which of the three adds representational capacity rather than only refining appearance, and why does the memory argument single out the implicit predictors it was aimed at?"
    anchors: ["3D Gaussian super-resolution", "asymmetric U-Net"]
    requires: ["2401.04099", "2309.16653", "2402.05054"]
    note: "AGG's cascade upsamples primitive count and local detail, so it adds capacity. LGM's image-space per-pixel Gaussian prediction keeps memory linear in pixels and the U-Net asymmetry lets the decoder spend more compute at high resolution; the argument is aimed at feed-forward NeRF-style predictors whose training compute scales badly because predicting an entire implicit field at high resolution is memory-heavy. DreamGaussian's high-resolution stage refines UV-space texture against the diffusion prior — appearance, not capacity."
    hop_rationale: "Both anchors are upsampling or capacity devices inside Gaussian generators, so 'high-resolution 3D generation' links them in one or two hops without distinguishing them. The question requires knowing that one mechanism adds primitives, one restructures where prediction happens to control memory, and one only repaints an existing mesh — plus the reason the memory argument targets implicit fields specifically. A generic resolution-topic path would rank every fast-generation paper equally, which is exactly the false positive the controls test for."
  - id: i23-prior-in-image-space-vs-score
    text: "LucidDreamer never backpropagates a diffusion gradient into its 3D parameters: the diffusion model acts as an image-space inpainter and the Gaussians are fitted afterwards to images already committed to. DreamGaussian does the opposite, pushing the score gradient into the primitives at every step. Which score-distillation failure modes does the image-space route sidestep, and which consistency problem does it create that the score route does not have?"
    anchors: ["Score Distillation Sampling", "Dreaming and Alignment"]
    requires: ["2311.13384", "2309.16653", "2209.14988", "2305.16213"]
    note: "SDS as defined by DreamFusion noises a render and treats the denoising direction as a gradient, so consistency emerges only because every step re-renders a different camera against the same prompt distribution; DreamGaussian inherits this, including its slow-per-sample and prior-mean-biased character. LucidDreamer's diffusion output is committed as pixels first, so there is no per-step distillation gradient at all — instead it must reconcile independently generated chunks, which is exactly what Alignment does before the Gaussian optimisation begins."
    hop_rationale: "SDS is the single largest hub in the generative half of this corpus, so any generative method node is within two hops of it; reaching 'Dreaming and Alignment' from it proves only that LucidDreamer is a diffusion-based 3D method. The question asks where in the loop the prior is consumed — as a gradient on 3D parameters versus as finished pixels — and what each placement costs. That distinction is invisible to a path that runs through the SDS hub, and treating hub proximity as evidence here would score every generative paper as relevant."
  - id: i23-pose-assumption-ladder
    text: "Zero-1-to-3 is conditioned on an explicit elevation, azimuth and radius offset; Magic123 advertises a single unposed image as its input; LucidDreamer lifts each generated view with a camera pose it chose itself. Order these by how much camera knowledge is assumed at inference time, and explain what each pipeline substitutes at the point where a pose is not given."
    anchors: ["elevation, azimuth, and radius", "unposed image"]
    requires: ["2303.11328", "2306.17843", "2311.13384"]
    note: "Zero-1-to-3 requires a specified relative transform at sampling time — the pose is the control signal. Magic123 takes an unposed in-the-wild photograph and substitutes reference-view supervision plus novel-view guidance from mixed priors, so the reference camera is implicitly the canonical one. LucidDreamer needs no input pose because it authors the trajectory itself: each target view has a known pose by construction, which is what makes depth-lifting well-defined."
    hop_rationale: "'Pose' terminology connects these anchors in a hop or two through camera-parameter concepts shared with the SLAM and NeRF halves of the corpus, and that connection says nothing more than 'both papers mention cameras'. The question asks for an ordering by inference-time assumption and for the substitute each method uses in the absence of pose, which requires reading how the pose enters each pipeline — as conditioning input, as an implicit canonical frame, or as a self-chosen trajectory. A short camera-topic path would be equally strong for BARF or DROID-SLAM, so it is not evidence here."
  - id: i23-intermediate-representation-choice
    text: "Between the input image and the final 3D primitives, AGG interposes a hybrid intermediate representation, the large feed-forward reconstructor interposes a triplane, and LucidDreamer interposes an explicit point cloud. What does each intermediate buy — conditioning, parameterisation capacity, or geometric anchoring — and which of the three exists before any learned 3D decoder has run?"
    anchors: ["hybrid intermediate representation", "triplane"]
    requires: ["2401.04099", "2311.13384", "2311.04400"]
    note: "AGG's hybrid intermediate lets the location stream and the appearance stream interact, stabilising a decomposed prediction problem. LRM's triplane is the parameterisation that a deep cross-attention transformer predicts and that in turn parameterises the radiance field — capacity and a decodable structure. LucidDreamer's point cloud is built from inpainted images and depth, so it is geometric anchoring that exists before any 3D decoder — indeed there is no learned 3D decoder, only a subsequent Gaussian optimisation initialised from it."
    hop_rationale: "Both anchors are internal representations in image-to-3D models and will be within two hops via 'ImageTo3D' or 'FeedForward', which would equally connect TripoSR, Instant3D and LGM. The question requires classifying each intermediate by function and identifying the one produced without a learned 3D decoder at all — a property of LucidDreamer's pipeline order, not of its topic. Category co-membership is the generic signal; the functional contrast is the specific relationship being probed."
  - id: i23-control-superres-on-anchor-fields
    text: "When AGG's 3D Gaussian super-resolution module is applied to an anchor-based structured Gaussian field rather than a free Gaussian set, how much of the primitive-count reduction survives, and what happens to view-adaptive rendering quality?"
    anchors: ["3D Gaussian super-resolution", "anchor points"]
    control: true
    legacy_gameable: true
    requires: []
    note: "Unanswerable from the corpus. AGG's super-resolution module is described only as a cascade stage over its own coarse Gaussian prediction and is never applied to a structured or anchored field; the anchor-based variant appears only as a one-line mention of a follow-on reconstruction method. No corpus document reports any combination of the two, nor any primitive-count or view-adaptive-quality measurement for such a combination. Both anchor strings do occur, in different papers, so retrieval will surface plausible-looking neighbours."
    hop_rationale: "The two anchors are two hops apart through GaussianSplatting, and that path is precisely the trap: it records representation-family co-membership, not the existence of a measured combination. A retriever that treats the short path as evidence will return AGG and the structured-Gaussian material and appear to support an answer that no document contains."
  - id: i23-control-dreaming-iteration-ablation
    text: "How many Dreaming and Alignment iterations does LucidDreamer need before the aggregated point cloud stops improving the final Gaussian optimisation, and what quality plateau does that ablation report?"
    anchors: ["Dreaming and Alignment", "point cloud"]
    control: true
    legacy_gameable: true
    requires: []
    note: "Unanswerable from the corpus. The Dream/Align loop is described only qualitatively — project, inpaint, lift, merge — with no iteration counts, no convergence curve, and no ablation numbers of any kind; no other corpus paper measures LucidDreamer's loop either. The question sounds like a routine ablation lookup and both anchors occur in the same paper, which is what makes it a good false-positive probe."
    hop_rationale: "Here the anchors are one hop apart inside a single document, so path distance is minimal and maximally misleading: the retrieved paper is the right paper and still contains no quantity that answers the question. Any scoring that equates short paths with answerability will mark this confidently answerable."
  - id: i23-control-zero123-multi-object-inputs
    text: "How does Zero-1-to-3's elevation, azimuth and radius conditioning degrade when the input photograph contains several distinct objects, measured against a layout-guided compositional baseline?"
    anchors: ["elevation, azimuth, and radius", "layout-guided"]
    control: true
    legacy_gameable: true
    requires: []
    note: "Unanswerable from the corpus. Zero-1-to-3 is described purely as a single-object method and is never evaluated on multi-object inputs; the layout-guided compositional pipeline in the corpus is text-to-3D, targets scene generation from an LLM-emitted layout, and is never compared with Zero-1-to-3 on any input. No document relates the two, and no multi-object degradation measurement for viewpoint conditioning exists anywhere in the 50 papers."
    hop_rationale: "Both anchors are reachable from generative-3D hubs such as Diffusion and GaussianSplatting within two or three hops, so a path exists and would look like cross-paper support. The path only expresses that both papers generate 3D content with diffusion priors; a comparison between a single-object viewpoint model and a compositional layout pipeline is asserted nowhere, so short-path proximity is exactly the wrong evidence."

  # ---- lrm ----
  - id: lrm-triplane-vs-pixel-gaussian-memory
    text: "LGM replaced the triplane-parameterised radiance field that LRM introduced and TripoSR kept with per-pixel multi-view Gaussian features. Explain why that substitution changes how training cost scales with output resolution, and what the triplane gives the LRM/TripoSR line that image-space Gaussian prediction gives up."
