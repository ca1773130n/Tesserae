  - id: lrm-inheritance-ledger
    text: "LRM committed to three things at once: a 500-million-parameter Transformer, a triplane NeRF output, and single-image conditioning. Using TripoSR and LGM, say which of the three each successor kept and which it dropped, and which commitment turned out to be the one worth changing."
