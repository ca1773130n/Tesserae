    text: "Zero-1-to-3 conditions its generator on a relative camera transformation given as elevation, azimuth and radius, Instant3D fixes a layout so that relative camera poses are known constants, and LRM assumes nothing explicit about the input camera. What contract about pose does each reconstruction stage rely on, and what breaks when that contract is violated?"
