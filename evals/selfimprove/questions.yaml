  - id: ctl2-surface-dyn-vanishing-content
    text: "UNISURF relaxes occupancy to a probability early in training and sharpens it into surface rendering late, while 4D-Rotor Gaussian Splatting represents content that appears or disappears with 4D Gaussians of narrow temporal extent. State what the corpus reports when that annealing meets a boundary present for only part of a capture, and which of the two constructions is re-tuned."
