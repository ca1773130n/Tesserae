  - id: lrm-triplane-objective-stability
    text: "TripoSR says balancing silhouette, photometric and geometric terms is more stable than LRM's original recipe. Which part of a single-image triplane prediction is left unconstrained by photometric multi-view supervision alone, and would Instant3D's four-view conditioning remove that ambiguity instead of an extra loss term?"
