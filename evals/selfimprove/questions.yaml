    requires: ["2402.05054", "2311.04400", "2403.02151"]
    note: "Answer must join LGM's stated reason (Gaussians predicted in image space keep memory linear in pixel count, whereas predicting a whole implicit field at high resolution is memory-heavy) with the LRM/TripoSR account of the triplane as a view-independent volumetric parameterisation produced by a cross-attention transformer."
    hop_rationale: "'triplane' and 'multi-view Gaussian features' are both 3D-representation nodes, so any graph joins them in two hops through a generic 'representation used by a feed-forward model' concept or through the shared LRM ancestry. That path asserts only that both are representations; it carries no claim about which one's training memory grows with resolution or why one was swapped for the other. Only LGM's resolution-bottleneck rationale, read against LRM/TripoSR's description of what a triplane is, satisfies the question."
  - id: lrm-triposr-speedup-attribution
    text: "TripoSR reports under 0.5 s per mesh where LRM takes about 5 s with essentially the same architecture template, while Instant3D's end-to-end budget is roughly 20 s. Attribute each number: which part of TripoSR's gain is engineering rather than architecture, and what dominates Instant3D's budget that neither single-image model pays?"
    anchors: ["mixed-precision execution", "sparse-view reconstructor"]
    requires: ["2403.02151", "2311.04400", "2311.06214"]
    note: "Requires TripoSR's engineering list (kernel scheduling, mixed-precision) plus its statement that the headline architecture stays close to LRM, and Instant3D's two-stage split in which the four-view diffusion generation, not the sparse-view reconstructor forward pass, is the expensive stage."
    hop_rationale: "All three papers are timing-comparable feed-forward models, so a graph links them in one or two hops through 'LargeReconstructionModel' or an inference-speed concept. Landing on that shared node cannot separate a kernel-level speedup from an architectural one, nor say which of Instant3D's two stages consumes the 20 s. The answer is a per-paper cost attribution that no generic speed edge encodes."
  - id: lrm-augmentation-vs-canonical-layout
    text: "TripoSR adds data augmentations over object scale, orientation and lighting on top of LRM's data scale, while Instant3D removes the same variation at the input by canonicalising the spatial layout of its four generated views. Which distribution shift does each strategy handle, and why does the Instant3D reconstructor not need TripoSR's augmentation?"
