  - id: lrm-more-views-or-more-data
    text: "Instant3D's second stage is LRM conditioned on sparse multi-view input rather than one image; TripoSR stays single-image and invests in data and training instead. Does adding views solve the same ambiguity that LRM's data scale was meant to solve, and how do the two positions differ on in-the-wild images?"
