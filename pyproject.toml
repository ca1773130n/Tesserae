[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tesserae"
version = "0.31.0"
description = "Typed LLM wiki graph pipeline for research and development projects"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Tesserae Contributors" }
]
keywords = ["llm", "wiki", "knowledge-graph", "mcp", "obsidian"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "pydantic>=2",
  # ``networkx`` powers Louvain community detection in
  # :mod:`tesserae.community_summaries`. Pure-Python, zero transitive
  # dependencies (~18 MB on disk) — small enough that pinning it in the
  # base install keeps the production code path identical to the tested
  # code path and avoids a Louvain reimplementation in the fallback.
  "networkx>=3.0",
  # ``rich`` powers the setup wizard UI (panels, prompts, tables) and any
  # other terminal output that benefits from styling. Pure-Python, ~1 MB.
  "rich>=13",
  # ``PyYAML`` parses OKF frontmatter (:mod:`tesserae.okf`). Not optional:
  # ``tesserae export okf`` is a shipped CLI verb and OKF mandates YAML
  # frontmatter, which the stdlib cannot parse. It was imported without being
  # declared, so every INSTALLED build raised ModuleNotFoundError on that verb
  # while the test suite passed — pyyaml is a transitive dependency of the dev
  # environment, so the tested path and the shipped path were not the same one.
  "pyyaml>=6",
]

[project.optional-dependencies]
synthesis-llm = ["anthropic>=0.40"]
raganything = ["raganything>=1.3.0"]
raganything-all = ["raganything[all]>=1.3.0"]
raganything-semantic = ["raganything[all]>=1.3.0", "sentence-transformers>=3.0"]
# Lightweight, offline, torch-free semantic embeddings (model2vec static
# vectors, ~8 MB potion-base-8M downloaded on first use). This is the real
# default semantic lane; without it, hybrid/embedding retrieval degrades to
# the non-semantic hash-bucket stub and emits a loud UserWarning.
semantic = ["model2vec>=0.3", "numpy>=1.21"]
ingest-url = ["httpx>=0.24", "markdownify>=0.11"]

[dependency-groups]
# The test runner was previously undeclared: `pytest` appeared in neither
# pyproject nor uv.lock, so the suite ran only because it had been installed
# into a hand-built .venv. A fresh clone got no test runner, and any `uv run`
# that rebuilt the environment from the lock silently dropped it. Declaring it
# here is what makes CI — or any second machine — able to run the tests at all.
#
# The suite imports nothing beyond the stdlib, the package itself, and pytest.
# The optional integrations it exercises through `pytest.importorskip`
# (`anthropic`, `model2vec`) live in the extras below and skip cleanly when
# absent — they do not belong here.
#
# `kuzu` is the exception: two tests (test_persistence, test_cli) call the Kuzu
# store directly with no importorskip guard, so they FAIL rather than skip when
# it is missing. It was undeclared for the same reason pytest was — present in a
# hand-built .venv, invisible to the lock. Either it is a test dependency or
# those tests need a guard; declaring it keeps today's behaviour.
dev = ["pytest>=8", "kuzu>=0.6"]

[project.scripts]
tesserae = "tesserae.cli:main"
tesserae_mcp = "tesserae.mcp_server:main"

[tool.setuptools.packages.find]
include = ["tesserae*"]

[tool.pytest.ini_options]
# ``evals/`` holds gitignored upstream clones (cognee, MegaMem) carrying their
# own test suites. Bare ``pytest`` used to walk into them and fail collection on
# 39 of their modules. Only ``tests/`` is ours.
testpaths = ["tests"]
# Several test modules do ``from tests.X import ...`` for shared fixtures, and
# ``evals/federation`` is imported by test_federation_eval. Both need the repo
# root importable; without this, bare ``pytest`` fails collection on 9 modules
# and only ``python -m pytest`` (which adds cwd implicitly) works.
pythonpath = ["."]
