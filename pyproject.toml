[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tesserae"
version = "0.28.2"
description = "Typed LLM wiki graph pipeline for research and development projects"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Tesserae Contributors" }
]
keywords = ["llm", "wiki", "knowledge-graph", "mcp", "obsidian"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "pydantic>=2",
  # ``networkx`` powers Louvain community detection in
  # :mod:`tesserae.community_summaries`. Pure-Python, zero transitive
  # dependencies (~18 MB on disk) — small enough that pinning it in the
  # base install keeps the production code path identical to the tested
  # code path and avoids a Louvain reimplementation in the fallback.
  "networkx>=3.0",
  # ``rich`` powers the setup wizard UI (panels, prompts, tables) and any
  # other terminal output that benefits from styling. Pure-Python, ~1 MB.
  "rich>=13",
  # ``PyYAML`` parses OKF frontmatter (:mod:`tesserae.okf`). Not optional:
  # ``tesserae export okf`` is a shipped CLI verb and OKF mandates YAML
  # frontmatter, which the stdlib cannot parse. It was imported without being
  # declared, so every INSTALLED build raised ModuleNotFoundError on that verb
  # while the test suite passed — pyyaml is a transitive dependency of the dev
  # environment, so the tested path and the shipped path were not the same one.
  "pyyaml>=6",
]

[project.optional-dependencies]
synthesis-llm = ["anthropic>=0.40"]
raganything = ["raganything>=1.3.0"]
raganything-all = ["raganything[all]>=1.3.0"]
raganything-semantic = ["raganything[all]>=1.3.0", "sentence-transformers>=3.0"]
# Lightweight, offline, torch-free semantic embeddings (model2vec static
# vectors, ~8 MB potion-base-8M downloaded on first use). This is the real
# default semantic lane; without it, hybrid/embedding retrieval degrades to
# the non-semantic hash-bucket stub and emits a loud UserWarning.
semantic = ["model2vec>=0.3", "numpy>=1.21"]
ingest-url = ["httpx>=0.24", "markdownify>=0.11"]

[project.scripts]
tesserae = "tesserae.cli:main"
tesserae_mcp = "tesserae.mcp_server:main"

[tool.setuptools.packages.find]
include = ["tesserae*"]
